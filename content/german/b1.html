/* ============================================================
   GLEIS B1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#FFC400;
  --signal-dim:#B88A00;
  --rail:#7A5200;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#FFC400}
.lvl-card.l4{border-top-color:#B8202E}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#FFC400}
.lvl-card.l4 .lvl-code{color:#B8202E}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#FFC400}
.fp-lvl.l4{background:#B8202E}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}
/* ---------- Pioneer header lockup ---------- */
.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}
.plogo{height:46px; width:auto; display:block; border-radius:3px; flex:none;
       box-shadow:0 1px 6px rgba(0,0,0,.35)}
.brandcenter{flex:1; text-align:center; min-width:0}
.bname{
  font-family:var(--sans-w); font-weight:800; font-size:17px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--enamel); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bweb{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--signal); margin-top:3px;
}
.bweb span{color:#8A96A3}
.levelchip{
  font-family:var(--sans-w); font-weight:800; font-size:21px; letter-spacing:.06em;
  background:var(--signal); color:var(--board); padding:4px 12px; border-radius:3px;
  line-height:1.15; flex:none;
}
@media (max-width:900px){
  .board-top{gap:9px; flex-wrap:wrap}
  .plogo{height:32px}
  .plogo.right{display:none}
  .bname{font-size:12px; letter-spacing:.09em}
  .bweb{font-size:9px; letter-spacing:.1em}
  .levelchip{font-size:16px; padding:3px 9px}
}

  <tr><td class="g">müssen</td><td class="e">müsste</td><td class="n">Du <b>müsstest</b> mehr üben.</td></tr>
  <tr><td class="g">dürfen</td><td class="e">dürfte</td><td class="n"><b>Dürfte</b> ich Sie etwas fragen?</td></tr>
  <tr><td class="g">sollen</td><td class="e">sollte</td><td class="n">Du <b>solltest</b> zum Arzt gehen.</td></tr>
  <tr><td class="g">wissen</td><td class="e">wüsste</td><td class="n">Wenn ich das <b>wüsste</b> …</td></tr>
  <tr><td class="g">gehen / kommen</td><td class="e">ginge / käme</td><td class="n">Es <b>ginge</b> auch am Montag.</td></tr>
  <tr><td class="g">alle anderen</td><td class="e">würde + Infinitiv</td><td class="n">Ich <b>würde</b> mehr <b>lesen</b>.</td></tr>
  </tbody></table></div>`},
 {typ:'regel', t:'Die Vergangenheit — regrets', html:`
  <p>To talk about what <b>would have</b> happened, use <b class="de">hätte / wäre + Partizip II</b>. There is no würde here.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Real</th><th>Irreal (Vergangenheit)</th></tr></thead><tbody>
  <tr><td class="e">Ich hatte keine Zeit.</td><td class="n">Wenn ich Zeit <b>gehabt hätte</b>, wäre ich gekommen.</td></tr>
  <tr><td class="e">Ich habe nicht gelernt.</td><td class="n">Ich <b>hätte</b> mehr <b>lernen sollen</b>.</td></tr>
  <tr><td class="e">Er ist zu spät gekommen.</td><td class="n">Er <b>hätte</b> früher <b>aufstehen müssen</b>.</td></tr>
  <tr><td class="e">Wir sind nicht gefahren.</td><td class="n">Wir <b>wären</b> gern <b>gefahren</b>.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Modalverben in der Vergangenheit</span>With a modal verb, both verbs stay in the infinitive at the end — this is the <i>doppelter Infinitiv</i>:<br>
  <b class="de">Ich hätte früher <u>anfangen sollen</u>.</b> — I should have started earlier.<br>
  <b class="de">Du hättest mich <u>fragen können</u>.</b> — You could have asked me.<br>
  <b class="de">Er hätte nicht <u>gehen müssen</u>.</b> — He wouldn't have had to go.</div>`},
 {typ:'regel', t:'Die vier Anwendungen', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Funktion</th><th>Struktur</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">Irreale Bedingung</td><td class="e">Wenn …, würde/hätte/wäre …</td><td class="n"><b>Wenn</b> ich reich <b>wäre</b>, <b>würde</b> ich um die Welt reisen.</td></tr>
  <tr><td class="g">Wunsch</td><td class="e">Ich wünschte / Wenn … doch nur …!</td><td class="n"><b>Ich wünschte</b>, ich hätte mehr Zeit.<br><b>Wenn</b> ich <b>doch nur</b> besser Deutsch könnte!</td></tr>
  <tr><td class="g">Ratschlag</td><td class="e">An deiner Stelle würde ich … / Du solltest …</td><td class="n"><b>An deiner Stelle würde ich</b> mit dem Chef sprechen.</td></tr>
  <tr><td class="g">Höfliche Bitte</td><td class="e">Könnten / Würden / Wäre es möglich …</td><td class="n"><b>Wäre es möglich</b>, den Termin zu verschieben?</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Wenn weglassen</span>You may drop <b>wenn</b> and start with the verb — this sounds noticeably more advanced:<br>
  <b class="de">Hätte ich Zeit, würde ich kommen.</b> = Wenn ich Zeit hätte, würde ich kommen.</div>`},
 {typ:'ueb', art:'mcq', t:'Übung 1 — Formen erkennen', items:[
  {q:'Wenn ich Zeit ___, würde ich mitkommen.', en:'', opts:['habe','hatte','hätte','haben würde'], a:2, fb:'Irreal condition → hätte.'},
  {q:'Ich ___ gern nach Japan reisen.', en:'', opts:['werde','würde','wurde','wäre'], a:1, fb:'würde + Infinitiv.'},
  {q:'Du ___ mehr schlafen. <i>(advice)</i>', en:'', opts:['sollst','solltest','sollen','wolltest'], a:1, fb:'sollte = should.'},
  {q:'Ich ___ mehr lernen sollen. <i>(past regret)</i>', en:'', opts:['würde','hätte','wäre','habe'], a:1, fb:'hätte + doppelter Infinitiv.'},
  {q:'Wir ___ gern gekommen, aber wir hatten keine Zeit.', en:'', opts:['hätten','wären','würden','waren'], a:1, fb:'kommen takes sein → wären gekommen.'},
  {q:'Welcher Satz ist richtig?', en:'', opts:['Ich hätte früher anfangen gesollt.','Ich hätte früher anfangen sollen.','Ich hätte früher angefangen sollen.','Ich wäre früher anfangen sollen.'], a:1, fb:'Double infinitive: anfangen sollen.'},
  {q:'"Hätte ich das gewusst, …" ist:', en:'', opts:['eine Frage','ein Bedingungssatz ohne wenn','ein Befehl','falsch'], a:1, fb:'wenn dropped, verb moved to front.'},
  {q:'Konjunktiv II von "wissen":', en:'', opts:['wisste','wüsste','gewusst','würde wissen'], a:1, fb:'wüsste.'},
  {q:'"Ich wünschte, ich ___ mehr Geld."', en:'', opts:['habe','hätte','hatte','haben würde'], a:1, fb:'A wish → hätte.'},
  {q:'Höflichste Formulierung:', en:'', opts:['Verschieben Sie den Termin.','Können Sie den Termin verschieben?','Wäre es möglich, den Termin zu verschieben?','Ich will einen anderen Termin.'], a:2, fb:'Konjunktiv II + impersonal = most polite.'}
 ]},
 {typ:'ueb', art:'luecke', t:'Übung 2 — Konjunktiv II bilden', items:[
  {q:'Wenn ich reich ___, würde ich reisen. <i>(sein)</i>', a:['wäre','waere'], en:'If I were rich…'},

  {q:'Du ___ dich bei ihm entschuldigen. <i>(sollen)</i>', a:['solltest'], en:'You should apologise to him.'},
  {q:'___ Sie mir bitte helfen? <i>(können)</i>', a:['könnten','Könnten','koennten'], en:'Could you help me, please?'},
  {q:'Ich ___ das nicht gemacht. <i>(haben — past)</i>', a:['hätte','haette'], en:'I would not have done that.'},
  {q:'Wir ___ gern gekommen. <i>(sein — past)</i>', a:['wären','waeren'], en:'We would have liked to come.'},
  {q:'Wenn ich das ___ hätte! <i>(wissen — Partizip)</i>', a:['gewusst'], en:'If I had known that!'},
  {q:'An deiner Stelle ___ ich zum Arzt gehen. <i>(werden)</i>', a:['würde','wuerde'], en:'In your place I would go to the doctor.'},

 {typ:'ueb', art:'ordnen', t:'Übung 3 — Irreale Sätze', items:[

  {a:'Wenn ich das gewusst hätte wäre ich nicht gekommen', en:'If I had known that I would not have come'},
  {a:'Ich wünschte ich könnte besser Deutsch sprechen', en:'I wish I could speak German better'}
 ]},
 {typ:'schreiben', t:'Schreiben — Was wäre, wenn?', prompt:'Write 10–12 sentences: what would you do if you won a large sum of money? Use at least four Konjunktiv II forms and one past-tense regret.',
  punkte:['Wenn ich … gewinnen würde, …','Was würdest du zuerst machen?','Was würdest du deiner Familie geben?','Würdest du weiterarbeiten?','Was hättest du früher anders machen sollen?','Was wäre der größte Vorteil? Und ein Nachteil?'],
  muster:`Wenn ich eine Million Euro gewinnen würde, würde sich mein Leben natürlich verändern.

Zuerst würde ich meiner Familie ein größeres Haus kaufen, denn unsere Wohnung ist ziemlich klein.
Danach würde ich eine lange Reise machen — ich wäre sehr gern einmal in Deutschland und Österreich.

Ich würde aber trotzdem weiterarbeiten. Ohne Arbeit hätte ich zu viel Zeit und würde mich langweilen.
Vielleicht würde ich eine eigene Sprachschule eröffnen und ärmeren Schülern kostenlosen Unterricht anbieten.

Wenn ich ehrlich bin: Ich hätte schon früher mehr sparen sollen. Dann müsste ich jetzt nicht vom Gewinnen träumen.

Der größte Vorteil wäre die Freiheit. Ein Nachteil wäre, dass sich manche Menschen anders verhalten würden, wenn sie wüssten, dass ich reich bin.`}
]});

STATIONEN.push({
id:'passiv', g:'02', kat:'Grammatik', t:'Das Passiv', en:'The passive voice',
lead:'The passive shifts attention from who does something to what is done. German uses it constantly in news, notices, instructions and formal writing — exactly the text types in the B1 reading module.',
bloecke:[
 {typ:'regel', t:'Aktiv → Passiv', html:`
  <p>Formula: <b class="de">werden + Partizip II</b>. The accusative object of the active sentence becomes the subject.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Aktiv</th><th>Passiv</th></tr></thead><tbody>
  <tr><td class="e">Der Mechaniker repariert <b>das Auto</b>.</td><td class="n"><b>Das Auto</b> wird repariert.</td></tr>
  <tr><td class="e">Man baut <b>ein Haus</b>.</td><td class="n"><b>Ein Haus</b> wird gebaut.</td></tr>
  <tr><td class="e">Die Firma stellte <b>zehn Leute</b> ein.</td><td class="n"><b>Zehn Leute</b> wurden eingestellt.</td></tr>
  </tbody></table></div>
  <div class="tbl-wrap"><table><thead><tr><th>Zeit</th><th>Form</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">Präsens</td><td class="e">wird / werden + Partizip II</td><td class="n">Das Haus <b>wird gebaut</b>.</td></tr>
  <tr><td class="g">Präteritum</td><td class="e">wurde / wurden + Partizip II</td><td class="n">Das Haus <b>wurde gebaut</b>.</td></tr>
  <tr><td class="g">Perfekt</td><td class="e">ist / sind + Partizip II + <b>worden</b></td><td class="n">Das Haus <b>ist gebaut worden</b>.</td></tr>
  <tr><td class="g">mit Modalverb</td><td class="e">muss / kann + Partizip II + <b>werden</b></td><td class="n">Das Haus <b>muss renoviert werden</b>.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">worden, nicht geworden</span>In the passive perfect the participle of werden is <b class="de">worden</b>, never "geworden":<br>
  ✓ Das Auto ist repariert <b>worden</b>. — The car has been repaired.<br>
  ✗ <s>Das Auto ist repariert geworden.</s></div>`},
 {typ:'regel', t:'von, durch — naming the agent', html:`
  <p>Usually the passive is used precisely because the agent does not matter. If you must name it:</p>
  <div class="tbl-wrap"><table><thead><tr><th>Wort</th><th>Für</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">von + Dativ</td><td class="e">a person or institution — the doer</td><td class="n">Der Brief wurde <b>von meiner Chefin</b> geschrieben.</td></tr>
  <tr><td class="g">durch + Akkusativ</td><td class="e">a means, cause or instrument</td><td class="n">Die Stadt wurde <b>durch das Erdbeben</b> zerstört.</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Zustandspassiv — the state passive</span>
  <b class="de">werden</b>-Passiv describes the <b>action</b>: <i>Das Fenster <b>wird</b> geöffnet.</i> (someone is opening it now)<br>
  <b class="de">sein</b>-Passiv describes the <b>result</b>: <i>Das Fenster <b>ist</b> geöffnet.</i> (it stands open)<br>
  Compare: <i>Das Geschäft <b>wird</b> um 20 Uhr geschlossen</i> (the closing happens) vs. <i>Das Geschäft <b>ist</b> geschlossen</i> (it is shut).</div>`},
 {typ:'regel', t:'Passiv-Ersatz — alternatives', html:`
  <p>German often avoids the passive with these three constructions. Recognising them is tested in the reading module.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Struktur</th><th>Beispiel</th><th>Bedeutung</th></tr></thead><tbody>
  <tr><td class="g">man + Aktiv</td><td class="n"><b>Man</b> spricht hier Deutsch.</td><td class="e">German is spoken here.</td></tr>
  <tr><td class="g">sein + zu + Infinitiv</td><td class="n">Das Formular <b>ist</b> bis Freitag <b>auszufüllen</b>.</td><td class="e">must be filled in by Friday</td></tr>
  <tr><td class="g">sich lassen + Infinitiv</td><td class="n">Das Problem <b>lässt sich</b> leicht <b>lösen</b>.</td><td class="e">can easily be solved</td></tr>
  <tr><td class="g">-bar Adjektiv</td><td class="n">Das ist <b>machbar</b> / <b>lösbar</b> / <b>essbar</b>.</td><td class="e">doable / solvable / edible</td></tr>
  </tbody></table></div>`},
 {typ:'ueb', art:'mcq', t:'Übung 1 — Passivformen', items:[
  {q:'Das Haus ___ gerade renoviert.', en:'', opts:['ist','wird','hat','war'], a:1, fb:'Präsens Passiv → wird.'},
  {q:'Die Brücke ___ 1965 gebaut.', en:'', opts:['ist','wird','wurde','hat'], a:2, fb:'Präteritum Passiv → wurde.'},
  {q:'Das Auto ist repariert ___.', en:'', opts:['geworden','worden','werden','wurden'], a:1, fb:'Perfekt Passiv → worden.'},
  {q:'Der Vertrag muss heute ___ ___.', en:'', opts:['unterschrieben werden','unterschrieben worden','werden unterschrieben','unterschreiben werden'], a:0, fb:'Modal + Partizip II + werden.'},
  {q:'Der Brief wurde ___ meiner Chefin geschrieben.', en:'', opts:['durch','von','mit','für'], a:1, fb:'A person → von + Dativ.'},
  {q:'Die Stadt wurde ___ das Feuer zerstört.', en:'', opts:['von','durch','mit','bei'], a:1, fb:'A cause → durch + Akkusativ.'},
  {q:'"Das Geschäft ist geschlossen" beschreibt:', en:'', opts:['die Handlung','den Zustand','die Zukunft','eine Bitte'], a:1, fb:'sein-Passiv = state, not action.'},
  {q:'"Das Problem lässt sich lösen" bedeutet:', en:'', opts:['the problem solves itself','the problem can be solved','the problem was solved','the problem must be solved'], a:1, fb:'sich lassen = can be … ed.'},
  {q:'Aktiv: "Man liest das Buch." Passiv:', en:'', opts:['Das Buch wird gelesen.','Das Buch ist gelesen.','Das Buch liest sich.','Das Buch wurde lesen.'], a:0, fb:'Object becomes subject; werden + Partizip II.'},
  {q:'"Das Formular ist auszufüllen" bedeutet:', en:'', opts:['it is filled in','it must be filled in','it can be filled in','it was filled in'], a:1, fb:'sein + zu + Infinitiv = obligation.'}
 ]},
 {typ:'ueb', art:'luecke', t:'Übung 2 — Aktiv zu Passiv', items:[
  {q:'Man baut ein Haus. → Ein Haus ___ gebaut.', a:['wird'], en:'A house is being built.'},
  {q:'Man reparierte das Auto. → Das Auto ___ repariert.', a:['wurde'], en:'The car was repaired.'},
  {q:'Man hat den Brief geschickt. → Der Brief ist geschickt ___.', a:['worden'], en:'The letter has been sent.'},
  {q:'Man muss die Rechnung bezahlen. → Die Rechnung muss bezahlt ___.', a:['werden'], en:'The bill must be paid.'},
  {q:'Man spricht hier Englisch. → Hier ___ Englisch gesprochen.', a:['wird'], en:'English is spoken here.'},
  {q:'Man eröffnete den Laden 2019. → Der Laden ___ 2019 eröffnet.', a:['wurde'], en:'The shop was opened in 2019.'},
  {q:'Man kann das Problem lösen. → Das Problem kann gelöst ___.', a:['werden'], en:'The problem can be solved.'},
  {q:'Man hat mich eingeladen. → Ich bin eingeladen ___.', a:['worden'], en:'I have been invited.'}
 ]},
 {typ:'ueb', art:'ordnen', t:'Übung 3 — Passivsätze', items:[
  {a:'Das neue Krankenhaus wird nächstes Jahr eröffnet', en:'The new hospital will be opened next year'},
  {a:'Die Brücke wurde vor hundert Jahren gebaut', en:'The bridge was built a hundred years ago'},
  {a:'Der Vertrag muss bis Freitag unterschrieben werden', en:'The contract must be signed by Friday'},
  {a:'Das Auto ist gestern repariert worden', en:'The car was repaired yesterday'},
  {a:'In diesem Land werden vier Sprachen gesprochen', en:'Four languages are spoken in this country'}

STATIONEN.push({
id:'relativ', g:'03', kat:'Grammatik', t:'Relativsätze', en:'Relative clauses',
lead:'Relative clauses let you combine two short sentences into one adult-sounding sentence. The pronoun takes its gender from the noun it refers to, but its case from its own clause — that split is the whole difficulty, and it is entirely learnable.',
bloecke:[
 {typ:'regel', t:'Die Relativpronomen', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Fall</th><th>maskulin</th><th>feminin</th><th>neutral</th><th>Plural</th></tr></thead><tbody>
  <tr><td class="g">Nominativ</td><td class="e">der</td><td class="e">die</td><td class="e">das</td><td class="e">die</td></tr>
  <tr><td class="g">Akkusativ</td><td class="e"><b>den</b></td><td class="e">die</td><td class="e">das</td><td class="e">die</td></tr>
  <tr><td class="g">Dativ</td><td class="e"><b>dem</b></td><td class="e"><b>der</b></td><td class="e"><b>dem</b></td><td class="e"><b>denen</b></td></tr>
  <tr><td class="g">Genitiv</td><td class="e"><b>dessen</b></td><td class="e"><b>deren</b></td><td class="e"><b>dessen</b></td><td class="e"><b>deren</b></td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Fast identisch mit der/die/das</span>Only two things differ from the ordinary article: the dative plural is <b>denen</b> (not den), and the genitive forms are <b>dessen / deren</b>. Everything else you already know.</div>`},
 {typ:'regel', t:'Genus von oben, Kasus von unten', html:`
  <p>This is the single rule that governs every relative clause:</p>
  <div class="rule warn"><span class="lbl">Die Regel</span>
  <b>Gender and number</b> come from the noun in the main clause.<br>
  <b>Case</b> comes from the role the pronoun plays <i>inside the relative clause</i>.</div>
  <div class="tbl-wrap"><table><thead><tr><th>Satz</th><th>Warum?</th></tr></thead><tbody>
  <tr><td class="n">Der Mann, <b>der</b> dort steht, ist mein Lehrer.</td><td class="e">der Mann (m) + subject of "steht" → Nominativ</td></tr>
  <tr><td class="n">Der Mann, <b>den</b> ich gesehen habe, ist mein Lehrer.</td><td class="e">der Mann (m) + object of "gesehen" → Akkusativ</td></tr>
  <tr><td class="n">Der Mann, <b>dem</b> ich geholfen habe, ist mein Lehrer.</td><td class="e">helfen takes the Dativ → dem</td></tr>
  <tr><td class="n">Der Mann, <b>dessen</b> Auto dort steht, ist mein Lehrer.</td><td class="e">possession → Genitiv → dessen</td></tr>
  <tr><td class="n">Die Frau, <b>mit der</b> ich gesprochen habe, …</td><td class="e">mit takes the Dativ, feminine → der</td></tr>
  <tr><td class="n">Die Kinder, <b>denen</b> wir helfen, …</td><td class="e">plural + helfen → Dativ Plural → denen</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Verbposition</span>A relative clause is a subordinate clause: the conjugated verb goes to the <b>end</b>, and the clause is always fenced by commas.</div>`},
 {typ:'regel', t:'was, wo, wofür — the special cases', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Wort</th><th>Wann?</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">was</td><td class="e">after alles, etwas, nichts, das, vieles — or a whole clause</td><td class="n">Das ist alles, <b>was</b> ich weiß.<br>Er kam zu spät, <b>was</b> mich geärgert hat.</td></tr>
  <tr><td class="g">wo</td><td class="e">places</td><td class="n">Die Stadt, <b>wo</b> ich geboren bin, …<br><i>(= in der ich geboren bin)</i></td></tr>
  <tr><td class="g">Präposition + Pronomen</td><td class="e">when the verb has a fixed preposition</td><td class="n">Der Kurs, <b>für den</b> ich mich angemeldet habe, …<br>Der Mann, <b>über den</b> wir gesprochen haben, …</td></tr>
  </tbody></table></div>`},
 {typ:'ueb', art:'mcq', t:'Übung 1 — Welches Relativpronomen?', items:[
  {q:'Der Mann, ___ dort steht, ist mein Chef.', en:'', opts:['der','den','dem','dessen'], a:0, fb:'Subject of steht → Nominativ.'},
  {q:'Der Film, ___ wir gestern gesehen haben, war gut.', en:'', opts:['der','den','dem','dessen'], a:1, fb:'Object of sehen → Akkusativ masculine → den.'},
  {q:'Die Frau, ___ ich geholfen habe, ist Ärztin.', en:'', opts:['die','der','den','deren'], a:1, fb:'helfen + Dativ, feminine → der.'},
  {q:'Das Kind, ___ Mutter Lehrerin ist, heißt Lena.', en:'', opts:['das','dem','dessen','deren'], a:2, fb:'Possession, neuter → dessen.'},
  {q:'Die Leute, ___ wir geschrieben haben, antworten nicht.', en:'', opts:['die','denen','deren','der'], a:1, fb:'Dativ Plural → denen.'},
  {q:'Die Stadt, in ___ ich wohne, ist klein.', en:'', opts:['die','der','dem','denen'], a:1, fb:'in + Dativ (position), feminine → der.'},
  {q:'Das ist alles, ___ ich weiß.', en:'', opts:['das','was','wo','dem'], a:1, fb:'After "alles" → was.'},
  {q:'Der Kurs, für ___ ich mich angemeldet habe, beginnt morgen.', en:'', opts:['der','den','dem','dessen'], a:1, fb:'für + Akkusativ → den.'},
  {q:'Die Frau, ___ Sohn in meiner Klasse ist, …', en:'', opts:['die','der','deren','dessen'], a:2, fb:'Genitiv feminine → deren.'},
  {q:'Er hat mich nicht angerufen, ___ ich sehr schade finde.', en:'', opts:['das','was','wo','der'], a:1, fb:'Referring to the whole preceding clause → was.'}
 ]},
 {typ:'ueb', art:'luecke', t:'Übung 2 — Ergänze das Pronomen', items:[

STATIONEN.push({

  <div class="rule warn"><span class="lbl">Das -s am Nomen</span>Masculine and neuter nouns add <b>-s</b> or <b>-es</b>:<br>

 {typ:'regel', t:'Wo braucht man den Genitiv?', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Funktion</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">Besitz</td><td class="n">das Auto <b>meines Bruders</b> · die Farbe <b>des Hauses</b></td></tr>
  <tr><td class="g">Genitivpräpositionen</td><td class="n"><b>wegen</b> des Wetters · <b>trotz</b> der Kälte · <b>während</b> der Pause · <b>statt</b> des Autos · <b>innerhalb</b> einer Woche · <b>außerhalb</b> der Stadt · <b>aufgrund</b> der Situation</td></tr>
  <tr><td class="g">Feste Wendungen</td><td class="n">eines Tages · meiner Meinung nach · in der Nähe des Bahnhofs</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Gesprochene Sprache</span>In everyday speech Germans often say <b class="de">von + Dativ</b> instead: <i>das Auto <b>von meinem Bruder</b></i>. That is acceptable when speaking, but in the written exam the genitive scores better. Note also that <b>wegen</b> and <b>trotz</b> are commonly heard with the dative (wegen dem Wetter) — correct written form is the genitive.</div>`},
 {typ:'regel', t:'n-Deklination — the weak masculine nouns', html:`
  <p>A closed group of masculine nouns adds <b>-n</b> or <b>-en</b> in <b>every case except the nominative singular</b>.</p>

  <p>Which nouns? Mostly: male people ending in <b>-e</b> (Kollege, Junge, Kunde, Experte), professions and nationalities ending in <b>-ent, -ant, -ist, -oge, -at</b> (Student, Praktikant, Journalist, Biologe, Kandidat), plus Mensch, Herr, Nachbar, Bauer, Nachbar.</p>`},

STATIONEN.push({
id:'futur', g:'05', kat:'Grammatik', t:'Futur I & Plusquamperfekt', en:'Future & past perfect',
lead:'Two tenses that complete your timeline. Futur I is used less than English learners expect — but it carries meanings the present tense cannot. Plusquamperfect lets you say that one past event happened before another.',
bloecke:[
 {typ:'regel', t:'Futur I — werden + Infinitiv', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Pronomen</th><th>werden</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">ich</td><td class="e">werde</td><td class="n">Ich <b>werde</b> morgen <b>anrufen</b>.</td></tr>
  <tr><td class="g">du</td><td class="e">wirst</td><td class="n">Du <b>wirst</b> es <b>schaffen</b>.</td></tr>
  <tr><td class="g">er/sie/es</td><td class="e">wird</td><td class="n">Es <b>wird</b> wohl <b>regnen</b>.</td></tr>
  <tr><td class="g">wir</td><td class="e">werden</td><td class="n">Wir <b>werden</b> uns <b>melden</b>.</td></tr>
  <tr><td class="g">ihr</td><td class="e">werdet</td><td class="n">Ihr <b>werdet</b> viel <b>lernen</b>.</td></tr>
  <tr><td class="g">sie/Sie</td><td class="e">werden</td><td class="n">Sie <b>werden</b> informiert <b>werden</b>.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Wann wirklich Futur?</span>For ordinary future plans German uses the <b>present tense</b> with a time word:<br>
  <b class="de">Morgen fahre ich nach Berlin.</b> — I'm going to Berlin tomorrow. <i>(not "werde fahren")</i><br><br>
  Futur I is reserved for:<br>
  <b>1. Vermutung</b> (assumption): <i>Er <b>wird wohl</b> im Stau stehen.</i> — He's probably stuck in traffic.<br>
  <b>2. Versprechen / feste Absicht</b>: <i>Ich <b>werde</b> dich nicht enttäuschen.</i><br>
  <b>3. Vorhersage</b>: <i>Die Preise <b>werden</b> weiter <b>steigen</b>.</i><br><br>
  Signal words for assumption: <b class="de">wohl, wahrscheinlich, vermutlich, sicher</b>.</div>`},
 {typ:'regel', t:'Plusquamperfekt — the past before the past', html:`
  <p>Formula: <b class="de">hatte / war + Partizip II</b>. Same helper verb rules as the Perfekt.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Struktur</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">hatte + Partizip II</td><td class="n">Ich <b>hatte</b> schon <b>gegessen</b>, als er kam.</td></tr>
  <tr><td class="g">war + Partizip II</td><td class="n">Er <b>war</b> schon <b>gegangen</b>, als ich ankam.</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">nachdem — the natural partner</span><b>nachdem</b> almost always takes the Plusquamperfekt in its clause and the Präteritum or Perfekt in the main clause:<br>
  <b class="de">Nachdem ich gegessen hatte, ging ich spazieren.</b><br>
  <b class="de">Nachdem er angekommen war, rief er seine Familie an.</b><br><br>
  Compare <b>bevor</b>, which does the opposite: <i>Bevor ich <b>ging</b>, hatte ich gegessen.</i></div>`},

STATIONEN.push({
id:'zuinfinitiv', g:'06', kat:'Grammatik', t:'zu + Infinitiv, um…zu, damit', en:'Infinitive clauses & purpose',
lead:'These structures let you express purpose, intention and attitude without starting a new sentence. The um…zu / damit choice is a guaranteed exam question, and the rule behind it takes ten seconds to learn.',
bloecke:[
 {typ:'regel', t:'Wann zu + Infinitiv?', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Nach</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">bestimmten Verben</td><td class="n">Ich habe vergessen, dich <b>anzurufen</b>.<br>Er versucht, mehr <b>zu lernen</b>.<br>Wir haben vor, nach Berlin <b>zu fahren</b>.</td></tr>
  <tr><td class="g">Adjektiv + sein</td><td class="n">Es ist wichtig, gesund <b>zu essen</b>.<br>Es ist schwer, Deutsch <b>zu lernen</b>.</td></tr>
  <tr><td class="g">Nomen + haben</td><td class="n">Ich habe keine Zeit, ins Kino <b>zu gehen</b>.<br>Ich habe Lust, spazieren <b>zu gehen</b>.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Trennbare Verben</span>The <b>zu</b> slots <b>inside</b> the verb: anrufen → an<b>zu</b>rufen · einkaufen → ein<b>zu</b>kaufen · aufstehen → auf<b>zu</b>stehen · mitkommen → mit<b>zu</b>kommen.</div>
  <div class="rule"><span class="lbl">Kein zu nach…</span>modal verbs (Ich <b>muss gehen</b>), and after <b>werden, bleiben, gehen, lassen, hören, sehen</b>: <i>Ich <b>gehe schwimmen</b>. Ich <b>lasse</b> mein Auto <b>reparieren</b>.</i></div>`},
 {typ:'vok', t:'Verben mit zu + Infinitiv', items:[
  ['vorhaben','to plan to'],['versuchen','to try to'],
  ['vergessen','to forget to'],['anfangen / beginnen','to begin to'],
  ['aufhören','to stop doing'],['hoffen','to hope to'],
  ['versprechen','to promise to'],['sich freuen','to be glad to'],
  ['beschließen','to decide to'],['sich entscheiden','to decide to'],

  ['bitten','to ask someone to'],['helfen','to help to'],

  ['die Absicht haben','to intend to'],['Angst haben','to be afraid to']
 ]},
 {typ:'regel', t:'um…zu oder damit?', html:`
  <div class="rule warn"><span class="lbl">Die Ein-Satz-Regel</span>
  <b>Same subject</b> in both halves → <b class="de">um … zu</b><br>
  <b>Different subjects</b> → <b class="de">damit</b></div>
  <div class="tbl-wrap"><table><thead><tr><th>Satz</th><th>Subjekte</th></tr></thead><tbody>
  <tr><td class="n">Ich lerne Deutsch, <b>um</b> in Deutschland <b>zu arbeiten</b>.</td><td class="e">ich / ich — gleich → um…zu</td></tr>
  <tr><td class="n">Ich spare Geld, <b>um</b> ein Auto <b>zu kaufen</b>.</td><td class="e">ich / ich — gleich → um…zu</td></tr>
  <tr><td class="n">Ich erkläre es langsam, <b>damit</b> <u>du</u> es verstehst.</td><td class="e">ich / du — verschieden → damit</td></tr>
  <tr><td class="n">Die Eltern arbeiten viel, <b>damit</b> <u>die Kinder</u> studieren können.</td><td class="e">Eltern / Kinder → damit</td></tr>

  <p><b>Related:</b> <b class="de">ohne … zu</b> (without doing) and <b class="de">statt / anstatt … zu</b> (instead of doing):<br>

  {q:'Es ist wichtig, gesund ___.', en:'', opts:['essen','zu essen','isst','gegessen'], a:1, fb:'Adjective + sein → zu + Infinitiv.'},
  {q:'Ich habe keine Zeit, ins Kino ___.', en:'', opts:['gehen','zu gehen','gehe','gegangen'], a:1, fb:'Noun + haben → zu + Infinitiv.'}
 ]},
 {typ:'ueb', art:'luecke', t:'Übung 2 — Ergänze', items:[

bloecke:[

 {typ:'regel', t:'Konjunktiv I — erkennen', html:`
  <p>Formed from the infinitive stem + <b>-e, -est, -e, -en, -et, -en</b>. In practice you mainly meet the <b>er/sie</b> form.</p>

  <tr><td class="g">können</td><td class="e">kann</td><td class="e"><b>könne</b></td></tr>
  <tr><td class="g">wollen</td><td class="e">will</td><td class="e"><b>wolle</b></td></tr>

  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Wenn die Form gleich aussieht</span>When Konjunktiv I would look identical to the indicative (mainly the plural: <i>sie haben</i>), German switches to <b>Konjunktiv II</b>: <i>Sie sagten, sie <b>hätten</b> keine Zeit.</i></div>`},

 {typ:'text', t:'Lesen — Die duale Ausbildung', meta:'Informationstext', html:`
  <p>In Deutschland gibt es einen Weg in den Beruf, den viele Menschen aus anderen Ländern nicht kennen: die <b>duale Ausbildung</b>. „Dual" bedeutet, dass die Auszubildenden an zwei Orten lernen — drei bis vier Tage pro Woche arbeiten sie in einem Betrieb, ein bis zwei Tage besuchen sie die Berufsschule.</p>
  <p>Eine Ausbildung dauert in der Regel zwei bis dreieinhalb Jahre. Der wichtigste Unterschied zum Studium ist, dass die Azubis von Anfang an Geld verdienen. Die Vergütung ist zwar niedrig — je nach Beruf zwischen 700 und 1.200 Euro im Monat — aber sie steigt jedes Jahr.</p>
  <p>Ein großer Vorteil besteht darin, dass die Auszubildenden praktische Erfahrung sammeln, während sie lernen. Viele Betriebe übernehmen ihre Azubis nach der Prüfung direkt als Mitarbeiter. Nach Angaben der Handelskammer werden mehr als zwei Drittel der Auszubildenden übernommen.</p>
  <p>Allerdings gibt es auch Kritik. Manche Azubis berichten, dass sie im Betrieb vor allem einfache Arbeiten erledigen müssten und zu wenig lernten. Außerdem finden nicht alle Jugendlichen einen Ausbildungsplatz: In manchen Regionen gibt es deutlich mehr Bewerber als Stellen, in anderen bleiben Stellen unbesetzt.</p>
  <p>Trotzdem gilt das duale System international als Vorbild. Mehrere Länder haben versucht, es zu übernehmen — mit unterschiedlichem Erfolg, denn es funktioniert nur, wenn die Betriebe wirklich mitmachen.</p>`},

 {typ:'schreiben', t:'Schreiben — Forumsbeitrag', prompt:'In einem Forum wird diskutiert: „Ausbildung oder Studium — was ist der bessere Weg?" Schreiben Sie Ihren Beitrag (ca. 80 Wörter).',
  punkte:['Nennen Sie Ihre Meinung.','Nennen Sie einen Vorteil Ihrer Wahl.','Nennen Sie einen Nachteil der anderen Möglichkeit.','Geben Sie ein Beispiel aus Ihrem Land oder Ihrer Familie.'],
  muster:`Ich finde diese Frage sehr interessant, weil sie in meinem Land ganz anders diskutiert wird.

 {typ:'text', t:'Lesen — Stress am Arbeitsplatz', meta:'Zeitungsartikel', html:`
  <p>Immer mehr Beschäftigte in Deutschland fühlen sich bei der Arbeit unter Druck. Nach einer aktuellen Umfrage einer Krankenkasse geben rund 60 Prozent der Befragten an, dass ihr Arbeitspensum in den letzten fünf Jahren gestiegen sei. Etwa jeder Fünfte berichtet von Schlafproblemen.</p>
  <p>Als Hauptursachen werden ständige Erreichbarkeit, Zeitdruck und häufige Unterbrechungen genannt. Besonders belastend sei, so die Studie, dass viele Beschäftigte auch nach Feierabend berufliche Nachrichten läsen.</p>
  <p>Fachleute empfehlen deshalb klare Grenzen. Wer nach der Arbeit das Diensthandy ausschaltet, erholt sich messbar besser. Auch regelmäßige Bewegung hilft: Schon dreimal dreißig Minuten pro Woche senken das Stressniveau deutlich.</p>
  <p>Einige Unternehmen haben inzwischen reagiert. Sie schalten abends die Mailserver ab oder bieten kostenlose Sportkurse an. Kritiker halten das allerdings für zu wenig. Solange die Arbeitsmenge nicht reduziert werde, seien solche Angebote nur Kosmetik.</p>`},

 {typ:'text', t:'Lesen — Forum: Handy für Kinder?', meta:'Online-Forum · Ab welchem Alter ein Smartphone?', html:`
  <p><b>Nadja:</b> Meine Tochter ist neun und fragt jeden Tag nach einem Handy. Alle in ihrer Klasse hätten schon eins, sagt sie. Ich bin unsicher. Einerseits möchte ich sie erreichen können, wenn sie allein unterwegs ist. Andererseits mache ich mir Sorgen wegen der vielen Stunden vor dem Bildschirm.</p>

 {typ:'schreiben', t:'Schreiben — Forumsbeitrag', prompt:'Schreiben Sie einen Beitrag zu der Frage „Ab welchem Alter sollten Kinder ein Smartphone bekommen?" (ca. 80 Wörter).',
  punkte:['Nennen Sie Ihre Meinung.','Begründen Sie sie mit einem Argument.','Räumen Sie ein Gegenargument ein.','Geben Sie ein Beispiel aus Ihrer Erfahrung.'],
  muster:`Ich habe die Beiträge mit großem Interesse gelesen, weil wir in meiner Familie gerade dasselbe diskutieren.

Meiner Meinung nach sollten Kinder frühestens mit zwölf ein Smartphone bekommen. Ein wichtiger Grund besteht darin, dass jüngere Kinder noch nicht einschätzen können, wie lange sie online sind und welche Inhalte problematisch sind.

 {typ:'text', t:'Lesen — Weniger Müll im Alltag', meta:'Ratgeber-Artikel', html:`
  <p>Jeder Mensch in Deutschland produziert im Durchschnitt etwa 480 Kilogramm Abfall pro Jahr — deutlich mehr als der europäische Durchschnitt. Ein großer Teil davon ist Verpackungsmüll.</p>
  <p>Dabei ließe sich vieles vermeiden. Fachleute empfehlen vor allem drei Schritte. Erstens: unverpackte Ware kaufen, etwa Obst und Gemüse ohne Plastikfolie. Zweitens: Mehrweg statt Einweg — eine Trinkflasche aus Metall ersetzt im Jahr Hunderte Plastikflaschen. Drittens: Lebensmittel besser planen, denn in deutschen Haushalten landen jährlich rund 78 Kilogramm Essen pro Person im Müll.</p>
  <p>Kritiker wenden ein, dass die Verantwortung nicht allein bei den Verbrauchern liege. Solange Hersteller Produkte in drei Schichten Plastik verpackten, sei der Einfluss des Einzelnen begrenzt. Sinnvoller seien gesetzliche Vorgaben für die Industrie.</p>
  <p>Beides schließt sich allerdings nicht aus. Wer im Alltag weniger wegwirft, spart nicht nur Müll, sondern auch Geld — und übt Druck auf die Hersteller aus, denn diese reagieren durchaus auf verändertes Kaufverhalten.</p>`},

  muster:`Mein Thema ist Umweltschutz im Alltag. Ich habe es gewählt, weil jeder von uns täglich Entscheidungen trifft, die die Umwelt betreffen.

In meiner Heimat, in Punjab, ist die Luftverschmutzung ein großes Problem, besonders im Winter. Viele Menschen fahren mit dem Motorrad, weil die öffentlichen Verkehrsmittel nicht gut ausgebaut sind.

 {typ:'text', t:'Teil 4 — Meinungen: Homeoffice', meta:'Leserbriefe: Sollten alle Firmen Homeoffice anbieten?', html:`
  <p><b>a) Petra, 41:</b> Seit ich zwei Tage pro Woche zu Hause arbeite, spare ich täglich zwei Stunden Fahrt. Ich bin ausgeruhter und schaffe mehr als früher im Büro. Für mich wäre ein Zurück undenkbar.</p>

 {typ:'text', t:'Teil 5 — Benutzerordnung', meta:'Stadtbibliothek Köln · Benutzungsordnung (Auszug)', html:`
  <p><b>§1 Anmeldung.</b> Die Anmeldung erfolgt persönlich unter Vorlage eines gültigen Ausweises. Personen unter 18 Jahren benötigen die schriftliche Zustimmung eines Erziehungsberechtigten. Der Bibliotheksausweis ist nicht übertragbar.</p>
  <p><b>§2 Leihfrist.</b> Bücher können vier Wochen entliehen werden, Zeitschriften und DVDs zwei Wochen. Eine Verlängerung um weitere vier Wochen ist zweimal möglich, sofern das Medium nicht von einer anderen Person vorgemerkt wurde. Verlängerungen sind online, telefonisch oder persönlich möglich.</p>
  <p><b>§3 Gebühren.</b> Die Jahresgebühr beträgt 22 Euro; für Schülerinnen, Schüler und Studierende bis 27 Jahre ist die Nutzung kostenfrei. Bei Überschreitung der Leihfrist wird eine Versäumnisgebühr von 0,50 € pro Medium und angefangener Woche erhoben.</p>
  <p><b>§4 Verlust und Beschädigung.</b> Bei Verlust oder Beschädigung ist Ersatz in Höhe des Wiederbeschaffungswertes zu leisten. Eigenmächtige Reparaturen sind nicht gestattet.</p>`},

  {q:'Wie lange kann man eine DVD ausleihen?', en:'', opts:['zwei Wochen','vier Wochen','acht Wochen','ein Jahr'], a:0, fb:'§2: Zeitschriften und DVDs zwei Wochen.'},

  {q:'Eine 24-jährige Studentin zahlt im Jahr:', en:'', opts:['22 €','11 €','0 €','0,50 €'], a:2, fb:'Studierende bis 27 → kostenfrei.'},

 {typ:'regel', t:'Der Aufbau', html:`

  <div class="rule warn"><span class="lbl">Was Punkte kostet</span>

STATIONEN.push({
id:'schreiben3', g:'22', kat:'Prüfung', t:'Schreiben B1', en:'Writing module',
lead:'Three tasks, 60 minutes: a forum post (~80 words), a semi-formal email to someone you know (~80 words), and a short formal message (~40 words). Each has a fixed shape. Learn the shapes and the module becomes predictable.',
bloecke:[
 {typ:'regel', t:'Die drei Aufgaben', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Teil</th><th>Textsorte</th><th>Länge</th><th>Register</th><th>Zeit</th></tr></thead><tbody>
  <tr><td class="g">Teil 1</td><td class="e">Forumsbeitrag / Kommentar</td><td class="n">ca. 80 Wörter</td><td class="n">informell/neutral</td><td class="n">20 Min.</td></tr>
  <tr><td class="g">Teil 2</td><td class="e">E-Mail an eine bekannte Person</td><td class="n">ca. 80 Wörter</td><td class="n">halbformell (du oder Sie)</td><td class="n">25 Min.</td></tr>
  <tr><td class="g">Teil 3</td><td class="e">formelle Nachricht (Absage, Bitte)</td><td class="n">ca. 40 Wörter</td><td class="n">formell (Sie)</td><td class="n">15 Min.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Bewertung</span>Four criteria: <b>Erfüllung</b> (all points covered), <b>Kohärenz</b> (connectors, logical order), <b>Wortschatz</b> (range, not just accuracy), <b>Strukturen</b> (correct and varied grammar).<br><br>
  <b>Kohärenz is where marks are cheapest.</b> Simply using <i>außerdem, allerdings, deshalb, zusammenfassend</i> lifts the score without any new vocabulary.</div>`},
 {typ:'regel', t:'Gerüst für Teil 1 — Forumsbeitrag', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Schritt</th><th>Formulierung</th></tr></thead><tbody>
  <tr><td class="g">1 · Bezug</td><td class="e">Ich habe den Beitrag mit Interesse gelesen, weil …</td></tr>
  <tr><td class="g">2 · Meinung</td><td class="e">Meiner Meinung nach … / Ich bin der Ansicht, dass …</td></tr>
  <tr><td class="g">3 · Argument</td><td class="e">Ein wichtiger Grund besteht darin, dass … , denn …</td></tr>
  <tr><td class="g">4 · Einräumung</td><td class="e">Natürlich gibt es auch Gegenargumente. Allerdings …</td></tr>
  <tr><td class="g">5 · Beispiel</td><td class="e">Bei mir / In meinem Heimatland ist es so, dass …</td></tr>
  <tr><td class="g">6 · Fazit</td><td class="e">Zusammenfassend lässt sich sagen, dass …</td></tr>
  </tbody></table></div>`},
 {typ:'regel', t:'Gerüst für Teil 2 und Teil 3', html:`
  <div class="tbl-wrap"><table><thead><tr><th></th><th>Teil 2 — halbformell</th><th>Teil 3 — formell</th></tr></thead><tbody>
  <tr><td class="g">Anrede</td><td class="e">Liebe Frau Berger, / Hallo Anna,</td><td class="e">Sehr geehrte Frau Berger,<br>Sehr geehrte Damen und Herren,</td></tr>
  <tr><td class="g">Einstieg</td><td class="e">vielen Dank für deine Nachricht. / wie geht es dir?</td><td class="e">ich schreibe Ihnen, weil … / bezugnehmend auf …</td></tr>
  <tr><td class="g">Kern</td><td class="e">Grund nennen · sich entschuldigen · Vorschlag machen</td><td class="e">Sachverhalt · Bitte oder Absage · Frist</td></tr>
  <tr><td class="g">Bitte</td><td class="e">Könntest du mir bitte …?</td><td class="e">Ich bitte Sie, … zu … / Wäre es möglich, …?</td></tr>
  <tr><td class="g">Schluss</td><td class="e">Viele Grüße / Herzliche Grüße</td><td class="e">Vielen Dank im Voraus.<br>Mit freundlichen Grüßen</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Zeitplan</span>Do <b>Teil 3 first</b> — it is the shortest and most formulaic, so you bank those marks. Then Teil 1, then Teil 2. Leave five minutes at the end to check verb endings, verb position, and capital letters on nouns.</div>`},
 {typ:'schreiben', t:'Teil 1 — Forumsbeitrag', prompt:'In einem Forum steht: „Sollten Handys in der Schule verboten werden?" Schreiben Sie Ihren Beitrag (ca. 80 Wörter).',
  punkte:['Ihre Meinung','ein Argument mit Begründung','ein Gegenargument einräumen','ein Beispiel aus Ihrer Erfahrung'],
  muster:`Ich habe die Diskussion mit Interesse verfolgt, weil ich selbst als Lehrer arbeite.

Meiner Meinung nach sollten Handys während des Unterrichts verboten sein. Ein wichtiger Grund besteht darin, dass schon eine kurze Nachricht die Konzentration für mehrere Minuten stört.

Natürlich gibt es Gegenargumente. Ein Handy kann beim Nachschlagen von Wörtern durchaus nützlich sein. Allerdings lässt sich das auch mit Geräten der Schule lösen.

In meinem Unterricht sammle ich die Handys zu Beginn ein. Seitdem ist es deutlich ruhiger geworden.

Zusammenfassend lässt sich sagen, dass ein Verbot im Unterricht sinnvoll ist, in den Pausen aber nicht nötig.`},
 {typ:'schreiben', t:'Teil 2 — Halbformelle E-Mail', prompt:'Sie können an einem Seminar, für das Sie angemeldet sind, nicht teilnehmen. Schreiben Sie an die Kursleiterin, Frau Berger, die Sie schon kennen (ca. 80 Wörter).',
  punkte:['Entschuldigen Sie sich und nennen Sie den Grund.','Fragen Sie nach den Materialien.','Fragen Sie nach einem Ersatztermin.','Bedanken Sie sich.'],
  muster:`Liebe Frau Berger,

leider muss ich Ihnen absagen: Am Samstag kann ich nicht am Seminar teilnehmen, weil meine Tochter operiert wird und ich im Krankenhaus sein möchte.

Das tut mir wirklich leid, denn ich hatte mich sehr auf das Thema gefreut.

Könnten Sie mir die Materialien vielleicht per E-Mail schicken? Dann könnte ich den Stoff zu Hause nacharbeiten.

Außerdem würde mich interessieren, ob das Seminar im nächsten Halbjahr noch einmal angeboten wird.

Vielen Dank für Ihr Verständnis.

Herzliche Grüße
Simran Kaur`},
 {typ:'schreiben', t:'Teil 3 — Formelle Nachricht', prompt:'Sie haben online einen Sprachkurs gebucht, möchten aber vom Vertrag zurücktreten. Schreiben Sie an die Sprachschule (ca. 40 Wörter).',
  punkte:['Nennen Sie die Buchung.','Treten Sie vom Vertrag zurück.','Bitten Sie um Bestätigung und Rückerstattung.'],
  muster:`Sehr geehrte Damen und Herren,

am 12. März habe ich über Ihre Internetseite den Abendkurs B1 gebucht (Buchungsnummer 5589).

Hiermit trete ich fristgerecht von dieser Buchung zurück.

Ich bitte Sie, mir den Rücktritt schriftlich zu bestätigen und die bereits gezahlte Gebühr zurückzuerstatten.

Mit freundlichen Grüßen
Ravi Sharma`},
 {typ:'ueb', art:'mcq', t:'Übung — Register und Struktur', items:[

  {q:'Welcher Satz passt zu Teil 1?', en:'', opts:['Hiermit trete ich vom Vertrag zurück.','Meiner Meinung nach sollte man …','Bitte bestätigen Sie den Termin.','Vielen Dank im Voraus.'], a:1, fb:'Forum post = opinion.'},
  {q:'Welches Kriterium bringt am leichtesten Punkte?', en:'', opts:['schwierige Wörter','Kohärenz durch Konnektoren','lange Sätze','viele Adjektive'], a:1, fb:'Connectors are cheap and heavily rewarded.'},
  {q:'Welche Reihenfolge ist im Zeitmanagement sinnvoll?', en:'', opts:['1, 2, 3','3, 1, 2','2, 3, 1','egal'], a:1, fb:'Bank the short formulaic task first.'},

  {q:'Was ist das WICHTIGSTE Kriterium?', en:'', opts:['perfekte Grammatik','alle Punkte behandeln','Länge','Handschrift'], a:1, fb:'Erfüllung — coverage of all given points.'},
  {q:'"Ich bitte Sie, mir den Betrag zurückzuerstatten." ist:', en:'', opts:['informell','formell','unhöflich','falsch'], a:1, fb:'Formal request pattern.'}

STATIONEN.push({
id:'sprechen3', g:'23', kat:'Prüfung', t:'Sprechen B1', en:'Speaking module',
lead:'Fifteen minutes with a partner, three tasks. Most candidates lose marks not through grammar but through silence — they run out of things to say. The phrase banks below are your insurance.',
bloecke:[
 {typ:'regel', t:'Die drei Teile', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Teil</th><th>Aufgabe</th><th>Dauer</th><th>Worauf es ankommt</th></tr></thead><tbody>
  <tr><td class="g">Teil 1</td><td class="e">Gemeinsam etwas planen<br><i>(Ausflug, Geschenk, Fest)</i></td><td class="n">~3 Min.</td><td class="e">Vorschläge machen, reagieren, sich einigen</td></tr>
  <tr><td class="g">Teil 2</td><td class="e">Präsentation zu einem Thema</td><td class="n">~3 Min. je Person</td><td class="e">Struktur in fünf Folien / Punkten</td></tr>
  <tr><td class="g">Teil 3</td><td class="e">Rückmeldung geben und Fragen stellen</td><td class="n">~2 Min.</td><td class="e">eine Frage stellen, eine Frage beantworten</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Der entscheidende Punkt in Teil 1</span>You are graded on <b>interaction</b>, not on being right. Never simply agree with everything — propose, object once, offer an alternative, then reach agreement. A candidate who says only "Ja, gut" scores low even with perfect grammar.</div>`},
 {typ:'regel', t:'Teil 1 — Redemittel zum Planen', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Funktion</th><th>Redemittel</th></tr></thead><tbody>
  <tr><td class="g">Vorschlag</td><td class="e">Wie wäre es, wenn wir …? · Ich würde vorschlagen, dass … · Was hältst du davon, … zu …? · Wir könnten …</td></tr>
  <tr><td class="g">Zustimmung</td><td class="e">Das ist eine gute Idee. · Damit bin ich einverstanden. · Ja, das machen wir so.</td></tr>
  <tr><td class="g">Ablehnung</td><td class="e">Das finde ich nicht so gut, weil … · Da bin ich anderer Meinung. · Das passt mir leider nicht.</td></tr>
  <tr><td class="g">Alternative</td><td class="e">Stattdessen könnten wir … · Wie wäre es alternativ mit …? · Oder wir machen es so: …</td></tr>
  <tr><td class="g">Nachfragen</td><td class="e">Was meinst du dazu? · Bist du damit einverstanden? · Hast du eine bessere Idee?</td></tr>
  <tr><td class="g">Einigung</td><td class="e">Dann halten wir fest: … · Also treffen wir uns um … · Gut, dann machen wir das so.</td></tr>
  </tbody></table></div>`},
 {typ:'regel', t:'Teil 2 — das Fünf-Punkte-Gerüst', html:`
  <p>Every B1 presentation fits this frame. Memorise the five opening sentences and you will never be stuck.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Folie</th><th>Inhalt</th><th>Einstiegssatz</th></tr></thead><tbody>
  <tr><td class="g">1</td><td class="e">Thema nennen</td><td class="n">Mein Thema ist … Ich habe es gewählt, weil …</td></tr>
  <tr><td class="g">2</td><td class="e">eigene Erfahrung</td><td class="n">Ich möchte von meinen eigenen Erfahrungen berichten. …</td></tr>
  <tr><td class="g">3</td><td class="e">Situation im Heimatland</td><td class="n">In meiner Heimat ist es so, dass …</td></tr>
  <tr><td class="g">4</td><td class="e">Vor- und Nachteile / Meinung</td><td class="n">Ein Vorteil ist … Allerdings gibt es auch Nachteile, zum Beispiel …</td></tr>
  <tr><td class="g">5</td><td class="e">Abschluss</td><td class="n">Zusammenfassend lässt sich sagen, dass … Vielen Dank für Ihre Aufmerksamkeit.</td></tr>
  </tbody></table></div>

  window.speechSynthesis.onvoiceschanged = pickVoice;
}
var warned=false;
function say(text, rate){
  if(!('speechSynthesis' in window)){
    if(!warned){ toast('Audio not supported in this browser'); warned=true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang='de-DE';
    u.rate = rate||0.9;
    if(voice) u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!=null) n.innerHTML=html;
  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[.,!?;:„“"'()]/g,'')
    .replace(/\s+/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Anhören';
  b.setAttribute('aria-label','Play German audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){
  var bar=el('div','umlaut');
  ['ä','ö','ü','ß','Ä','Ö','Ü'].forEach(function(ch){
    var b=el('button',null,ch);
    b.type='button';
    b.onclick=function(){
      var s=input.selectionStart||input.value.length;
      var e2=input.selectionEnd||s;
      input.value = input.value.slice(0,s)+ch+input.value.slice(e2);
      input.focus();
      input.setSelectionRange(s+1,s+1);
    };
    bar.appendChild(b);
  });
  return bar;
}

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Punkte · '+overall+' % Fahrplan';
}

/* --- multiple choice --- */
function renderMCQ(blk, onDone){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' Fragen'));
  var scoreLbl=el('div','ex-count','0 richtig');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, answered=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + (item.en?'<span class="q-en">'+esc(item.en)+'</span>':'');
    q.appendChild(t);

    var opts=el('div','opts');
    var btns=[];
    var fb=el('div','fb');
    function apply(i, restoring){
      btns.forEach(function(x){ x.disabled=true; });
      answered++;
      if(i===item.a){
        btns[i].classList.add('right'); right++;
        if(!restoring) addXP(2);
      }else{
        btns[i].classList.add('wrong');
        btns[item.a].classList.add('right');
      }
      fb.className='fb show '+(i===item.a?'ok':'no');
      fb.innerHTML=(i===item.a?'✓ Richtig! ':'✗ ')+(item.fb||'');
      scoreLbl.textContent=right+' richtig';
      if(!restoring) setAns(blk, idx, i);
      markProgress(blk._st, blk._k, Math.round(right/n*100));
    }
    item.opts.forEach(function(o,i){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
      b.onclick=function(){ if(b.disabled) return; apply(i, false); };
      btns.push(b);
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q.appendChild(fb);
    wrap.appendChild(q);
    var prevA=getAns(blk, idx);

  return wrap;
}

function renderOrdnen(blk){

  blk.items.forEach(function(item, idx){

      '<span class="en-i">'+esc(item.en||'')+'</span>'));

    function mkWord(w, inSlot){
      var b=el('button','word', esc(w));
      b.type='button';
      b.onclick=function(){
        if(settled) return;
        b.remove();
        (inSlot?pool:slot).appendChild(mkWord(w, !inSlot));

      var got=Array.prototype.map.call(slot.children,function(c){return c.textContent;}).join(' ');
      var ok = norm(got)===norm(item.a);
      fb.className='fb show '+(ok?'ok':'no');

        fb.innerHTML='✓ Richtig! <b>'+esc(item.a)+'.</b> ';
        var s=speakBtn(item.a); fb.appendChild(s);

        fb.textContent='✗ Die Reihenfolge stimmt noch nicht. Denk an das Verb auf Position 2.';
      }
    };
    show.onclick=function(){
      if(settled) return;
      settled=true; done++;
      slot.innerHTML=''; pool.innerHTML='';
      target.forEach(function(w){ slot.appendChild(mkWord(w,true)); });
      fb.className='fb show no';
      fb.innerHTML='Lösung: <b>'+esc(item.a)+'.</b> ';
      fb.appendChild(speakBtn(item.a));
      btn.disabled=true;
      if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));

/* --- matching pairs --- */
function renderPaare(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' Paare'));
  var scoreLbl=el('div','ex-count','0 gefunden');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var grid=el('div','pairs');
  var L=el('div','pcol'), R=el('div','pcol');
  grid.appendChild(L); grid.appendChild(R);
  wrap.appendChild(grid);

  var found=0, n=blk.items.length, sel=null;
  var leftItems=shuffle(blk.items.map(function(p,i){return {t:p[0],i:i};}));
  var rightItems=shuffle(blk.items.map(function(p,i){return {t:p[1],i:i};}));

  function mk(col, obj, side){
    var b=el('button','pbtn', esc(obj.t));
    b.type='button';
    b.dataset.i=obj.i;
    b.onclick=function(){
      if(b.classList.contains('done')) return;
      if(side==='L'){ say(obj.t); }
      if(!sel){ 
        if(side!=='L'){ toast('Wähle zuerst links'); return; }
        sel=b; b.classList.add('sel'); return;
      }
      if(sel===b){ sel=null; b.classList.remove('sel'); return; }
      if(side==='L'){ sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.i===b.dataset.i){
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
        sel=null; found++; addXP(2);
        scoreLbl.textContent=found+' gefunden';
        if(found===n){ markProgress(blk._st, blk._k, 100); toast('Alle Paare gefunden!'); }
      }else{
        b.classList.add('miss');
        setTimeout(function(){ b.classList.remove('miss'); },320);
      }
    };
    col.appendChild(b);
  }
  leftItems.forEach(function(o){ mk(L,o,'L'); });
  rightItems.forEach(function(o){ mk(R,o,'R'); });
  return wrap;
}

  var pos=0, flipped=false;

  var card=el('div','card');

  function paint(){
    var it=blk.items[order[pos]];
    card.innerHTML='';

    if(flipped){ card.appendChild(el('div','back', esc(it[1]))); }
    card.appendChild(el('div','hint', flipped?'Tippen zum Umdrehen':'Tippen für die Antwort'));
    counter.textContent='Karte '+(pos+1)+' von '+order.length;
  }
  card.onclick=function(){ flipped=!flipped; paint(); };

  var prev=el('button','btn sm ghost','◀ Zurück'); prev.type='button';
  var hear=el('button','btn sm gelb','▶ Hören'); hear.type='button';
  var next=el('button','btn sm','Weiter ▶'); next.type='button';
  var mix=el('button','btn sm ghost','Mischen'); mix.type='button';

  prev.onclick=function(){ pos=(pos-1+order.length)%order.length; flipped=false; paint(); };
  next.onclick=function(){
