/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#35A0F0;
  --signal-dim:#1B72BD;
  --rail:#12457A;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#35A0F0}
.lvl-card.l4{border-top-color:#B8202E}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#35A0F0}
.lvl-card.l4 .lvl-code{color:#B8202E}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#35A0F0}
.fp-lvl.l4{background:#B8202E}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}
/* ---------- Pioneer header lockup ---------- */
.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}
.plogo{height:46px; width:auto; display:block; border-radius:3px; flex:none;
       box-shadow:0 1px 6px rgba(0,0,0,.35)}
.brandcenter{flex:1; text-align:center; min-width:0}
.bname{
  font-family:var(--sans-w); font-weight:800; font-size:17px; letter-spacing:.15em;
  text-transform:uppercase; color:var(--enamel); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.bweb{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--signal); margin-top:3px;
}
.bweb span{color:#8A96A3}
.levelchip{
  font-family:var(--sans-w); font-weight:800; font-size:21px; letter-spacing:.06em;
  background:var(--signal); color:var(--board); padding:4px 12px; border-radius:3px;
  line-height:1.15; flex:none;
}
@media (max-width:900px){
  .board-top{gap:9px; flex-wrap:wrap}
  .plogo{height:32px}
  .plogo.right{display:none}
  .bname{font-size:12px; letter-spacing:.09em}
  .bweb{font-size:9px; letter-spacing:.1em}
  .levelchip{font-size:16px; padding:3px 9px}
}

STATIONEN.push({

lead:'This is the engine room of German. Six pronouns, six endings — and once you know them, you can conjugate roughly 90 % of all German verbs correctly. Learn the endings, not the words.',
bloecke:[
 {typ:'regel', t:'Die Personalpronomen', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Deutsch</th><th>English</th><th>Hinweis</th></tr></thead><tbody>

  <tr><td class="g">du</td><td class="e">you (one person, informal)</td><td class="n">friends, family</td></tr>
  <tr><td class="g">er / sie / es</td><td class="e">he / she / it</td><td class="n">follows the noun's gender</td></tr>

  <tr><td class="g">ihr</td><td class="e">you (several people, informal)</td><td class="n">a group of friends</td></tr>
  <tr><td class="g">sie</td><td class="e">they</td><td class="n">small s</td></tr>
  <tr><td class="g">Sie</td><td class="e">you (formal, one or many)</td><td class="n">ALWAYS capital S</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Die sie-Falle</span>Three different words look the same: <b class="de">sie</b> = she, <b class="de">sie</b> = they, <b class="de">Sie</b> = you (formal). Tell them apart by the <b>verb ending</b>: <i>sie komm<b>t</b></i> = she comes · <i>sie komm<b>en</b></i> = they come · <i>Sie komm<b>en</b></i> = you come.</div>`},
 {typ:'regel', t:'Die sechs Endungen — the six endings', html:`
  <p>Take the infinitive (<b class="de">wohnen</b>), cut off <b>-en</b> to get the stem (<b class="de">wohn-</b>), then add the ending.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Pronomen</th><th>Endung</th><th>wohnen</th><th>lernen</th><th>spielen</th></tr></thead><tbody>
  <tr><td class="g">ich</td><td class="n">-e</td><td class="e">wohn<b>e</b></td><td class="e">lern<b>e</b></td><td class="e">spiel<b>e</b></td></tr>
  <tr><td class="g">du</td><td class="n">-st</td><td class="e">wohn<b>st</b></td><td class="e">lern<b>st</b></td><td class="e">spiel<b>st</b></td></tr>
  <tr><td class="g">er/sie/es</td><td class="n">-t</td><td class="e">wohn<b>t</b></td><td class="e">lern<b>t</b></td><td class="e">spiel<b>t</b></td></tr>
  <tr><td class="g">wir</td><td class="n">-en</td><td class="e">wohn<b>en</b></td><td class="e">lern<b>en</b></td><td class="e">spiel<b>en</b></td></tr>
  <tr><td class="g">ihr</td><td class="n">-t</td><td class="e">wohn<b>t</b></td><td class="e">lern<b>t</b></td><td class="e">spiel<b>t</b></td></tr>
  <tr><td class="g">sie/Sie</td><td class="n">-en</td><td class="e">wohn<b>en</b></td><td class="e">lern<b>en</b></td><td class="e">spiel<b>en</b></td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Aussprache-Hilfe</span>If the stem ends in <b>-t, -d, -n</b> after a consonant, insert an extra <b>e</b> so you can say it:<br>
  arbeit<b>en</b> → du arbeit<b>e</b>st, er arbeit<b>e</b>t, ihr arbeit<b>e</b>t<br>
  find<b>en</b> → du find<b>e</b>st, er find<b>e</b>t<br>
  If the stem ends in <b>-s, -ß, -z, -x</b>, the du-form loses its s: heißen → du hei<b>ßt</b>, tanzen → du tan<b>zt</b>.</div>`},

STATIONEN.push({
id:'verben2', g:'07', kat:'Grammatik', t:'sein, haben & unregelmäßige Verben', en:'to be, to have & irregular verbs',
lead:'Some verbs change their stem vowel in the du- and er-forms. There are only three patterns, and about twenty verbs matter at A1. sein and haben are irregular everywhere — memorise them like a poem.',
bloecke:[
 {typ:'regel', t:'sein und haben — the two you must never get wrong', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Pronomen</th><th>sein (to be)</th><th>haben (to have)</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">ich</td><td class="e"><b>bin</b></td><td class="e"><b>habe</b></td><td class="n">Ich bin müde. Ich habe Zeit.</td></tr>
  <tr><td class="g">du</td><td class="e"><b>bist</b></td><td class="e"><b>hast</b></td><td class="n">Du bist nett. Du hast Glück.</td></tr>
  <tr><td class="g">er/sie/es</td><td class="e"><b>ist</b></td><td class="e"><b>hat</b></td><td class="n">Er ist Lehrer. Sie hat Hunger.</td></tr>
  <tr><td class="g">wir</td><td class="e"><b>sind</b></td><td class="e"><b>haben</b></td><td class="n">Wir sind hier. Wir haben Ferien.</td></tr>
  <tr><td class="g">ihr</td><td class="e"><b>seid</b></td><td class="e"><b>habt</b></td><td class="n">Ihr seid spät. Ihr habt Zeit.</td></tr>
  <tr><td class="g">sie/Sie</td><td class="e"><b>sind</b></td><td class="e"><b>haben</b></td><td class="n">Sie sind Ärzte.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Achtung</span><b>ihr seid</b> is written with <b>d</b>, not t. This is a favourite exam trap.</div>`},
 {typ:'regel', t:'Die drei Vokalwechsel — the three vowel changes', html:`
  <p>The change happens <b>only in the du- and er/sie/es-forms</b>. Everywhere else the verb is completely regular.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Wechsel</th><th>Infinitiv</th><th>du</th><th>er/sie/es</th></tr></thead><tbody>
  <tr><td class="g">a → ä</td><td class="e">fahren (to drive)</td><td class="n">du f<b>ä</b>hrst</td><td class="n">er f<b>ä</b>hrt</td></tr>
  <tr><td class="g">a → ä</td><td class="e">schlafen (to sleep)</td><td class="n">du schl<b>ä</b>fst</td><td class="n">er schl<b>ä</b>ft</td></tr>
  <tr><td class="g">a → ä</td><td class="e">tragen (to carry/wear)</td><td class="n">du tr<b>ä</b>gst</td><td class="n">er tr<b>ä</b>gt</td></tr>
  <tr><td class="g">e → i</td><td class="e">sprechen (to speak)</td><td class="n">du spr<b>i</b>chst</td><td class="n">er spr<b>i</b>cht</td></tr>
  <tr><td class="g">e → i</td><td class="e">essen (to eat)</td><td class="n">du <b>i</b>sst</td><td class="n">er <b>i</b>sst</td></tr>
  <tr><td class="g">e → i</td><td class="e">helfen (to help)</td><td class="n">du h<b>i</b>lfst</td><td class="n">er h<b>i</b>lft</td></tr>
  <tr><td class="g">e → i</td><td class="e">geben (to give)</td><td class="n">du g<b>i</b>bst</td><td class="n">er g<b>i</b>bt</td></tr>
  <tr><td class="g">e → ie</td><td class="e">lesen (to read)</td><td class="n">du l<b>ie</b>st</td><td class="n">er l<b>ie</b>st</td></tr>
  <tr><td class="g">e → ie</td><td class="e">sehen (to see)</td><td class="n">du s<b>ie</b>hst</td><td class="n">er s<b>ie</b>ht</td></tr>
  <tr><td class="g">a → ä + umlaut</td><td class="e">laufen (to run)</td><td class="n">du l<b>äu</b>fst</td><td class="n">er l<b>äu</b>ft</td></tr>
  <tr><td class="g">völlig irregulär</td><td class="e">wissen (to know)</td><td class="n">du w<b>ei</b>ßt</td><td class="n">er w<b>ei</b>ß</td></tr>
  <tr><td class="g">völlig irregulär</td><td class="e">nehmen (to take)</td><td class="n">du n<b>imm</b>st</td><td class="n">er n<b>imm</b>t</td></tr>
  <tr><td class="g">völlig irregulär</td><td class="e">werden (to become)</td><td class="n">du w<b>ir</b>st</td><td class="n">er w<b>ir</b>d</td></tr>
  </tbody></table></div>`},
 {typ:'regel', t:'Modalverben — the helper verbs', html:`
  <p>Modal verbs have <b>no ending</b> in the ich- and er-forms, and they send the second verb to the <b>very end</b> of the sentence.</p>

  <tr><td class="g">du</td><td class="e">kannst</td><td class="e">musst</td><td class="e">möchtest</td><td class="e">willst</td><td class="e">darfst</td></tr>
  <tr><td class="g">er/sie/es</td><td class="e">kann</td><td class="e">muss</td><td class="e">möchte</td><td class="e">will</td><td class="e">darf</td></tr>
  <tr><td class="g">wir</td><td class="e">können</td><td class="e">müssen</td><td class="e">möchten</td><td class="e">wollen</td><td class="e">dürfen</td></tr>
  <tr><td class="g">ihr</td><td class="e">könnt</td><td class="e">müsst</td><td class="e">möchtet</td><td class="e">wollt</td><td class="e">dürft</td></tr>
  <tr><td class="g">sie/Sie</td><td class="e">können</td><td class="e">müssen</td><td class="e">möchten</td><td class="e">wollen</td><td class="e">dürfen</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Satzklammer — the sentence bracket</span>

  Wir <b>müssen</b> jetzt nach Hause <b>gehen</b>. — We must go home now.<br>
  <b class="de">Ich möchte einen Kaffee, bitte.</b> — I would like a coffee, please. <i>(möchten can also stand alone)</i></div>`},

STATIONEN.push({

lead:'Every German noun has a gender, and you cannot guess it from meaning — das Mädchen (the girl) is neuter. The only reliable method: always learn the noun WITH its article and its plural. "der Tisch, die Tische" — never just "Tisch".',
bloecke:[
 {typ:'regel', t:'Nominativ & Akkusativ — the two A1 cases', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Fall</th><th>maskulin</th><th>feminin</th><th>neutral</th><th>Plural</th></tr></thead><tbody>
  <tr><td class="g">Nominativ<br><span class="n">(subject)</span></td><td class="e"><b>der</b> Mann<br><b>ein</b> Mann</td><td class="e"><b>die</b> Frau<br><b>eine</b> Frau</td><td class="e"><b>das</b> Kind<br><b>ein</b> Kind</td><td class="e"><b>die</b> Kinder<br>— Kinder</td></tr>
  <tr><td class="g">Akkusativ<br><span class="n">(object)</span></td><td class="e"><b>den</b> Mann<br><b>einen</b> Mann</td><td class="e"><b>die</b> Frau<br><b>eine</b> Frau</td><td class="e"><b>das</b> Kind<br><b>ein</b> Kind</td><td class="e"><b>die</b> Kinder<br>— Kinder</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Die gute Nachricht</span><b>Only the masculine changes.</b> der → den, ein → einen. Feminine, neuter and plural look exactly the same in both cases. Learn that one change and you have the accusative.</div>
  <p><b class="de">Der Mann</b> kauft <b class="de">den Tisch</b>. — <i>The man (subject, nominative) buys the table (object, accusative).</i></p>
  <p><b class="de">Ich habe einen Bruder und eine Schwester.</b> — <i>I have a brother and a sister.</i></p>`},
 {typ:'regel', t:'Genus-Regeln — clues to the gender', html:`
  <div class="tbl-wrap"><table><thead><tr><th>DER (m)</th><th>DIE (f)</th><th>DAS (n)</th></tr></thead><tbody>

  <tr><td class="e">days, months, seasons: der Montag, der Mai, der Sommer</td><td class="e">endings <b>-ung, -heit, -keit, -schaft, -ion, -tät</b>: die Zeitung, die Freiheit, die Nation</td><td class="e">endings <b>-chen, -lein</b>: das Brötchen, das Fräulein</td></tr>

STATIONEN.push({

lead:'German has five plural endings and no single rule that predicts which one a noun takes. But there are strong tendencies tied to gender — learn those, and you will guess right most of the time. In the plural, the article is always DIE.',
bloecke:[
 {typ:'regel', t:'Die fünf Pluralendungen', html:`

  <tr><td class="g">-(e)n</td><td class="e">almost all feminine nouns</td><td class="n">die Frau → die Frau<b>en</b><br>die Lampe → die Lampe<b>n</b><br>die Zeitung → die Zeitung<b>en</b></td></tr>
  <tr><td class="g">-er<br><span class="n">(often + umlaut)</span></td><td class="e">many short neuter nouns</td><td class="n">das Kind → die Kind<b>er</b><br>das Buch → die B<b>ü</b>ch<b>er</b><br>das Haus → die H<b>äu</b>s<b>er</b></td></tr>
  <tr><td class="g">-s</td><td class="e">foreign words, words ending in a vowel</td><td class="n">das Auto → die Auto<b>s</b><br>das Handy → die Handy<b>s</b><br>der Park → die Park<b>s</b></td></tr>
  <tr><td class="g">— (nothing)<br><span class="n">sometimes + umlaut</span></td><td class="e">nouns ending in -er, -en, -el, -chen, -lein</td><td class="n">der Lehrer → die Lehrer<br>das Fenster → die Fenster<br>der Vater → die V<b>ä</b>ter</td></tr>
  </tbody></table></div>

  ✓ <b class="de">Heute lerne ich Deutsch.</b> — right, verb second, subject third.<br>

 {typ:'regel', t:'TeKaMoLo — the order of extra information', html:`

  <tr><td class="g">Immer AKKUSATIV</td><td class="e">durch, für, gegen, ohne, um</td><td class="n">Das ist <b>für</b> <b class="de">den</b> Lehrer.<br>Ich gehe <b>ohne</b> <b class="de">meinen</b> Bruder.</td></tr>

  <tr><td class="g">WECHSEL<br><span class="n">two-way</span></td><td class="e">in, an, auf, über, unter, vor, hinter, neben, zwischen</td><td class="n">Wo? → DATIV: Ich bin <b>in</b> <b class="de">der</b> Schule.<br>Wohin? → AKKUSATIV: Ich gehe <b>in</b> <b class="de">die</b> Schule.</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Die Wechsel-Regel</span>
  <b>Wo?</b> (position, no movement) → <b>Dativ</b><br>
  <b>Wohin?</b> (movement to a place) → <b>Akkusativ</b><br><br>
  Das Buch liegt <b>auf dem</b> Tisch. <i>(Wo? — it lies there → Dativ)</i><br>
  Ich lege das Buch <b>auf den</b> Tisch. <i>(Wohin? — I move it there → Akkusativ)</i></div>
  <div class="rule warn"><span class="lbl">Verschmelzungen — contractions</span>
  in + dem = <b class="de">im</b> · in + das = <b class="de">ins</b> · an + dem = <b class="de">am</b> · an + das = <b class="de">ans</b><br>
  zu + dem = <b class="de">zum</b> · zu + der = <b class="de">zur</b> · bei + dem = <b class="de">beim</b> · von + dem = <b class="de">vom</b></div>`},

  <tr><td class="g">gern</td><td class="e">a VERB — "to like doing"</td><td class="n">Ich trinke <b>gern</b> Tee.<br>Ich spiele <b>gern</b> Cricket.</td></tr>
  <tr><td class="g">mögen</td><td class="e">a NOUN — "to like something"</td><td class="n">Ich <b>mag</b> Tee.<br>Ich <b>mag</b> keinen Kaffee.</td></tr>
  <tr><td class="g">möchten</td><td class="e">a wish RIGHT NOW</td><td class="n">Ich <b>möchte</b> einen Tee, bitte.</td></tr>
  </tbody></table></div>
  <div class="rule warn"><span class="lbl">Der klassische Fehler</span>
  ✗ <s>Ich mag Tee trinken.</s> — wrong<br>
  ✓ <b class="de">Ich trinke gern Tee.</b> — right (gern goes with the verb)<br>
  ✓ <b class="de">Ich mag Tee.</b> — right (mögen goes with the noun)</div>
  <div class="tbl-wrap"><table><thead><tr><th>mögen</th><th></th><th>mögen</th><th></th></tr></thead><tbody>
  <tr><td class="g">ich</td><td class="e">mag</td><td class="g">wir</td><td class="e">mögen</td></tr>
  <tr><td class="g">du</td><td class="e">magst</td><td class="g">ihr</td><td class="e">mögt</td></tr>
  <tr><td class="g">er/sie/es</td><td class="e">mag</td><td class="g">sie/Sie</td><td class="e">mögen</td></tr>
  </tbody></table></div>`},
 {typ:'regel', t:'Steigerung — gern, lieber, am liebsten', html:`
  <div class="tbl-wrap"><table><thead><tr><th>Stufe</th><th>Wort</th><th>Beispiel</th></tr></thead><tbody>
  <tr><td class="g">1 — I like</td><td class="e">gern</td><td class="n">Ich trinke <b>gern</b> Tee.</td></tr>
  <tr><td class="g">2 — I prefer</td><td class="e">lieber</td><td class="n">Ich trinke <b>lieber</b> Kaffee.</td></tr>
  <tr><td class="g">3 — I like most</td><td class="e">am liebsten</td><td class="n"><b>Am liebsten</b> trinke ich Mango-Lassi.</td></tr>
  </tbody></table></div>
  <div class="rule"><span class="lbl">Nicht mögen — dislikes</span>
  <b class="de">Ich trinke nicht gern Kaffee.</b> — I don't like drinking coffee.<br>
  <b class="de">Ich mag keinen Kaffee.</b> — I don't like coffee. <i>(kein + noun)</i><br>
  <b class="de">Ich hasse Spinat.</b> — I hate spinach. <i>(strong)</i><br>
  <b class="de">Das schmeckt mir nicht.</b> — I don't like the taste of that.<br>
  <b class="de">Das finde ich langweilig.</b> — I find that boring.</div>`},

  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[.,!?;:„“"'()]/g,'')
    .replace(/\s+/g,' ')
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Anhören';
  b.setAttribute('aria-label','Play German audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){
  var bar=el('div','umlaut');
  ['ä','ö','ü','ß','Ä','Ö','Ü'].forEach(function(ch){
    var b=el('button',null,ch);
    b.type='button';
    b.onclick=function(){
      var s=input.selectionStart||input.value.length;
      var e2=input.selectionEnd||s;
      input.value = input.value.slice(0,s)+ch+input.value.slice(e2);
      input.focus();
      input.setSelectionRange(s+1,s+1);
    };
    bar.appendChild(b);
  });
  return bar;
}

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Punkte · '+overall+' % Fahrplan';
}

function renderPaare(blk){

  var grid=el('div','pairs');
  var L=el('div','pcol'), R=el('div','pcol');
  grid.appendChild(L); grid.appendChild(R);
  wrap.appendChild(grid);

  var found=0, n=blk.items.length, sel=null;
  var leftItems=shuffle(blk.items.map(function(p,i){return {t:p[0],i:i};}));
  var rightItems=shuffle(blk.items.map(function(p,i){return {t:p[1],i:i};}));

  function mk(col, obj, side){
    var b=el('button','pbtn', esc(obj.t));
    b.type='button';
    b.dataset.i=obj.i;
    b.onclick=function(){
      if(b.classList.contains('done')) return;
      if(side==='L'){ say(obj.t); }
      if(!sel){ 
        if(side!=='L'){ toast('Wähle zuerst links'); return; }
        sel=b; b.classList.add('sel'); return;
      }
      if(sel===b){ sel=null; b.classList.remove('sel'); return; }
      if(side==='L'){ sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.i===b.dataset.i){
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
        sel=null; found++; addXP(2);
        scoreLbl.textContent=found+' gefunden';
        if(found===n){ markProgress(blk._st, blk._k, 100); toast('Alle Paare gefunden!'); }
      }else{
        b.classList.add('miss');
        setTimeout(function(){ b.classList.remove('miss'); },320);
      }
    };
    col.appendChild(b);
  }
  leftItems.forEach(function(o){ mk(L,o,'L'); });
  rightItems.forEach(function(o){ mk(R,o,'R'); });
  return wrap;
}

function renderKarten(blk){
  var wrap=el('div','ex');

  var pos=0, flipped=false;

  var card=el('div','card');
  var counter=el('div','ex-count','');
  var ctrls=el('div','inrow');

  function paint(){
    var it=blk.items[order[pos]];
    card.innerHTML='';
    card.appendChild(el('div','face', esc(it[0])));
    if(flipped){ card.appendChild(el('div','back', esc(it[1]))); }
    card.appendChild(el('div','hint', flipped?'Tippen zum Umdrehen':'Tippen für die Antwort'));
    counter.textContent='Karte '+(pos+1)+' von '+order.length;
  }
  card.onclick=function(){ flipped=!flipped; paint(); };

  var prev=el('button','btn sm ghost','◀ Zurück'); prev.type='button';
  var hear=el('button','btn sm gelb','▶ Hören'); hear.type='button';
  var next=el('button','btn sm','Weiter ▶'); next.type='button';
  var mix=el('button','btn sm ghost','Mischen'); mix.type='button';

  prev.onclick=function(){ pos=(pos-1+order.length)%order.length; flipped=false; paint(); };
  next.onclick=function(){
    pos=(pos+1)%order.length; flipped=false; paint();
    if(pos===0){ markProgress(blk._st, blk._k, 100); addXP(5); toast('Kartenstapel fertig!'); }
  };
  hear.onclick=function(){ var it=blk.items[order[pos]]; say(it[0]); };
  mix.onclick=function(){ order=shuffle(order); pos=0; flipped=false; paint(); toast('Gemischt'); };

  ctrls.appendChild(prev); ctrls.appendChild(hear); ctrls.appendChild(next); ctrls.appendChild(mix);
  stage.appendChild(card); stage.appendChild(counter); stage.appendChild(ctrls);
  wrap.appendChild(stage);
  paint();
  return wrap;
}

  head.appendChild(el('h1',null,'Wo möchtest du einsteigen?<span class="en">Pick a level — you do not have to start at Gleis 01</span>'));
  head.appendChild(el('p','lead','The course is split into four levels. Jump straight to the one that matches you, or take the two-minute placement test below and let it choose for you. Your progress is saved automatically.'));
  main.appendChild(head);

  /* resume card */
  if(save.last){
    var li=idxOfId(save.last), lst=STATIONEN[li];
    var rc=el('button','resume'); rc.type='button';
    rc.appendChild(el('span','rg', lst.g));
    rc.appendChild(el('span','rt','<small>Weitermachen · continue where you stopped</small>'+esc(lst.t)));
    rc.appendChild(el('span','ra','Weiter ▶'));
    rc.onclick=function(){ go(li); };
    main.appendChild(rc);
  }

  /* level cards */
  var grid=el('div','lvl-grid');
  LEVELS.forEach(function(lv, li){
    var card=el('button','lvl-card '+lv.cls); card.type='button';
    var top=el('div','lvl-top');
    var left=el('div');
    left.appendChild(el('div','lvl-code','Stufe '+(li+1)+' · '+lv.code));
    left.appendChild(el('div','lvl-name', esc(lv.name)+'<em>'+esc(lv.en)+'</em>'));
    top.appendChild(left);
    top.appendChild(ring(levelPct(lv), LVL_COLOUR[li]));
    card.appendChild(top);
    card.appendChild(el('p','lvl-desc', esc(lv.desc)));

    var chips=el('div','lvl-stations');
    lv.ids.forEach(function(id){
      var st=STATIONEN[idxOfId(id)], p=stationPct(st);
      chips.appendChild(el('span','lvl-chip'+(p>=100?' done':(p>0?' part':'')), st.g));
    });
    card.appendChild(chips);

    var meta=el('div','lvl-meta');
    meta.appendChild(el('span',null, lv.ids.length+' Gleise'));
    meta.appendChild(el('span',null,'Start ▶'));
    card.appendChild(meta);

    card.onclick=function(){
      /* open the first unfinished station in this level */
      var target=lv.ids[0];
      for(var k=0;k<lv.ids.length;k++){
        if(stationPct(STATIONEN[idxOfId(lv.ids[k])])<100){ target=lv.ids[k]; break; }
      }
      go(idxOfId(target));
    };
    grid.appendChild(card);
  });
  main.appendChild(grid);

  /* placement test */
  main.appendChild(renderPlacement());

  var tools=el('div','home-tools');
  var all=el('button','btn ghost','Alle 21 Gleise ansehen'); all.type='button';
  all.onclick=function(){ go(0); };
  tools.appendChild(all);
  main.appendChild(tools);

  var g=document.getElementById('stripG'), t=document.getElementById('stripT');
  g.textContent='⌂';
  t.innerHTML='Übersicht<small>Level select</small>';
  paintNav(); paintXP();
}

function renderPlacement(){
  var box=el('div','place');
  box.appendChild(el('h3',null,'Einstufungstest — where should I start?'));
  box.appendChild(el('p',null,'Sixteen quick questions. Answer honestly and skip nothing — the result tells you which Stufe to open first.'));

  var start=el('button','btn gelb','Test starten'); start.type='button';
  box.appendChild(start);
  var area=el('div');
  box.appendChild(area);

  start.onclick=function(){
    start.style.display='none';
    area.innerHTML='';
    var score=[0,0,0,0], count=[0,0,0,0], answered=0;
    PLACEMENT.forEach(function(item, idx){
      count[item.lvl]++;
      var q=el('div','q');
      q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+item.q));
      var opts=el('div','opts'); var btns=[];
      item.opts.forEach(function(o,i){
        var b=el('button','opt'); b.type='button';
        b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
        b.onclick=function(){
          if(b.disabled) return;
          btns.forEach(function(x){x.disabled=true;});
          answered++;
          if(i===item.a){ b.classList.add('right'); score[item.lvl]++; }
          else{ b.classList.add('wrong'); btns[item.a].classList.add('right'); }
          if(answered===PLACEMENT.length) finish();
        };
        btns.push(b); opts.appendChild(b);
      });
      q.appendChild(opts);
      area.appendChild(q);
    });

    function finish(){
      /* recommended level = first level where the student scored below 70% */
      var rec=LEVELS.length-1;
      for(var i=0;i<4;i++){
        if(count[i] && (score[i]/count[i])<0.7){ rec=i; break; }
      }
      var total=score.reduce(function(a,b){return a+b;},0);
      var res=el('div','place-result');
      var lv=LEVELS[rec];
      res.innerHTML='<b>Empfehlung: Stufe '+(rec+1)+' — '+esc(lv.name)+' ('+lv.code+')</b>'+
        'Du hast '+total+' von '+PLACEMENT.length+' richtig. '+
        'Pro Stufe: A1.1 '+score[0]+'/'+count[0]+' · A1.2 '+score[1]+'/'+count[1]+
        ' · A1.3 '+score[2]+'/'+count[2]+' · A1.4 '+score[3]+'/'+count[3]+'.';
      var goBtn=el('button','btn gelb','Stufe '+(rec+1)+' öffnen ▶');
      goBtn.type='button'; goBtn.style.marginTop='12px';
      goBtn.onclick=function(){ go(idxOfId(lv.ids[0])); };
      res.appendChild(goBtn);
      area.appendChild(res);
      addXP(10);
      res.scrollIntoView({block:'nearest'});
    }
  };
  return box;
}

var current=-1;
function renderStation(idx){
  current=idx;
  var st=STATIONEN[idx];
  save.last=st.id; persist();
  var main=document.getElementById('main');
  main.innerHTML='';

  var lvi=levelOf(st.id), lv=LEVELS[lvi];
  var posInLvl=lv.ids.indexOf(st.id)+1;

  var head=el('div','station-head');
  head.appendChild(el('div','eyebrow','Stufe '+(lvi+1)+' · '+lv.code+' '+lv.name+
    ' · Gleis '+st.g+' ('+posInLvl+' von '+lv.ids.length+')'));
  head.appendChild(el('h1',null, esc(st.t)+'<span class="en">'+esc(st.en)+'</span>'));
  if(st.lead) head.appendChild(el('p','lead', esc(st.lead)));
  main.appendChild(head);

  st.bloecke.forEach(function(b,i){ main.appendChild(renderBlock(st,b,i)); });

  var step=el('div','stepper');
  var prev=el('button','btn ghost','◀ Gleis '+(idx>0?STATIONEN[idx-1].g:STATIONEN[STATIONEN.length-1].g));
  prev.type='button';
  prev.onclick=function(){ go((idx-1+STATIONEN.length)%STATIONEN.length); };

  var over=el('button','btn ghost','⌂ Übersicht'); over.type='button';
  over.onclick=function(){ goHome(); };

  var isLast = (posInLvl===lv.ids.length);
  var next=el('button','btn', isLast
    ? (lvi<LEVELS.length-1 ? 'Stufe '+(lvi+2)+' ▶' : 'Zur Übersicht ▶')
    : 'Gleis '+STATIONEN[idxOfId(lv.ids[posInLvl])].g+' ▶');
  next.type='button';
  next.onclick=function(){
    if(!isLast){ go(idxOfId(lv.ids[posInLvl])); return; }
    if(lvi<LEVELS.length-1){ go(idxOfId(LEVELS[lvi+1].ids[0])); toast('Stufe '+(lvi+2)+' — '+LEVELS[lvi+1].name); }
    else{ goHome(); }
  };
  step.appendChild(prev); step.appendChild(over); step.appendChild(next);
  main.appendChild(step);

  if(!save.done[st.id]) save.done[st.id]={};
  save.done[st.id].seen=1; persist();

  var g=document.getElementById('stripG'), t=document.getElementById('stripT');
  g.textContent=st.g;
  t.innerHTML=esc(st.t)+'<small>'+esc(st.en)+'</small>';
  g.classList.remove('flip'); t.classList.remove('flip');
  void g.offsetWidth;
  g.classList.add('flip'); t.classList.add('flip');

  restoreTyped(st.id);
  paintNav(); paintXP();
}
function go(i){
  renderStation(i);
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}
function goHome(){
  renderHome();
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}

/* ---------- sidebar ---------- */
function paintNav(){
  var nav=document.getElementById('fahrplan');
  nav.innerHTML='';
  var h=el('div','fp-head');
  h.appendChild(el('span',null,'Fahrplan'));
  h.appendChild(el('span',null,STATIONEN.length+' Gleise'));
  nav.appendChild(h);

  var hb=el('button','fp-item'+(current===-1?' on':''));
  hb.type='button';
  hb.appendChild(el('span','fp-g','⌂'));
  hb.appendChild(el('span','fp-t','Übersicht<em>All levels</em>'));
  hb.appendChild(el('span'));
  hb.onclick=goHome;
  nav.appendChild(hb);

  LEVELS.forEach(function(lv, li){
    var lh=el('div','fp-lvl '+lv.cls);
    lh.appendChild(el('span',null,'Stufe '+(li+1)+' · '+lv.code));
    lh.appendChild(el('span',null, levelPct(lv)+'%'));
    nav.appendChild(lh);

    lv.ids.forEach(function(id){
      var i=idxOfId(id), st=STATIONEN[i];
      var b=el('button','fp-item'+(i===current?' on':''));
      b.type='button';
      b.appendChild(el('span','fp-g', st.g));
      b.appendChild(el('span','fp-t', esc(st.t)+'<em>'+esc(st.en)+'</em>'));
      var p=stationPct(st);
      b.appendChild(el('span','fp-dot'+(p>=100?' done':(p>0?' part':''))));
      b.onclick=function(){ go(i); };
      nav.appendChild(b);
    });
  });

  var reset=el('button','btn sm ghost','Fortschritt zurücksetzen');
  reset.type='button';
  reset.style.marginTop='18px';
  reset.onclick=function(){
    if(confirm('Allen Fortschritt löschen?')){
      save={xp:0,done:{},last:null,ans:{},typed:{}}; persist(); goHome(); toast('Zurückgesetzt');
    }
  };
  nav.appendChild(reset);
}
function closeNav(){
  document.getElementById('fahrplan').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('menuBtn').onclick=function(){
  document.getElementById('fahrplan').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
};
document.getElementById('scrim').onclick=closeNav;
document.getElementById('homeBtn').onclick=goHome;

/* keyboard: arrows move between stations, Esc returns to the overview */
document.addEventListener('keydown', function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='Escape'){ goHome(); return; }
  if(current<0) return;
  if(e.key==='ArrowLeft') go((current-1+STATIONEN.length)%STATIONEN.length);
  if(e.key==='ArrowRight') go((current+1)%STATIONEN.length);
});

renderHome();
})();
</script>
</body>
