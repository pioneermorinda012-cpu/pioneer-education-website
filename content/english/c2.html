<style>
/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#FF5C7A;
  --signal-dim:#C2294A;
  --rail:#7A1530;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#C2294A}
.lvl-card.l4{border-top-color:#1B4D89}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#C2294A}
.lvl-card.l4 .lvl-code{color:#1B4D89}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#C2294A}
.fp-lvl.l4{background:#1B4D89}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}

.bname{

  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;

.levelchip{

UNIT('c2_syntax','01','Command of language','Complex Syntax: Absolute Constructions, Parenthesis and Layered Clauses','जटिल वाक्य-रचना · ਗੁੰਝਲਦਾਰ ਵਾਕ-ਬਣਤਰ',
'At C2 you control long, layered sentences without losing the reader: absolute constructions, parenthetical commentary, concessive and correlative structures.',
'C2 में आप लंबे, परतदार वाक्यों को पाठक को भटकाए बिना सँभालते हैं: absolute constructions, parenthetical टिप्पणियाँ, concessive और correlative ढाँचे।',
'C2 ਵਿੱਚ ਤੁਸੀਂ ਲੰਮੇ, ਪਰਤਦਾਰ ਵਾਕਾਂ ਨੂੰ ਪਾਠਕ ਨੂੰ ਭਟਕਾਏ ਬਿਨਾਂ ਸੰਭਾਲਦੇ ਹੋ: absolute constructions, parenthetical ਟਿੱਪਣੀਆਂ, concessive ਅਤੇ correlative ਢਾਂਚੇ।',[
 B.rule('Advanced structures',
  '<div class="tbl-wrap"><table><thead><tr><th>Structure</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">Absolute construction</td><td class="n">The meeting over, the delegates dispersed. / Weather permitting, we will sail at dawn.</td></tr>'+
  '<tr><td class="g">Concessive with as / though</td><td class="n">Talented as she was, she never won. / Try as he might, he could not open it.</td></tr>'+
  '<tr><td class="g">Whatever / However + clause</td><td class="n">However hard we tried, the engine refused to start. / Whatever the cause, the effect was severe.</td></tr>'+
  '<tr><td class="g">So/Such … that fronted</td><td class="n">So severe was the storm that all flights were cancelled.</td></tr>'+
  '<tr><td class="g">Correlatives</td><td class="n">Neither the manager nor the staff were aware. / Not so much a plan as a hope.</td></tr>'+
  '<tr><td class="g">Parenthesis</td><td class="n">The proposal — for all its flaws — deserves consideration.</td></tr>'+
  '<tr><td class="g">Subjunctive variants</td><td class="n">Suffice it to say that… / Be it ever so humble… / Come what may.</td></tr>'+
  '</tbody></table></div>'+
  T('Absolute construction: “काम पूरा होने पर” जैसा भाव, बिना conjunction के: The work done, they left।','Absolute construction: “ਕੰਮ ਪੂਰਾ ਹੋਣ ਤੇ” ਵਰਗਾ ਭਾਵ, ਬਿਨਾਂ conjunction ਦੇ: The work done, they left।')+
  '<div class="rule warn"><span class="lbl">Careful</span>Long sentences need clear subjects and parallel structure. ✗ She enjoys swimming, to read, and going out. → ✓ <b class="eng">She enjoys swimming, reading and going out.</b></div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  '___ as she was, she never won the prize.|Talented;Talent;Talentedly|0|concessive as.',
  '___ was the storm that all flights were cancelled.|So severe;Such severe;Severely|0|fronted so.',
  'Try ___ he might, he could not open the lock.|as;so;that|0|try as he might.',
  'Neither the manager nor the staff ___ aware.|was;were;has been|1|nearest subject plural.',
  'The work ___, the team went home.|completing;completed;to complete|1|absolute.',
  '___ the cause, the effect was severe.|Whatever;Whichever of;However|0|whatever.',
  'It was not so much a plan ___ a hope.|than;as;but|1|not so much … as.',
  '___ it to say that we were disappointed.|Suffice;Sufficient;Suffices|0|fixed subjunctive.']),
 B.gap('Practice 2 — Rewrite',[
  'Although she was talented, she never won. → ___ she was, she never won.|Talented as',
  'The storm was so severe that flights were cancelled. → So ___ was the storm that…|severe',
  'If weather permits, we will sail. → ___ permitting, we will sail.|Weather',
  'No matter how hard we tried, we failed. → ___ hard we tried, we failed.|However',
  'Because the meeting had finished, they left. → The meeting ___, they left.|over/finished/concluded']),
 B.write('Practice 3 — One layered sentence','Write ONE sentence (30–45 words) about a difficult decision that uses an absolute construction, a concessive “as” clause and a parenthesis.',['Absolute construction','… as she was, …','— parenthesis —'],
  'The deadline fast approaching, the director — reluctant though she was — finally agreed to cancel the launch, difficult as the decision proved to be for a team that had worked relentlessly for months.')
]);

UNIT('c2_rhet','05','Style & rhetoric','Rhetorical Devices for Persuasive Writing and Speech','Rhetorical devices · Rhetorical devices',
'The great speeches and editorials use a small set of techniques. Recognise them, analyse them, and use them with restraint.',

  '<tr><td class="g">Tricolon</td><td class="e">three parallel items</td><td class="n">Government of the people, by the people, for the people.</td></tr>'+
  '<tr><td class="g">Anaphora</td><td class="e">repeated opening words</td><td class="n">We shall fight on the beaches, we shall fight on the landing grounds…</td></tr>'+
  '<tr><td class="g">Antithesis</td><td class="e">contrasting ideas in balance</td><td class="n">Ask not what your country can do for you; ask what you can do for your country.</td></tr>'+
  '<tr><td class="g">Chiasmus</td><td class="e">reversed structure (ABBA)</td><td class="n">Fair is foul, and foul is fair.</td></tr>'+
  '<tr><td class="g">Rhetorical question</td><td class="e">question needing no answer</td><td class="n">If we do not act now, then when?</td></tr>'+
  '<tr><td class="g">Hyperbole</td><td class="e">deliberate exaggeration</td><td class="n">I have told you a million times.</td></tr>'+

  '<div class="rule warn"><span class="lbl">Careful</span>Overusing devices makes writing sound theatrical. Use one or two at the key moment, not in every paragraph.</div>'),

UNIT('c2_coh','08','Style & rhetoric','Cohesion, Coherence and Signposting in Long Texts','Cohesion और Signposting · Cohesion ਅਤੇ Signposting',

'लंबे तर्क में पाठक का मार्गदर्शन करें: topic sentences, संदर्भ, lexical chains, signposting और अनुच्छेद-संक्रमण।',

 B.rule('Tools for coherence',
  '<div class="tbl-wrap"><table><thead><tr><th>Tool</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">Signposting (announce)</td><td class="n">This section examines… · I shall first outline…, then evaluate…</td></tr>'+
  '<tr><td class="g">Signposting (recap)</td><td class="n">Having considered X, I now turn to Y. · As discussed above, …</td></tr>'+

  '</tbody></table></div>'+

  '___ having considered the costs, I now turn to the benefits.|Having;After;While|0|signposting.',

  '___ the economic dimension, there is a cultural one.|Beyond;Under;Despite|0|transition.',
  'Pollution… contamination… emissions… is an example of|a lexical chain;a tricolon;a signpost|0|lexical chain.',
  'The word “these” in “These findings” is|a reference word;a hedge;a booster|0|reference.',
  'A summary noun is|this phenomenon;quickly;and|0|summarises previous idea.']),
 B.gap('Practice 2 — Complete the transition',[

UNIT('c2_summ','09','Mastery skills','Summarising, Paraphrasing and Synthesising Sources','सार, paraphrase और synthesis · ਸਾਰ, paraphrase ਅਤੇ synthesis',
'Condense a long text without losing meaning, restate ideas in your own words, and combine several sources into one coherent account.',
'लंबे पाठ को अर्थ खोए बिना संक्षिप्त करें, विचारों को अपने शब्दों में लिखें और कई स्रोतों को एक संगत विवरण में जोड़ें।',
'ਲੰਮੇ ਪਾਠ ਨੂੰ ਅਰਥ ਗੁਆਏ ਬਿਨਾਂ ਸੰਖੇਪ ਕਰੋ, ਵਿਚਾਰਾਂ ਨੂੰ ਆਪਣੇ ਸ਼ਬਦਾਂ ਵਿੱਚ ਲਿਖੋ ਅਤੇ ਕਈ ਸਰੋਤਾਂ ਨੂੰ ਇੱਕ ਸੰਗਤ ਬਿਰਤਾਂਤ ਵਿੱਚ ਜੋੜੋ।',[
 B.rule('Method',

  '<div class="rule"><span class="lbl">Example</span><b>Original:</b> The rapid growth of online shopping has led many small shops to close. <b>Paraphrase:</b> Many small retailers have been forced out of business owing to the swift expansion of e-commerce.</div>'),

  '“Taken together, these sources suggest…” is used for|synthesis;quotation;definition|0|synthesis.',
  'Original: “He suddenly left the room.”|He abruptly exited the room.;He left the room suddenly.;He suddenly left the room.|0|paraphrase with synonyms.',
  'A summary should keep|the main ideas;every detail;the writer’s examples|0|main ideas.']),
 B.gap('Practice 2 — Complete the paraphrase',[

 B.write('Practice 3 — Summarise','Summarise in 2–3 sentences: “Over the past decade, remote working has risen sharply, driven by faster internet and changing attitudes. Supporters argue that it saves time and money, while critics say it weakens team spirit and blurs the boundary between work and home. Recent surveys indicate that most employees prefer a hybrid model, spending part of the week in the office.”',['Main idea','Key contrast','Conclusion'],

UNIT('c2_crit','10','Mastery skills','Critical Reading: Bias, Assumptions and Evidence','आलोचनात्मक पठन · ਆਲੋਚਨਾਤਮਕ ਪੜ੍ਹਨਾ',
'Question what you read: detect bias, hidden assumptions, loaded language and weak evidence.',
'जो पढ़ते हैं उस पर प्रश्न उठाएँ: पक्षपात, छिपी मान्यताएँ, भावनात्मक भाषा और कमज़ोर प्रमाण पहचानें।',
'ਜੋ ਪੜ੍ਹਦੇ ਹੋ ਉਸ ਤੇ ਸਵਾਲ ਉਠਾਓ: ਪੱਖਪਾਤ, ਛੁਪੀਆਂ ਧਾਰਨਾਵਾਂ, ਭਾਵੁਕ ਭਾਸ਼ਾ ਅਤੇ ਕਮਜ਼ੋਰ ਸਬੂਤ ਪਛਾਣੋ।',[
 B.rule('Critical questions',
  '<div class="rule"><b>Who</b> wrote it and why? · <b>What</b> evidence is given — statistics, anecdotes, expert opinion? · <b>What</b> is assumed but not proved? · <b>What</b> is left out? · <b>How</b> does the language steer the reader?<br><b>Loaded language:</b> “regime” vs “government”, “slashed” vs “reduced”, “mob” vs “crowd”.<br><b>Weak evidence:</b> a single anecdote, unnamed “experts”, correlation presented as cause, a tiny sample, an outdated study.'+T('loaded language = शब्द जो भावना जगाकर राय बनाते हैं: slashed (काट डाला) बनाम reduced (घटाया)।','loaded language = ਸ਼ਬਦ ਜੋ ਭਾਵਨਾ ਜਗਾ ਕੇ ਰਾਇ ਬਣਾਉਂਦੇ ਹਨ: slashed (ਕੱਟ ਦਿੱਤਾ) ਬਨਾਮ reduced (ਘਟਾਇਆ)।')+'</div>'),
 B.text('Extract — Headline analysis','News · C2',
  '<p><b>“Greedy Landlords Slash Tenants’ Rights as Rents Soar”</b><br>Rents have risen by 6%, according to “industry insiders”. A tenant interviewed outside a London office said she “could no longer afford to live anywhere”. Critics of the new Housing Bill claim that it will cause a flood of evictions, though the government maintains that it merely tidies up outdated rules. No figures were available on the number of evictions last year.</p>'),
 B.mcq('Questions',[
  'The word “greedy” is an example of|loaded language;hedging;understatement|0|emotive.',
  '“Industry insiders” is weak because|the source is unnamed;it is too precise;it is a statistic|0|unnamed.',
  'The tenant’s quotation is|anecdotal evidence;statistical proof;expert analysis|0|one person.',
  '“A flood of evictions” is|a metaphor that exaggerates;a literal fact;an understatement|0|loaded metaphor.',
  'What is missing from the article?|Evidence on actual eviction numbers;Any quotes;A headline|0|stated.',
  'The article’s overall stance is|biased against landlords/government;neutral;pro-government|0|bias.']),
 B.mcq('Practice — Spot the weakness',[
  '“Ice cream sales rise with crime, so ice cream causes crime.” is|a false cause;strong evidence;a statistic|0|correlation.',
  '“A survey of 12 friends shows the app is popular.” is weak because|the sample is tiny;it is current;it is anonymous|0|sample size.',
  '“Experts say…” without names is|unverifiable;scientific;a quotation|0|unverifiable.',
  '“Nobody sensible supports this policy.” is|an ad hominem / loaded claim;a balanced view;a statistic|0|loaded.'])
]);

UNIT('c2_pres','11','Mastery skills','Presentations, Speeches and Spontaneous Discussion','प्रस्तुतियाँ और भाषण · ਪੇਸ਼ਕਾਰੀਆਂ ਅਤੇ ਭਾਸ਼ਣ',

 B.rule('Structure and language',

  '<tr><td class="g">Hook</td><td class="n">Imagine a world where… · Let me begin with a question: …</td></tr>'+
  '<tr><td class="g">Roadmap</td><td class="n">I will address three issues: first…, second…, finally…</td></tr>'+
  '<tr><td class="g">Move on</td><td class="n">That brings me to my next point. · Turning now to…</td></tr>'+
  '<tr><td class="g">Emphasise</td><td class="n">What I want to stress is… · Make no mistake…</td></tr>'+
  '<tr><td class="g">Handle questions</td><td class="n">That is a fair point. · Let me clarify. · I am afraid I do not have the figures to hand, but…</td></tr>'+

  '</tbody></table></div>'+
  T('अच्छा भाषण: hook → roadmap → तीन बिंदु → सार → प्रश्न।','ਚੰਗਾ ਭਾਸ਼ਣ: hook → roadmap → ਤਿੰਨ ਬਿੰਦੂ → ਸਾਰ → ਸਵਾਲ।')),
 B.dlg('Model — Handling a hostile question',[
  'Audience|Isn’t this proposal simply too expensive?|क्या यह प्रस्ताव बस बहुत महँगा नहीं है?|ਕੀ ਇਹ ਪ੍ਰਸਤਾਵ ਬਸ ਬਹੁਤ ਮਹਿੰਗਾ ਨਹੀਂ ਹੈ?',
  'Speaker|That is a fair concern. In the short term, yes, the outlay is significant. However, the savings over ten years more than offset it.|यह उचित चिंता है। अल्पकाल में लागत ज़्यादा है, पर दस साल की बचत उसे पूरा कर देती है।|ਇਹ ਵਾਜਬ ਚਿੰਤਾ ਹੈ। ਥੋੜ੍ਹੇ ਸਮੇਂ ਵਿੱਚ ਲਾਗਤ ਵੱਧ ਹੈ, ਪਰ ਦਸ ਸਾਲ ਦੀ ਬਚਤ ਉਸਨੂੰ ਪੂਰਾ ਕਰ ਦਿੰਦੀ ਹੈ।',
  'Audience|But who will pay in the meantime?|पर तब तक कौन भुगतान करेगा?|ਪਰ ਉਦੋਂ ਤੱਕ ਭੁਗਤਾਨ ਕੌਣ ਕਰੇਗਾ?',
  'Speaker|I am afraid I do not have the exact figures to hand, but I can send them to you after the session.|मेरे पास सटीक आँकड़े अभी नहीं हैं, पर सत्र के बाद भेज दूँगा।|ਮੇਰੇ ਕੋਲ ਸਟੀਕ ਅੰਕੜੇ ਹੁਣੇ ਨਹੀਂ ਹਨ, ਪਰ ਸੈਸ਼ਨ ਤੋਂ ਬਾਅਦ ਭੇਜ ਦਿਆਂਗਾ।']),
 B.mcq('Practice 1 — Choose the best phrase',[
  'To introduce your outline: “I will ___ three issues.”|address;touch;put|0|address.',
  'To move on: “That ___ me to my next point.”|brings;takes off;puts|0|brings.',
  'To handle a difficult question: “That is a ___ point.”|fair;fear;fare|0|fair.',
  'To stress: “Make no ___ : this matters.”|mistake;error;fault|0|make no mistake.',
  'To close: “To sum ___ , …”|up;out;in|0|sum up.',
  'A strong hook is|a question or striking image;a long definition;an apology|0|hook.',
  'If you do not know a figure you say|I do not have the figures to hand.;I don’t know.;Not sure.|0|polite.',
  '“Turning now to the costs…” is|a transition;a hook;a close|0|transition.']),
 B.write('Practice 2 — Write the opening and closing','Write the opening (3–4 sentences) and closing (2–3 sentences) of a speech on “Why every student should learn a second language”.',['Hook','Roadmap','Closing line'],
  'Imagine walking into a room where you cannot understand a single word. Now imagine the opposite: every conversation open to you. Today I will address three reasons why every student should learn a second language: cognitive, cultural and professional. … To sum up, a second language does not merely add words to your vocabulary; it adds worlds to your life. Thank you; I would be glad to take questions.')
]);

UNIT('c2_write','12','Mastery skills','Writing at C2: Essays, Reviews, Reports and Proposals','C2 लेखन · C2 ਲਿਖਤ',
'Produce polished, sophisticated texts for different audiences, with a controlled style and a clear voice.',
'अलग-अलग पाठकों के लिए परिष्कृत और परिपक्व पाठ तैयार करें, नियंत्रित शैली और स्पष्ट स्वर के साथ।',

 B.rule('Text types and what makes them C2',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>C2 qualities</th></tr></thead><tbody>'+
  '<tr><td class="g">Discursive essay</td><td class="n">a clear thesis; nuanced concessions; sophisticated linking; a distinctive voice; no clichés.</td></tr>'+
  '<tr><td class="g">Review</td><td class="n">engaging opening; balanced evaluation; vivid detail; a memorable final judgement.</td></tr>'+
  '<tr><td class="g">Report / proposal</td><td class="n">clear structure with headings; objective language; evidence; practical, justified recommendations.</td></tr>'+
  '<tr><td class="g">Article / editorial</td><td class="n">a striking hook; rhetorical devices; balanced yet persuasive tone.</td></tr>'+
  '</tbody></table></div>'+
  '<div class="rule"><span class="lbl">Revise like a professional</span>1) Cut every sentence that does not serve the argument. 2) Replace vague words (thing, good, very). 3) Vary sentence length. 4) Check every link: does each paragraph follow logically? 5) Read it aloud.'+T('अंतिम जाँच: अनावश्यक वाक्य हटाएँ, अस्पष्ट शब्द बदलें, वाक्यों की लंबाई बदलें।','ਅੰਤਿਮ ਜਾਂਚ: ਬੇਲੋੜੇ ਵਾਕ ਹਟਾਓ, ਅਸਪਸ਼ਟ ਸ਼ਬਦ ਬਦਲੋ, ਵਾਕਾਂ ਦੀ ਲੰਬਾਈ ਬਦਲੋ।')+'</div>'),
 B.write('Task 1 — Discursive essay (about 280 words)','“The pursuit of happiness has made modern society less happy.” Discuss.',['Hook + thesis','Argument with evidence','Concession + rebuttal','Nuanced conclusion'],
  'We live in an age obsessed with happiness: bookshops groan under self-help titles, and social media offers a daily parade of other people’s contentment. Yet the very pursuit may be self-defeating. This essay argues that happiness, when treated as a goal to be hunted rather than a by-product of meaningful living, tends to elude us. Psychologists have long observed that people who constantly measure their own happiness report lower satisfaction than those who simply immerse themselves in work, relationships or causes. Moreover, endless comparison with curated online lives breeds a quiet envy that no achievement can cure. Admittedly, it would be churlish to deny that modern society has delivered unprecedented health, safety and opportunity. Nevertheless, material progress has not been matched by a corresponding rise in well-being, which suggests that something other than comfort is at stake. Perhaps what has changed is not our happiness but our expectation of it: we now regard unhappiness as a malfunction rather than a normal part of human experience. Ultimately, the remedy lies not in chasing joy more energetically but in cultivating purpose, from which contentment tends to follow.'),
 B.write('Task 2 — Review (about 180 words)','Write a review of a film, book or restaurant you know well. Include a hook, description, evaluation and a final judgement.',['Hook','Description','Strengths and weaknesses','Final judgement'],
  'From its opening scene, the film refuses to flatter its audience. Set in a crumbling Punjab village, it follows a retired teacher who discovers that the land beneath his school has been sold. The performances are quietly devastating, particularly that of the lead, whose silences speak louder than any dialogue. The cinematography, all dusty golds and long shadows, lends the story a painterly dignity. If there is a flaw, it lies in the final act, which hurries toward a resolution that the slow-burning first hour has not earned. Nevertheless, these are minor quibbles. This is a film that lingers: days after watching it, I still found myself thinking of its final shot. Unmissable.'),
 B.write('Task 3 — Proposal (about 220 words)','You are asked to propose a programme to improve English communication skills in a college. Write the proposal with headings.',['Introduction / aim','Current situation','Proposal','Benefits and cost','Conclusion'],
  'Proposal: An English Communication Programme. Aim: This proposal outlines a programme to improve students’ spoken and written English. Current situation: A recent survey found that 68% of final-year students lack confidence in interviews, and employers report persistent weakness in written communication. Proposal: I recommend a 12-week programme comprising weekly speaking workshops, fortnightly writing clinics and monthly mock interviews led by industry volunteers. Classes would be small, with no more than 20 students. Benefits and cost: The programme would improve employability and raise the college’s placement record. The estimated cost is modest, as it would use existing classrooms and volunteer mentors; only materials and a part-time coordinator would require funding. Conclusion: Given the clear need and the low cost, I strongly recommend piloting the programme next semester, with an evaluation after the first cohort.')
]);

(function(){
'use strict';

function levelOf(stId){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].ids.indexOf(stId)>-1) return i; }
  return 0;
}
function idxOfId(id){
  for(var i=0;i<STATIONEN.length;i++){ if(STATIONEN[i].id===id) return i; }
  return 0;
}

/* ---------- safe storage (never breaks if blocked) ---------- */
var mem = {};
var STORE = {
  get:function(k){ try{ var v=localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set:function(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
var KEY='pioneerEnglishC2_v1';
var save={xp:0, done:{}, last:null, ans:{}, typed:{}};
try{ var raw=STORE.get(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object'){ save.xp=p.xp||0; save.done=p.done||{}; save.last=p.last||null; save.ans=p.ans||{}; save.typed=p.typed||{}; } } }catch(e){}
function persist(){ try{ STORE.set(KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- answers survive leaving a station ---------- */
function setAns(blk, idx, val){
  if(!save.ans) save.ans={};
  if(!save.ans[blk._st]) save.ans[blk._st]={};
  if(!save.ans[blk._st][blk._k]) save.ans[blk._st][blk._k]={};
  save.ans[blk._st][blk._k][idx]=val;
  persist();
}
function getAns(blk, idx){
  try{ return save.ans[blk._st][blk._k][idx]; }catch(e){ return undefined; }
}
function restoreTyped(stId){
  var main=document.getElementById('main');
  if(!main) return;
  var nodes=main.querySelectorAll('input[type=text], textarea');
  if(!save.typed) save.typed={};
  var store=save.typed[stId]||{};
  Array.prototype.forEach.call(nodes, function(nd, i){
    var k='n'+i;
    if(store[k]!==undefined && store[k]!=='' && !nd.value) nd.value=store[k];
    nd.addEventListener('input', function(){
      if(!save.typed[stId]) save.typed[stId]={};
      save.typed[stId][k]=nd.value;
      persist();
    });
  });
}

/* ---------- speech (browser built-in, no network) ---------- */
var voice=null, voiceReady=false;
function pickVoice(){
  try{
    var vs = window.speechSynthesis.getVoices()||[];
    voice = vs.filter(function(v){return /^en-(IN|GB)/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
    voiceReady = true;
  }catch(e){ voiceReady=true; }
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
var warned=false;
function say(text, rate){
  if(!('speechSynthesis' in window)){
    if(!warned){ toast('Audio not supported in this browser'); warned=true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang=(voice&&voice.lang)||'en-GB';
    u.rate = rate||0.9;
    if(voice) u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!=null) n.innerHTML=html;
  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[\u2018\u2019\u02BC]/g,"'")
    .replace(/[.,!?;:"'()\u201C\u201D]/g,'')
    .replace(/\s+/g,' ');
}
function trh(it){
  return (it.hi?'<span class="trl hi">'+esc(it.hi)+'</span>':'')+(it.pa?'<span class="trl pa">'+esc(it.pa)+'</span>':'');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Listen';
  b.setAttribute('aria-label','Play English audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){ return document.createElement('span'); }

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Points · '+overall+' % complete';
}

/* --- multiple choice --- */
function renderMCQ(blk, onDone){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' questions'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, answered=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var opts=el('div','opts');
    var btns=[];
    var fb=el('div','fb');
    function apply(i, restoring){
      btns.forEach(function(x){ x.disabled=true; });
      answered++;
      if(i===item.a){
        btns[i].classList.add('right'); right++;
        if(!restoring) addXP(2);
      }else{
        btns[i].classList.add('wrong');
        btns[item.a].classList.add('right');
      }
      fb.className='fb show '+(i===item.a?'ok':'no');
      fb.innerHTML=(i===item.a?'✓ Correct! ':'✗ ')+(item.fb||'');
      scoreLbl.textContent=right+' correct';
      if(!restoring) setAns(blk, idx, i);
      markProgress(blk._st, blk._k, Math.round(right/n*100));
    }
    item.opts.forEach(function(o,i){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
      b.onclick=function(){ if(b.disabled) return; apply(i, false); };
      btns.push(b);
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q.appendChild(fb);
    wrap.appendChild(q);
    var prevA=getAns(blk, idx);
    if(prevA!==undefined && prevA!==null) apply(prevA, true);
  });
  return wrap;
}

/* --- word ordering --- */
function renderOrdnen(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');

  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, done=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var target=item.a.split(' ');
    var q=el('div','q');
    q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+
      '<span class="cue">'+esc(item.hi||'')+'</span><span class="cue pa-i">'+esc(item.pa||'')+'</span>'));

    var slot=el('div','slot');
    var pool=el('div','pool');
    var settled=false;

    function mkWord(w, inSlot){
      var b=el('button','word', esc(w));
      b.type='button';
      b.onclick=function(){
        if(settled) return;
        b.remove();
        (inSlot?pool:slot).appendChild(mkWord(w, !inSlot));
      };
      return b;
    }
    shuffle(target).forEach(function(w){ pool.appendChild(mkWord(w,false)); });
    q.appendChild(slot); q.appendChild(pool);

    var row=el('div','inrow');
    row.style.marginTop='8px';
    var btn=el('button','btn sm','Check'); btn.type='button';

    q.appendChild(row);
    var fb=el('div','fb'); q.appendChild(fb);

    btn.onclick=function(){
      if(settled) return;
      var got=Array.prototype.map.call(slot.children,function(c){return c.textContent;}).join(' ');
      var ok = norm(got)===norm(item.a);
      fb.className='fb show '+(ok?'ok':'no');
      if(ok){
        settled=true; right++; done++; addXP(4);
        fb.innerHTML='✓ Richtig! <b>'+esc(item.a)+'.</b> ';
        var s=speakBtn(item.a); fb.appendChild(s);

        if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
      }else{
        fb.textContent='✗ Not quite. Check the word order: Subject + Verb + Object, with time words at the end.';
      }
    };
    show.onclick=function(){
      if(settled) return;
      settled=true; done++;
      slot.innerHTML=''; pool.innerHTML='';
      target.forEach(function(w){ slot.appendChild(mkWord(w,true)); });
      fb.className='fb show no';
      fb.innerHTML='Answer: <b>'+esc(item.a)+'.</b> ';
      fb.appendChild(speakBtn(item.a));
      btn.disabled=true;
      if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));

    wrap.appendChild(q);
  });

/* --- matching pairs --- */
function renderPaare(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' pairs'));
  var scoreLbl=el('div','ex-count','0 found');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var grid=el('div','pairs');
  var L=el('div','pcol'), R=el('div','pcol');
  grid.appendChild(L); grid.appendChild(R);
  wrap.appendChild(grid);

  var found=0, n=blk.items.length, sel=null;
  var leftItems=shuffle(blk.items.map(function(p,i){return {t:p[0],i:i};}));
  var rightItems=shuffle(blk.items.map(function(p,i){return {t:p[1],i:i};}));

  function mk(col, obj, side){
    var b=el('button','pbtn', esc(obj.t));
    b.type='button';
    b.dataset.i=obj.i;
    b.onclick=function(){
      if(b.classList.contains('done')) return;
      if(side==='L'){ say(obj.t); }
      if(!sel){ 
        if(side!=='L'){ toast('Choose from the left column first'); return; }
        sel=b; b.classList.add('sel'); return;
      }
      if(sel===b){ sel=null; b.classList.remove('sel'); return; }
      if(side==='L'){ sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.i===b.dataset.i){
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
        sel=null; found++; addXP(2);
        scoreLbl.textContent=found+' found';
        if(found===n){ markProgress(blk._st, blk._k, 100); toast('All pairs found!'); }
      }else{
        b.classList.add('miss');
        setTimeout(function(){ b.classList.remove('miss'); },320);
      }
    };
    col.appendChild(b);
  }
  leftItems.forEach(function(o){ mk(L,o,'L'); });
  rightItems.forEach(function(o){ mk(R,o,'R'); });
  return wrap;
}

/* --- flashcards --- */
function renderKarten(blk){
  var wrap=el('div','ex');

  var pos=0, flipped=false;

  var card=el('div','card');
  var counter=el('div','ex-count','');
  var ctrls=el('div','inrow');

  function paint(){
    var it=blk.items[order[pos]];
    card.innerHTML='';
    card.appendChild(el('div','face', esc(it[0])));
    if(flipped){ card.appendChild(el('div','back', esc(it[1])+(it[2]?'<br>'+esc(it[2]):''))); }
    card.appendChild(el('div','hint', flipped?'Tap to flip back':'Tap for the meaning'));
    counter.textContent='Card '+(pos+1)+' of '+order.length;
  }
  card.onclick=function(){ flipped=!flipped; paint(); };

  var prev=el('button','btn sm ghost','◀ Back'); prev.type='button';
  var hear=el('button','btn sm gelb','▶ Listen'); hear.type='button';
  var next=el('button','btn sm','Next ▶'); next.type='button';
  var mix=el('button','btn sm ghost','Shuffle'); mix.type='button';

  prev.onclick=function(){ pos=(pos-1+order.length)%order.length; flipped=false; paint(); };
  next.onclick=function(){
    pos=(pos+1)%order.length; flipped=false; paint();
    if(pos===0){ markProgress(blk._st, blk._k, 100); addXP(5); toast('Deck finished!'); }
  };
  hear.onclick=function(){ var it=blk.items[order[pos]]; say(it[0]); };
  mix.onclick=function(){ order=shuffle(order); pos=0; flipped=false; paint(); toast('Shuffled'); };

  ctrls.appendChild(prev); ctrls.appendChild(hear); ctrls.appendChild(next); ctrls.appendChild(mix);
  stage.appendChild(card); stage.appendChild(counter); stage.appendChild(ctrls);

  ta.oninput=function(){
    var w=ta.value.trim()?ta.value.trim().split(/\s+/).length:0;
    count.textContent=w+' words';
    if(w>=25){ markProgress(blk._st, blk._k, 100); }
  };

  var m=el('div','muster', esc(blk.muster));
  wrap.appendChild(m);
  btn.onclick=function(){
    m.classList.toggle('show');
    btn.textContent = m.classList.contains('show')?'Hide model answer':'Show model answer';
    if(m.classList.contains('show')) addXP(3);
  };
  read.onclick=function(){ say(blk.muster, 0.85); };
  return wrap;
}

/* ============================================================
   BLOCK & STATION RENDERING
============================================================ */
function renderVok(blk){
  var w=el('div','tbl-wrap');
  var t=el('table');
  t.innerHTML='<thead><tr><th>English</th><th>Meaning / example</th><th class="hi">हिन्दी</th><th class="pa">ਪੰਜਾਬੀ</th><th></th></tr></thead>';
  var tb=el('tbody');
  blk.items.forEach(function(it){
    var tr=el('tr');
    tr.appendChild(el('td','g', esc(it[0])));
    tr.appendChild(el('td','e', esc(it[1]||'')));
    tr.appendChild(el('td','hi', esc(it[2]||'')));
    tr.appendChild(el('td','pa', esc(it[3]||'')));
    var td4=el('td');
    td4.appendChild(speakBtn(it[0].split('—')[0].split('↔')[0].replace(/\(.*?\)/g,'')));
    tr.appendChild(td4);
    tb.appendChild(tr);
  });
  t.appendChild(tb); w.appendChild(t);
  return w;
}
function renderDlg(blk){
  var w=el('div','dlg');
  var all=blk.zeilen.map(function(z){return z[1];}).join(' ');
  var head=el('div','inrow');
  head.style.marginBottom='10px';
  var b=el('button','btn sm gelb','▶ Play whole dialogue'); b.type='button';
  b.onclick=function(){ say(all, 0.85); };
  head.appendChild(b);
  w.appendChild(head);
  blk.zeilen.forEach(function(z){
    var r=el('div','dlg-row');
    r.appendChild(el('div','dlg-who', esc(z[0])));
    r.appendChild(el('div','dlg-de', esc(z[1])+trh({hi:z[2],pa:z[3]})));
    var c=el('div'); c.appendChild(speakBtn(z[1]));
    r.appendChild(c);
    w.appendChild(r);
  });
  return w;
}
function renderText(blk){
  var w=el('div','lesetext');
  if(blk.meta) w.appendChild(el('div','meta', esc(blk.meta)));
  var body=el('div',null, blk.html);
  w.appendChild(body);
  return w;
}

var TAGS={ vok:['','Vocabulary'], regel:['gram','Grammar'], dlg:['','Dialogue'],
           text:['','Reading'], ueb:['ueb','Practice'], karten:['','Flashcards'],
           schreiben:['ueb','Writing'] };

function renderBlock(st, blk, i){
  blk._st=st.id; blk._k='b'+i;
  var box=el('div','blk');
  var head=el('div','blk-head');
  var meta=TAGS[blk.typ]||['',''];
  head.appendChild(el('span','tag '+meta[0], meta[1]));
  head.appendChild(el('h2',null, esc(blk.t||'')));
  box.appendChild(head);
  var body=el('div','blk-body');

  if(blk.typ==='vok') body.appendChild(renderVok(blk));
  else if(blk.typ==='regel') body.innerHTML=blk.html;
  else if(blk.typ==='dlg') body.appendChild(renderDlg(blk));
  else if(blk.typ==='text') body.appendChild(renderText(blk));
  else if(blk.typ==='karten') body.appendChild(renderKarten(blk));
  else if(blk.typ==='schreiben') body.appendChild(renderSchreiben(blk));
  else if(blk.typ==='ueb'){
    if(blk.art==='mcq') body.appendChild(renderMCQ(blk));
    else if(blk.art==='luecke') body.appendChild(renderLuecke(blk));
    else if(blk.art==='ordnen') body.appendChild(renderOrdnen(blk));
    else if(blk.art==='paare') body.appendChild(renderPaare(blk));
    else if(blk.art==='diktat') body.appendChild(renderDiktat(blk));
  }
  box.appendChild(body);
  return box;
}

/* ============================================================
   HOME SCREEN — level select
============================================================ */
function levelPct(lv){
  var sum=0;
  lv.ids.forEach(function(id){ sum+=stationPct(STATIONEN[idxOfId(id)]); });
  return Math.round(sum/lv.ids.length);
}
function ring(pct, colour){
  var w=el('div','ring');
  var r=22, c=2*Math.PI*r, off=c*(1-pct/100);
  w.innerHTML='<svg width="52" height="52" viewBox="0 0 52 52">'+
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#DADDD6" stroke-width="5"/>'+
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+colour+'" stroke-width="5" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" stroke-linecap="round"/>'+
    '</svg><span>'+pct+'%</span>';
  return w;
}
var LVL_COLOUR=['#12457A','#2A7F62','#35A0F0','#B8202E'];

function renderHome(){
  current=-1;
  var main=document.getElementById('main');
  main.innerHTML='';

  var head=el('div','home-head');
  head.appendChild(el('div','eyebrow','Overview · choose your level'));
  head.appendChild(el('h1',null,'Where would you like to start?<span class="en">Pick a part — you do not have to start at Unit 01</span>'));
  head.appendChild(el('p','lead','The course is split into four levels. Jump straight to the one that matches you, or take the two-minute placement test below and let it choose for you. Your progress is saved automatically.'));
  main.appendChild(head);

  /* resume card */
  if(save.last){
    var li=idxOfId(save.last), lst=STATIONEN[li];
    var rc=el('button','resume'); rc.type='button';
    rc.appendChild(el('span','rg', lst.g));
    rc.appendChild(el('span','rt','<small>Continue · continue where you stopped</small>'+esc(lst.t)));
    rc.appendChild(el('span','ra','Next ▶'));
    rc.onclick=function(){ go(li); };
    main.appendChild(rc);
  }

  /* level cards */
  var grid=el('div','lvl-grid');
  LEVELS.forEach(function(lv, li){
    var card=el('button','lvl-card '+lv.cls); card.type='button';
    var top=el('div','lvl-top');
    var left=el('div');
    left.appendChild(el('div','lvl-code','Part '+(li+1)+' · '+lv.code));
    left.appendChild(el('div','lvl-name', esc(lv.name)+'<em>'+esc(lv.en)+'</em>'));
    top.appendChild(left);
    top.appendChild(ring(levelPct(lv), LVL_COLOUR[li]));
    card.appendChild(top);
    card.appendChild(el('p','lvl-desc', esc(lv.desc)));

    var chips=el('div','lvl-stations');
    lv.ids.forEach(function(id){
      var st=STATIONEN[idxOfId(id)], p=stationPct(st);
      chips.appendChild(el('span','lvl-chip'+(p>=100?' done':(p>0?' part':'')), st.g));
    });
    card.appendChild(chips);

    var meta=el('div','lvl-meta');
    meta.appendChild(el('span',null, lv.ids.length+' units'));
    meta.appendChild(el('span',null,'Start ▶'));
    card.appendChild(meta);

    card.onclick=function(){
      /* open the first unfinished station in this level */
      var target=lv.ids[0];
      for(var k=0;k<lv.ids.length;k++){
        if(stationPct(STATIONEN[idxOfId(lv.ids[k])])<100){ target=lv.ids[k]; break; }
      }
      go(idxOfId(target));
    };
    grid.appendChild(card);
  });
  main.appendChild(grid);

  /* placement test */
  main.appendChild(renderPlacement());

  var tools=el('div','home-tools');
  var all=el('button','btn ghost','View all '+STATIONEN.length+' units'); all.type='button';
  all.onclick=function(){ go(0); };
  tools.appendChild(all);
  main.appendChild(tools);

  var g=document.getElementById('stripG'), t=document.getElementById('stripT');
  g.textContent='⌂';
  t.innerHTML='Overview<small>Level select</small>';
  paintNav(); paintXP();
}

function renderPlacement(){
  var box=el('div','place');
  box.appendChild(el('h3',null,'Placement test — where should I start?'));
  box.appendChild(el('p',null,PLACEMENT.length+' quick questions. Answer honestly and skip nothing — the result tells you which part to open first.'));

  var start=el('button','btn gelb','Start test'); start.type='button';
  box.appendChild(start);
  var area=el('div');
  box.appendChild(area);

  start.onclick=function(){
    start.style.display='none';
    area.innerHTML='';
    var score=[0,0,0,0], count=[0,0,0,0], answered=0;
    PLACEMENT.forEach(function(item, idx){
      count[item.lvl]++;
      var q=el('div','q');
      q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+item.q));
      var opts=el('div','opts'); var btns=[];
      item.opts.forEach(function(o,i){
        var b=el('button','opt'); b.type='button';
        b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
        b.onclick=function(){
          if(b.disabled) return;
          btns.forEach(function(x){x.disabled=true;});
          answered++;
          if(i===item.a){ b.classList.add('right'); score[item.lvl]++; }
          else{ b.classList.add('wrong'); btns[item.a].classList.add('right'); }
          if(answered===PLACEMENT.length) finish();
        };
        btns.push(b); opts.appendChild(b);
      });
      q.appendChild(opts);
      area.appendChild(q);
    });

    function finish(){
      /* recommended level = first level where the student scored below 70% */
      var rec=LEVELS.length-1;
      for(var i=0;i<4;i++){
        if(count[i] && (score[i]/count[i])<0.7){ rec=i; break; }
      }
      var total=score.reduce(function(a,b){return a+b;},0);
      var res=el('div','place-result');
      var lv=LEVELS[rec];
      res.innerHTML='<b>Recommended: Part '+(rec+1)+' — '+esc(lv.name)+' ('+lv.code+')</b>'+
        'You scored '+total+' out of '+PLACEMENT.length+'. '+
        'Per part: '+LEVELS.map(function(l,i){return l.code+' '+score[i]+'/'+count[i];}).join(' · ')+'.';
      var goBtn=el('button','btn gelb','Open Part '+(rec+1)+' ▶');
      goBtn.type='button'; goBtn.style.marginTop='12px';
      goBtn.onclick=function(){ go(idxOfId(lv.ids[0])); };
      res.appendChild(goBtn);
      area.appendChild(res);
      addXP(10);
      res.scrollIntoView({block:'nearest'});
    }
  };
  return box;
}

var current=-1;
function renderStation(idx){
  current=idx;
  var st=STATIONEN[idx];
  save.last=st.id; persist();
  var main=document.getElementById('main');
  main.innerHTML='';

  var lvi=levelOf(st.id), lv=LEVELS[lvi];
  var posInLvl=lv.ids.indexOf(st.id)+1;

  var head=el('div','station-head');
  head.appendChild(el('div','eyebrow','Part '+(lvi+1)+' · '+lv.code+' '+lv.name+
    ' · Unit '+st.g+' ('+posInLvl+' of '+lv.ids.length+')'));
  head.appendChild(el('h1',null, esc(st.t)+'<span class="en">'+esc(st.en)+'</span>'));
  if(st.lead) head.appendChild(el('p','lead', esc(st.lead)));
  if(st.leadHi) head.appendChild(el('p','lead trl hi', esc(st.leadHi)));
  if(st.leadPa) head.appendChild(el('p','lead trl pa', esc(st.leadPa)));
  main.appendChild(head);

  st.bloecke.forEach(function(b,i){ main.appendChild(renderBlock(st,b,i)); });

  var step=el('div','stepper');
  var prev=el('button','btn ghost','◀ Unit '+(idx>0?STATIONEN[idx-1].g:STATIONEN[STATIONEN.length-1].g));
  prev.type='button';
  prev.onclick=function(){ go((idx-1+STATIONEN.length)%STATIONEN.length); };

  var over=el('button','btn ghost','⌂ Overview'); over.type='button';
  over.onclick=function(){ goHome(); };

  var isLast = (posInLvl===lv.ids.length);
  var next=el('button','btn', isLast
    ? (lvi<LEVELS.length-1 ? 'Part '+(lvi+2)+' ▶' : 'To overview ▶')
    : 'Unit '+STATIONEN[idxOfId(lv.ids[posInLvl])].g+' ▶');
  next.type='button';
  next.onclick=function(){
    if(!isLast){ go(idxOfId(lv.ids[posInLvl])); return; }
    if(lvi<LEVELS.length-1){ go(idxOfId(LEVELS[lvi+1].ids[0])); toast('Part '+(lvi+2)+' — '+LEVELS[lvi+1].name); }
    else{ goHome(); }
  };
  step.appendChild(prev); step.appendChild(over); step.appendChild(next);
  main.appendChild(step);

  if(!save.done[st.id]) save.done[st.id]={};
  save.done[st.id].seen=1; persist();

  var g=document.getElementById('stripG'), t=document.getElementById('stripT');
  g.textContent=st.g;
  t.innerHTML=esc(st.t)+'<small>'+esc(st.en)+'</small>';
  g.classList.remove('flip'); t.classList.remove('flip');
  void g.offsetWidth;
  g.classList.add('flip'); t.classList.add('flip');

  restoreTyped(st.id);
  paintNav(); paintXP();
}
function go(i){
  renderStation(i);
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}
function goHome(){
  renderHome();
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}

/* ---------- sidebar ---------- */
function paintNav(){
  var nav=document.getElementById('fahrplan');
  nav.innerHTML='';
  var h=el('div','fp-head');
  h.appendChild(el('span',null,'Course map'));
  h.appendChild(el('span',null,STATIONEN.length+' units'));
  nav.appendChild(h);

  var hb=el('button','fp-item'+(current===-1?' on':''));
  hb.type='button';
  hb.appendChild(el('span','fp-g','⌂'));
  hb.appendChild(el('span','fp-t','Overview<em>All levels</em>'));
  hb.appendChild(el('span'));
  hb.onclick=goHome;
  nav.appendChild(hb);

  LEVELS.forEach(function(lv, li){
    var lh=el('div','fp-lvl '+lv.cls);
    lh.appendChild(el('span',null,'Part '+(li+1)+' · '+lv.code));
    lh.appendChild(el('span',null, levelPct(lv)+'%'));
    nav.appendChild(lh);

    lv.ids.forEach(function(id){
      var i=idxOfId(id), st=STATIONEN[i];
      var b=el('button','fp-item'+(i===current?' on':''));
      b.type='button';
      b.appendChild(el('span','fp-g', st.g));
      b.appendChild(el('span','fp-t', esc(st.t)+'<em>'+esc(st.en)+'</em>'));
      var p=stationPct(st);
      b.appendChild(el('span','fp-dot'+(p>=100?' done':(p>0?' part':''))));
      b.onclick=function(){ go(i); };
      nav.appendChild(b);
    });
  });

  var reset=el('button','btn sm ghost','Reset progress');
  reset.type='button';
  reset.style.marginTop='18px';
  reset.onclick=function(){
    if(confirm('Delete all your progress?')){
      save={xp:0,done:{},last:null,ans:{},typed:{}}; persist(); goHome(); toast('Progress reset');
    }
  };
  nav.appendChild(reset);
}
function closeNav(){
  document.getElementById('fahrplan').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('menuBtn').onclick=function(){
  document.getElementById('fahrplan').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
};
document.getElementById('scrim').onclick=closeNav;
document.getElementById('homeBtn').onclick=goHome;

/* keyboard: arrows move between stations, Esc returns to the overview */
document.addEventListener('keydown', function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='Escape'){ goHome(); return; }
  if(current<0) return;
  if(e.key==='ArrowLeft') go((current-1+STATIONEN.length)%STATIONEN.length);
  if(e.key==='ArrowRight') go((current+1)%STATIONEN.length);
});

/* ---------- translation toggles ---------- */
var TRKEY=KEY+'_tr';
var trs={hi:false, pa:false};
try{ var rawT=STORE.get(TRKEY); if(rawT){ var pt=JSON.parse(rawT); trs.hi=!!pt.hi; trs.pa=!!pt.pa; } }catch(e){}
function applyTr(){
  document.body.classList.toggle('t-hi', trs.hi);
  document.body.classList.toggle('t-pa', trs.pa);
  document.getElementById('trHi').classList.toggle('on', trs.hi);
  document.getElementById('trPa').classList.toggle('on', trs.pa);
  STORE.set(TRKEY, JSON.stringify(trs));
}
document.getElementById('trHi').onclick=function(){ trs.hi=!trs.hi; applyTr(); };
document.getElementById('trPa').onclick=function(){ trs.pa=!trs.pa; applyTr(); };
applyTr();

renderHome();
})();
</script>
