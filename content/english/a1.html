<style>
/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#35A0F0;
  --signal-dim:#1B72BD;
  --rail:#12457A;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#1B72BD}
.lvl-card.l4{border-top-color:#B8202E}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#1B72BD}
.lvl-card.l4 .lvl-code{color:#B8202E}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#1B72BD}
.fp-lvl.l4{background:#B8202E}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}

.levelchip{

  '<tr><td class="g">you</td><td class="e">one or many people (singular & plural)</td><td class="hi">तुम / आप</td><td class="pa">ਤੁਸੀਂ / ਤੂੰ</td></tr>'+
  '<tr><td class="g">he</td><td class="e">a man / boy</td><td class="hi">वह (पुरुष)</td><td class="pa">ਉਹ (ਮਰਦ)</td></tr>'+
  '<tr><td class="g">she</td><td class="e">a woman / girl</td><td class="hi">वह (स्त्री)</td><td class="pa">ਉਹ (ਔਰਤ)</td></tr>'+
  '<tr><td class="g">it</td><td class="e">a thing / animal / weather</td><td class="hi">यह / वह (वस्तु)</td><td class="pa">ਇਹ / ਉਹ (ਚੀਜ਼)</td></tr>'+
  '<tr><td class="g">we</td><td class="e">me + others</td><td class="hi">हम</td><td class="pa">ਅਸੀਂ</td></tr>'+
  '<tr><td class="g">they</td><td class="e">other people or things</td><td class="hi">वे / वो</td><td class="pa">ਉਹ ਸਾਰੇ</td></tr>'+
  '</tbody></table></div>'+
  P('English has <b>no polite "aap"</b> form: <b class="eng">you</b> is used for everybody. Politeness comes from words like <i>please</i> and <i>sir / madam</i>.','अंग्रेज़ी में "आप" का अलग रूप नहीं है — सबके लिए you। शिष्टता please, sir, madam जैसे शब्दों से दिखाते हैं।','ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ "ਤੁਸੀਂ" ਦਾ ਵੱਖਰਾ ਰੂਪ ਨਹੀਂ — ਸਭ ਲਈ you। ਆਦਰ please, sir, madam ਵਰਗੇ ਸ਼ਬਦਾਂ ਨਾਲ ਦਿਖਾਉਂਦੇ ਹਾਂ।')),
 B.rule('Present of "to be"',
  '<div class="tbl-wrap"><table><thead><tr><th>Pronoun</th><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="g">I</td><td class="e">I am / I\'m</td><td class="e">I am not / I\'m not</td><td class="e">Am I?</td></tr>'+
  '<tr><td class="g">he / she / it</td><td class="e">He is / He\'s</td><td class="e">He is not / isn\'t</td><td class="e">Is he?</td></tr>'+
  '<tr><td class="g">you / we / they</td><td class="e">You are / You\'re</td><td class="e">You are not / aren\'t</td><td class="e">Are you?</td></tr>'+
  '</tbody></table></div>'+
  P('Hindi/Punjabi use <i>hoon, hai, ho, hain</i>. English uses <b class="eng">am, is, are</b> and the verb comes <b>after</b> the subject: <i>I am happy</i> (मैं खुश हूँ), <i>She is a doctor</i> (वह डॉक्टर है). For a question, swap the order: <i>Is she a doctor?</i>','हिन्दी में हूँ/है/हो/हैं की जगह अंग्रेज़ी में am, is, are आता है और subject के बाद लगता है। प्रश्न बनाने के लिए क्रम बदलें: Is she a doctor?','ਪੰਜਾਬੀ ਦੇ ਹਾਂ/ਹੈ/ਹੋ/ਹਨ ਦੀ ਥਾਂ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ am, is, are ਆਉਂਦਾ ਹੈ ਅਤੇ subject ਤੋਂ ਬਾਅਦ ਲੱਗਦਾ ਹੈ। ਪ੍ਰਸ਼ਨ ਲਈ ਕ੍ਰਮ ਬਦਲੋ: Is she a doctor?')+
  '<div class="rule"><span class="lbl">Short answers</span>Are you a student? <b class="eng">Yes, I am.</b> / <b class="eng">No, I\'m not.</b><br>Is he tired? <b class="eng">Yes, he is.</b> / <b class="eng">No, he isn\'t.</b></div>'+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ I am agree. ✓ <b class="eng">I agree.</b> &nbsp; ✗ She is knowing. ✓ <b class="eng">She knows.</b><br>✗ He am a boy. ✓ <b class="eng">He is a boy.</b> &nbsp; ✗ They is happy. ✓ <b class="eng">They are happy.</b></div>'),
 B.mcq('Practice 1 — am, is or are?',[
  'I ___ a teacher.|am;is;are|0|I goes with am.|मैं शिक्षक हूँ।|ਮੈਂ ਅਧਿਆਪਕ ਹਾਂ।',
  'She ___ my sister.|am;is;are|1|she = is.|वह मेरी बहन है।|ਉਹ ਮੇਰੀ ਭੈਣ ਹੈ।',
  'We ___ students.|am;is;are|2|we = are.|हम छात्र हैं।|ਅਸੀਂ ਵਿਦਿਆਰਥੀ ਹਾਂ।',
  'They ___ from Punjab.|is;am;are|2|they = are.',
  'It ___ a big city.|is;are;am|0|it = is.',
  '___ you tired? — Yes, I am.|Is;Are;Am|1|you = are.',
  'He ___ not at home.|are;is;am|1|he = is.',
  'The books ___ on the table.|is;are;am|1|Plural noun = are.',
  'I ___ not hungry.|am;is;are|0|I am not.',
  'My mother and father ___ doctors.|is;am;are|2|Two people = are.']),
 B.gap('Practice 2 — Write am / is / are (or the short form)',[
  'My name ___ Rohit.|is|मेरा नाम रोहित है।|ਮੇਰਾ ਨਾਮ ਰੋਹਿਤ ਹੈ।','You ___ very kind.|are|आप बहुत दयालु हैं।|ਤੁਸੀਂ ਬਹੁਤ ਦਿਆਲੂ ਹੋ।','I ___ from India.|am|मैं भारत से हूँ।|ਮੈਂ ਭਾਰਤ ਤੋਂ ਹਾਂ।','The weather ___ cold today.|is|आज मौसम ठंडा है।|ਅੱਜ ਮੌਸਮ ਠੰਢਾ ਹੈ।','We ___ late!|are|हम लेट हैं!|ਅਸੀਂ ਲੇਟ ਹਾਂ!','___ she your friend?|is|क्या वह आपकी दोस्त है?|ਕੀ ਉਹ ਤੁਹਾਡੀ ਦੋਸਤ ਹੈ?','They ___ not ready. (negative: use isn\'t / aren\'t)|aren\'t/are not|वे तैयार नहीं हैं।|ਉਹ ਤਿਆਰ ਨਹੀਂ ਹਨ।']),
 B.ord('Practice 3 — Make sentences',[
  'She is a doctor|वह डॉक्टर है|ਉਹ ਡਾਕਟਰ ਹੈ','Are you a student|क्या आप छात्र हैं?|ਕੀ ਤੁਸੀਂ ਵਿਦਿਆਰਥੀ ਹੋ?','They are not at home|वे घर पर नहीं हैं|ਉਹ ਘਰ ਨਹੀਂ ਹਨ','Is he your brother|क्या वह तुम्हारा भाई है?|ਕੀ ਉਹ ਤੁਹਾਡਾ ਭਰਾ ਹੈ?','We are very happy|हम बहुत खुश हैं|ਅਸੀਂ ਬਹੁਤ ਖੁਸ਼ ਹਾਂ']),
 B.vok('Feelings & descriptions (use with am / is / are)',[
  'happy|I am happy.|खुश|ਖੁਸ਼','sad|She is sad.|उदास|ਉਦਾਸ','tired|We are tired.|थका हुआ|ਥੱਕਿਆ ਹੋਇਆ','hungry|I am hungry.|भूखा|ਭੁੱਖਾ','thirsty|He is thirsty.|प्यासा|ਪਿਆਸਾ','angry|They are angry.|गुस्सा|ਗੁੱਸੇ ਵਿੱਚ','busy|I am busy today.|व्यस्त|ਰੁੱਝਿਆ ਹੋਇਆ','ready|Are you ready?|तैयार|ਤਿਆਰ','late / early|late = after time|देर से / जल्दी|ਦੇਰ ਨਾਲ / ਜਲਦੀ','cold / hot|It is cold.|ठंडा / गरम|ਠੰਢਾ / ਗਰਮ','big / small|The room is big.|बड़ा / छोटा|ਵੱਡਾ / ਛੋਟਾ','new / old|The phone is new.|नया / पुराना|ਨਵਾਂ / ਪੁਰਾਣਾ'])
]);

/* ══════════ UNIT 06 — Articles & Plurals ══════════ */
UNIT('a1_art','06','Grammar','Nouns, Articles (a / an / the) & Plurals','संज्ञा, आर्टिकल और बहुवचन · ਨਾਂਵ, ਆਰਟੀਕਲ ਅਤੇ ਬਹੁ-ਵਚਨ',
'Hindi and Punjabi have no articles, so this is one of the biggest topics for you. Learn when to say a, an, the — and how to make plurals.',
'हिन्दी-पंजाबी में articles नहीं होते, इसलिए यह आपके लिए बहुत ज़रूरी विषय है। a, an, the कब लगाएँ और बहुवचन कैसे बनाएँ — सीखें।',
'ਹਿੰਦੀ-ਪੰਜਾਬੀ ਵਿੱਚ articles ਨਹੀਂ ਹੁੰਦੇ, ਇਸ ਲਈ ਇਹ ਤੁਹਾਡੇ ਲਈ ਬਹੁਤ ਜ਼ਰੂਰੀ ਵਿਸ਼ਾ ਹੈ। a, an, the ਕਦੋਂ ਲਗਾਉਣੇ ਹਨ ਅਤੇ ਬਹੁ-ਵਚਨ ਕਿਵੇਂ ਬਣਾਉਣੇ ਹਨ — ਸਿੱਖੋ।',[
 B.rule('a, an and the',
  P('<b class="eng">a / an</b> = one, not special (first mention). <b class="eng">the</b> = a particular thing that both people know.','a / an = कोई एक (पहली बार)। the = खास, जाना-पहचाना (जिसके बारे में दोनों जानते हैं)।','a / an = ਕੋਈ ਇੱਕ (ਪਹਿਲੀ ਵਾਰ)। the = ਖ਼ਾਸ, ਜਾਣੀ-ਪਛਾਣੀ ਚੀਜ਼ (ਜਿਸ ਬਾਰੇ ਦੋਵੇਂ ਜਾਣਦੇ ਹਨ)।')+
  '<div class="tbl-wrap"><table><thead><tr><th>Article</th><th>When</th><th>Examples</th></tr></thead><tbody>'+
  '<tr><td class="g">a</td><td class="e">before a consonant <b>sound</b></td><td class="n">a book, a pen, a university (yoo-)</td></tr>'+
  '<tr><td class="g">an</td><td class="e">before a vowel <b>sound</b></td><td class="n">an apple, an hour (silent h), an umbrella</td></tr>'+
  '<tr><td class="g">the</td><td class="e">a known / unique thing</td><td class="n">the sun, the teacher in my class</td></tr>'+
  '<tr><td class="g">— (no article)</td><td class="e">general plurals, languages, meals, most names</td><td class="n">I like cats. She speaks Punjabi. We have lunch.</td></tr>'+
  '</tbody></table></div>'+
  '<div class="rule"><span class="lbl">Example</span>I have <b>a</b> dog. <b>The</b> dog is very friendly. (first mention = a; second mention = the)'+T('पहली बार "a dog", दोबारा उसी कुत्ते के लिए "the dog"।','ਪਹਿਲੀ ਵਾਰ "a dog", ਦੁਬਾਰਾ ਉਸੇ ਕੁੱਤੇ ਲਈ "the dog"।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>It is the <b>sound</b>, not the letter: <b class="eng">an hour</b> (h is silent) but <b class="eng">a hotel</b>; <b class="eng">a university</b> (starts with "yoo") but <b class="eng">an umbrella</b>. Jobs need an article: <b class="eng">She is a teacher.</b> (not "She is teacher.")</div>'),
 B.rule('Plural nouns',
  '<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Singular → Plural</th></tr></thead><tbody>'+
  '<tr><td class="g">most nouns: + s</td><td class="e">book → books, pen → pens</td></tr>'+
  '<tr><td class="g">ends in s, x, ch, sh: + es</td><td class="e">bus → buses, box → boxes, watch → watches, dish → dishes</td></tr>'+
  '<tr><td class="g">consonant + y → ies</td><td class="e">city → cities, baby → babies (but boy → boys)</td></tr>'+
  '<tr><td class="g">f / fe → ves</td><td class="e">knife → knives, leaf → leaves, wife → wives</td></tr>'+
  '<tr><td class="g">ends in o: + es (some)</td><td class="e">tomato → tomatoes, potato → potatoes (but photo → photos)</td></tr>'+
  '<tr><td class="g">irregular</td><td class="e">man → men, woman → women, child → children, foot → feet, tooth → teeth, person → people, mouse → mice</td></tr>'+
  '<tr><td class="g">same form</td><td class="e">sheep, fish, deer</td></tr>'+
  '</tbody></table></div>'+
  T('s, x, ch, sh पर खत्म होने वाले शब्दों में es लगता है। "people" पहले से बहुवचन है — "peoples" नहीं।','s, x, ch, sh ਉੱਤੇ ਖ਼ਤਮ ਹੋਣ ਵਾਲੇ ਸ਼ਬਦਾਂ ਵਿੱਚ es ਲੱਗਦਾ ਹੈ। "people" ਪਹਿਲਾਂ ਹੀ ਬਹੁ-ਵਚਨ ਹੈ — "peoples" ਨਹੀਂ।')),
 B.pairs('Practice 1 — Singular ↔ plural',['man|men','child|children','city|cities','knife|knives','box|boxes','woman|women','person|people','tooth|teeth']),
 B.mcq('Practice 2 — a, an, the or nothing',[
  'I have ___ apple.|a;an;the|1|apple starts with a vowel sound.|मेरे पास एक सेब है।|ਮੇਰੇ ਕੋਲ ਇੱਕ ਸੇਬ ਹੈ।',
  'She is ___ engineer.|a;an;the|1|engineer starts with a vowel sound.',
  '___ sun is hot.|A;An;The|2|There is only one sun — use the.',
  'He studies at ___ university.|a;an;the|0|"university" starts with a "y" sound.',
  'I like ___ music.|a;the;(no article)|2|General likes need no article.',
  'We wait for ___ hour.|a;an;the|1|"hour": silent h = vowel sound.',
  'My father is ___ doctor.|a;an;the|0|Jobs take a / an.',
  'Two ___ are in the room.|woman;womans;women|2|Irregular plural: woman → women.',
  'There are three ___.|babys;babies;babyes|1|consonant + y → ies.',
  'I have two ___ (child).|childs;childes;children|2|child → children.']),
 B.gap('Practice 3 — Write the plural',[
  'one dish → two ___|dishes|दो थालियाँ|ਦੋ ਥਾਲ਼ੀਆਂ','one bus → three ___|buses|तीन बसें|ਤਿੰਨ ਬੱਸਾਂ','one baby → two ___|babies|दो बच्चे|ਦੋ ਬੱਚੇ','one leaf → many ___|leaves|कई पत्ते|ਕਈ ਪੱਤੇ','one foot → two ___|feet|दो पैर|ਦੋ ਪੈਰ','one tomato → five ___|tomatoes|पाँच टमाटर|ਪੰਜ ਟਮਾਟਰ']),
 B.dikt('Practice 4 — Dictation',[
  'I have a cat and two dogs.|मेरे पास एक बिल्ली और दो कुत्ते हैं।|ਮੇਰੇ ਕੋਲ ਇੱਕ ਬਿੱਲੀ ਅਤੇ ਦੋ ਕੁੱਤੇ ਹਨ।','She is an English teacher.|वह अंग्रेज़ी की शिक्षिका है।|ਉਹ ਅੰਗਰੇਜ਼ੀ ਦੀ ਅਧਿਆਪਕਾ ਹੈ।','The children are in the garden.|बच्चे बगीचे में हैं।|ਬੱਚੇ ਬਾਗ਼ ਵਿੱਚ ਹਨ।','I need an umbrella.|मुझे एक छाते की ज़रूरत है।|ਮੈਨੂੰ ਇੱਕ ਛਤਰੀ ਦੀ ਲੋੜ ਹੈ।'])
]);

/* ══════════ UNIT 07 — This/That, Possessives ══════════ */
UNIT('a1_this','07','Grammar','This / That, Possessives & Object Pronouns','this/that, मेरा-तेरा और कर्म सर्वनाम · this/that, ਮੇਰਾ-ਤੇਰਾ ਅਤੇ ਕਰਮ ਪੜਨਾਂਵ',
'Point to things (this, that, these, those) and say who owns them (my, your, his, her…).',
'चीज़ों की ओर इशारा करना (this, that, these, those) और बताना कि वह किसकी है (my, your, his, her…)।',
'ਚੀਜ਼ਾਂ ਵੱਲ ਇਸ਼ਾਰਾ ਕਰਨਾ (this, that, these, those) ਅਤੇ ਦੱਸਣਾ ਕਿ ਉਹ ਕਿਸਦੀ ਹੈ (my, your, his, her…)।',[
 B.rule('this / that / these / those',
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>Near (here)</th><th>Far (there)</th></tr></thead><tbody>'+
  '<tr><td class="g">Singular</td><td class="e"><b>this</b> pen (यह / ਇਹ)</td><td class="e"><b>that</b> pen (वह / ਉਹ)</td></tr>'+
  '<tr><td class="g">Plural</td><td class="e"><b>these</b> pens (ये / ਇਹ ਸਾਰੇ)</td><td class="e"><b>those</b> pens (वे / ਉਹ ਸਾਰੇ)</td></tr>'+
  '</tbody></table></div>'+
  T('पास की चीज़ — this/these; दूर की चीज़ — that/those। "these" में ee लंबी है, "this" में i छोटी: this /dis/ — these /deez/।','ਨੇੜੇ ਦੀ ਚੀਜ਼ — this/these; ਦੂਰ ਦੀ — that/those। "these" ਵਿੱਚ ee ਲੰਮੀ ਹੈ, "this" ਵਿੱਚ i ਛੋਟੀ: this /dis/ — these /deez/।')),
 B.rule('Possessive adjectives & pronouns',
  '<div class="tbl-wrap"><table><thead><tr><th>Subject</th><th>Possessive adjective (+ noun)</th><th>Possessive pronoun (alone)</th><th>Object pronoun</th></tr></thead><tbody>'+
  '<tr><td class="g">I</td><td class="e">my book</td><td class="e">mine</td><td class="e">me</td></tr>'+
  '<tr><td class="g">you</td><td class="e">your book</td><td class="e">yours</td><td class="e">you</td></tr>'+
  '<tr><td class="g">he</td><td class="e">his book</td><td class="e">his</td><td class="e">him</td></tr>'+
  '<tr><td class="g">she</td><td class="e">her book</td><td class="e">hers</td><td class="e">her</td></tr>'+
  '<tr><td class="g">it</td><td class="e">its cover</td><td class="e">—</td><td class="e">it</td></tr>'+
  '<tr><td class="g">we</td><td class="e">our book</td><td class="e">ours</td><td class="e">us</td></tr>'+
  '<tr><td class="g">they</td><td class="e">their book</td><td class="e">theirs</td><td class="e">them</td></tr>'+
  '</tbody></table></div>'+
  P('<b class="eng">my / your / his / her</b> go <b>before</b> a noun: <i>my phone</i>. <b class="eng">mine / yours / hers</b> stand alone: <i>This phone is mine.</i> Object pronouns come <b>after</b> the verb: <i>Call me. I love them.</i>','my/your/his/her संज्ञा से पहले आते हैं (my phone)। mine/yours/hers अकेले आते हैं (The phone is mine)। me/him/them क्रिया के बाद आते हैं (Call me)।','my/your/his/her ਨਾਂਵ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦੇ ਹਨ (my phone)। mine/yours/hers ਇਕੱਲੇ ਆਉਂਦੇ ਹਨ (The phone is mine)। me/him/them ਕਿਰਿਆ ਤੋਂ ਬਾਅਦ ਆਉਂਦੇ ਹਨ (Call me)।')+
  '<div class="rule"><span class="lbl">\'s = belongs to</span>Add <b>\'s</b> to a name: <b class="eng">Simran\'s bag</b>, <b class="eng">my father\'s car</b>. Plural with s: <b class="eng">the students\' books</b>.'+T('किसी का सामान बताने के लिए \'s लगाएँ: Simran\'s bag = सिमरन का बैग।','ਕਿਸੇ ਦਾ ਸਾਮਾਨ ਦੱਸਣ ਲਈ \'s ਲਗਾਓ: Simran\'s bag = ਸਿਮਰਨ ਦਾ ਬੈਗ।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ <i>It\'s</i> (it is) vs <i>its</i> (belongs to it): <b class="eng">The dog wags its tail.</b> &nbsp; ✗ He loves <i>she</i>. ✓ He loves <b class="eng">her</b>.</div>'),
 B.mcq('Practice 1 — Choose the correct word',[

  'Rohit loves ___ mother.|he;him;his|2|Before a noun we need his.',
  'Simran has a bag. The bag is ___.|she;hers;her|1|Alone = hers.',
  'Please call ___. (me / I)|I;my;me|2|After the verb: me.',
  'We love ___ teacher.|we;our;us|1|our + noun.',

]);

/* ══════════ UNIT 08 — Have/Has, There is/are ══════════ */
UNIT('a1_have','08','Grammar','Have / Has, There is / There are','have/has और there is/are · have/has ਅਤੇ there is/are',
'Say what you possess ("I have a car") and what exists in a place ("There is a shop near my house").',
'आपके पास क्या है ("I have a car") और किसी जगह पर क्या मौजूद है ("There is a shop near my house") — बताना सीखें।',
'ਤੁਹਾਡੇ ਕੋਲ ਕੀ ਹੈ ("I have a car") ਅਤੇ ਕਿਸੇ ਥਾਂ ਉੱਤੇ ਕੀ ਮੌਜੂਦ ਹੈ ("There is a shop near my house") — ਦੱਸਣਾ ਸਿੱਖੋ।',[
 B.rule('have / has',
  '<div class="tbl-wrap"><table><thead><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="g">I / you / we / they</td><td class="e">I have a phone.</td><td class="e">I don\'t have a phone.</td><td class="e">Do you have a phone?</td></tr>'+
  '<tr><td class="g">he / she / it</td><td class="e">She has a phone.</td><td class="e">She doesn\'t have a phone.</td><td class="e">Does she have a phone?</td></tr>'+
  '</tbody></table></div>'+
  P('<b class="eng">has</b> is used only with he / she / it. After <b>does / doesn\'t</b> go back to <b>have</b>: ✗ Does she <i>has</i>…? ✓ <b class="eng">Does she have…?</b>','has केवल he/she/it के साथ आता है। does/doesn\'t के बाद फिर से have आता है।','has ਸਿਰਫ਼ he/she/it ਨਾਲ ਆਉਂਦਾ ਹੈ। does/doesn\'t ਤੋਂ ਬਾਅਦ ਫਿਰ have ਆਉਂਦਾ ਹੈ।')+
  '<div class="rule warn"><span class="lbl">Not the same as Hindi</span>We say "I <b>have</b> a headache / a cold / a fever". Age is "I <b>am</b> 20", not "I have 20". English has no "mere paas… hai" word order: ✗ <i>By me is a pen.</i> ✓ <b class="eng">I have a pen.</b>'+T('"मेरे पास पेन है" = I have a pen. उम्र के लिए have नहीं, am: I am 20।','"ਮੇਰੇ ਕੋਲ ਪੈੱਨ ਹੈ" = I have a pen। ਉਮਰ ਲਈ have ਨਹੀਂ, am: I am 20।')+'</div>'),
 B.rule('There is / There are',
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>Singular</th><th>Plural</th></tr></thead><tbody>'+
  '<tr><td class="g">Positive</td><td class="e">There is a bank near here.</td><td class="e">There are two banks near here.</td></tr>'+
  '<tr><td class="g">Negative</td><td class="e">There isn\'t a bank.</td><td class="e">There aren\'t any banks.</td></tr>'+
  '<tr><td class="g">Question</td><td class="e">Is there a bank?</td><td class="e">Are there any banks?</td></tr>'+
  '<tr><td class="g">Short answer</td><td class="e">Yes, there is. / No, there isn\'t.</td><td class="e">Yes, there are. / No, there aren\'t.</td></tr>'+
  '</tbody></table></div>'+
  P('<b class="eng">There is / There are</b> = "…है / …हैं" (exists). Use <b>a / an</b> or a number after it, not <b>the</b>. Use <b>any</b> in negatives and questions.','There is/There are = "…है / …हैं" (मौजूद है)। इसके बाद a/an या संख्या आती है, the नहीं। नकारात्मक और प्रश्न में any का प्रयोग करें।','There is/There are = "…ਹੈ / …ਹਨ" (ਮੌਜੂਦ ਹੈ)। ਇਸ ਤੋਂ ਬਾਅਦ a/an ਜਾਂ ਗਿਣਤੀ ਆਉਂਦੀ ਹੈ, the ਨਹੀਂ। ਨਕਾਰਾਤਮਕ ਅਤੇ ਪ੍ਰਸ਼ਨ ਵਿੱਚ any ਵਰਤੋ।')),
 B.mcq('Practice 1 — have / has / is / are',[
  'She ___ two brothers.|have;has;haves|1|she → has.|उसके दो भाई हैं।|ਉਸਦੇ ਦੋ ਭਰਾ ਹਨ।',
  'I ___ a new phone.|has;have;am|1|I → have.',
  'Does he ___ a car?|has;have;having|1|After does use the base form have.',
  'There ___ a park near my house.|is;are;has|0|singular → is.',
  'There ___ many students in the room.|is;are;have|1|plural → are.',
  '___ there a pharmacy near here?|Are;Is;Do|1|Is there a…?',
  'They ___ not have any money.|doesn\'t;don\'t;isn\'t|1|they → don\'t have.',
  'There ___ any milk in the fridge.|isn\'t;aren\'t;hasn\'t|0|milk is uncountable → isn\'t any.',
  'We ___ a big family.|has;have;are|1|we → have.']),
 B.gap('Practice 2 — Complete',[
  'My brother ___ a bike.|has|मेरे भाई के पास साइकिल है।|ਮੇਰੇ ਭਰਾ ਕੋਲ ਸਾਈਕਲ ਹੈ।','___ you have a pen?|do|क्या आपके पास पेन है?|ਕੀ ਤੁਹਾਡੇ ਕੋਲ ਪੈੱਨ ਹੈ?','There ___ three chairs in the room.|are|कमरे में तीन कुर्सियाँ हैं।|ਕਮਰੇ ਵਿੱਚ ਤਿੰਨ ਕੁਰਸੀਆਂ ਹਨ।','She ___ not have a car. (short form: ___n\'t)|doesn\'t/does not|उसके पास कार नहीं है।|ਉਸ ਕੋਲ ਕਾਰ ਨਹੀਂ ਹੈ।','Is ___ a bank near here? (Yes, ___ is.)|there|क्या यहाँ पास में बैंक है?|ਕੀ ਇੱਥੇ ਨੇੜੇ ਬੈਂਕ ਹੈ?']),
 B.dikt('Practice 3 — Dictation',[
  'I have two sisters and one brother.|मेरी दो बहनें और एक भाई हैं।|ਮੇਰੀਆਂ ਦੋ ਭੈਣਾਂ ਅਤੇ ਇੱਕ ਭਰਾ ਹੈ।','Does she have a laptop?|क्या उसके पास लैपटॉप है?|ਕੀ ਉਸ ਕੋਲ ਲੈਪਟਾਪ ਹੈ?','There is a temple near my house.|मेरे घर के पास एक मंदिर है।|ਮੇਰੇ ਘਰ ਦੇ ਨੇੜੇ ਇੱਕ ਮੰਦਰ ਹੈ।','There are no tickets today.|आज टिकट नहीं हैं।|ਅੱਜ ਟਿਕਟਾਂ ਨਹੀਂ ਹਨ।'])
]);

/* ══════════ UNIT 09 — Present Simple ══════════ */
UNIT('a1_present','09','Grammar','Present Simple','साधारण वर्तमान काल · ਸਧਾਰਨ ਵਰਤਮਾਨ ਕਾਲ',
'Use the present simple for habits, routines, facts and things that are always true. It is the most common tense in daily English.',
'आदतों, दिनचर्या, तथ्यों और हमेशा सच बातों के लिए present simple प्रयोग होता है। रोज़मर्रा की अंग्रेज़ी में यह सबसे आम काल है।',
'ਆਦਤਾਂ, ਰੁਟੀਨ, ਤੱਥਾਂ ਅਤੇ ਹਮੇਸ਼ਾ ਸੱਚ ਗੱਲਾਂ ਲਈ present simple ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ। ਰੋਜ਼ਾਨਾ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਇਹ ਸਭ ਤੋਂ ਆਮ ਕਾਲ ਹੈ।',[
 B.rule('Form',
  '<div class="tbl-wrap"><table><thead><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="g">I / you / we / they</td><td class="e">I work.</td><td class="e">I do not (don\'t) work.</td><td class="e">Do you work?</td></tr>'+
  '<tr><td class="g">he / she / it</td><td class="e">She work<b>s</b>.</td><td class="e">She does not (doesn\'t) work.</td><td class="e">Does she work?</td></tr>'+
  '</tbody></table></div>'+
  '<h3>Spelling of he / she / it verbs</h3>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Examples</th></tr></thead><tbody>'+
  '<tr><td class="g">most verbs: + s</td><td class="e">work → works, play → plays, read → reads</td></tr>'+
  '<tr><td class="g">s, sh, ch, x, o: + es</td><td class="e">pass → passes, wash → washes, teach → teaches, go → goes, do → does</td></tr>'+
  '<tr><td class="g">consonant + y → ies</td><td class="e">study → studies, cry → cries (but play → plays)</td></tr>'+
  '<tr><td class="g">irregular</td><td class="e">have → <b>has</b></td></tr>'+
  '</tbody></table></div>'+
  P('Add <b>s / es</b> only in the <b>positive</b> sentence with he / she / it. In negatives and questions, <b>does</b> already carries the "s", so the main verb stays <b>plain</b>: ✗ <i>She doesn\'t works</i>. ✓ <b class="eng">She doesn\'t work.</b>','s/es केवल positive वाक्य में he/she/it के साथ लगता है। negative और प्रश्न में does पहले से है, इसलिए मुख्य क्रिया सादी रहती है: She doesn\'t work।','s/es ਸਿਰਫ਼ positive ਵਾਕ ਵਿੱਚ he/she/it ਨਾਲ ਲੱਗਦਾ ਹੈ। negative ਅਤੇ ਪ੍ਰਸ਼ਨ ਵਿੱਚ does ਪਹਿਲਾਂ ਹੀ ਹੈ, ਇਸ ਲਈ ਮੁੱਖ ਕਿਰਿਆ ਸਾਦੀ ਰਹਿੰਦੀ ਹੈ: She doesn\'t work।')+
  '<div class="rule"><span class="lbl">Time words</span><b class="eng">always, usually, often, sometimes, never, every day, on Mondays, once a week</b>. Frequency adverbs go <b>before</b> the main verb but <b>after</b> "be": <i>I <b>always</b> drink tea. She is <b>never</b> late.</i>'+T('always, usually, often, sometimes, never मुख्य क्रिया से पहले आते हैं, पर am/is/are के बाद।','always, usually, often, sometimes, never ਮੁੱਖ ਕਿਰਿਆ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦੇ ਹਨ, ਪਰ am/is/are ਤੋਂ ਬਾਅਦ।')+'</div>'),
 B.vok('Everyday verbs',[
  'wake up|I wake up at six.|जागना|ਜਾਗਣਾ','get up|He gets up late.|उठना|ਉੱਠਣਾ','brush|I brush my teeth.|ब्रश करना|ਬੁਰਸ਼ ਕਰਨਾ','eat / have breakfast|We have breakfast at 8.|नाश्ता करना|ਨਾਸ਼ਤਾ ਕਰਨਾ','go to school / work|She goes to work by bus.|स्कूल / काम पर जाना|ਸਕੂਲ / ਕੰਮ ਤੇ ਜਾਣਾ',
  'study|I study English every day.|पढ़ाई करना|ਪੜ੍ਹਾਈ ਕਰਨਾ','work|My father works in a bank.|काम करना|ਕੰਮ ਕਰਨਾ','cook|Mother cooks dinner.|खाना पकाना|ਖਾਣਾ ਪਕਾਉਣਾ','watch TV|We watch TV at night.|टीवी देखना|ਟੀਵੀ ਵੇਖਣਾ','sleep|I sleep at ten.|सोना|ਸੌਣਾ','drive|He drives a taxi.|चलाना (गाड़ी)|ਚਲਾਉਣਾ (ਗੱਡੀ)','speak|She speaks Punjabi.|बोलना|ਬੋਲਣਾ']),
 B.mcq('Practice 1 — Choose the correct form',[
  'She ___ to school every day.|go;goes;going|1|she → goes.|वह रोज़ स्कूल जाती है।|ਉਹ ਰੋਜ਼ ਸਕੂਲ ਜਾਂਦੀ ਹੈ।',
  'They ___ football on Sundays.|plays;play;playing|1|they → play.',
  'He doesn\'t ___ tea.|likes;like;liking|1|After doesn\'t use the plain verb.',
  '___ you speak English?|Do;Does;Are|0|you → Do.',
  '___ she work in a bank?|Do;Does;Is|1|she → Does.',
  'My mother ___ breakfast at 7.|make;makes;making|1|mother = she → makes.',
  'I ___ watch TV in the morning.|doesn\'t;don\'t;not|1|I → don\'t.',
  'The sun ___ in the east.|rise;rises;rising|1|General truth: it → rises.',
  'He always ___ late. (be)|is;does;has|0|"be" verb: He is always late.',
  'She ___ English. (study)|studys;studies;studyes|1|consonant + y → ies.']),
 B.gap('Practice 2 — Write the verb in present simple',[
  'My father ___ (work) in Chandigarh.|works|मेरे पिता चंडीगढ़ में काम करते हैं।|ਮੇਰੇ ਪਿਤਾ ਜੀ ਚੰਡੀਗੜ੍ਹ ਵਿੱਚ ਕੰਮ ਕਰਦੇ ਹਨ।','We ___ (not / eat) meat.|don\'t eat/do not eat|हम माँस नहीं खाते।|ਅਸੀਂ ਮਾਸ ਨਹੀਂ ਖਾਂਦੇ।','___ he ___ (like) pizza? (write: Does he like)|does he like|क्या उसे पिज़्ज़ा पसंद है?|ਕੀ ਉਸਨੂੰ ਪਿੱਜ਼ਾ ਪਸੰਦ ਹੈ?','She ___ (watch) TV in the evening.|watches|वह शाम को टीवी देखती है।|ਉਹ ਸ਼ਾਮ ਨੂੰ ਟੀਵੀ ਵੇਖਦੀ ਹੈ।','The bus ___ (leave) at nine.|leaves|बस नौ बजे जाती है।|ਬੱਸ ਨੌਂ ਵਜੇ ਜਾਂਦੀ ਹੈ।','He ___ (study) every night.|studies|वह हर रात पढ़ाई करता है।|ਉਹ ਹਰ ਰਾਤ ਪੜ੍ਹਾਈ ਕਰਦਾ ਹੈ।']),
 B.ord('Practice 3 — Word order',[
  'She never eats meat|वह कभी माँस नहीं खाती|ਉਹ ਕਦੇ ਮਾਸ ਨਹੀਂ ਖਾਂਦੀ','I usually wake up at six|मैं आमतौर पर छह बजे उठता हूँ|ਮੈਂ ਆਮ ਤੌਰ ਤੇ ਛੇ ਵਜੇ ਉੱਠਦਾ ਹਾਂ','Does your brother play cricket|क्या तुम्हारा भाई क्रिकेट खेलता है?|ਕੀ ਤੁਹਾਡਾ ਭਰਾ ਕ੍ਰਿਕਟ ਖੇਡਦਾ ਹੈ?','They do not go to school on Sunday|वे रविवार को स्कूल नहीं जाते|ਉਹ ਐਤਵਾਰ ਨੂੰ ਸਕੂਲ ਨਹੀਂ ਜਾਂਦੇ']),
 B.dikt('Practice 4 — Dictation',[
  'My sister works in a hospital.|मेरी बहन अस्पताल में काम करती है।|ਮੇਰੀ ਭੈਣ ਹਸਪਤਾਲ ਵਿੱਚ ਕੰਮ ਕਰਦੀ ਹੈ।','I do not drink coffee at night.|मैं रात को कॉफ़ी नहीं पीता।|ਮੈਂ ਰਾਤ ਨੂੰ ਕੌਫ਼ੀ ਨਹੀਂ ਪੀਂਦਾ।','Does he speak English?|क्या वह अंग्रेज़ी बोलता है?|ਕੀ ਉਹ ਅੰਗਰੇਜ਼ੀ ਬੋਲਦਾ ਹੈ?','We usually eat dinner at eight.|हम आमतौर पर आठ बजे रात का खाना खाते हैं।|ਅਸੀਂ ਆਮ ਤੌਰ ਤੇ ਅੱਠ ਵਜੇ ਰਾਤ ਦਾ ਖਾਣਾ ਖਾਂਦੇ ਹਾਂ।'])

/* ══════════ UNIT 10 — Present Continuous ══════════ */
UNIT('a1_cont','10','Grammar','Present Continuous','चालू वर्तमान काल · ਚਲੰਤ ਵਰਤਮਾਨ ਕਾਲ',
'Use the present continuous for actions happening now ("I am reading") and for temporary situations.',
'अभी हो रही क्रिया ("I am reading") और अस्थायी स्थितियों के लिए present continuous प्रयोग होता है।',
'ਹੁਣ ਹੋ ਰਹੀ ਕਿਰਿਆ ("I am reading") ਅਤੇ ਅਸਥਾਈ ਹਾਲਾਤ ਲਈ present continuous ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ।',[
 B.rule('Form: am / is / are + verb-ing',
  '<div class="tbl-wrap"><table><thead><tr><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="e">I am eating.</td><td class="e">I am not eating.</td><td class="e">Am I eating?</td></tr>'+
  '<tr><td class="e">She is eating.</td><td class="e">She isn\'t eating.</td><td class="e">Is she eating?</td></tr>'+
  '<tr><td class="e">They are eating.</td><td class="e">They aren\'t eating.</td><td class="e">Are they eating?</td></tr>'+
  '</tbody></table></div>'+
  P('Hindi: <i>"मैं खा रहा हूँ"</i> = English: <b class="eng">I am eating</b>. "रहा हूँ / रही है / रहे हैं" = <b>am / is / are + -ing</b>.','हिन्दी "खा रहा हूँ / रही है / रहे हैं" = अंग्रेज़ी am/is/are + -ing।','ਪੰਜਾਬੀ "ਖਾ ਰਿਹਾ ਹਾਂ / ਰਹੀ ਹੈ / ਰਹੇ ਹਨ" = ਅੰਗਰੇਜ਼ੀ am/is/are + -ing।')+
  '<h3>Spelling of -ing</h3>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Examples</th></tr></thead><tbody>'+
  '<tr><td class="g">most verbs: + ing</td><td class="e">work → working, play → playing</td></tr>'+

UNIT('a1_q','11','Grammar','Question Words & Making Questions','प्रश्नवाचक शब्द और प्रश्न बनाना · ਪ੍ਰਸ਼ਨ-ਵਾਚਕ ਸ਼ਬਦ ਅਤੇ ਪ੍ਰਸ਼ਨ ਬਣਾਉਣਾ',
'Learn the question words and the correct word order. English questions do not use "kya" at the start — the helping verb moves in front.',
'प्रश्नवाचक शब्द और सही शब्द-क्रम सीखें। अंग्रेज़ी में "क्या" जैसा शब्द शुरू में नहीं लगता — सहायक क्रिया आगे आती है।',
'ਪ੍ਰਸ਼ਨ-ਵਾਚਕ ਸ਼ਬਦ ਅਤੇ ਸਹੀ ਸ਼ਬਦ-ਕ੍ਰਮ ਸਿੱਖੋ। ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ "ਕੀ" ਵਰਗਾ ਸ਼ਬਦ ਸ਼ੁਰੂ ਵਿੱਚ ਨਹੀਂ ਲੱਗਦਾ — ਸਹਾਇਕ ਕਿਰਿਆ ਅੱਗੇ ਆਉਂਦੀ ਹੈ।',[
 B.vok('Question words',[
  'what|What is your name?|क्या / कौन-सा|ਕੀ / ਕਿਹੜਾ','who|Who is she?|कौन|ਕੌਣ','where|Where do you live?|कहाँ|ਕਿੱਥੇ','when|When is the exam?|कब|ਕਦੋਂ','why|Why are you late?|क्यों|ਕਿਉਂ','how|How do you go to school?|कैसे|ਕਿਵੇਂ',
  'which|Which bag is yours?|कौन-सा (चुनना)|ਕਿਹੜਾ (ਚੁਣਨਾ)','whose|Whose pen is this?|किसका|ਕਿਸਦਾ','how much|How much is this? (uncountable / price)|कितना|ਕਿੰਨਾ','how many|How many books? (countable)|कितने|ਕਿੰਨੇ','how old|How old are you?|कितनी उम्र|ਕਿੰਨੀ ਉਮਰ','what time|What time is it?|क्या समय|ਕੀ ਸਮਾਂ']),
 B.rule('Word order in questions',

  '<tr><td class="g">Yes/no: Be/Do/Does + subject …?</td><td class="e"><b>Are</b> you ready? — <b>Do</b> they work here? — <b>Does</b> he know her?</td></tr>'+
  '<tr><td class="g">Who / What as subject (no do)</td><td class="e">Who <b>lives</b> here? — What <b>happens</b> next?</td></tr>'+
  '</tbody></table></div>'+
  P('Hindi/Punjabi usually put the question word <b>inside</b> the sentence: "आप कहाँ रहते हैं?". English puts it at the <b>start</b>: <b class="eng">Where do you live?</b> The helping verb (do/does/is/are) comes <b>before</b> the subject, and the main verb stays <b>plain</b>.','हिन्दी में प्रश्न शब्द प्रायः वाक्य के बीच में आता है; अंग्रेज़ी में शुरू में: Where do you live? सहायक क्रिया subject से पहले आती है और मुख्य क्रिया सादी रहती है।','ਪੰਜਾਬੀ ਵਿੱਚ ਪ੍ਰਸ਼ਨ ਸ਼ਬਦ ਆਮ ਤੌਰ ਤੇ ਵਾਕ ਦੇ ਵਿਚਕਾਰ ਆਉਂਦਾ ਹੈ; ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਸ਼ੁਰੂ ਵਿੱਚ: Where do you live? ਸਹਾਇਕ ਕਿਰਿਆ subject ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦੀ ਹੈ ਅਤੇ ਮੁੱਖ ਕਿਰਿਆ ਸਾਦੀ ਰਹਿੰਦੀ ਹੈ।')+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ Where you live? → ✓ <b class="eng">Where do you live?</b><br>✗ What you are doing? → ✓ <b class="eng">What are you doing?</b><br>✗ Why she does come late? → ✓ <b class="eng">Why does she come late?</b></div>'),

  'You want to know someone\'s age.|How old are you?;What old are you?;How many are you?|0|How old…?|उम्र पूछनी है।|ਉਮਰ ਪੁੱਛਣੀ ਹੈ।',
  'You want to know the place.|When do you live?;Where do you live?;Who do you live?|1|Where = place.',

 B.gap('Practice 3 — Fill the gap',[

UNIT('a1_family','13','Everyday','Family, People & Descriptions','परिवार, लोग और वर्णन · ਪਰਿਵਾਰ, ਲੋਕ ਅਤੇ ਵਰਣਨ',
'English family words are simpler than Hindi or Punjabi: "uncle" and "aunt" cover many relatives. Learn to describe people and their jobs.',
'अंग्रेज़ी में रिश्तों के शब्द कम हैं: "uncle" और "aunt" कई रिश्तेदारों के लिए आता है। लोगों और उनके पेशों का वर्णन करना सीखें।',
'ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਰਿਸ਼ਤਿਆਂ ਦੇ ਸ਼ਬਦ ਘੱਟ ਹਨ: "uncle" ਅਤੇ "aunt" ਕਈ ਰਿਸ਼ਤੇਦਾਰਾਂ ਲਈ ਆਉਂਦੇ ਹਨ। ਲੋਕਾਂ ਅਤੇ ਉਨ੍ਹਾਂ ਦੇ ਕੰਮਾਂ ਦਾ ਵਰਣਨ ਕਰਨਾ ਸਿੱਖੋ।',[
 B.vok('Family',[
  'mother / mum|my mother|माँ|ਮਾਂ','father / dad|my father|पिता / पापा|ਪਿਤਾ / ਪਾਪਾ','parents|mother + father|माता-पिता|ਮਾਪੇ','brother|older / younger brother|भाई|ਭਰਾ','sister|older / younger sister|बहन|ਭੈਣ','son / daughter|my son, my daughter|बेटा / बेटी|ਪੁੱਤਰ / ਧੀ',
  'husband / wife|her husband|पति / पत्नी|ਪਤੀ / ਪਤਨੀ','grandfather / grandmother|paternal or maternal|दादा-नाना / दादी-नानी|ਦਾਦਾ-ਨਾਨਾ / ਦਾਦੀ-ਨਾਨੀ','uncle|father\'s or mother\'s brother (chacha, mama, tau, fufa)|चाचा, मामा, ताऊ, फूफा|ਚਾਚਾ, ਮਾਮਾ, ਤਾਇਆ, ਫੁੱਫੜ','aunt|chachi, mami, bua, mausi|चाची, मामी, बुआ, मौसी|ਚਾਚੀ, ਮਾਮੀ, ਭੂਆ, ਮਾਸੀ','cousin|uncle\'s or aunt\'s child|चचेरा/ममेरा भाई-बहन|ਚਚੇਰਾ/ਮਮੇਰਾ ਭੈਣ-ਭਰਾ','nephew / niece|brother\'s or sister\'s son / daughter|भतीजा-भांजा / भतीजी-भांजी|ਭਤੀਜਾ-ਭਾਣਜਾ / ਭਤੀਜੀ-ਭਾਣਜੀ','father-in-law / mother-in-law|spouse\'s parents|ससुर / सास|ਸਹੁਰਾ / ਸੱਸ','friend / neighbour|my best friend|दोस्त / पड़ोसी|ਦੋਸਤ / ਗੁਆਂਢੀ']),
 B.vok('Describing people',[
  'tall / short|He is tall.|लंबा / छोटा|ਲੰਮਾ / ਛੋਟਾ','fat / thin / slim|She is slim.|मोटा / पतला|ਮੋਟਾ / ਪਤਲਾ','young / old|My grandfather is old.|जवान / बूढ़ा|ਜਵਾਨ / ਬੁੱਢਾ','handsome / beautiful|a handsome man, a beautiful woman|सुंदर|ਸੋਹਣਾ','kind / friendly|She is very kind.|दयालु / मिलनसार|ਦਿਆਲੂ / ਮਿਲਣਸਾਰ','funny|He is funny.|मज़ाकिया|ਮਜ਼ਾਕੀਆ','hard-working|She is hard-working.|मेहनती|ਮਿਹਨਤੀ','lazy|He is lazy.|आलसी|ਆਲਸੀ','long / short hair|She has long black hair.|लंबे / छोटे बाल|ਲੰਮੇ / ਛੋਟੇ ਵਾਲ','brown eyes|He has brown eyes.|भूरी आँखें|ਭੂਰੀਆਂ ਅੱਖਾਂ']),
 B.vok('Jobs',[
  'teacher|She is a teacher.|शिक्षक|ਅਧਿਆਪਕ','doctor|a doctor in a hospital|डॉक्टर|ਡਾਕਟਰ','engineer|an engineer|इंजीनियर|ਇੰਜੀਨੀਅਰ','farmer|a farmer in Punjab|किसान|ਕਿਸਾਨ','driver|a bus driver|चालक|ਡਰਾਈਵਰ','shopkeeper|owns a shop|दुकानदार|ਦੁਕਾਨਦਾਰ','nurse|works with doctors|नर्स|ਨਰਸ','businessman|a businessman|व्यापारी|ਵਪਾਰੀ','police officer|a police officer|पुलिस अधिकारी|ਪੁਲਿਸ ਅਧਿਕਾਰੀ','housewife / homemaker|works at home|गृहिणी|ਘਰੇਲੂ ਔਰਤ']),
 B.rule('Describing: be and have',
  P('Use <b class="eng">be</b> for height, age, character: <i>He is tall. She is kind.</i> Use <b class="eng">have</b> for hair and eyes: <i>She has long hair. He has brown eyes.</i> Adjectives come <b>before</b> the noun and never take -s: <i>two tall boys</i> (not "talls").','ऊँचाई, उम्र, स्वभाव के लिए be; बाल और आँखों के लिए have। विशेषण संज्ञा से पहले आता है और उसमें -s नहीं लगता: two tall boys।','ਕੱਦ, ਉਮਰ, ਸੁਭਾਅ ਲਈ be; ਵਾਲਾਂ ਅਤੇ ਅੱਖਾਂ ਲਈ have। ਵਿਸ਼ੇਸ਼ਣ ਨਾਂਵ ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦਾ ਹੈ ਅਤੇ ਉਸ ਵਿੱਚ -s ਨਹੀਂ ਲੱਗਦਾ: two tall boys।')+
  '<div class="rule"><span class="lbl">Word order of adjectives</span>opinion → size → age → colour: <b class="eng">a beautiful big old red car</b>. Use 2–3 adjectives at most.</div>'+
  '<div class="rule"><span class="lbl">A text about family</span>My name is Simran. I have a big family. My father is a farmer and my mother is a teacher. I have one brother and one sister. My brother is tall and my sister is very funny. We live in Morinda.</div>'),
 B.mcq('Practice 1 — Family & description',[
  'Your father\'s brother is your…|uncle;cousin;nephew|0|chacha/tau = uncle.|आपके पिता का भाई आपका क्या है?|ਤੁਹਾਡੇ ਪਿਤਾ ਦਾ ਭਰਾ ਤੁਹਾਡਾ ਕੀ ਹੈ?',
  'Your uncle\'s son is your…|brother;cousin;nephew|1|cousin.',
  'She ___ long black hair.|is;has;have|1|hair = has.',
  'He ___ very tall.|has;is;does|1|height = is.',
  'Your mother\'s mother is your…|grandmother;aunt;sister-in-law|0|nani = grandmother.',
  'My brother is a ___ (a person who treats patients).|teacher;doctor;driver|1|doctor.',
  'Which order is correct?|a red big car;a big red car;a car big red|1|size comes before colour.',
  'She is ___ engineer.|a;an;the|1|engineer → an.']),
 B.gap('Practice 2 — Complete',[
  'My father\'s sister is my ___ .|aunt|मेरी बुआ|ਮੇਰੀ ਭੂਆ','My wife\'s father is my ___-in-law.|father|मेरे ससुर|ਮੇਰੇ ਸਹੁਰਾ','He is a ___ . He grows wheat in Punjab.|farmer|वह किसान है।|ਉਹ ਕਿਸਾਨ ਹੈ।','She ___ brown eyes. (be / have)|has|उसकी आँखें भूरी हैं।|ਉਸ ਦੀਆਂ ਅੱਖਾਂ ਭੂਰੀਆਂ ਹਨ।','Anita is my mother\'s sister. She is my ___ .|aunt|अनीता मेरी मौसी है।|ਅਨੀਤਾ ਮੇਰੀ ਮਾਸੀ ਹੈ।']),
 B.write('Practice 3 — Write about your family','Write 6–8 sentences about your family.',['How many people are in your family?','Who are they? What do they do?','Describe one person (appearance and character)'],
  'There are five people in my family: my parents, my brother, my sister and me.\nMy father is a driver and my mother is a housewife.\nMy brother is a student. He is tall and funny.\nMy sister is a nurse. She is kind and hard-working.\nI love my family very much.')
]);

/* ══════════ UNIT 14 — Food & Ordering ══════════ */
UNIT('a1_food','14','Everyday','Food, Drink & Ordering','खाना-पीना और ऑर्डर करना · ਖਾਣਾ-ਪੀਣਾ ਅਤੇ ਆਰਡਰ ਕਰਨਾ',
'Talk about what you eat, say what you like and order politely in a restaurant or café.',
'आप क्या खाते हैं, क्या पसंद है और रेस्तरां या कैफ़े में शिष्टता से ऑर्डर कैसे करें — सीखें।',
'ਤੁਸੀਂ ਕੀ ਖਾਂਦੇ ਹੋ, ਕੀ ਪਸੰਦ ਹੈ ਅਤੇ ਰੈਸਟੋਰੈਂਟ ਜਾਂ ਕੈਫ਼ੇ ਵਿੱਚ ਸ਼ਿਸ਼ਟਤਾ ਨਾਲ ਆਰਡਰ ਕਿਵੇਂ ਕਰਨਾ ਹੈ — ਸਿੱਖੋ।',[
 B.vok('Food & drink',[
  'bread / roti|a piece of bread|रोटी / ब्रेड|ਰੋਟੀ / ਬਰੈੱਡ','rice|a plate of rice|चावल|ਚੌਲ','dal / lentils|yellow dal|दाल|ਦਾਲ','vegetables|fresh vegetables|सब्ज़ियाँ|ਸਬਜ਼ੀਆਂ','fruit|apples, bananas, mangoes|फल|ਫਲ','milk|a glass of milk|दूध|ਦੁੱਧ','curd / yoghurt|a bowl of curd|दही|ਦਹੀਂ','butter|paratha with butter|मक्खन|ਮੱਖਣ','cheese / paneer|paneer is Indian cheese|पनीर|ਪਨੀਰ','egg|a boiled egg|अंडा|ਆਂਡਾ','chicken / meat|I don\'t eat meat.|चिकन / माँस|ਚਿਕਨ / ਮਾਸ',
  'tea / coffee|a cup of tea|चाय / कॉफ़ी|ਚਾਹ / ਕੌਫ਼ੀ','water / juice|a bottle of water|पानी / जूस|ਪਾਣੀ / ਜੂਸ','lassi|sweet or salty lassi|लस्सी|ਲੱਸੀ','sugar / salt|a spoon of sugar|चीनी / नमक|ਖੰਡ / ਲੂਣ','spicy|The curry is spicy.|मसालेदार|ਮਸਾਲੇਦਾਰ','sweet / sour|The mango is sweet.|मीठा / खट्टा|ਮਿੱਠਾ / ਖੱਟਾ','delicious|The food is delicious.|स्वादिष्ट|ਸੁਆਦੀ']),
 B.rule('Countable and uncountable nouns',
  P('<b>Countable</b> nouns can be counted: <i>an apple, two apples</i>. <b>Uncountable</b> nouns cannot: <i>water, rice, milk, sugar, bread, tea</i> — no "a", no plural -s.','गिनी जा सकने वाली संज्ञाएँ (an apple, two apples)। न गिनी जा सकने वाली (water, rice, milk, tea) — इनके साथ a नहीं और बहुवचन -s नहीं।','ਗਿਣੀਆਂ ਜਾ ਸਕਣ ਵਾਲੀਆਂ ਸੰਗਿਆਵਾਂ (an apple, two apples)। ਨਾ ਗਿਣੀਆਂ ਜਾਣ ਵਾਲੀਆਂ (water, rice, milk, tea) — ਇਨ੍ਹਾਂ ਨਾਲ a ਨਹੀਂ ਅਤੇ ਬਹੁ-ਵਚਨ -s ਨਹੀਂ।')+
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>Countable</th><th>Uncountable</th></tr></thead><tbody>'+
  '<tr><td class="g">a / an</td><td class="e">an egg ✓</td><td class="e">a milk ✗</td></tr>'+
  '<tr><td class="g">some</td><td class="e">some eggs</td><td class="e">some milk</td></tr>'+
  '<tr><td class="g">many / much</td><td class="e">How <b>many</b> eggs?</td><td class="e">How <b>much</b> milk?</td></tr>'+
  '<tr><td class="g">a few / a little</td><td class="e">a few eggs</td><td class="e">a little milk</td></tr>'+
  '<tr><td class="g">Measure with</td><td class="e">—</td><td class="e">a glass of water, a cup of tea, a kilo of rice, a piece of bread</td></tr>'+
  '</tbody></table></div>'+
  '<div class="rule"><span class="lbl">some / any</span><b>some</b> in positive sentences and offers: <i>I have some rice. Would you like some tea?</i> &nbsp; <b>any</b> in negatives and questions: <i>I don\'t have any milk. Do you have any sugar?</i></div>'+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ Give me <i>a water</i>. ✓ <b class="eng">Give me some water / a glass of water.</b> &nbsp; ✗ <i>Breads</i>, <i>advices</i>, <i>informations</i> ✓ <b class="eng">bread, advice, information</b>'),
 B.rule('Likes, wants and polite ordering',
  '<div class="tbl-wrap"><table><thead><tr><th>Say this</th><th>Use</th></tr></thead><tbody>'+
  '<tr><td class="g">I like / love / hate …</td><td class="e">I like tea. I love paratha. I hate bitter gourd.</td></tr>'+
  '<tr><td class="g">I\'d like … (I would like)</td><td class="e">polite: I\'d like a cup of coffee, please.</td></tr>'+
  '<tr><td class="g">Can I have …, please?</td><td class="e">Can I have the menu, please?</td></tr>'+
  '<tr><td class="g">What would you like?</td><td class="e">waiter asks</td></tr>'+
  '<tr><td class="g">Would you like …?</td><td class="e">offering: Would you like some water?</td></tr>'+
  '<tr><td class="g">The bill, please.</td><td class="e">ask for the bill</td></tr>'+
  '</tbody></table></div>'+
  T('"I want tea" थोड़ा सीधा लगता है; शिष्टता से कहें "I\'d like tea, please." / "Can I have tea, please?"','"I want tea" ਥੋੜ੍ਹਾ ਸਿੱਧਾ ਲੱਗਦਾ ਹੈ; ਸ਼ਿਸ਼ਟਤਾ ਨਾਲ ਕਹੋ "I\'d like tea, please." / "Can I have tea, please?"')),
 B.dlg('Dialogue — in a restaurant',[
  'Waiter|Good evening. Here is the menu. What would you like?|शुभ संध्या। यह मेन्यू है। आप क्या लेंगे?|ਸ਼ੁਭ ਸ਼ਾਮ। ਇਹ ਮੀਨੂ ਹੈ। ਤੁਸੀਂ ਕੀ ਲਓਗੇ?',
  'Customer|I\'d like a plate of rice and some dal, please.|मुझे एक प्लेट चावल और थोड़ी दाल चाहिए।|ਮੈਨੂੰ ਇੱਕ ਪਲੇਟ ਚੌਲ ਅਤੇ ਥੋੜ੍ਹੀ ਦਾਲ ਚਾਹੀਦੀ ਹੈ।',
  'Waiter|Would you like anything to drink?|कुछ पीने के लिए लेंगे?|ਪੀਣ ਲਈ ਕੁਝ ਲਓਗੇ?',
  'Customer|Yes, a glass of lassi, please. Is it sweet?|हाँ, एक गिलास लस्सी। क्या यह मीठी है?|ਹਾਂ, ਇੱਕ ਗਲਾਸ ਲੱਸੀ। ਕੀ ਇਹ ਮਿੱਠੀ ਹੈ?',
  'Waiter|Yes, it is. Anything else?|हाँ, है। और कुछ?|ਹਾਂ, ਹੈ। ਹੋਰ ਕੁਝ?',
  'Customer|No, thank you. Can I have the bill, please?|नहीं, धन्यवाद। बिल दीजिए।|ਨਹੀਂ, ਧੰਨਵਾਦ। ਬਿੱਲ ਦਿਓ ਜੀ।']),
 B.mcq('Practice 1 — Choose the correct word',[
  'I don\'t have ___ milk.|some;any;a|1|negative → any.|मेरे पास दूध नहीं है।|ਮੇਰੇ ਕੋਲ ਦੁੱਧ ਨਹੀਂ ਹੈ।',
  'How ___ sugar do you want?|many;much;few|1|sugar = uncountable → much.',
  'How ___ eggs are there?|much;many;a little|1|eggs = countable → many.',
  'Would you like ___ tea?|any;some;a|1|offers use some.',
  'Polite way to order:|Give me tea.;I want tea.;I\'d like some tea, please.|2|I\'d like … please = polite.',
  'Which is correct?|a bread;a piece of bread;breads|1|bread is uncountable.',
  'There is ___ rice in the box.|a few;a little;many|1|rice = uncountable → a little.',
  '"Can I have the bill, please?" You say this…|before eating;to ask how much to pay;to order a drink|1|bill = the amount to pay.']),
 B.gap('Practice 2 — Fill the gap',[
  'I\'d like ___ cup of tea. (a / an)|a|मुझे एक कप चाय चाहिए।|ਮੈਨੂੰ ਇੱਕ ਕੱਪ ਚਾਹ ਚਾਹੀਦੀ ਹੈ।','There aren\'t ___ apples. (some / any)|any|कोई सेब नहीं हैं।|ਕੋਈ ਸੇਬ ਨਹੀਂ ਹਨ।','Can I have some ___? (a drink: w _ _ _ r)|water|क्या मुझे थोड़ा पानी मिल सकता है?|ਕੀ ਮੈਨੂੰ ਥੋੜ੍ਹਾ ਪਾਣੀ ਮਿਲ ਸਕਦਾ ਹੈ?','How ___ is a kilo of rice? (price)|much|एक किलो चावल कितने का है?|ਇੱਕ ਕਿੱਲੋ ਚੌਲ ਕਿੰਨੇ ਦੇ ਹਨ?','She ___ spicy food. (like — present simple, she)|likes|उसे मसालेदार खाना पसंद है।|ਉਸਨੂੰ ਮਸਾਲੇਦਾਰ ਖਾਣਾ ਪਸੰਦ ਹੈ।']),
 B.dikt('Practice 3 — Dictation',[
  'I would like a glass of water, please.|मुझे एक गिलास पानी चाहिए।|ਮੈਨੂੰ ਇੱਕ ਗਲਾਸ ਪਾਣੀ ਚਾਹੀਦਾ ਹੈ।','Do you have any sugar?|क्या आपके पास चीनी है?|ਕੀ ਤੁਹਾਡੇ ਕੋਲ ਖੰਡ ਹੈ?','The food is delicious but a little spicy.|खाना स्वादिष्ट है पर थोड़ा तीखा।|ਖਾਣਾ ਸੁਆਦੀ ਹੈ ਪਰ ਥੋੜ੍ਹਾ ਤਿੱਖਾ।','Can I have the menu, please?|कृपया मेन्यू दीजिए।|ਕਿਰਪਾ ਕਰਕੇ ਮੀਨੂ ਦਿਓ।'])
]);

UNIT('a1_shop','15','Everyday','Shopping, Clothes & Money','खरीदारी, कपड़े और पैसे · ਖ਼ਰੀਦਦਾਰੀ, ਕੱਪੜੇ ਅਤੇ ਪੈਸੇ',

'ਭਾਅ ਪੁੱਛਣਾ, ਕੀ ਖ਼ਰੀਦਣਾ ਹੈ ਦੱਸਣਾ, ਅਤੇ ਸਾਈਜ਼, ਰੰਗ ਤੇ ਕੱਪੜਿਆਂ ਬਾਰੇ ਗੱਲ ਕਰਨਾ ਸਿੱਖੋ।',[

UNIT('a1_past','18','Everyday','Past Simple: was / were & regular verbs','साधारण भूतकाल · ਸਧਾਰਨ ਭੂਤ ਕਾਲ',
'Talk about finished actions: yesterday, last week, in 2020. Start with was / were, then regular verbs (-ed) and the most common irregular verbs.',
'बीती हुई समाप्त क्रियाओं की बात — कल, पिछले हफ़्ते, 2020 में। was/were से शुरू करें, फिर regular verbs (-ed) और सबसे आम irregular verbs।',
'ਬੀਤੀਆਂ ਖ਼ਤਮ ਹੋ ਚੁੱਕੀਆਂ ਕਿਰਿਆਵਾਂ ਦੀ ਗੱਲ — ਕੱਲ੍ਹ, ਪਿਛਲੇ ਹਫ਼ਤੇ, 2020 ਵਿੱਚ। was/were ਤੋਂ ਸ਼ੁਰੂ ਕਰੋ, ਫਿਰ regular verbs (-ed) ਅਤੇ ਸਭ ਤੋਂ ਆਮ irregular verbs।',[
 B.rule('was / were',
  '<div class="tbl-wrap"><table><thead><tr><th>Subject</th><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="g">I / he / she / it</td><td class="e">I was happy.</td><td class="e">I wasn\'t happy.</td><td class="e">Was I happy?</td></tr>'+
  '<tr><td class="g">you / we / they</td><td class="e">They were late.</td><td class="e">They weren\'t late.</td><td class="e">Were they late?</td></tr>'+
  '</tbody></table></div>'+
  T('was/were = था / थी / थे। I/he/she/it के साथ was; you/we/they के साथ were।','was/were = ਸੀ / ਸਨ। I/he/she/it ਨਾਲ was; you/we/they ਨਾਲ were।')+
  '<div class="rule"><span class="lbl">Time words</span><b class="eng">yesterday, last night, last week, last year, two days ago, in 2020, when I was a child</b></div>'),
 B.rule('Regular verbs: + ed',
  '<div class="tbl-wrap"><table><thead><tr><th>Rule</th><th>Examples</th></tr></thead><tbody>'+
  '<tr><td class="g">most verbs: + ed</td><td class="e">work → worked, play → played, watch → watched</td></tr>'+
  '<tr><td class="g">ends in e: + d</td><td class="e">like → liked, live → lived, love → loved</td></tr>'+
  '<tr><td class="g">consonant + y → ied</td><td class="e">study → studied, try → tried (but play → played)</td></tr>'+
  '<tr><td class="g">1 vowel + 1 consonant: double</td><td class="e">stop → stopped, plan → planned</td></tr>'+
  '</tbody></table></div>'+
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="g">all subjects</td><td class="e">I worked.</td><td class="e">I <b>didn\'t</b> work.</td><td class="e"><b>Did</b> you work?</td></tr>'+
  '</tbody></table></div>'+
  P('In negatives and questions use <b class="eng">did / didn\'t</b> + <b>plain verb</b>. The "-ed" is only in the positive: ✗ <i>I didn\'t worked</i>. ✓ <b class="eng">I didn\'t work.</b>','negative और प्रश्न में did/didn\'t + सादी क्रिया। "-ed" केवल positive वाक्य में: I didn\'t work।','negative ਅਤੇ ਪ੍ਰਸ਼ਨ ਵਿੱਚ did/didn\'t + ਸਾਦੀ ਕਿਰਿਆ। "-ed" ਸਿਰਫ਼ positive ਵਾਕ ਵਿੱਚ: I didn\'t work।')+
  '<div class="rule"><span class="lbl">Pronouncing -ed</span>/t/ after unvoiced sounds: <i>worked, watched</i>. /d/ after voiced sounds: <i>played, lived</i>. /id/ after t or d: <i>wanted, needed</i>.</div>'),
 B.vok('Common irregular verbs (learn these!)',[
  'be → was / were|I was at home.|था / थे|ਸੀ / ਸਨ','go → went|I went to Delhi.|गया|ਗਿਆ','come → came|He came late.|आया|ਆਇਆ','see → saw|I saw a film.|देखा|ਵੇਖਿਆ','do → did|I did my work.|किया|ਕੀਤਾ','have → had|We had lunch.|खाया / था|ਖਾਧਾ / ਸੀ','eat → ate|She ate rice.|खाया|ਖਾਧਾ','drink → drank|I drank tea.|पिया|ਪੀਤਾ','buy → bought|He bought a phone.|खरीदा|ਖ਼ਰੀਦਿਆ','take → took|I took a taxi.|लिया|ਲਿਆ','give → gave|She gave me a gift.|दिया|ਦਿੱਤਾ','make → made|Mum made dinner.|बनाया|ਬਣਾਇਆ','get → got|I got a letter.|मिला / हुआ|ਮਿਲਿਆ / ਹੋਇਆ','know → knew|I knew the answer.|जाना|ਜਾਣਿਆ','write → wrote|He wrote a letter.|लिखा|ਲਿਖਿਆ','read → read /red/|I read a book.|पढ़ा|ਪੜ੍ਹਿਆ','speak → spoke|She spoke English.|बोला|ਬੋਲਿਆ','say → said|He said hello.|कहा|ਕਿਹਾ','sleep → slept|I slept well.|सोया|ਸੌਂ ਗਿਆ','meet → met|We met at school.|मिला|ਮਿਲਿਆ']),
 B.mcq('Practice 1 — Choose the correct past form',[
  'I ___ at home yesterday.|am;was;were|1|I → was.|मैं कल घर पर था।|ਮੈਂ ਕੱਲ੍ਹ ਘਰ ਸੀ।',
  'They ___ happy last night.|was;were;are|1|they → were.',
  'She ___ to the market yesterday.|go;goed;went|2|go → went.',
  'We ___ a film last Sunday.|watched;watch;watches|0|regular: watched.',
  'I didn\'t ___ the bus.|took;take;taking|1|didn\'t + plain verb.',

  'She ___ her homework. (do)|did;done;do|0|did.',

 B.gap('Practice 2 — Past simple',[
  'Yesterday I ___ (go) to the temple.|went|कल मैं मंदिर गया।|ਕੱਲ੍ਹ ਮੈਂ ਮੰਦਰ ਗਿਆ।','She ___ (not / come) to class yesterday.|didn\'t come/did not come|वह कल कक्षा में नहीं आई।|ਉਹ ਕੱਲ੍ਹ ਜਮਾਤ ਵਿੱਚ ਨਹੀਂ ਆਈ।','We ___ (eat) rice for lunch.|ate|हमने दोपहर में चावल खाए।|ਅਸੀਂ ਦੁਪਹਿਰ ਨੂੰ ਚੌਲ ਖਾਧੇ।','___ you ___ (see) Rohit? (write: Did you see)|did you see|क्या तुमने रोहित को देखा?|ਕੀ ਤੁਸੀਂ ਰੋਹਿਤ ਨੂੰ ਵੇਖਿਆ?','He ___ (play) cricket last Sunday.|played|उसने पिछले रविवार क्रिकेट खेला।|ਉਸਨੇ ਪਿਛਲੇ ਐਤਵਾਰ ਕ੍ਰਿਕਟ ਖੇਡਿਆ।','I ___ (be) very tired last night.|was|मैं कल रात बहुत थका था।|ਮੈਂ ਕੱਲ੍ਹ ਰਾਤ ਬਹੁਤ ਥੱਕਿਆ ਸੀ।']),
 B.ord('Practice 3 — Make sentences',[
  'I went to the market yesterday|मैं कल बाज़ार गया|ਮੈਂ ਕੱਲ੍ਹ ਬਾਜ਼ਾਰ ਗਿਆ','She did not come to school|वह स्कूल नहीं आई|ਉਹ ਸਕੂਲ ਨਹੀਂ ਆਈ','Did you watch the match last night|क्या तुमने कल रात मैच देखा?|ਕੀ ਤੁਸੀਂ ਕੱਲ੍ਹ ਰਾਤ ਮੈਚ ਵੇਖਿਆ?','We were at home on Sunday|हम रविवार को घर पर थे|ਅਸੀਂ ਐਤਵਾਰ ਨੂੰ ਘਰ ਸੀ']),

(function(){
'use strict';

function levelOf(stId){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].ids.indexOf(stId)>-1) return i; }
  return 0;
}
function idxOfId(id){
  for(var i=0;i<STATIONEN.length;i++){ if(STATIONEN[i].id===id) return i; }
  return 0;
}

/* ---------- safe storage (never breaks if blocked) ---------- */
var mem = {};
var STORE = {
  get:function(k){ try{ var v=localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set:function(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
var KEY='pioneerEnglishA1_v1';
var save={xp:0, done:{}, last:null, ans:{}, typed:{}};
try{ var raw=STORE.get(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object'){ save.xp=p.xp||0; save.done=p.done||{}; save.last=p.last||null; save.ans=p.ans||{}; save.typed=p.typed||{}; } } }catch(e){}
function persist(){ try{ STORE.set(KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- answers survive leaving a station ---------- */
function setAns(blk, idx, val){
  if(!save.ans) save.ans={};
  if(!save.ans[blk._st]) save.ans[blk._st]={};
  if(!save.ans[blk._st][blk._k]) save.ans[blk._st][blk._k]={};
  save.ans[blk._st][blk._k][idx]=val;
  persist();
}
function getAns(blk, idx){
  try{ return save.ans[blk._st][blk._k][idx]; }catch(e){ return undefined; }
}
function restoreTyped(stId){
  var main=document.getElementById('main');
  if(!main) return;
  var nodes=main.querySelectorAll('input[type=text], textarea');
  if(!save.typed) save.typed={};
  var store=save.typed[stId]||{};
  Array.prototype.forEach.call(nodes, function(nd, i){
    var k='n'+i;
    if(store[k]!==undefined && store[k]!=='' && !nd.value) nd.value=store[k];
    nd.addEventListener('input', function(){
      if(!save.typed[stId]) save.typed[stId]={};
      save.typed[stId][k]=nd.value;
      persist();
    });
  });
}

/* ---------- speech (browser built-in, no network) ---------- */
var voice=null, voiceReady=false;
function pickVoice(){
  try{
    var vs = window.speechSynthesis.getVoices()||[];
    voice = vs.filter(function(v){return /^en-(IN|GB)/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
    voiceReady = true;
  }catch(e){ voiceReady=true; }
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
var warned=false;
function say(text, rate){
  if(!('speechSynthesis' in window)){
    if(!warned){ toast('Audio not supported in this browser'); warned=true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang=(voice&&voice.lang)||'en-GB';
    u.rate = rate||0.9;
    if(voice) u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!=null) n.innerHTML=html;
  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[\u2018\u2019\u02BC]/g,"'")
    .replace(/[.,!?;:"'()\u201C\u201D]/g,'')
    .replace(/\s+/g,' ');
}
function trh(it){
  return (it.hi?'<span class="trl hi">'+esc(it.hi)+'</span>':'')+(it.pa?'<span class="trl pa">'+esc(it.pa)+'</span>':'');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Listen';
  b.setAttribute('aria-label','Play English audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){ return document.createElement('span'); }

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Points · '+overall+' % complete';
}

/* ============================================================
   EXERCISE RENDERERS
============================================================ */

/* --- multiple choice --- */
function renderMCQ(blk, onDone){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' questions'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, answered=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var opts=el('div','opts');
    var btns=[];
    var fb=el('div','fb');
    function apply(i, restoring){
      btns.forEach(function(x){ x.disabled=true; });
      answered++;
      if(i===item.a){
        btns[i].classList.add('right'); right++;
        if(!restoring) addXP(2);
      }else{
        btns[i].classList.add('wrong');
        btns[item.a].classList.add('right');
      }
      fb.className='fb show '+(i===item.a?'ok':'no');
      fb.innerHTML=(i===item.a?'✓ Correct! ':'✗ ')+(item.fb||'');
      scoreLbl.textContent=right+' correct';
      if(!restoring) setAns(blk, idx, i);
      markProgress(blk._st, blk._k, Math.round(right/n*100));
    }
    item.opts.forEach(function(o,i){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
      b.onclick=function(){ if(b.disabled) return; apply(i, false); };
      btns.push(b);
      opts.appendChild(b);
