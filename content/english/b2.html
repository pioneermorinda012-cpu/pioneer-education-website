<style>
/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#9B6BFF;
  --signal-dim:#6B3FBF;
  --rail:#4A2A8A;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#6B3FBF}
.lvl-card.l4{border-top-color:#B8202E}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#6B3FBF}
.lvl-card.l4 .lvl-code{color:#B8202E}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#6B3FBF}
.fp-lvl.l4{background:#B8202E}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}

.bname{

.levelchip{

 B.rule('Mixed conditionals',
  '<div class="rule"><b>Past cause → present result:</b> If + past perfect, would + V1: <i>If I had studied medicine, I would be a doctor now.</i><br><b>Present state → past result:</b> If + past simple, would have + V3: <i>If I were more careful, I wouldn\'t have broken it.</i>'+T('पिछली बात का असर आज: If I had studied medicine, I would be a doctor now।','ਪਿਛਲੀ ਗੱਲ ਦਾ ਅਸਰ ਅੱਜ: If I had studied medicine, I would be a doctor now।')+'</div>'+

  'Hurry up; ___, we\'ll be late.|unless;otherwise;provided|1|or else.',
  '___ you need help, please call me.|Should;Would;Had|0|formal inversion.']),

UNIT('b2_pass','04','Advanced grammar','Advanced Passive, Causative and Reporting Verbs','उन्नत passive · ਉੱਨਤ passive',

'Modals और reporting verbs के साथ passive, और दूसरों से करवाई गई सेवाओं की बात (have / get something done)।',
'Modals ਅਤੇ reporting verbs ਨਾਲ passive, ਅਤੇ ਦੂਜਿਆਂ ਤੋਂ ਕਰਵਾਈਆਂ ਸੇਵਾਵਾਂ ਦੀ ਗੱਲ (have / get something done)।',[
 B.rule('Patterns',
  '<div class="tbl-wrap"><table><thead><tr><th>Pattern</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">modal + be + V3</td><td class="n">The report must be finished by Friday. It could be done.</td></tr>'+
  '<tr><td class="g">modal + have been + V3</td><td class="n">The window might have been broken by the wind.</td></tr>'+
  '<tr><td class="g">It is said / believed / thought that…</td><td class="n">It is believed that the city is 800 years old.</td></tr>'+
  '<tr><td class="g">Subject + is said to + V1</td><td class="n">The city is believed to be 800 years old. He is said to have left.</td></tr>'+
  '<tr><td class="g">have / get + object + V3</td><td class="n">I had my hair cut. She got her car repaired.</td></tr>'+
  '<tr><td class="g">being + V3</td><td class="n">I hate being interrupted. He avoided being seen.</td></tr>'+
  '</tbody></table></div>'+
  T('have something done = किसी और से करवाना: I had my phone repaired (मैंने फ़ोन ठीक करवाया)।','have something done = ਕਿਸੇ ਹੋਰ ਤੋਂ ਕਰਵਾਉਣਾ: I had my phone repaired (ਮੈਂ ਫ਼ੋਨ ਠੀਕ ਕਰਵਾਇਆ)।')+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ I cut my hair at the salon → ✓ <b class="eng">I had my hair cut at the salon.</b> (someone else did it)</div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'I ___ my laptop repaired yesterday.|had;did;made|0|have something done.',
  'The documents ___ be signed before Monday.|must;have;are|0|modal passive.',
  'The thief is said ___ escaped through a window.|to have;having;has|0|said to have.',
  'She hates ___ told what to do.|be;being;to be|1|being + V3.',
  'It is believed ___ the temple is 500 years old.|that;to;of|0|it is believed that.',
  'The road ___ closed by the police last night.|has been;had;was been|0|present perfect passive.',
  'We are going to ___ the house painted.|have;do;make|0|have something done.',
  'The package might ___ delivered by now.|have been;be been;been|0|modal perfect passive.']),
 B.gap('Practice 2 — Rewrite using the passive',[
  'They say he is rich. → He ___ rich.|is said to be|कहा जाता है कि वह अमीर है।|ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਕਿ ਉਹ ਅਮੀਰ ਹੈ।',
  'Someone cleaned my car. → I ___ my car cleaned.|had/got|मैंने गाड़ी साफ़ करवाई।|ਮੈਂ ਗੱਡੀ ਸਾਫ਼ ਕਰਵਾਈ।',
  'Someone must repair this roof. → This roof ___ repaired.|must be|इस छत की मरम्मत होनी चाहिए।|ਇਸ ਛੱਤ ਦੀ ਮੁਰੰਮਤ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ।',
  'People believe he left. → He is believed ___ left.|to have|माना जाता है कि वह चला गया।|ਮੰਨਿਆ ਜਾਂਦਾ ਹੈ ਕਿ ਉਹ ਚਲਾ ਗਿਆ।',
  'I don\'t like people staring at me. → I don\'t like ___ stared at.|being|मुझे घूरे जाना पसंद नहीं।|ਮੈਨੂੰ ਘੂਰੇ ਜਾਣਾ ਪਸੰਦ ਨਹੀਂ।']),
 B.dikt('Practice 3 — Dictation',[
  'The new airport is expected to open next year.|नया हवाई अड्डा अगले साल खुलने की उम्मीद है।|ਨਵਾਂ ਹਵਾਈ ਅੱਡਾ ਅਗਲੇ ਸਾਲ ਖੁੱਲ੍ਹਣ ਦੀ ਉਮੀਦ ਹੈ।',
  'I had my passport renewed last month.|मैंने पिछले महीने पासपोर्ट का नवीनीकरण करवाया।|ਮੈਂ ਪਿਛਲੇ ਮਹੀਨੇ ਪਾਸਪੋਰਟ ਦਾ ਨਵੀਨੀਕਰਨ ਕਰਵਾਇਆ।'])
]);

UNIT('b2_report','05','Advanced grammar','Reported Speech and Reporting Verbs','Reported speech · Reported speech',
'Report not only what people said but also what they meant: admit, deny, suggest, warn, insist, promise and more.',
'सिर्फ़ यह नहीं कि लोगों ने क्या कहा, बल्कि उनका आशय भी बताएँ: admit, deny, suggest, warn, insist, promise आदि।',
'ਸਿਰਫ਼ ਇਹ ਨਹੀਂ ਕਿ ਲੋਕਾਂ ਨੇ ਕੀ ਕਿਹਾ, ਸਗੋਂ ਉਹਨਾਂ ਦਾ ਮਤਲਬ ਵੀ ਦੱਸੋ: admit, deny, suggest, warn, insist, promise ਆਦਿ।',[
 B.rule('Reporting verb patterns',
  '<div class="tbl-wrap"><table><thead><tr><th>Pattern</th><th>Verbs</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">verb + -ing</td><td class="e">admit, deny, suggest, recommend, apologise for</td><td class="n">He denied stealing it. She suggested going by train.</td></tr>'+
  '<tr><td class="g">verb + to V1</td><td class="e">promise, refuse, offer, threaten, agree</td><td class="n">She promised to call. He refused to pay.</td></tr>'+
  '<tr><td class="g">verb + object + to V1</td><td class="e">advise, warn, remind, invite, order, persuade</td><td class="n">He advised me to wait. She warned us not to go.</td></tr>'+
  '<tr><td class="g">verb + that clause</td><td class="e">claim, insist, explain, point out, announce</td><td class="n">He insisted that he was innocent.</td></tr>'+
  '</tbody></table></div>'+
  T('"उसने मना कर दिया" = refused to; "उसने इनकार किया कि…" = denied -ing; "उसने सलाह दी" = advised me to।','"ਉਸਨੇ ਮਨ੍ਹਾ ਕਰ ਦਿੱਤਾ" = refused to; "ਉਸਨੇ ਇਨਕਾਰ ਕੀਤਾ ਕਿ…" = denied -ing; "ਉਸਨੇ ਸਲਾਹ ਦਿੱਤੀ" = advised me to।')+
  '<div class="rule"><span class="lbl">Backshift reminders</span>am/is → was, will → would, can → could, now → then, today → that day, tomorrow → the next day, here → there. If the situation is still true, you may keep the tense: <i>She said she lives in Mohali.</i></div>'),
 B.mcq('Practice 1 — Choose the correct reported form',[
  '"I\'ll call you tomorrow." → She promised ___ me the next day.|calling;to call;that calling|1|promise + to.',
  '"Don\'t touch the wire!" → He warned me ___ the wire.|not to touch;don\'t touch;to not touching|0|warn + object + not to.',
  '"You should see a doctor." → She advised me ___ a doctor.|seeing;to see;see|1|advise + object + to.',
  '"I didn\'t take your pen." → He denied ___ my pen.|to take;taking;take|1|deny + -ing.',
  '"Let\'s go to the cinema." → She suggested ___ to the cinema.|going;to go;we going to|0|suggest + -ing.',
  '"Sorry I\'m late." → He apologised ___ late.|for being;to be;being|0|apologise for -ing.',
  '"I won\'t help you." → He refused ___ me.|helping;to help;help|1|refuse + to.',
  '"It\'s my fault." → She admitted ___ her fault.|that it was;it is;to being|0|admit + that clause.']),
 B.gap('Practice 2 — Report the sentence',[
  '"I\'ll pay you back." → He promised ___ me back.|to pay|उसने वादा किया कि वह पैसे लौटा देगा।|ਉਸਨੇ ਵਾਅਦਾ ਕੀਤਾ ਕਿ ਉਹ ਪੈਸੇ ਮੋੜ ਦੇਵੇਗਾ।',
  '"Remember to lock the door." → She reminded me ___ the door.|to lock|उसने मुझे दरवाज़ा बंद करने की याद दिलाई।|ਉਸਨੇ ਮੈਨੂੰ ਦਰਵਾਜ਼ਾ ਬੰਦ ਕਰਨ ਦੀ ਯਾਦ ਕਰਵਾਈ।',
  '"Why don\'t you take a break?" → He suggested I ___ a break.|take/should take/took|उसने सुझाव दिया कि मैं ब्रेक लूँ।|ਉਸਨੇ ਸੁਝਾਅ ਦਿੱਤਾ ਕਿ ਮੈਂ ਬ੍ਰੇਕ ਲਵਾਂ।',
  '"I didn\'t cheat!" → He denied ___.|cheating|उसने नकल करने से इनकार किया।|ਉਸਨੇ ਨਕਲ ਕਰਨ ਤੋਂ ਇਨਕਾਰ ਕੀਤਾ।',
  '"You must come!" → She insisted ___ I came.|that|उसने ज़ोर दिया कि मैं आऊँ।|ਉਸਨੇ ਜ਼ੋਰ ਦਿੱਤਾ ਕਿ ਮੈਂ ਆਵਾਂ।']),
 B.dikt('Practice 3 — Dictation',[
  'She admitted that she had made a mistake.|उसने माना कि उससे ग़लती हुई थी।|ਉਸਨੇ ਮੰਨਿਆ ਕਿ ਉਸ ਤੋਂ ਗ਼ਲਤੀ ਹੋਈ ਸੀ।',
  'He warned us not to walk alone at night.|उसने हमें रात को अकेले न चलने की चेतावनी दी।|ਉਸਨੇ ਸਾਨੂੰ ਰਾਤ ਨੂੰ ਇਕੱਲੇ ਨਾ ਤੁਰਨ ਦੀ ਚੇਤਾਵਨੀ ਦਿੱਤੀ।'])
]);

UNIT('b2_part','06','Style & structure','Participle Clauses and Reduced Relatives','Participle clauses · Participle clauses',
'Make sentences shorter and more elegant: "The man standing there…", "Having finished, she left…".',
'वाक्यों को छोटा और सुंदर बनाएँ: "The man standing there…", "Having finished, she left…"।',
'ਵਾਕਾਂ ਨੂੰ ਛੋਟਾ ਅਤੇ ਸੁੰਦਰ ਬਣਾਓ: "The man standing there…", "Having finished, she left…"।',[
 B.rule('Forms and uses',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Meaning</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">V-ing (active)</td><td class="e">happening at the same time / reduced relative</td><td class="n">The girl sitting next to me is my cousin. (= who is sitting)</td></tr>'+
  '<tr><td class="g">V3 (passive)</td><td class="e">reduced passive</td><td class="n">The book written by Tagore is famous. (= which was written)</td></tr>'+
  '<tr><td class="g">Having + V3</td><td class="e">action finished earlier</td><td class="n">Having finished the exam, she went home.</td></tr>'+
  '<tr><td class="g">Being + V3 / Not + V-ing</td><td class="e">reason (passive / negative)</td><td class="n">Not knowing the way, we asked a stranger.</td></tr>'+
  '</tbody></table></div>'+
  T('Having finished = "ख़त्म करने के बाद"; Not knowing = "न जानते हुए / क्योंकि पता नहीं था"।','Having finished = "ਖ਼ਤਮ ਕਰਨ ਤੋਂ ਬਾਅਦ"; Not knowing = "ਨਾ ਜਾਣਦੇ ਹੋਏ / ਕਿਉਂਕਿ ਪਤਾ ਨਹੀਂ ਸੀ"।')+
  '<div class="rule warn"><span class="lbl">Careful (dangling participle)</span>✗ Walking down the road, the rain started. → ✓ <b class="eng">Walking down the road, I felt the rain start.</b> The subject of both clauses must be the same person.</div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'The boy ___ the guitar is my brother.|play;playing;played|1|reduced relative active.',
  'The house ___ in 1920 is now a museum.|building;built;being built|1|reduced passive.',
  '___ the work, he went home.|Finish;Having finished;Finishing|1|earlier action.',
  '___ the answer, I stayed quiet.|Not knowing;Knowing not;Don\'t know|0|negative participle.',
  'Students ___ late will not be admitted.|arrive;arriving;arrived|1|reduced relative.',
  '___ by the noise, the baby started crying.|Frightening;Frightened;Frighten|1|passive feeling.',
  'The letters ___ yesterday are on the desk.|written;writing;wrote|0|reduced passive.',
  '___ along the beach, we saw a dolphin.|Walk;Walked;Walking|2|same time.']),
 B.gap('Practice 2 — Shorten the sentence',[
  'The woman who is wearing a red sari is my aunt. → The woman ___ a red sari is my aunt.|wearing|लाल साड़ी पहनी महिला मेरी मौसी है।|ਲਾਲ ਸਾੜ੍ਹੀ ਪਾਈ ਔਰਤ ਮੇਰੀ ਮਾਸੀ ਹੈ।',
  'The cake which was baked by my mother was delicious. → The cake ___ by my mother was delicious.|baked|माँ का बनाया केक स्वादिष्ट था।|ਮਾਂ ਦਾ ਬਣਾਇਆ ਕੇਕ ਸੁਆਦੀ ਸੀ।',
  'After he had read the letter, he cried. → ___ the letter, he cried.|Having read|चिट्ठी पढ़ने के बाद वह रोया।|ਚਿੱਠੀ ਪੜ੍ਹਨ ਤੋਂ ਬਾਅਦ ਉਹ ਰੋਇਆ।',
  'Because she didn\'t have money, she walked. → ___ money, she walked.|Not having|पैसे न होने से वह पैदल चली।|ਪੈਸੇ ਨਾ ਹੋਣ ਕਰਕੇ ਉਹ ਪੈਦਲ ਗਈ।',
  'The people who live nearby are friendly. → The people ___ nearby are friendly.|living|आसपास रहने वाले लोग मिलनसार हैं।|ਨੇੜੇ ਰਹਿਣ ਵਾਲੇ ਲੋਕ ਮਿਲਣਸਾਰ ਹਨ।']),
 B.dikt('Practice 3 — Dictation',[
  'Having finished my homework, I watched a film.|होमवर्क ख़त्म करके मैंने फ़िल्म देखी।|ਹੋਮਵਰਕ ਮੁਕਾ ਕੇ ਮੈਂ ਫ਼ਿਲਮ ਵੇਖੀ।',
  'The man standing at the door is my uncle.|दरवाज़े पर खड़ा आदमी मेरा चाचा है।|ਦਰਵਾਜ਼ੇ ਤੇ ਖੜ੍ਹਾ ਆਦਮੀ ਮੇਰਾ ਚਾਚਾ ਹੈ।'])

UNIT('b2_inv','07','Style & structure','Inversion, Emphasis and Cleft Sentences','उलटा क्रम और ज़ोर · ਉਲਟਾ ਕ੍ਰਮ ਅਤੇ ਜ਼ੋਰ',
'For stronger, more formal English: "Never have I seen…", "Not only did he…", "It was John who…", "What I need is…".',
'अधिक प्रभावशाली और औपचारिक अंग्रेज़ी के लिए: "Never have I seen…", "Not only did he…", "It was John who…"।',
'ਵਧੇਰੇ ਪ੍ਰਭਾਵਸ਼ਾਲੀ ਅਤੇ ਰਸਮੀ ਅੰਗਰੇਜ਼ੀ ਲਈ: "Never have I seen…", "Not only did he…", "It was John who…"।',[
 B.rule('Inversion after negative adverbs',
  '<div class="tbl-wrap"><table><thead><tr><th>Start</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">Never / Rarely / Seldom</td><td class="n">Never have I eaten such delicious food.</td></tr>'+
  '<tr><td class="g">Not only … but also</td><td class="n">Not only did she win, but she also broke the record.</td></tr>'+
  '<tr><td class="g">No sooner … than</td><td class="n">No sooner had we left than it started to rain.</td></tr>'+
  '<tr><td class="g">Hardly … when</td><td class="n">Hardly had he sat down when the phone rang.</td></tr>'+
  '<tr><td class="g">Only when / Only after</td><td class="n">Only after the exam did I relax.</td></tr>'+
  '<tr><td class="g">Under no circumstances</td><td class="n">Under no circumstances should you open this door.</td></tr>'+
  '</tbody></table></div>'+
  T('negative adverb वाक्य के शुरू में आए तो auxiliary verb subject से पहले आती है: Never have I…','negative adverb ਵਾਕ ਦੇ ਸ਼ੁਰੂ ਵਿੱਚ ਆਵੇ ਤਾਂ auxiliary verb subject ਤੋਂ ਪਹਿਲਾਂ ਆਉਂਦੀ ਹੈ: Never have I…')+
  '<div class="rule"><span class="lbl">Cleft sentences for emphasis</span><b>It was + focus + that/who</b>: <i>It was my brother who broke the window.</i><br><b>What + clause + is/was</b>: <i>What I need is a long holiday.</i><br><b>The reason why … is that…</b>: <i>The reason I left is that I was bored.</i></div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ Never I have seen → ✓ <b class="eng">Never have I seen</b> &nbsp; ✗ No sooner he arrived than → ✓ <b class="eng">No sooner had he arrived than</b></div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'Never ___ such a beautiful place.|I have seen;have I seen;I saw|1|inversion.',
  'No sooner had he arrived ___ the meeting began.|when;than;then|1|no sooner … than.',
  'Hardly had we started ___ it began to rain.|than;when;as|1|hardly … when.',
  'Not only ___ late, but he also forgot the files.|he was;was he;did he come|1|inversion with be.',
  'Under no circumstances ___ the exam hall.|you may leave;may you leave;you leave|1|inversion.',
  '___ I need is a quiet room.|It;What;That|1|cleft.',
  'It was Rohan ___ called me.|which;who;what|1|cleft.',
  'Only after the results ___ I feel relieved.|did;do;was|0|inversion.']),
 B.gap('Practice 2 — Rewrite using inversion',[
  'I have never felt so happy. → Never ___ so happy.|have I felt|मैंने कभी इतना खुश महसूस नहीं किया।|ਮੈਂ ਕਦੇ ਇੰਨਾ ਖੁਸ਼ ਮਹਿਸੂਸ ਨਹੀਂ ਕੀਤਾ।',
  'As soon as she saw him, she smiled. → No sooner ___ him than she smiled.|had she seen|ज्यों ही उसने उसे देखा, वह मुस्कुराई।|ਜਿਉਂ ਹੀ ਉਸਨੇ ਉਸਨੂੰ ਵੇਖਿਆ, ਉਹ ਮੁਸਕਰਾਈ।',
  'He is clever and he is also kind. → Not only ___ clever, but also kind.|is he|वह न सिर्फ़ चतुर है बल्कि दयालु भी है।|ਉਹ ਨਾ ਸਿਰਫ਼ ਚਲਾਕ ਹੈ ਸਗੋਂ ਦਿਆਲੂ ਵੀ ਹੈ।',
  'I rarely go out on weekdays. → Rarely ___ out on weekdays.|do I go|मैं हफ़्ते के दिनों में शायद ही बाहर जाता हूँ।|ਮੈਂ ਹਫ਼ਤੇ ਦੇ ਦਿਨਾਂ ਵਿੱਚ ਸ਼ਾਇਦ ਹੀ ਬਾਹਰ ਜਾਂਦਾ ਹਾਂ।',
  'I want a cold drink. → What ___ is a cold drink.|I want|मुझे ठंडा पेय चाहिए।|ਮੈਨੂੰ ਠੰਡਾ ਪੀਣ ਵਾਲਾ ਚਾਹੀਦਾ ਹੈ।']),
 B.dikt('Practice 3 — Dictation',[
  'Never have I seen such a beautiful sunset.|मैंने कभी इतना सुंदर सूर्यास्त नहीं देखा।|ਮੈਂ ਕਦੇ ਇੰਨਾ ਸੋਹਣਾ ਸੂਰਜ ਛਿਪਣਾ ਨਹੀਂ ਵੇਖਿਆ।',
  'No sooner had I sat down than the lights went out.|मैं बैठा ही था कि बत्ती चली गई।|ਮੈਂ ਬੈਠਾ ਹੀ ਸੀ ਕਿ ਬੱਤੀ ਚਲੀ ਗਈ।'])

'Upper-intermediate की तरह बोलें और लिखें: अपने तर्क के संकेत दें, बारीकी जोड़ें और पाठ को प्रवाहपूर्ण बनाएँ।',

UNIT('b2_word','10','Style & structure','Word Formation and Collocations','शब्द-निर्माण और collocations · ਸ਼ਬਦ-ਨਿਰਮਾਣ ਅਤੇ collocations',

 B.rule('Word formation',

  '<tr><td class="g">Negative prefixes</td><td class="e">un-, in-, im-, il-, ir-, dis-, mis-</td><td class="n">unhappy, incorrect, impossible, illegal, irregular, dislike, misunderstand</td></tr>'+
  '<tr><td class="g">Noun suffixes</td><td class="e">-tion, -ment, -ness, -ity, -ence, -ship</td><td class="n">decision, development, kindness, ability, importance, friendship</td></tr>'+

UNIT('b2_society','11','Topics & vocabulary','Society, Culture and Debate','समाज, संस्कृति और बहस · ਸਮਾਜ, ਸੱਭਿਆਚਾਰ ਅਤੇ ਬਹਿਸ',
'Discuss social issues in a balanced way: advanced vocabulary, hedging language and polite disagreement.',
'सामाजिक मुद्दों पर संतुलित चर्चा करें: उन्नत शब्दावली, hedging भाषा और विनम्र असहमति।',

 B.vok('Advanced vocabulary',[
  'inequality|Income inequality is widening.|असमानता|ਅਸਮਾਨਤਾ',
  'prejudice|Prejudice against women still exists.|पूर्वाग्रह|ਪੱਖਪਾਤ',
  'diversity|India is known for its cultural diversity.|विविधता|ਵਿਭਿੰਨਤਾ',

  'urbanisation|Rapid urbanisation causes pollution.|शहरीकरण|ਸ਼ਹਿਰੀਕਰਨ',
  'generation gap|There is a generation gap between us.|पीढ़ियों का अंतर|ਪੀੜ੍ਹੀਆਂ ਦਾ ਫ਼ਰਕ',
  'impact|Social media has a huge impact on youth.|प्रभाव|ਪ੍ਰਭਾਵ',
  'tackle|Governments must tackle unemployment.|निपटना|ਨਜਿੱਠਣਾ',
  'implement|The scheme was implemented in 2020.|लागू करना|ਲਾਗੂ ਕਰਨਾ',
  'consensus|There is no consensus on the issue.|आम सहमति|ਆਮ ਸਹਿਮਤੀ',

  'dilemma|He faced a moral dilemma.|दुविधा|ਦੁਚਿੱਤੀ']),
 B.rule('Hedging and polite disagreement',
  '<div class="rule"><b>Hedging</b> (not too absolute): It seems that… · This might suggest… · To some extent… · tends to · is likely to · arguably · it could be argued that…<br><b>Polite disagreement:</b> I see what you mean, but… · I\'m afraid I can\'t agree entirely. · That\'s a valid point; however… · I\'d like to play devil\'s advocate.<br><b>Avoid:</b> "You are wrong." "That is stupid." → say "I take a different view."'+T('hedging = बात को पूरी तरह निश्चित न बताना: "It could be argued that…" (यह तर्क दिया जा सकता है कि…)।','hedging = ਗੱਲ ਨੂੰ ਪੂਰੀ ਤਰ੍ਹਾਂ ਨਿਸ਼ਚਿਤ ਨਾ ਦੱਸਣਾ: "It could be argued that…" (ਇਹ ਦਲੀਲ ਦਿੱਤੀ ਜਾ ਸਕਦੀ ਹੈ ਕਿ…)।')+'</div>'),
 B.text('Reading — The generation gap','Opinion · B2',
  '<p>It is often claimed that today\'s young people have less respect for tradition than their grandparents. Arguably, this view overlooks an important point: the world has changed faster in the last thirty years than in the previous three hundred. Teenagers who grew up with smartphones tend to communicate differently, and older relatives sometimes interpret this as rudeness rather than a simple difference in habit. That said, research suggests that young people still value family bonds highly; the way they express them has merely evolved. Rather than blaming one another, both generations could benefit from listening more carefully. Only then is a genuine consensus likely to emerge.</p>'+
  T('अक्सर कहा जाता है कि आज के युवा परंपरा का कम सम्मान करते हैं। तर्क दिया जा सकता है कि यह दृष्टि एक महत्वपूर्ण बात को अनदेखा करती है: दुनिया पिछले तीस सालों में बहुत तेज़ी से बदली है। शोध बताते हैं कि युवा पारिवारिक रिश्तों को अब भी महत्व देते हैं; बस तरीक़ा बदला है। दोनों पीढ़ियाँ एक-दूसरे को सुनें तो सहमति बन सकती है।','ਅਕਸਰ ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਕਿ ਅੱਜ ਦੇ ਨੌਜਵਾਨ ਪਰੰਪਰਾ ਦਾ ਘੱਟ ਸਤਿਕਾਰ ਕਰਦੇ ਹਨ। ਦਲੀਲ ਦਿੱਤੀ ਜਾ ਸਕਦੀ ਹੈ ਕਿ ਇਹ ਨਜ਼ਰੀਆ ਇੱਕ ਮਹੱਤਵਪੂਰਨ ਗੱਲ ਨੂੰ ਅਣਡਿੱਠ ਕਰਦਾ ਹੈ: ਦੁਨੀਆ ਪਿਛਲੇ ਤੀਹ ਸਾਲਾਂ ਵਿੱਚ ਬਹੁਤ ਤੇਜ਼ੀ ਨਾਲ ਬਦਲੀ ਹੈ। ਖੋਜ ਦੱਸਦੀ ਹੈ ਕਿ ਨੌਜਵਾਨ ਪਰਿਵਾਰਕ ਰਿਸ਼ਤਿਆਂ ਨੂੰ ਹੁਣ ਵੀ ਮਹੱਤਵ ਦਿੰਦੇ ਹਨ; ਬੱਸ ਢੰਗ ਬਦਲਿਆ ਹੈ।')),
 B.mcq('Questions on the text',[
  'What does the writer say about the common claim?|It is completely true;It may overlook an important point;It is rude|1|arguably overlooks.',
  'Why do older relatives sometimes feel disrespected?|Teenagers communicate differently;Teenagers never speak;Teenagers live abroad|0|different habits.',
  'What does research suggest about young people?|They ignore family;They still value family bonds;They hate tradition|1|still value.',
  'The word "consensus" means|general agreement;strong argument;old tradition|0|agreement.']),
 B.mcq('Practice 1 — Vocabulary and phrases',[

 B.gap('Practice 2 — Complete the sentences',[

  'That\'s a valid point; ___, I think there are other factors.|however|यह सही मुद्दा है; फिर भी और कारक भी हैं।|ਇਹ ਸਹੀ ਨੁਕਤਾ ਹੈ; ਫਿਰ ਵੀ ਹੋਰ ਕਾਰਕ ਵੀ ਹਨ।',
  'India is known for its cultural ___.|diversity|भारत अपनी सांस्कृतिक विविधता के लिए जाना जाता है।|ਭਾਰਤ ਆਪਣੀ ਸੱਭਿਆਚਾਰਕ ਵਿਭਿੰਨਤਾ ਲਈ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।',

 B.write('Practice 3 — Balanced discussion','Write 150 words: "Is the generation gap a serious problem?" Present both sides and use hedging.',['Introduction','Argument 1 + example','Counter-argument','Conclusion with hedging'],
  'The generation gap is often described as a serious social problem. It could be argued that differences in values lead to constant arguments in families. For instance, parents may disapprove of their children\'s career choices. However, this view may be exaggerated. Many young people still seek their elders\' advice, and many grandparents enjoy learning new technologies. Moreover, disagreements can be productive, since they encourage both sides to explain their reasons. Arguably, the real problem is not the gap itself but the lack of communication. To a certain extent, tolerance and listening can bridge it. All in all, the generation gap seems manageable if both generations are willing to compromise.')

  'Let\'s ___ some ideas for the campaign.|brainstorm|चलिए अभियान के लिए कुछ विचार सोचें।|ਆਓ ਮੁਹਿੰਮ ਲਈ ਕੁਝ ਵਿਚਾਰ ਸੋਚੀਏ।',
  'It would be ___ if you could send the file today.|helpful|अगर आप आज फ़ाइल भेज सकें तो मददगार होगा।|ਜੇ ਤੁਸੀਂ ਅੱਜ ਫ਼ਾਈਲ ਭੇਜ ਸਕੋ ਤਾਂ ਮਦਦਗਾਰ ਹੋਵੇਗਾ।']),
 B.write('Practice 3 — Formal email','Write a formal email (about 120 words) to a supplier. Explain that a delivery is late, say how it affects your business, ask for a new date and a discount.',['Subject line','I am writing with regard to…','Problem and consequences','Request','Closing'],
  'Subject: Delayed delivery of order no. 4521. Dear Mr Sharma, I am writing with regard to our order placed on 3 March, which was due to arrive last Friday. Unfortunately, we have still not received the goods. As a result, several of our customers have been waiting, and we have lost sales. I would appreciate it if you could confirm a new delivery date as soon as possible. Furthermore, in view of the inconvenience, we would like to request a 10% discount on this order. Should you need any further information, please do not hesitate to contact me. I look forward to your prompt reply. Yours sincerely, Navdeep Singh')
]);

UNIT('b2_read','14','Exam practice','Reading: Inference, Attitude and Paraphrase','पढ़ना: अनुमान, दृष्टिकोण और paraphrase · ਪੜ੍ਹਨਾ: ਅਨੁਮਾਨ, ਰਵੱਈਆ ਅਤੇ paraphrase',
'B2 reading needs more than finding words: you must infer the writer\'s attitude and recognise paraphrase.',
'B2 reading में केवल शब्द खोजना काफ़ी नहीं; लेखक का दृष्टिकोण समझना और paraphrase पहचानना ज़रूरी है।',
'B2 reading ਵਿੱਚ ਸਿਰਫ਼ ਸ਼ਬਦ ਲੱਭਣਾ ਕਾਫ਼ੀ ਨਹੀਂ; ਲੇਖਕ ਦਾ ਰਵੱਈਆ ਸਮਝਣਾ ਅਤੇ paraphrase ਪਛਾਣਨਾ ਜ਼ਰੂਰੀ ਹੈ।',[
 B.rule('Strategies',
  '<div class="rule"><b>Paraphrase:</b> the question rarely uses the same words as the text. "expensive" → "costly"; "rise" → "go up"; "said it was wrong" → "criticised".<br><b>Attitude words:</b> critical, sceptical, enthusiastic, cautious, ironic, neutral, dismissive. Look at adjectives and adverbs: <i>unfortunately, remarkably, merely</i>.<br><b>Distractors:</b> wrong options often use exact words from the text but change the meaning. Always check the whole sentence.'+T('सवाल में अक्सर पाठ के वही शब्द नहीं होते, समानार्थी होते हैं। सही उत्तर की पुष्टि पूरे वाक्य से करें।','ਸਵਾਲ ਵਿੱਚ ਅਕਸਰ ਪਾਠ ਦੇ ਉਹੀ ਸ਼ਬਦ ਨਹੀਂ ਹੁੰਦੇ, ਸਮਾਨਾਰਥੀ ਹੁੰਦੇ ਹਨ। ਸਹੀ ਉੱਤਰ ਦੀ ਪੁਸ਼ਟੀ ਪੂਰੇ ਵਾਕ ਨਾਲ ਕਰੋ।')+'</div>'),
 B.text('Text 1 — The myth of multitasking','Article · B2',
  '<p>Many professionals pride themselves on their ability to multitask, replying to emails while attending meetings and checking messages while writing reports. Yet neuroscientists have repeatedly shown that the brain does not truly perform two demanding tasks simultaneously; it merely switches rapidly between them, losing time and accuracy with every switch. One study found that people who were frequently interrupted took up to 25 minutes to return to their original task, and made considerably more errors. Productivity experts therefore recommend "single-tasking": setting aside blocks of uninterrupted time and silencing notifications. Admittedly, this advice is difficult to follow in workplaces that reward constant availability. Nevertheless, the evidence suggests that those who resist the temptation to do everything at once ultimately achieve more.</p>'),
 B.mcq('Questions on Text 1',[
  'What is the writer\'s attitude to multitasking?|Enthusiastic;Sceptical;Neutral|1|The writer calls it a myth.',
  'According to the text, the brain|performs two tasks at once;switches rapidly between tasks;rests during interruptions|1|switches.',
  'What did the study find about interruptions?|They improve accuracy;They cause long delays and more errors;They have no effect|1|up to 25 minutes.',
  'What does "admittedly" signal?|a concession;a conclusion;an example|0|concession.',
  'What do productivity experts recommend?|Checking messages often;Single-tasking in blocks;Working longer hours|1|single-tasking.']),
 B.text('Text 2 — Review','Review · B2',
  '<p>The film promises much but delivers little. Though the cinematography is undeniably stunning, the plot collapses halfway through, leaving the audience bewildered rather than moved. The lead actor, widely praised for his earlier work, appears oddly detached, as if he had wandered onto the wrong set. That said, the supporting cast is superb, and one scene in a crowded market is worth the ticket price alone. I would not describe the film as a disaster, merely as a missed opportunity.</p>'),
 B.mcq('Questions on Text 2',[
  'The reviewer\'s overall opinion is|enthusiastic;disappointed but fair;hostile|1|missed opportunity.',
  '"delivers little" means|gives few results;is delivered late;costs little|0|fulfils little of its promise.',
  'What does the reviewer praise?|The plot;The lead actor;Cinematography and supporting cast|2|stated.',
  'The phrase "wandered onto the wrong set" suggests the actor|looked out of place;was lost;was late|0|detached.']),
 B.pairs('Matching — synonyms',['reluctant|unwilling','considerable|substantial','swift|rapid','obscure|unclear','mitigate|reduce the effect of','scrutinise|examine closely'])
]);

UNIT('b2_write','15','Exam practice','Writing: Essays, Reports and Formal Letters','लिखना: निबंध, रिपोर्ट और औपचारिक पत्र · ਲਿਖਣਾ: ਲੇਖ, ਰਿਪੋਰਟ ਅਤੇ ਰਸਮੀ ਪੱਤਰ',
'B2 writing is judged on content, organisation, vocabulary range and accuracy. Learn the structure of each text type and a bank of high-level phrases.',
'B2 writing का आकलन विषयवस्तु, संगठन, शब्द-भंडार और शुद्धता पर होता है। हर प्रकार की संरचना और उच्च-स्तरीय वाक्यांश सीखें।',
'B2 writing ਦਾ ਮੁਲਾਂਕਣ ਵਿਸ਼ਾ-ਵਸਤੂ, ਸੰਗਠਨ, ਸ਼ਬਦ-ਭੰਡਾਰ ਅਤੇ ਸ਼ੁੱਧਤਾ ਤੇ ਹੁੰਦਾ ਹੈ। ਹਰ ਕਿਸਮ ਦੀ ਬਣਤਰ ਅਤੇ ਉੱਚ-ਪੱਧਰੀ ਵਾਕਾਂਸ਼ ਸਿੱਖੋ।',[
 B.rule('Text types',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Structure</th><th>Key language</th></tr></thead><tbody>'+
  '<tr><td class="g">For-and-against essay</td><td class="e">Intro · arguments for · arguments against · conclusion</td><td class="n">It is widely believed that… · A further advantage is… · On the other hand… · In conclusion, …</td></tr>'+
  '<tr><td class="g">Opinion essay</td><td class="e">Intro with opinion · 2–3 reasons · counter-argument · conclusion</td><td class="n">In my view… · I firmly believe… · Admittedly… · Taking everything into account…</td></tr>'+
  '<tr><td class="g">Report</td><td class="e">Title · Introduction · Findings (headings) · Recommendations</td><td class="n">The aim of this report is to… · It was found that… · I would recommend that…</td></tr>'+
  '<tr><td class="g">Formal letter / proposal</td><td class="e">Dear Sir/Madam · Reason · Details · Request · Closing</td><td class="n">I am writing to enquire about… · I would be most grateful if…</td></tr>'+
  '</tbody></table></div>'+
  T('रिपोर्ट में passive और अवैयक्तिक भाषा का प्रयोग: "It was found that…"; सिफ़ारिश: "I would recommend that + subject + V1"।','ਰਿਪੋਰਟ ਵਿੱਚ passive ਅਤੇ ਨਿਰਪੇਖ ਭਾਸ਼ਾ: "It was found that…"; ਸਿਫ਼ਾਰਸ਼: "I would recommend that + subject + V1"।')+
  '<div class="rule"><span class="lbl">Check your writing</span>Did you answer all parts of the question? · Is each paragraph about one idea? · Did you use a range of linking words and tenses? · No contractions in formal texts. · Proofread for articles, prepositions and subject-verb agreement.</div>'),
 B.write('Task 1 — For-and-against essay (about 200 words)','"Working from home is better for employees than working in an office." Discuss both views and give your opinion.',['Introduction','Advantages','Disadvantages','Conclusion with opinion'],
  'In recent years, working from home has become increasingly common. This essay will consider both its advantages and disadvantages. Firstly, employees save time and money because they do not have to commute. Furthermore, many people find that they concentrate better in a quiet environment. On the other hand, remote work can lead to isolation, and it is often difficult to separate professional and private life. In addition, younger employees may miss opportunities to learn from colleagues. Nevertheless, a flexible arrangement seems to offer the best of both worlds. In conclusion, I believe that working from home benefits employees provided that they remain in regular contact with their team and that companies set clear expectations.'),
 B.write('Task 2 — Report (about 180 words)','You are a student representative. Write a report to the principal about the facilities in your college library and recommend improvements.',['Title','Introduction','Findings','Recommendations'],
  'Report on Library Facilities. Introduction: The aim of this report is to evaluate the library facilities and to suggest improvements. It is based on a survey of 100 students. Findings: Opening hours — Most students stated that the library closes too early, especially during exams. Resources — It was found that many books are outdated and that there are too few computers. Atmosphere — Although the reading room is generally quiet, seating is limited. Recommendations: I would recommend that the library stay open until 9 p.m. during exam season. In addition, new books and at least ten more computers should be purchased. Finally, extra seating could be provided in the corridor. These measures would greatly improve the students\' learning experience.'),
 B.write('Task 3 — Formal letter (about 150 words)','You saw an advertisement for a summer course in London. Write to the organiser asking for details of dates, fees, accommodation and the level of the course.',['Dear Sir or Madam','Reason for writing','Specific questions','Closing'],
  'Dear Sir or Madam, I am writing to enquire about the summer English course advertised on your website. I am a university student from India and I am interested in improving my academic writing. Firstly, could you please let me know the exact dates of the course? Secondly, I would be grateful if you could send me details of the fees and whether any scholarships are available. I would also like to know whether accommodation is provided, and if so, at what cost. Finally, could you tell me which level the course is aimed at? I would appreciate a prompt reply. I look forward to hearing from you. Yours faithfully, Harpreet Singh')
]);

UNIT('b2_speak','16','Exam practice','Speaking & Listening: Long Turns and Discussion','बोलना और सुनना · ਬੋਲਣਾ ਅਤੇ ਸੁਣਨਾ',
'Learn to speak for one to two minutes without stopping, compare photos, and discuss abstract topics with a partner.',
'बिना रुके एक-दो मिनट बोलना, तस्वीरों की तुलना करना और अमूर्त विषयों पर चर्चा करना सीखें।',
'ਬਿਨਾਂ ਰੁਕੇ ਇੱਕ-ਦੋ ਮਿੰਟ ਬੋਲਣਾ, ਤਸਵੀਰਾਂ ਦੀ ਤੁਲਨਾ ਕਰਨਾ ਅਤੇ ਅਮੂਰਤ ਵਿਸ਼ਿਆਂ ਤੇ ਚਰਚਾ ਕਰਨਾ ਸਿੱਖੋ।',[
 B.rule('Long turn structure',
  '<div class="rule"><b>Comparing two photos:</b> Both pictures show… · In the first picture… whereas in the second… · One similarity is… · A key difference is… · I would say the first is more… because…<br><b>Speculating:</b> They might be… · It looks as if… · I get the impression that… · They must have been…<br><b>Keep going:</b> What I mean is… · Let me put it another way… · Another point is…<br><b>Discussing:</b> What do you think? · I tend to agree, though… · That\'s true up to a point.'+T('"दोनों तस्वीरों में…" = Both pictures show…; "मुझे ऐसा लगता है कि…" = I get the impression that…','"ਦੋਵਾਂ ਤਸਵੀਰਾਂ ਵਿੱਚ…" = Both pictures show…; "ਮੈਨੂੰ ਇੰਝ ਲੱਗਦਾ ਹੈ ਕਿ…" = I get the impression that…')+'</div>'),
 B.dlg('Model — Discussion',[
  'Examiner|Some people say that learning a language is easier for children. What do you think?|कुछ लोग कहते हैं बच्चों के लिए भाषा सीखना आसान है। आप क्या सोचते हैं?|ਕੁਝ ਲੋਕ ਕਹਿੰਦੇ ਹਨ ਬੱਚਿਆਂ ਲਈ ਭਾਸ਼ਾ ਸਿੱਖਣੀ ਸੌਖੀ ਹੈ। ਤੁਸੀਂ ਕੀ ਸੋਚਦੇ ਹੋ?',
  'Candidate|I tend to agree, though I think adults have advantages too. Children absorb pronunciation naturally, but adults can use strategies and study more systematically.|मैं कुछ हद तक सहमत हूँ; वयस्कों के भी फ़ायदे हैं।|ਮੈਂ ਕੁਝ ਹੱਦ ਤੱਕ ਸਹਿਮਤ ਹਾਂ; ਬਾਲਗਾਂ ਦੇ ਵੀ ਫ਼ਾਇਦੇ ਹਨ।',
  'Examiner|Why do you think so?|आप ऐसा क्यों सोचते हैं?|ਤੁਸੀਂ ਇੰਝ ਕਿਉਂ ਸੋਚਦੇ ਹੋ?',
  'Candidate|Well, for example, I started learning English at twenty, and although my accent isn\'t perfect, I can discuss complex topics. In other words, motivation matters more than age.|मैंने बीस साल की उम्र में अंग्रेज़ी सीखनी शुरू की; उच्चारण पूरा सही न हो तो भी मैं जटिल विषयों पर बात कर सकता हूँ। यानी प्रेरणा उम्र से ज़्यादा मायने रखती है।|ਮੈਂ ਵੀਹ ਸਾਲ ਦੀ ਉਮਰ ਵਿੱਚ ਅੰਗਰੇਜ਼ੀ ਸਿੱਖਣੀ ਸ਼ੁਰੂ ਕੀਤੀ; ਉਚਾਰਨ ਪੂਰਾ ਸਹੀ ਨਾ ਹੋਵੇ ਤਾਂ ਵੀ ਮੈਂ ਗੁੰਝਲਦਾਰ ਵਿਸ਼ਿਆਂ ਤੇ ਗੱਲ ਕਰ ਸਕਦਾ ਹਾਂ। ਯਾਨੀ ਪ੍ਰੇਰਨਾ ਉਮਰ ਨਾਲੋਂ ਵੱਧ ਮਾਇਨੇ ਰੱਖਦੀ ਹੈ।']),
 B.dikt('Listening — type what you hear',[
  'Unless the weather improves, the outdoor event will be cancelled.|जब तक मौसम नहीं सुधरता, बाहरी कार्यक्रम रद्द कर दिया जाएगा।|ਜਦੋਂ ਤੱਕ ਮੌਸਮ ਨਹੀਂ ਸੁਧਰਦਾ, ਬਾਹਰੀ ਸਮਾਗਮ ਰੱਦ ਕਰ ਦਿੱਤਾ ਜਾਵੇਗਾ।',
  'The committee is expected to announce its decision by the end of the week.|समिति से अपेक्षा है कि वह हफ़्ते के अंत तक फ़ैसला सुनाएगी।|ਕਮੇਟੀ ਤੋਂ ਉਮੀਦ ਹੈ ਕਿ ਉਹ ਹਫ਼ਤੇ ਦੇ ਅੰਤ ਤੱਕ ਫ਼ੈਸਲਾ ਸੁਣਾਵੇਗੀ।',
  'Had I realised how difficult it would be, I would have prepared more thoroughly.|अगर मुझे पता होता कि यह कितना कठिन होगा तो मैं और अच्छी तैयारी करता।|ਜੇ ਮੈਨੂੰ ਪਤਾ ਹੁੰਦਾ ਕਿ ਇਹ ਕਿੰਨਾ ਔਖਾ ਹੋਵੇਗਾ ਤਾਂ ਮੈਂ ਹੋਰ ਚੰਗੀ ਤਿਆਰੀ ਕਰਦਾ।']),
 B.write('Speaking task — prepare a 2-minute talk','Write notes for a two-minute talk: "Describe a challenge you overcame and what you learnt from it."',['Set the scene','What went wrong','How you overcame it (use past perfect)','What you learnt (use If I hadn\'t…)'],
  'Let me tell you about a time when I nearly gave up my studies. Two years ago I failed an important exam, which had never happened before. At first I felt devastated, and I had been avoiding my friends for weeks. Eventually, my teacher advised me to analyse my mistakes instead of blaming myself. I created a timetable, and by the time the next exam came, I had revised everything three times. I passed with distinction. If I hadn\'t failed, I would never have learnt to manage my time. What I learnt is that failure is simply feedback.')
]);

UNIT('b2_mock','17','Exam practice','B2 Final Review Test','B2 अंतिम समीक्षा परीक्षा · B2 ਅੰਤਿਮ ਸਮੀਖਿਆ ਪ੍ਰੀਖਿਆ',
'A full review of B2 grammar and vocabulary. Aim for 80% or more, then move to C1 or an exam such as IELTS 6.5–7.0.',
'B2 की व्याकरण और शब्दावली की पूरी समीक्षा। 80% या अधिक का लक्ष्य रखें, फिर C1 या IELTS 6.5–7.0 की तैयारी करें।',
'B2 ਦੇ ਵਿਆਕਰਨ ਅਤੇ ਸ਼ਬਦਾਵਲੀ ਦੀ ਪੂਰੀ ਸਮੀਖਿਆ। 80% ਜਾਂ ਵੱਧ ਦਾ ਟੀਚਾ ਰੱਖੋ, ਫਿਰ C1 ਜਾਂ IELTS 6.5–7.0 ਦੀ ਤਿਆਰੀ ਕਰੋ।',[
 B.mcq('Part A — Grammar and vocabulary (24 questions)',[

  '___ the exam, she went home.|Finishing;Having finished;Finished|1|perfect participle.',
  'Never ___ such a beautiful view.|I have seen;have I seen;I saw|1|inversion.',

  'It could ___ argued that prices will fall.|be;is;been|0|hedging.',
  'The benefits ___ the risks.|outweigh;overtake;outgrow|0|outweigh.']),
 B.gap('Part B — Fill the gap (8 questions)',[
  'By the time you come, I ___ (finish) the report.|will have finished',
  'This time tomorrow I ___ (fly) to London.|will be flying',
  'You ___ (not / go) alone. It was dangerous.|shouldn\'t have gone',
  'If I ___ (be) you, I would apologise.|were/was',
  'He suggested ___ (take) a taxi.|taking',
  'Not only ___ (she / win), but she also broke the record.|did she win',
  'The documents ___ (must / sign) by Friday.|must be signed',
  'She advised me ___ (see) a doctor.|to see']),
 B.ord('Part C — Word order (5 sentences)',[
  'Had I known I would have helped you|अगर मुझे पता होता तो मैं मदद करता|ਜੇ ਮੈਨੂੰ ਪਤਾ ਹੁੰਦਾ ਤਾਂ ਮੈਂ ਮਦਦ ਕਰਦਾ',
  'Never have I seen such a crowd|मैंने कभी इतनी भीड़ नहीं देखी|ਮੈਂ ਕਦੇ ਇੰਨੀ ਭੀੜ ਨਹੀਂ ਵੇਖੀ',
  'He is said to have left the country|कहा जाता है कि वह देश छोड़ गया|ਕਿਹਾ ਜਾਂਦਾ ਹੈ ਕਿ ਉਹ ਦੇਸ਼ ਛੱਡ ਗਿਆ',
  'I had my car repaired last week|मैंने पिछले हफ़्ते गाड़ी ठीक करवाई|ਮੈਂ ਪਿਛਲੇ ਹਫ਼ਤੇ ਗੱਡੀ ਠੀਕ ਕਰਵਾਈ',
  'It was my sister who called you|तुम्हें मेरी बहन ने फ़ोन किया था|ਤੁਹਾਨੂੰ ਮੇਰੀ ਭੈਣ ਨੇ ਫ਼ੋਨ ਕੀਤਾ ਸੀ']),

(function(){
'use strict';

function levelOf(stId){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].ids.indexOf(stId)>-1) return i; }
  return 0;
}
function idxOfId(id){
  for(var i=0;i<STATIONEN.length;i++){ if(STATIONEN[i].id===id) return i; }
  return 0;
}

/* ---------- safe storage (never breaks if blocked) ---------- */
var mem = {};
var STORE = {
  get:function(k){ try{ var v=localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set:function(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
var KEY='pioneerEnglishB2_v1';
var save={xp:0, done:{}, last:null, ans:{}, typed:{}};
try{ var raw=STORE.get(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object'){ save.xp=p.xp||0; save.done=p.done||{}; save.last=p.last||null; save.ans=p.ans||{}; save.typed=p.typed||{}; } } }catch(e){}
function persist(){ try{ STORE.set(KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- answers survive leaving a station ---------- */
function setAns(blk, idx, val){
  if(!save.ans) save.ans={};
  if(!save.ans[blk._st]) save.ans[blk._st]={};
  if(!save.ans[blk._st][blk._k]) save.ans[blk._st][blk._k]={};
  save.ans[blk._st][blk._k][idx]=val;
  persist();
}
function getAns(blk, idx){
  try{ return save.ans[blk._st][blk._k][idx]; }catch(e){ return undefined; }
}
function restoreTyped(stId){
  var main=document.getElementById('main');
  if(!main) return;
  var nodes=main.querySelectorAll('input[type=text], textarea');
  if(!save.typed) save.typed={};
  var store=save.typed[stId]||{};
  Array.prototype.forEach.call(nodes, function(nd, i){
    var k='n'+i;
    if(store[k]!==undefined && store[k]!=='' && !nd.value) nd.value=store[k];
    nd.addEventListener('input', function(){
      if(!save.typed[stId]) save.typed[stId]={};
      save.typed[stId][k]=nd.value;
      persist();
    });
  });
}

/* ---------- speech (browser built-in, no network) ---------- */
var voice=null, voiceReady=false;
function pickVoice(){
  try{
    var vs = window.speechSynthesis.getVoices()||[];
    voice = vs.filter(function(v){return /^en-(IN|GB)/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
    voiceReady = true;
  }catch(e){ voiceReady=true; }
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
var warned=false;
function say(text, rate){
  if(!('speechSynthesis' in window)){
    if(!warned){ toast('Audio not supported in this browser'); warned=true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang=(voice&&voice.lang)||'en-GB';
    u.rate = rate||0.9;
    if(voice) u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!=null) n.innerHTML=html;
  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[\u2018\u2019\u02BC]/g,"'")
    .replace(/[.,!?;:"'()\u201C\u201D]/g,'')
    .replace(/\s+/g,' ');
}
function trh(it){
  return (it.hi?'<span class="trl hi">'+esc(it.hi)+'</span>':'')+(it.pa?'<span class="trl pa">'+esc(it.pa)+'</span>':'');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Listen';
  b.setAttribute('aria-label','Play English audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){ return document.createElement('span'); }

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Points · '+overall+' % complete';
}

/* --- multiple choice --- */
function renderMCQ(blk, onDone){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' questions'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, answered=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var opts=el('div','opts');
    var btns=[];
    var fb=el('div','fb');
    function apply(i, restoring){
      btns.forEach(function(x){ x.disabled=true; });
      answered++;
      if(i===item.a){
        btns[i].classList.add('right'); right++;
        if(!restoring) addXP(2);
      }else{
        btns[i].classList.add('wrong');
        btns[item.a].classList.add('right');
      }
      fb.className='fb show '+(i===item.a?'ok':'no');
      fb.innerHTML=(i===item.a?'✓ Correct! ':'✗ ')+(item.fb||'');
      scoreLbl.textContent=right+' correct';
      if(!restoring) setAns(blk, idx, i);
      markProgress(blk._st, blk._k, Math.round(right/n*100));
    }
    item.opts.forEach(function(o,i){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
      b.onclick=function(){ if(b.disabled) return; apply(i, false); };
      btns.push(b);
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q.appendChild(fb);
    wrap.appendChild(q);
    var prevA=getAns(blk, idx);
    if(prevA!==undefined && prevA!==null) apply(prevA, true);
  });
  return wrap;
}

/* --- gap fill --- */
function renderLuecke(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' gaps'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, checked=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var row=el('div','inrow');
    var inp=el('input','gap');
    inp.type='text';
    inp.setAttribute('autocomplete','off');
    inp.setAttribute('autocapitalize','off');
    inp.setAttribute('spellcheck','false');
    inp.placeholder='Type your answer …';
    var btn=el('button','btn sm','Check');
    btn.type='button';
    var show=el('button','btn sm ghost','Show answer');
    show.type='button';
    row.appendChild(inp); row.appendChild(btn); row.appendChild(show);
    q.appendChild(row);
    q.appendChild(umlautBar(inp));
    var fb=el('div','fb');
    q.appendChild(fb);

    var settled=false;
    function check(){
      if(settled) return;
      var ok=matches(inp.value, item.a);
      inp.classList.remove('right','wrong');
      inp.classList.add(ok?'right':'wrong');
      fb.className='fb show '+(ok?'ok':'no');
      if(ok){
        settled=true; right++; checked++; addXP(3);
        fb.textContent='✓ Correct!';
        btn.disabled=true;
        scoreLbl.textContent=right+' correct';
        if(checked===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
      }else{
        fb.textContent='✗ Not yet. Try again.';
      }
    }
    btn.onclick=check;
    inp.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); check(); } };
    show.onclick=function(){
      if(settled) return;
      settled=true; checked++;
      inp.value=item.a[0]; inp.classList.add('wrong');
      fb.className='fb show no';
      fb.innerHTML='Answer: <b>'+esc(item.a[0])+'</b>';
      btn.disabled=true;
      if(checked===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
    };
    wrap.appendChild(q);
  });
  return wrap;
}

/* --- word ordering --- */
function renderOrdnen(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' sentences'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, done=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var target=item.a.split(' ');
    var q=el('div','q');
    q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+
      '<span class="cue">'+esc(item.hi||'')+'</span><span class="cue pa-i">'+esc(item.pa||'')+'</span>'));

    var slot=el('div','slot');
    var pool=el('div','pool');
    var settled=false;

    function mkWord(w, inSlot){
      var b=el('button','word', esc(w));
      b.type='button';
      b.onclick=function(){
        if(settled) return;
        b.remove();
        (inSlot?pool:slot).appendChild(mkWord(w, !inSlot));
      };
      return b;
    }
    shuffle(target).forEach(function(w){ pool.appendChild(mkWord(w,false)); });
    q.appendChild(slot); q.appendChild(pool);

    var row=el('div','inrow');
    row.style.marginTop='8px';
    var btn=el('button','btn sm','Check'); btn.type='button';
    var show=el('button','btn sm ghost','Show answer'); show.type='button';
    row.appendChild(btn); row.appendChild(show);
    q.appendChild(row);
    var fb=el('div','fb'); q.appendChild(fb);

    btn.onclick=function(){
      if(settled) return;
      var got=Array.prototype.map.call(slot.children,function(c){return c.textContent;}).join(' ');
      var ok = norm(got)===norm(item.a);
      fb.className='fb show '+(ok?'ok':'no');
      if(ok){
        settled=true; right++; done++; addXP(4);
        fb.innerHTML='✓ Richtig! <b>'+esc(item.a)+'.</b> ';
        var s=speakBtn(item.a); fb.appendChild(s);
        btn.disabled=true;
        scoreLbl.textContent=right+' correct';
        if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
      }else{
        fb.textContent='✗ Not quite. Check the word order: Subject + Verb + Object, with time words at the end.';
      }
    };
    show.onclick=function(){
      if(settled) return;
      settled=true; done++;
      slot.innerHTML=''; pool.innerHTML='';
      target.forEach(function(w){ slot.appendChild(mkWord(w,true)); });
      fb.className='fb show no';
      fb.innerHTML='Answer: <b>'+esc(item.a)+'.</b> ';
      fb.appendChild(speakBtn(item.a));
      btn.disabled=true;
      if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
    };
    wrap.appendChild(q);
  });
  return wrap;
}

/* --- matching pairs --- */
function renderPaare(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' pairs'));
  var scoreLbl=el('div','ex-count','0 found');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var grid=el('div','pairs');
  var L=el('div','pcol'), R=el('div','pcol');
  grid.appendChild(L); grid.appendChild(R);
  wrap.appendChild(grid);

  var found=0, n=blk.items.length, sel=null;
  var leftItems=shuffle(blk.items.map(function(p,i){return {t:p[0],i:i};}));
  var rightItems=shuffle(blk.items.map(function(p,i){return {t:p[1],i:i};}));

  function mk(col, obj, side){
    var b=el('button','pbtn', esc(obj.t));
    b.type='button';
    b.dataset.i=obj.i;
    b.onclick=function(){
      if(b.classList.contains('done')) return;
      if(side==='L'){ say(obj.t); }
      if(!sel){ 
        if(side!=='L'){ toast('Choose from the left column first'); return; }
        sel=b; b.classList.add('sel'); return;
      }
      if(sel===b){ sel=null; b.classList.remove('sel'); return; }
      if(side==='L'){ sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.i===b.dataset.i){
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
        sel=null; found++; addXP(2);
        scoreLbl.textContent=found+' found';
        if(found===n){ markProgress(blk._st, blk._k, 100); toast('All pairs found!'); }
      }else{
        b.classList.add('miss');
        setTimeout(function(){ b.classList.remove('miss'); },320);
      }
    };
    col.appendChild(b);
  }
  leftItems.forEach(function(o){ mk(L,o,'L'); });
  rightItems.forEach(function(o){ mk(R,o,'R'); });
  return wrap;
}

/* --- flashcards --- */
function renderKarten(blk){
  var wrap=el('div','ex');
  var stage=el('div','fc-stage');
  var order=shuffle(blk.items.map(function(_,i){return i;}));
  var pos=0, flipped=false;

  var card=el('div','card');
  var counter=el('div','ex-count','');
  var ctrls=el('div','inrow');

  function paint(){
    var it=blk.items[order[pos]];
    card.innerHTML='';
    card.appendChild(el('div','face', esc(it[0])));
    if(flipped){ card.appendChild(el('div','back', esc(it[1])+(it[2]?'<br>'+esc(it[2]):''))); }
    card.appendChild(el('div','hint', flipped?'Tap to flip back':'Tap for the meaning'));
    counter.textContent='Card '+(pos+1)+' of '+order.length;
  }
  card.onclick=function(){ flipped=!flipped; paint(); };

  var prev=el('button','btn sm ghost','◀ Back'); prev.type='button';
  var hear=el('button','btn sm gelb','▶ Listen'); hear.type='button';
  var next=el('button','btn sm','Next ▶'); next.type='button';
  var mix=el('button','btn sm ghost','Shuffle'); mix.type='button';

  prev.onclick=function(){ pos=(pos-1+order.length)%order.length; flipped=false; paint(); };
  next.onclick=function(){
    pos=(pos+1)%order.length; flipped=false; paint();
    if(pos===0){ markProgress(blk._st, blk._k, 100); addXP(5); toast('Deck finished!'); }
  };
  hear.onclick=function(){ var it=blk.items[order[pos]]; say(it[0]); };
  mix.onclick=function(){ order=shuffle(order); pos=0; flipped=false; paint(); toast('Shuffled'); };

  ctrls.appendChild(prev); ctrls.appendChild(hear); ctrls.appendChild(next); ctrls.appendChild(mix);
  stage.appendChild(card); stage.appendChild(counter); stage.appendChild(ctrls);
  wrap.appendChild(stage);
  paint();
  return wrap;
}
