<style>
/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#FFC400;
  --signal-dim:#B88A00;
  --rail:#7A5200;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#2A7F62}
.lvl-card.l3{border-top-color:#B88A00}
.lvl-card.l4{border-top-color:#B8202E}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#2A7F62}
.lvl-card.l3 .lvl-code{color:#B88A00}
.lvl-card.l4 .lvl-code{color:#B8202E}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#2A7F62}
.fp-lvl.l3{background:#B88A00}
.fp-lvl.l4{background:#B8202E}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}

UNIT('b1_tenses','01','Core grammar','Tense Review: Present, Past & Future Forms','काल की समीक्षा · ਕਾਲਾਂ ਦੀ ਸਮੀਖਿਆ',

  '<tr><td class="g">Present continuous</td><td class="e">am/is/are + -ing</td><td class="e">now; temporary; fixed plans</td><td class="n">I\'m studying now. I\'m seeing the doctor at 5.</td></tr>'+
  '<tr><td class="g">Past simple</td><td class="e">V2</td><td class="e">finished past event</td><td class="n">I met him in 2019.</td></tr>'+
  '<tr><td class="g">Past continuous</td><td class="e">was/were + -ing</td><td class="e">action in progress in the past</td><td class="n">I was sleeping when you called.</td></tr>'+
  '<tr><td class="g">Present perfect</td><td class="e">have/has + V3</td><td class="e">experience, result now, unfinished time</td><td class="n">I have lost my keys. I\'ve lived here for 5 years.</td></tr>'+
  '<tr><td class="g">Present perfect continuous</td><td class="e">have/has been + -ing</td><td class="e">action from past till now (duration)</td><td class="n">I\'ve been waiting for an hour.</td></tr>'+

  '</tbody></table></div>'+
  P('A time word often gives the tense: <b>now / at the moment</b> → continuous; <b>every day / usually</b> → present simple; <b>yesterday / ago / in 2019</b> → past simple; <b>for / since / ever / yet / already</b> → present perfect; <b>by the time / before</b> + past → past perfect.','समय के शब्द काल बता देते हैं: now → continuous; every day → present simple; yesterday/ago → past simple; for/since/ever/yet/already → present perfect।','ਸਮੇਂ ਦੇ ਸ਼ਬਦ ਕਾਲ ਦੱਸ ਦਿੰਦੇ ਹਨ: now → continuous; every day → present simple; yesterday/ago → past simple; for/since/ever/yet/already → present perfect।')+

UNIT('b1_ppc','02','Core grammar','Present Perfect vs Past Simple & Present Perfect Continuous','present perfect बनाम past simple, और perfect continuous · present perfect ਬਨਾਮ past simple, ਅਤੇ perfect continuous',

 B.rule('Past simple or present perfect?',

  P('Form: <b class="eng">have / has + been + verb-ing</b>. It stresses <b>duration</b> of an action that started in the past and continues now or has just stopped. <b class="eng">I\'ve been studying for three hours.</b> <b class="eng">Why are your hands dirty? — I\'ve been working in the garden.</b>','Form: have/has + been + -ing। यह उस क्रिया की अवधि पर ज़ोर देता है जो अतीत में शुरू हुई और अब भी जारी है या अभी रुकी है।','Form: have/has + been + -ing। ਇਹ ਉਸ ਕਿਰਿਆ ਦੀ ਮਿਆਦ ਤੇ ਜ਼ੋਰ ਦਿੰਦਾ ਹੈ ਜੋ ਅਤੀਤ ਵਿੱਚ ਸ਼ੁਰੂ ਹੋਈ ਅਤੇ ਹੁਣ ਵੀ ਜਾਰੀ ਹੈ ਜਾਂ ਹੁਣੇ ਰੁਕੀ ਹੈ।')+

UNIT('b1_pperf','03','Core grammar','Past Perfect & Narrative Tenses','past perfect और कहानी के काल · past perfect ਅਤੇ ਕਹਾਣੀ ਦੇ ਕਾਲ',

 B.rule('Form and use',

  '<div class="tbl-wrap"><table><thead><tr><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+
  '<tr><td class="e">I <b>had finished</b>.</td><td class="e">I <b>hadn\'t finished</b>.</td><td class="e"><b>Had</b> you finished?</td></tr>'+

  '<div class="rule warn"><span class="lbl">Do not overuse</span>If the order is clear from <i>after / before</i> you can use past simple: <i>After she finished, she went out.</i> ✗ I had gone to Delhi last year. (single past event — use past simple)'+T('एक ही अतीत की घटना हो तो past simple; दो घटनाओं में पहली के लिए past perfect।','ਇੱਕੋ ਅਤੀਤ ਦੀ ਘਟਨਾ ਹੋਵੇ ਤਾਂ past simple; ਦੋ ਘਟਨਾਵਾਂ ਵਿੱਚ ਪਹਿਲੀ ਲਈ past perfect।')+'</div>'),
 B.text('Reading — A lucky escape','Story · B1',
  '<p>Last winter I was driving to Chandigarh when the fog became very thick. I <b>had left</b> home early, but I <b>hadn\'t checked</b> the weather. Suddenly I saw red lights ahead. A truck <b>had stopped</b> in the middle of the road. I braked quickly and my car stopped just a metre behind it. My hands were shaking. Later I found out that there <b>had been</b> an accident ten minutes before I arrived. I was lucky!</p>'+
  T('पिछली सर्दियों में चंडीगढ़ जाते समय कोहरा घना हो गया। मैं जल्दी निकला था पर मौसम नहीं देखा था। अचानक आगे लाल बत्तियाँ दिखीं — एक ट्रक सड़क के बीच रुका हुआ था। मैंने तुरंत ब्रेक लगाया। बाद में पता चला कि मेरे पहुँचने से दस मिनट पहले दुर्घटना हुई थी।','ਪਿਛਲੀਆਂ ਸਰਦੀਆਂ ਵਿੱਚ ਚੰਡੀਗੜ੍ਹ ਜਾਂਦੇ ਸਮੇਂ ਧੁੰਦ ਗੂੜ੍ਹੀ ਹੋ ਗਈ। ਮੈਂ ਜਲਦੀ ਨਿਕਲਿਆ ਸੀ ਪਰ ਮੌਸਮ ਨਹੀਂ ਵੇਖਿਆ ਸੀ। ਅਚਾਨਕ ਅੱਗੇ ਲਾਲ ਬੱਤੀਆਂ ਦਿਸੀਆਂ — ਇੱਕ ਟਰੱਕ ਸੜਕ ਦੇ ਵਿਚਕਾਰ ਰੁਕਿਆ ਹੋਇਆ ਸੀ। ਮੈਂ ਤੁਰੰਤ ਬ੍ਰੇਕ ਲਾਈ। ਬਾਅਦ ਵਿੱਚ ਪਤਾ ਲੱਗਾ ਕਿ ਮੇਰੇ ਪਹੁੰਚਣ ਤੋਂ ਦਸ ਮਿੰਟ ਪਹਿਲਾਂ ਹਾਦਸਾ ਹੋਇਆ ਸੀ।')),
 B.mcq('Practice 1 — Past perfect or past simple?',[

  'After he ___ dinner, he watched TV.|had eaten;has eaten;eating|0|earlier action.',

  'He ___ to Delhi in 2015.|had gone;went;has gone|1|single past event.']),
 B.gap('Practice 2 — Complete',[

/* ══════════ B1 UNIT 04 — Passive Voice ══════════ */
UNIT('b1_passive','04','Core grammar','The Passive Voice','कर्मवाच्य (Passive Voice) · ਕਰਮ-ਵਾਚ (Passive Voice)',
'Use the passive when the action is more important than who did it: "The bridge was built in 1990." Very common in news, exams and formal writing.',
'जब क्रिया महत्वपूर्ण हो और करने वाला नहीं: "The bridge was built in 1990." समाचार, परीक्षा और औपचारिक लेखन में बहुत प्रयोग।',
'ਜਦੋਂ ਕਿਰਿਆ ਮਹੱਤਵਪੂਰਨ ਹੋਵੇ ਅਤੇ ਕਰਨ ਵਾਲਾ ਨਹੀਂ: "The bridge was built in 1990." ਖ਼ਬਰਾਂ, ਪ੍ਰੀਖਿਆ ਅਤੇ ਰਸਮੀ ਲਿਖਤ ਵਿੱਚ ਬਹੁਤ ਵਰਤੋਂ।',[
 B.rule('Form: be + past participle',
  '<div class="tbl-wrap"><table><thead><tr><th>Tense</th><th>Active</th><th>Passive</th></tr></thead><tbody>'+
  '<tr><td class="g">Present simple</td><td class="e">They make shoes here.</td><td class="e">Shoes <b>are made</b> here.</td></tr>'+
  '<tr><td class="g">Past simple</td><td class="e">Someone stole my phone.</td><td class="e">My phone <b>was stolen</b>.</td></tr>'+
  '<tr><td class="g">Present perfect</td><td class="e">They have finished the road.</td><td class="e">The road <b>has been finished</b>.</td></tr>'+
  '<tr><td class="g">Present continuous</td><td class="e">They are repairing the bridge.</td><td class="e">The bridge <b>is being repaired</b>.</td></tr>'+
  '<tr><td class="g">Future (will)</td><td class="e">They will announce the results.</td><td class="e">The results <b>will be announced</b>.</td></tr>'+
  '<tr><td class="g">Modal</td><td class="e">You must send the form.</td><td class="e">The form <b>must be sent</b>.</td></tr>'+
  '<tr><td class="g">Past perfect</td><td class="e">They had cancelled the match.</td><td class="e">The match <b>had been cancelled</b>.</td></tr>'+
  '</tbody></table></div>'+
  P('Steps: 1) make the <b>object</b> of the active sentence the <b>subject</b>; 2) use the correct form of <b>be</b> in the same tense; 3) add the <b>past participle</b>; 4) add <b>by + agent</b> only if it is important: <i>The Taj Mahal was built <b>by Shah Jahan</b>.</i>','चरण: 1) कर्म को कर्ता बनाइए; 2) उसी काल में be का सही रूप; 3) V3; 4) करने वाला महत्वपूर्ण हो तभी by + agent।','ਕਦਮ: 1) ਕਰਮ ਨੂੰ ਕਰਤਾ ਬਣਾਓ; 2) ਉਸੇ ਕਾਲ ਵਿੱਚ be ਦਾ ਸਹੀ ਰੂਪ; 3) V3; 4) ਕਰਨ ਵਾਲਾ ਜ਼ਰੂਰੀ ਹੋਵੇ ਤਾਂ ਹੀ by + agent।')+
  '<div class="rule"><span class="lbl">Use the passive when…</span>the doer is unknown (<i>My bike was stolen.</i>), obvious (<i>The thief was arrested.</i>), unimportant (<i>English is spoken here.</i>), or you want a formal style (<i>Passengers are requested to remain seated.</i>).</div>'+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ The letter was wrote. → ✓ <b class="eng">written</b> (use V3). &nbsp; ✗ It is happened yesterday. → ✓ <b class="eng">It happened yesterday.</b> (happen / seem / arrive / die have no passive). &nbsp; ✗ I was agreed. → ✓ <b class="eng">I agreed.</b></div>'),
 B.mcq('Practice 1 — Choose the correct passive',[
  'English ___ all over the world.|speaks;is spoken;is speaking|1|present passive.|अंग्रेज़ी पूरी दुनिया में बोली जाती है।|ਅੰਗਰੇਜ਼ੀ ਸਾਰੀ ਦੁਨੀਆਂ ਵਿੱਚ ਬੋਲੀ ਜਾਂਦੀ ਹੈ।',
  'My wallet ___ yesterday.|stole;was stolen;has stolen|1|past passive.',
  'The results ___ next week.|will announce;will be announced;are announcing|1|future passive.',
  'The road ___ at the moment.|is repaired;is being repaired;has repaired|1|present continuous passive.',
  'The Golden Temple ___ in the 16th century.|built;was built;is built|1|past passive.',
  'The new bridge ___ already ___.|has … been completed;has … completed;is … completed|0|present perfect passive.',
  'This form must ___ by Friday.|submit;be submitted;submitted|1|modal passive.',
  'Which sentence is correct?|The match was cancelled.;The match cancelled.;The match was cancel.|0|be + V3.']),
 B.gap('Practice 2 — Change active to passive',[
  'They sell fresh milk here. → Fresh milk ___ here. (sell)|is sold|यहाँ ताज़ा दूध बेचा जाता है।|ਇੱਥੇ ਤਾਜ਼ਾ ਦੁੱਧ ਵੇਚਿਆ ਜਾਂਦਾ ਹੈ।','Someone cleaned the room. → The room ___. (clean)|was cleaned|कमरा साफ़ किया गया।|ਕਮਰਾ ਸਾਫ਼ ਕੀਤਾ ਗਿਆ।','They will open the school in May. → The school ___ in May.|will be opened|स्कूल मई में खोला जाएगा।|ਸਕੂਲ ਮਈ ਵਿੱਚ ਖੋਲ੍ਹਿਆ ਜਾਵੇਗਾ।','They have built a new hospital. → A new hospital ___ built.|has been|एक नया अस्पताल बनाया गया है।|ਇੱਕ ਨਵਾਂ ਹਸਪਤਾਲ ਬਣਾਇਆ ਗਿਆ ਹੈ।','Dickens wrote this novel. → This novel ___ by Dickens.|was written|यह उपन्यास डिकेंस ने लिखा।|ਇਹ ਨਾਵਲ ਡਿਕਨਜ਼ ਨੇ ਲਿਖਿਆ।','You must wear a helmet. → A helmet ___ worn.|must be|हेलमेट पहनना ज़रूरी है।|ਹੈਲਮੇਟ ਪਾਉਣਾ ਜ਼ਰੂਰੀ ਹੈ।']),
 B.dikt('Practice 3 — Dictation',[
  'The new airport was opened last year.|नया हवाई अड्डा पिछले साल खोला गया।|ਨਵਾਂ ਹਵਾਈ ਅੱਡਾ ਪਿਛਲੇ ਸਾਲ ਖੋਲ੍ਹਿਆ ਗਿਆ।','Passengers are requested to keep their tickets.|यात्रियों से अनुरोध है कि वे अपने टिकट रखें।|ਯਾਤਰੀਆਂ ਨੂੰ ਬੇਨਤੀ ਹੈ ਕਿ ਉਹ ਆਪਣੀਆਂ ਟਿਕਟਾਂ ਸੰਭਾਲ ਕੇ ਰੱਖਣ।','The match has been postponed because of rain.|बारिश के कारण मैच स्थगित कर दिया गया है।|ਮੀਂਹ ਕਾਰਨ ਮੈਚ ਮੁਲਤਵੀ ਕਰ ਦਿੱਤਾ ਗਿਆ ਹੈ।','The documents will be checked tomorrow.|दस्तावेज़ कल जाँचे जाएँगे।|ਦਸਤਾਵੇਜ਼ ਕੱਲ੍ਹ ਜਾਂਚੇ ਜਾਣਗੇ।'])
]);

/* ══════════ B1 UNIT 05 — Reported Speech ══════════ */
UNIT('b1_reported','05','Core grammar','Reported Speech','अप्रत्यक्ष कथन (Reported Speech) · ਅਸਿੱਧਾ ਕਥਨ (Reported Speech)',
'Tell someone what another person said. The tense usually moves one step back and pronouns and time words change.',
'किसी और ने जो कहा वह बताएँ। काल प्रायः एक कदम पीछे जाता है और सर्वनाम तथा समय-शब्द बदलते हैं।',
'ਕਿਸੇ ਹੋਰ ਨੇ ਜੋ ਕਿਹਾ ਉਹ ਦੱਸੋ। ਕਾਲ ਆਮ ਤੌਰ ਤੇ ਇੱਕ ਕਦਮ ਪਿੱਛੇ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪੜਨਾਂਵ ਤੇ ਸਮੇਂ-ਸ਼ਬਦ ਬਦਲਦੇ ਹਨ।',[
 B.rule('Tense changes',
  '<div class="tbl-wrap"><table><thead><tr><th>Direct speech</th><th>Reported speech</th></tr></thead><tbody>'+
  '<tr><td class="e">"I <b>work</b> here." (present simple)</td><td class="e">He said (that) he <b>worked</b> there.</td></tr>'+
  '<tr><td class="e">"I <b>am working</b>."</td><td class="e">He said he <b>was working</b>.</td></tr>'+
  '<tr><td class="e">"I <b>have finished</b>."</td><td class="e">He said he <b>had finished</b>.</td></tr>'+
  '<tr><td class="e">"I <b>went</b> there."</td><td class="e">He said he <b>had gone</b> there.</td></tr>'+
  '<tr><td class="e">"I <b>will call</b> you."</td><td class="e">He said he <b>would call</b> me.</td></tr>'+
  '<tr><td class="e">"I <b>can</b> swim."</td><td class="e">He said he <b>could</b> swim.</td></tr>'+
  '<tr><td class="e">"I <b>must</b> go."</td><td class="e">He said he <b>had to</b> go.</td></tr>'+
  '</tbody></table></div>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Direct</th><th>Reported</th></tr></thead><tbody>'+
  '<tr><td class="e">now / today / tonight</td><td class="e">then / that day / that night</td></tr>'+
  '<tr><td class="e">yesterday / tomorrow</td><td class="e">the day before / the next day</td></tr>'+
  '<tr><td class="e">last week / next week</td><td class="e">the week before / the following week</td></tr>'+
  '<tr><td class="e">here / this</td><td class="e">there / that</td></tr>'+
  '</tbody></table></div>'+
  P('<b>Questions</b>: no question word order, no do/does: <i>"Where do you live?"</i> → <i>She asked where I <b>lived</b>.</i> Yes/no questions use <b>if / whether</b>: <i>"Do you like tea?"</i> → <i>He asked <b>if</b> I liked tea.</i> <b>Commands</b>: <i>"Sit down!"</i> → <i>He told me <b>to sit</b> down.</i> / <i>"Don\'t be late."</i> → <i>She told me <b>not to be</b> late.</i>','प्रश्न: सामान्य क्रम (कोई do/does नहीं): She asked where I lived। हाँ/नहीं प्रश्न में if/whether। आदेश: told me to sit / not to be late।','ਪ੍ਰਸ਼ਨ: ਸਧਾਰਨ ਕ੍ਰਮ (ਕੋਈ do/does ਨਹੀਂ): She asked where I lived। ਹਾਂ/ਨਹੀਂ ਪ੍ਰਸ਼ਨ ਵਿੱਚ if/whether। ਹੁਕਮ: told me to sit / not to be late।')+
  '<div class="rule"><span class="lbl">Reporting verbs</span><b>say</b> (no person) / <b>tell</b> + person: <i>He said he was tired. He told me he was tired.</i> Others: <b>ask, explain, promise, suggest, warn, admit, deny, advise</b>.</div>'+
  '<div class="rule warn"><span class="lbl">No change needed when…</span>the statement is still true: <i>"The earth goes round the sun."</i> → <i>The teacher said the earth <b>goes</b> round the sun.</i></div>'),
 B.mcq('Practice 1 — Reported speech',[
  '"I am tired," she said. → She said she ___ tired.|is;was;has been|1|am → was.|उसने कहा कि वह थकी हुई है।|ਉਸਨੇ ਕਿਹਾ ਕਿ ਉਹ ਥੱਕੀ ਹੋਈ ਹੈ।',
  '"I will call you," he said. → He said he ___ call me.|will;would;can|1|will → would.',
  '"Where do you live?" → He asked me where I ___.|live;lived;do live|1|no do; tense back.',
  '"Do you like tea?" → She asked ___ I liked tea.|that;if;what|1|yes/no → if.',
  '"Don\'t touch it!" → He told me ___ it.|don\'t touch;not touch;not to touch|2|not to + verb.',
  '"I bought a car yesterday." → He said he ___ a car the day before.|bought;had bought;buys|1|past → past perfect.',
  '"Open the window." → She told me ___ the window.|open;to open;opening|1|told + object + to-infinitive.',
  'He ___ me that he was busy.|said;told;spoke|1|tell + person.']),
 B.gap('Practice 2 — Report the sentence',[

UNIT('b1_cond','06','Core grammar','Second Conditional, Wishes & Third Conditional (intro)','दूसरा conditional और इच्छाएँ · ਦੂਜਾ conditional ਅਤੇ ਇੱਛਾਵਾਂ',
'Talk about unreal or imaginary situations: "If I won a lottery, I would buy a house." and regrets: "I wish I had more time."',
'काल्पनिक स्थितियों की बात: "If I won a lottery, I would buy a house." और पछतावे: "I wish I had more time."',
'ਕਾਲਪਨਿਕ ਹਾਲਾਤ ਦੀ ਗੱਲ: "If I won a lottery, I would buy a house." ਅਤੇ ਪਛਤਾਵੇ: "I wish I had more time."',[
 B.rule('Conditional types',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>If-clause</th><th>Result clause</th><th>Meaning</th></tr></thead><tbody>'+
  '<tr><td class="g">Zero</td><td class="e">If + present</td><td class="e">present</td><td class="n">always true: If you heat ice, it melts.</td></tr>'+
  '<tr><td class="g">First</td><td class="e">If + present</td><td class="e">will + V1</td><td class="n">real future: If it rains, I will stay.</td></tr>'+
  '<tr><td class="g">Second</td><td class="e">If + past simple</td><td class="e">would + V1</td><td class="n">unreal present/future: If I had a car, I would drive to work.</td></tr>'+
  '<tr><td class="g">Third</td><td class="e">If + past perfect</td><td class="e">would have + V3</td><td class="n">unreal past: If I had studied, I would have passed.</td></tr>'+
  '</tbody></table></div>'+
  P('<b class="eng">If I were you, I would…</b> — use <b>were</b> for all persons in the second conditional (formal): <i>If he were here…</i> (<i>was</i> is also heard in speech).','If I were you, I would… — second conditional में सभी persons के साथ were (औपचारिक)।','If I were you, I would… — second conditional ਵਿੱਚ ਸਾਰੇ persons ਨਾਲ were (ਰਸਮੀ)।')+
  '<div class="rule"><span class="lbl">I wish / If only</span><b>I wish + past simple</b> = regret about the present: <i>I wish I had a bigger house.</i> &nbsp; <b>I wish + past perfect</b> = regret about the past: <i>I wish I had studied harder.</i> &nbsp; <b>I wish + would</b> = annoying behaviour: <i>I wish you would stop shouting.</i>'+T('"काश मेरे पास बड़ा घर होता" = I wish I had a bigger house; "काश मैंने ज़्यादा पढ़ा होता" = I wish I had studied harder।','"ਕਾਸ਼ ਮੇਰੇ ਕੋਲ ਵੱਡਾ ਘਰ ਹੁੰਦਾ" = I wish I had a bigger house; "ਕਾਸ਼ ਮੈਂ ਵੱਧ ਪੜ੍ਹਿਆ ਹੁੰਦਾ" = I wish I had studied harder।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ If I would have time, I would help. → ✓ <b class="eng">If I had time, I would help.</b> (no would in the if-clause)</div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'If I ___ a million rupees, I would buy a farm.|have;had;would have|1|second conditional.|अगर मेरे पास एक करोड़ होता तो मैं खेत ख़रीदता।|ਜੇ ਮੇਰੇ ਕੋਲ ਇੱਕ ਕਰੋੜ ਹੁੰਦਾ ਤਾਂ ਮੈਂ ਖੇਤ ਖ਼ਰੀਦਦਾ।',
  'If I were you, I ___ apologise.|will;would;am going to|1|would.',
  'If she ___ harder, she would have passed.|studied;had studied;would study|1|third conditional.',
  'I wish I ___ more time.|have;had;would have|1|wish + past simple.',
  'If it rains tomorrow, we ___ at home.|stay;will stay;would stay|1|first conditional.',
  'If he had left earlier, he ___ the train.|would catch;would have caught;caught|1|third conditional.',
  'I wish I ___ to the party last night. (didn\'t go)|went;had gone;go|1|wish + past perfect.',
  'What would you do if you ___ lost?|get;got;would get|1|second conditional.']),
 B.gap('Practice 2 — Complete the sentences',[
  'If I ___ (be) you, I would take the job.|were|अगर मैं तुम्हारी जगह होता तो नौकरी ले लेता।|ਜੇ ਮੈਂ ਤੁਹਾਡੀ ਥਾਂ ਹੁੰਦਾ ਤਾਂ ਨੌਕਰੀ ਲੈ ਲੈਂਦਾ।','If we ___ (have) a car, we would travel more.|had|अगर हमारे पास कार होती तो हम ज़्यादा घूमते।|ਜੇ ਸਾਡੇ ਕੋਲ ਕਾਰ ਹੁੰਦੀ ਤਾਂ ਅਸੀਂ ਵੱਧ ਘੁੰਮਦੇ।','She would be happier if she ___ (live) near her family.|lived|अगर वह परिवार के पास रहती तो ज़्यादा खुश होती।|ਜੇ ਉਹ ਪਰਿਵਾਰ ਦੇ ਨੇੜੇ ਰਹਿੰਦੀ ਤਾਂ ਵੱਧ ਖੁਸ਼ ਹੁੰਦੀ।','If I had known, I ___ (tell) you.|would have told|अगर मुझे पता होता तो मैं तुम्हें बता देता।|ਜੇ ਮੈਨੂੰ ਪਤਾ ਹੁੰਦਾ ਤਾਂ ਮੈਂ ਤੁਹਾਨੂੰ ਦੱਸ ਦਿੰਦਾ।','I wish I ___ (speak) English fluently.|spoke/could speak|काश मैं धाराप्रवाह अंग्रेज़ी बोल पाता।|ਕਾਸ਼ ਮੈਂ ਰਵਾਂ ਅੰਗਰੇਜ਼ੀ ਬੋਲ ਸਕਦਾ।']),
 B.write('Practice 3 — Imaginary situations','Write 6–8 sentences: "If I could change one thing in my life…" Use second conditional and wish.',['If I … , I would …','I wish …','What would you do differently?'],
  'If I could change one thing in my life, I would learn English earlier. If I spoke English fluently, I would apply for a job abroad. I wish I had started when I was in school. If I had studied harder then, I would have more options now. But I am working hard today, and I believe my future will be better.')
]);

UNIT('b1_rel','07','Connectors & expression','Relative Clauses: who, which, that, whose','संबंधवाचक उपवाक्य · ਸੰਬੰਧ ਵਾਚਕ ਉਪਵਾਕ',
'Relative clauses let you add information about a person or thing in the same sentence. They make your English longer, smoother and more natural.',
'Relative clauses एक ही वाक्य में किसी व्यक्ति या वस्तु के बारे में जानकारी जोड़ते हैं। इनसे आपकी अंग्रेज़ी स्वाभाविक बनती है।',
'Relative clauses ਇੱਕੋ ਵਾਕ ਵਿੱਚ ਕਿਸੇ ਵਿਅਕਤੀ ਜਾਂ ਚੀਜ਼ ਬਾਰੇ ਜਾਣਕਾਰੀ ਜੋੜਦੇ ਹਨ। ਇਹਨਾਂ ਨਾਲ ਤੁਹਾਡੀ ਅੰਗਰੇਜ਼ੀ ਕੁਦਰਤੀ ਬਣਦੀ ਹੈ।',[
 B.rule('Relative pronouns',
  '<div class="tbl-wrap"><table><thead><tr><th>Word</th><th>For</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">who</td><td class="e">people</td><td class="n">The man who lives next door is a doctor.</td></tr>'+
  '<tr><td class="g">which</td><td class="e">things, animals</td><td class="n">The book which I bought is very good.</td></tr>'+
  '<tr><td class="g">that</td><td class="e">people or things (defining)</td><td class="n">The car that I want is expensive.</td></tr>'+
  '<tr><td class="g">whose</td><td class="e">possession</td><td class="n">She is the girl whose father is a pilot.</td></tr>'+
  '<tr><td class="g">where</td><td class="e">places</td><td class="n">This is the school where I studied.</td></tr>'+
  '<tr><td class="g">when</td><td class="e">times</td><td class="n">I remember the day when we met.</td></tr>'+
  '</tbody></table></div>'+
  T('who = जो (व्यक्ति), which = जो (वस्तु), whose = जिसका/जिसकी, where = जहाँ, when = जब।','who = ਜੋ (ਵਿਅਕਤੀ), which = ਜੋ (ਚੀਜ਼), whose = ਜਿਸ ਦਾ/ਦੀ, where = ਜਿੱਥੇ, when = ਜਦੋਂ।')+
  '<div class="rule"><span class="lbl">Defining vs non-defining</span><b>Defining</b> (needed, no commas): <i>The student who studies hard will pass.</i><br><b>Non-defining</b> (extra, with commas, never "that"): <i>My brother, who lives in Delhi, is an engineer.</i>'+T('Defining = ज़रूरी जानकारी (कॉमा नहीं); Non-defining = अतिरिक्त जानकारी (कॉमा के साथ, "that" नहीं)।','Defining = ਜ਼ਰੂਰੀ ਜਾਣਕਾਰੀ (ਕਾਮਾ ਨਹੀਂ); Non-defining = ਵਾਧੂ ਜਾਣਕਾਰੀ (ਕਾਮੇ ਨਾਲ, "that" ਨਹੀਂ)।')+'</div>'+
  '<div class="rule"><span class="lbl">Dropping the pronoun</span>You can leave out <b>who / which / that</b> when it is the <b>object</b>: <i>The film (that) we watched was boring.</i> You cannot leave it out as the subject: <i>The man who called you is here.</i></div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ The man who he lives next door → ✓ <b class="eng">The man who lives next door.</b> Do not repeat the subject (he/it/she).</div>'),
 B.mcq('Practice 1 — Choose the correct word',[
  'The woman ___ lives upstairs is a teacher.|who;which;whose|0|who for people.|ऊपर रहने वाली महिला शिक्षिका है।|ਉੱਪਰ ਰਹਿਣ ਵਾਲੀ ਔਰਤ ਅਧਿਆਪਕਾ ਹੈ।',
  'The laptop ___ I bought is very fast.|who;which;whose|1|which for things.',
  'He is the boy ___ bag was stolen.|who;which;whose|2|whose = possession.',
  'This is the restaurant ___ we had dinner.|where;which;who|0|where for places.',
  'My uncle, ___ lives in Canada, is visiting us.|that;who;whose|1|non-defining: no "that".',
  'I remember the day ___ I joined college.|where;when;which|1|when for time.',
  'The film ___ we saw last night was great.|that;who;whose|0|that is fine for things.',
  'Is this the man ___ car was parked outside?|who;whose;which|1|whose car.']),
 B.gap('Practice 2 — Complete with who, which, whose, where or when',[
  'The people ___ work here are friendly.|who/that|यहाँ काम करने वाले लोग मिलनसार हैं।|ਇੱਥੇ ਕੰਮ ਕਰਨ ਵਾਲੇ ਲੋਕ ਮਿਲਣਸਾਰ ਹਨ।',
  'That is the village ___ I was born.|where|वह गाँव जहाँ मेरा जन्म हुआ।|ਉਹ ਪਿੰਡ ਜਿੱਥੇ ਮੇਰਾ ਜਨਮ ਹੋਇਆ।',
  'A teacher is a person ___ teaches students.|who/that|शिक्षक वह व्यक्ति है जो विद्यार्थियों को पढ़ाता है।|ਅਧਿਆਪਕ ਉਹ ਵਿਅਕਤੀ ਹੈ ਜੋ ਵਿਦਿਆਰਥੀਆਂ ਨੂੰ ਪੜ੍ਹਾਉਂਦਾ ਹੈ।',
  'She has a friend ___ brother is a cricketer.|whose|उसकी एक सहेली है जिसका भाई क्रिकेटर है।|ਉਸਦੀ ਇੱਕ ਸਹੇਲੀ ਹੈ ਜਿਸਦਾ ਭਰਾ ਕ੍ਰਿਕਟਰ ਹੈ।',
  'Summer is the season ___ mangoes are ripe.|when|गर्मी वह मौसम है जब आम पकते हैं।|ਗਰਮੀ ਉਹ ਮੌਸਮ ਹੈ ਜਦੋਂ ਅੰਬ ਪੱਕਦੇ ਹਨ।']),
 B.dikt('Practice 3 — Dictation',[
  'The man who lives next door is a doctor.|पड़ोस में रहने वाला आदमी डॉक्टर है।|ਗੁਆਂਢ ਵਿੱਚ ਰਹਿਣ ਵਾਲਾ ਆਦਮੀ ਡਾਕਟਰ ਹੈ।',
  'This is the book that I told you about.|यह वही किताब है जिसके बारे में मैंने बताया था।|ਇਹ ਉਹੀ ਕਿਤਾਬ ਹੈ ਜਿਸ ਬਾਰੇ ਮੈਂ ਦੱਸਿਆ ਸੀ।',
  'My sister, who works in Mohali, is getting married.|मेरी बहन, जो मोहाली में काम करती है, शादी कर रही है।|ਮੇਰੀ ਭੈਣ, ਜੋ ਮੁਹਾਲੀ ਵਿੱਚ ਕੰਮ ਕਰਦੀ ਹੈ, ਵਿਆਹ ਕਰ ਰਹੀ ਹੈ।'])
]);

UNIT('b1_ger','08','Connectors & expression','Gerunds and Infinitives','Gerund और Infinitive · Gerund ਅਤੇ Infinitive',
'After some verbs English uses -ing (gerund), after others to + verb (infinitive). Learn the groups and you will avoid one of the most common B1 mistakes.',
'कुछ verbs के बाद -ing आती है, कुछ के बाद to + verb। समूह सीख लें तो सबसे आम गलतियों से बचेंगे।',
'ਕੁਝ verbs ਤੋਂ ਬਾਅਦ -ing ਆਉਂਦੀ ਹੈ, ਕੁਝ ਤੋਂ ਬਾਅਦ to + verb। ਸਮੂਹ ਸਿੱਖ ਲਓ ਤਾਂ ਆਮ ਗਲਤੀਆਂ ਤੋਂ ਬਚੋਗੇ।',[
 B.rule('Which form after which verb?',
  '<div class="tbl-wrap"><table><thead><tr><th>Pattern</th><th>Common verbs</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">verb + -ing</td><td class="e">enjoy, finish, avoid, mind, keep, suggest, practise, give up, can\'t stand</td><td class="n">I enjoy reading. She suggested going out.</td></tr>'+
  '<tr><td class="g">verb + to + V1</td><td class="e">want, hope, decide, plan, need, promise, refuse, manage, afford, learn</td><td class="n">I decided to leave. He refused to help.</td></tr>'+
  '<tr><td class="g">preposition + -ing</td><td class="e">interested in, good at, afraid of, thank you for</td><td class="n">She is good at singing.</td></tr>'+
  '<tr><td class="g">verb + object + to V1</td><td class="e">ask, tell, want, allow, advise, invite</td><td class="n">He told me to wait.</td></tr>'+
  '<tr><td class="g">modal + V1 (no to)</td><td class="e">can, must, should, would, might</td><td class="n">You should rest.</td></tr>'+
  '</tbody></table></div>'+
  T('enjoy/finish/avoid/mind के बाद -ing; want/hope/decide/plan के बाद to + verb; preposition के बाद हमेशा -ing।','enjoy/finish/avoid/mind ਤੋਂ ਬਾਅਦ -ing; want/hope/decide/plan ਤੋਂ ਬਾਅਦ to + verb; preposition ਤੋਂ ਬਾਅਦ ਹਮੇਸ਼ਾ -ing।')+
  '<div class="rule"><span class="lbl">Verbs with both forms</span><b>like / love / hate / start / begin</b> — both are fine: <i>I like swimming / to swim.</i><br><b>stop</b>: <i>I stopped smoking</i> (quit) vs <i>I stopped to smoke</i> (paused in order to). <b>remember / forget</b>: <i>I remembered to lock the door</i> (did it) vs <i>I remember locking it</i> (memory of the act). <b>try</b>: <i>try to open</i> (attempt) vs <i>try opening</i> (experiment).'+T('stop smoking = सिगरेट छोड़ना; stop to smoke = रुककर सिगरेट पीना।','stop smoking = ਸਿਗਰਟ ਛੱਡਣੀ; stop to smoke = ਰੁਕ ਕੇ ਸਿਗਰਟ ਪੀਣੀ।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ I look forward to meet you → ✓ <b class="eng">I look forward to meeting you.</b> (here "to" is a preposition) &nbsp; ✗ I enjoy to read → ✓ <b class="eng">I enjoy reading.</b></div>'),
 B.mcq('Practice 1 — Gerund or infinitive?',[
  'I enjoy ___ cricket on Sundays.|play;to play;playing|2|enjoy + -ing.|मुझे रविवार को क्रिकेट खेलना पसंद है।|ਮੈਨੂੰ ਐਤਵਾਰ ਨੂੰ ਕ੍ਰਿਕਟ ਖੇਡਣਾ ਪਸੰਦ ਹੈ।',
  'She decided ___ a new job.|look for;to look for;looking for|1|decide + to.',
  'He avoided ___ the question.|answer;to answer;answering|2|avoid + -ing.',
  'We hope ___ you soon.|see;to see;seeing|1|hope + to.',
  'She is good at ___ maths.|solve;to solve;solving|2|preposition + -ing.',
  'My teacher told me ___ harder.|study;to study;studying|1|tell + object + to.',
  'I look forward to ___ you.|meet;meeting;to meet|1|to = preposition.',
  'He can\'t afford ___ a new car.|buy;to buy;buying|1|afford + to.']),
 B.gap('Practice 2 — Put the verb in the correct form',[
  'I finished ___ (write) the report.|writing|मैंने रिपोर्ट लिखना ख़त्म कर लिया।|ਮੈਂ ਰਿਪੋਰਟ ਲਿਖਣੀ ਮੁਕਾਈ।',
  'They agreed ___ (help) us.|to help|वे हमारी मदद करने के लिए सहमत हो गए।|ਉਹ ਸਾਡੀ ਮਦਦ ਕਰਨ ਲਈ ਸਹਿਮਤ ਹੋ ਗਏ।',
  'Thank you for ___ (come).|coming|आने के लिए धन्यवाद।|ਆਉਣ ਲਈ ਧੰਨਵਾਦ।',
  'She promised ___ (call) me tonight.|to call|उसने आज रात फ़ोन करने का वादा किया।|ਉਸਨੇ ਅੱਜ ਰਾਤ ਫ਼ੋਨ ਕਰਨ ਦਾ ਵਾਅਦਾ ਕੀਤਾ।',

UNIT('b1_link','09','Connectors & expression','Linking Words: Contrast, Reason and Result','जोड़ने वाले शब्द · ਜੋੜਨ ਵਾਲੇ ਸ਼ਬਦ',
'Good speakers and writers connect ideas. Learn the linking words that show contrast, reason, result and purpose.',
'अच्छे वक्ता और लेखक विचारों को जोड़ते हैं। contrast, reason, result और purpose के linking words सीखें।',
'ਚੰਗੇ ਬੁਲਾਰੇ ਅਤੇ ਲੇਖਕ ਵਿਚਾਰ ਜੋੜਦੇ ਹਨ। contrast, reason, result ਅਤੇ purpose ਦੇ linking words ਸਿੱਖੋ।',[
 B.rule('Linking words at a glance',
  '<div class="tbl-wrap"><table><thead><tr><th>Idea</th><th>Words</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">Contrast</td><td class="e">but, however, although, even though, despite, in spite of, whereas</td><td class="n">Although it was raining, we went out. / Despite the rain, we went out.</td></tr>'+
  '<tr><td class="g">Reason</td><td class="e">because, since, as, because of, due to</td><td class="n">I stayed home because I was ill. / because of my illness.</td></tr>'+
  '<tr><td class="g">Result</td><td class="e">so, therefore, as a result, consequently</td><td class="n">It was late, so we took a taxi. He was ill; therefore he stayed home.</td></tr>'+
  '<tr><td class="g">Purpose</td><td class="e">to, in order to, so that, so as to</td><td class="n">I study to get a good job. She saved money so that she could travel.</td></tr>'+
  '<tr><td class="g">Addition</td><td class="e">and, also, in addition, moreover, besides</td><td class="n">The hotel is cheap. Moreover, it is clean.</td></tr>'+
  '<tr><td class="g">Order</td><td class="e">first, then, after that, finally</td><td class="n">First, mix the flour. Then add water.</td></tr>'+
  '</tbody></table></div>'+
  T('although = हालाँकि; despite = के बावजूद; because = क्योंकि; so = इसलिए; however = लेकिन/फिर भी; therefore = इसलिए।','although = ਭਾਵੇਂ; despite = ਦੇ ਬਾਵਜੂਦ; because = ਕਿਉਂਕਿ; so = ਇਸ ਲਈ; however = ਪਰ/ਫਿਰ ਵੀ; therefore = ਇਸ ਲਈ।')+
  '<div class="rule"><span class="lbl">Grammar of contrast</span><b>Although / even though</b> + clause (subject + verb): <i>Although he was tired, he kept working.</i><br><b>Despite / in spite of</b> + noun or -ing: <i>Despite being tired, he kept working.</i><br><b>however</b> starts a new sentence with a comma: <i>He was tired. However, he kept working.</i></div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ Although he was tired, but he worked. → ✓ <b class="eng">Although he was tired, he worked.</b> (never although + but) &nbsp; ✗ Despite of the rain → ✓ <b class="eng">Despite the rain</b>.</div>'),
 B.mcq('Practice 1 — Choose the best linking word',[
  '___ it was cold, we went swimming.|Because;Although;So|1|contrast.|ठंड थी फिर भी हम तैरने गए।|ਠੰਡ ਸੀ ਫਿਰ ਵੀ ਅਸੀਂ ਤੈਰਨ ਗਏ।',
  'I was tired, ___ I went to bed early.|but;so;although|1|result.',
  '___ the heavy rain, the match continued.|Although;Despite;However|1|Despite + noun.',
  'She studied hard ___ she wanted to pass.|because;so;however|0|reason.',
  'He saved money ___ he could buy a bike.|so that;because of;despite|0|purpose.',
  'It was late. ___, we decided to stay.|Although;Therefore;Despite|1|result (sentence start).',
  'He failed ___ his illness.|because;because of;although|1|because of + noun.',
  'I like tea, ___ my brother prefers coffee.|whereas;so;despite|0|contrast between two people.']),
 B.gap('Practice 2 — Complete with a linking word',[
  '___ he is rich, he is not happy.|Although/Though/Even though|भले ही वह अमीर है, वह खुश नहीं है।|ਭਾਵੇਂ ਉਹ ਅਮੀਰ ਹੈ, ਉਹ ਖੁਸ਼ ਨਹੀਂ ਹੈ।',
  'I went to the bank ___ get some cash.|to/in order to|मैं पैसे निकालने बैंक गया।|ਮੈਂ ਪੈਸੇ ਕਢਵਾਉਣ ਬੈਂਕ ਗਿਆ।',
  'The bus was late ___ the traffic.|because of/due to|ट्रैफ़िक की वजह से बस देर से आई।|ਟ੍ਰੈਫ਼ਿਕ ਕਰਕੇ ਬੱਸ ਦੇਰ ਨਾਲ ਆਈ।',
  'She was ill; ___, she came to work.|however/nevertheless|वह बीमार थी; फिर भी वह काम पर आई।|ਉਹ ਬੀਮਾਰ ਸੀ; ਫਿਰ ਵੀ ਉਹ ਕੰਮ ਤੇ ਆਈ।',
  '___ the bad weather, we enjoyed the trip.|Despite/In spite of|खराब मौसम के बावजूद हमें यात्रा अच्छी लगी।|ਖ਼ਰਾਬ ਮੌਸਮ ਦੇ ਬਾਵਜੂਦ ਸਾਨੂੰ ਯਾਤਰਾ ਚੰਗੀ ਲੱਗੀ।']),
 B.write('Practice 3 — Opinion paragraph','Write 6–8 sentences: "Is it better to study in India or abroad?" Use at least five linking words.',['Although … ','However, …','Because of …','Therefore / As a result …','In my opinion …'],
  'Many students want to study abroad. Although the fees are high, the quality of education is excellent. However, living costs can be a problem, so students must plan carefully. Despite these difficulties, I believe studying abroad gives better opportunities. Moreover, students learn independence and a new language. Therefore, in my opinion, studying abroad is a good choice if you can afford it.')
]);

UNIT('b1_used','10','Connectors & expression','Used to, Would and Get Used To','Used to · Would · Get used to',
'Talk about past habits, past states and things that have become familiar. Three similar patterns, three different meanings.',
'पुरानी आदतों और अब परिचित हो चुकी चीज़ों के बारे में बात करें। तीन मिलते-जुलते ढाँचे, तीन अलग अर्थ।',
'ਪੁਰਾਣੀਆਂ ਆਦਤਾਂ ਅਤੇ ਹੁਣ ਜਾਣੂ ਹੋ ਚੁੱਕੀਆਂ ਚੀਜ਼ਾਂ ਬਾਰੇ ਗੱਲ ਕਰੋ। ਤਿੰਨ ਮਿਲਦੇ-ਜੁਲਦੇ ਢਾਂਚੇ, ਤਿੰਨ ਵੱਖਰੇ ਅਰਥ।',[
 B.rule('Three patterns',
  '<div class="tbl-wrap"><table><thead><tr><th>Pattern</th><th>Meaning</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">used to + V1</td><td class="e">past habit or state (not true now)</td><td class="n">I used to play hockey. She used to be shy.</td></tr>'+
  '<tr><td class="g">would + V1</td><td class="e">repeated past action only (not states)</td><td class="n">Every summer we would visit our village.</td></tr>'+
  '<tr><td class="g">be / get used to + -ing</td><td class="e">be / become familiar with</td><td class="n">I am used to waking up early. She got used to the cold.</td></tr>'+
  '</tbody></table></div>'+
  T('used to = पहले (अब नहीं); be used to = आदी होना; get used to = आदी हो जाना।','used to = ਪਹਿਲਾਂ (ਹੁਣ ਨਹੀਂ); be used to = ਆਦੀ ਹੋਣਾ; get used to = ਆਦੀ ਹੋ ਜਾਣਾ।')+
  '<div class="rule"><span class="lbl">Questions and negatives</span><i>Did you use to play?</i> &nbsp; <i>I didn\'t use to like fish.</i> (no "d" after did/didn\'t)</div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ I am used to get up early → ✓ <b class="eng">I am used to getting up early.</b> (to = preposition → -ing) &nbsp; ✗ I would be shy → ✓ <b class="eng">I used to be shy.</b> (would cannot show a state)</div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'I ___ smoke, but I quit five years ago.|used to;am used to;would|0|past habit.|मैं पहले सिगरेट पीता था।|ਮੈਂ ਪਹਿਲਾਂ ਸਿਗਰਟ ਪੀਂਦਾ ਸੀ।',
  'She is ___ living in a big city now.|used to;use to;getting used|0|be used to + -ing.',
  'We ___ live in a small village.|would;used to;are used to|1|state → used to.',
  'It took me a month to get used ___ the food.|to;for;with|0|get used to.',
  'Did you ___ play cricket as a child?|used to;use to;would|1|did + use to.',
  'He isn\'t ___ driving on the left.|used to;use to;would|0|be used to.',
  'When I was young, I ___ climb trees every day.|would;am used to;get used to|0|repeated action.',
  'I can\'t get used to ___ up so early.|get;getting;got|1|-ing.']),
 B.gap('Practice 2 — Complete the sentences',[

  'She is used to ___ (work) at night.|working|वह रात को काम करने की आदी है।|ਉਹ ਰਾਤ ਨੂੰ ਕੰਮ ਕਰਨ ਦੀ ਆਦੀ ਹੈ।',

  'He got used to ___ (drive) on the left.|driving|वह बाईं ओर गाड़ी चलाने का आदी हो गया।|ਉਹ ਖੱਬੇ ਪਾਸੇ ਗੱਡੀ ਚਲਾਉਣ ਦਾ ਆਦੀ ਹੋ ਗਿਆ।',
  'Every Sunday we ___ (would) visit our grandparents.|would|हर रविवार हम दादा-दादी से मिलने जाते थे।|ਹਰ ਐਤਵਾਰ ਅਸੀਂ ਦਾਦਾ-ਦਾਦੀ ਨੂੰ ਮਿਲਣ ਜਾਂਦੇ ਸੀ।']),
 B.write('Practice 3 — Then and now','Write 6–8 sentences comparing your life 10 years ago with today.',['I used to …','Now I am used to …','I got used to …'],
  'Ten years ago I used to live in a small village. Every morning I would walk to school with my friends. I used to be very shy and I didn\'t use to speak English. Now I live in a city and I am used to travelling by bus. At first I couldn\'t get used to the noise, but now it feels normal. My life has changed a lot.')

UNIT('b1_phr','11','Connectors & expression','Phrasal Verbs for Everyday Life','Phrasal verbs · Phrasal verbs',

'Phrasal verbs (verb + particle) ਬੋਲੀ ਜਾਂਦੀ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਹਰ ਥਾਂ ਹਨ। ਸਭ ਤੋਂ ਲਾਭਦਾਇਕ ਸਮੂਹਾਂ ਵਿੱਚ ਸਿੱਖੋ।',[
 B.vok('Useful phrasal verbs',[
  'give up|He gave up smoking.|छोड़ देना|ਛੱਡ ਦੇਣਾ',
  'look after|She looks after her parents.|देखभाल करना|ਦੇਖਭਾਲ ਕਰਨਾ',
  'look for|I\'m looking for my keys.|ढूँढना|ਲੱਭਣਾ',
  'find out|Please find out the price.|पता लगाना|ਪਤਾ ਲਗਾਉਣਾ',
  'turn down|They turned down my offer.|ठुकराना / आवाज़ कम करना|ਠੁਕਰਾਉਣਾ / ਆਵਾਜ਼ ਘਟਾਉਣਾ',
  'put off|Don\'t put off your work.|टालना|ਟਾਲਣਾ',
  'carry on|Carry on working.|जारी रखना|ਜਾਰੀ ਰੱਖਣਾ',
  'get along with|I get along with my colleagues.|निभाना / बनना|ਨਿਭਾਉਣਾ / ਬਣਨਾ',
  'break down|The car broke down.|ख़राब होना|ਖ਼ਰਾਬ ਹੋਣਾ',
  'set up|He set up a small business.|शुरू करना|ਸ਼ੁਰੂ ਕਰਨਾ',

 B.rule('Separable or inseparable?',
  '<div class="rule"><b>Separable</b> — the object can go in the middle: <i>turn the light off</i> / <i>turn off the light</i>. With a pronoun it must go in the middle: <i>turn <b>it</b> off</i> (✗ turn off it).<br><b>Inseparable</b> — never split: <i>look after the baby</i> → <i>look after <b>her</b></i>. Examples: look after, get along with, run out of, come up with.'+T('सर्वनाम (it, them, him) separable phrasal verbs के बीच में आता है: turn it off।','ਸਰਵਨਾਂ (it, them, him) separable phrasal verbs ਦੇ ਵਿਚਕਾਰ ਆਉਂਦਾ ਹੈ: turn it off।')+'</div>'),

 B.gap('Practice 2 — Complete with a particle',[

 B.dikt('Practice 3 — Dictation',[

UNIT('b1_env','13','Topics & vocabulary','Environment and Technology','पर्यावरण और तकनीक · ਵਾਤਾਵਰਣ ਅਤੇ ਤਕਨੀਕ',
'Discuss problems and solutions: pollution, climate change, social media and artificial intelligence. Learn the words and the opinion language.',

 B.vok('Key vocabulary',[
  'pollution|Air pollution is a serious problem in cities.|प्रदूषण|ਪ੍ਰਦੂਸ਼ਣ',
  'climate change|Climate change affects farmers.|जलवायु परिवर्तन|ਜਲਵਾਯੂ ਤਬਦੀਲੀ',
  'recycle|We should recycle plastic bottles.|पुनर्चक्रण करना|ਰੀਸਾਈਕਲ ਕਰਨਾ',
  'renewable energy|Solar power is renewable energy.|नवीकरणीय ऊर्जा|ਨਵਿਆਉਣਯੋਗ ਊਰਜਾ',
  'waste|Don\'t waste water.|बर्बादी / कचरा|ਬਰਬਾਦੀ / ਕੂੜਾ',
  'endangered|The tiger is an endangered animal.|विलुप्तप्राय|ਖ਼ਤਰੇ ਵਿੱਚ',
  'artificial intelligence|AI can translate languages.|कृत्रिम बुद्धिमत्ता|ਨਕਲੀ ਬੁੱਧੀ',
  'addicted|Many teenagers are addicted to their phones.|आदी|ਆਦੀ',
  'privacy|Online privacy is important.|निजता|ਨਿੱਜਤਾ',
  'upload / download|I uploaded the photos.|अपलोड / डाउनलोड|ਅੱਪਲੋਡ / ਡਾਊਨਲੋਡ',
  'device|Turn off all electronic devices.|उपकरण|ਉਪਕਰਣ',
  'sustainable|We need sustainable farming.|टिकाऊ|ਟਿਕਾਊ']),
 B.rule('Giving opinions and discussing pros and cons',
  '<div class="rule"><b>Opinion:</b> In my opinion… · I believe that… · As far as I\'m concerned… · It seems to me that…<br><b>Agree / disagree:</b> I totally agree. · I\'m not so sure. · I see your point, but…<br><b>Advantages:</b> One advantage is… · It also helps… <br><b>Disadvantages:</b> On the other hand… · The main drawback is…<br><b>Conclusion:</b> To sum up… · All things considered…'+T('"मेरे हिसाब से" = In my opinion; "दूसरी तरफ़" = On the other hand; "संक्षेप में" = To sum up।','"ਮੇਰੇ ਹਿਸਾਬ ਨਾਲ" = In my opinion; "ਦੂਜੇ ਪਾਸੇ" = On the other hand; "ਸੰਖੇਪ ਵਿੱਚ" = To sum up।')+'</div>'+
  '<div class="rule"><span class="lbl">Passive for problems</span>Forests <b>are being cut</b> down. Plastic <b>is thrown</b> into rivers. More trees <b>should be planted</b>.</div>'),
 B.text('Reading — Should schools ban mobile phones?','Opinion · B1',
  '<p>Many schools around the world are discussing whether students should be allowed to use mobile phones in class. Supporters of a ban say that phones distract students and make it harder to concentrate. They also argue that children spend too much time on social media instead of talking to each other. On the other hand, some teachers believe phones can be useful learning tools: students can look up words, use educational apps and take notes. In my opinion, the best solution is a compromise. Phones should be switched off during lessons, but students could use them in the library or for special projects. In this way, schools can enjoy the advantages of technology without its drawbacks.</p>'+
  T('कई स्कूल सोच रहे हैं कि कक्षा में फ़ोन की अनुमति हो या नहीं। एक पक्ष कहता है कि फ़ोन ध्यान भटकाते हैं; दूसरा कहता है कि वे सीखने के उपकरण भी हैं। लेखक का मत है कि बीच का रास्ता अच्छा है: पाठों में बंद, पुस्तकालय या प्रोजेक्ट में उपयोग।','ਕਈ ਸਕੂਲ ਸੋਚ ਰਹੇ ਹਨ ਕਿ ਜਮਾਤ ਵਿੱਚ ਫ਼ੋਨ ਦੀ ਇਜਾਜ਼ਤ ਹੋਵੇ ਜਾਂ ਨਹੀਂ। ਇੱਕ ਪੱਖ ਕਹਿੰਦਾ ਹੈ ਕਿ ਫ਼ੋਨ ਧਿਆਨ ਭਟਕਾਉਂਦੇ ਹਨ; ਦੂਜਾ ਕਹਿੰਦਾ ਹੈ ਕਿ ਉਹ ਸਿੱਖਣ ਦੇ ਸਾਧਨ ਵੀ ਹਨ। ਲੇਖਕ ਦੀ ਰਾਇ ਹੈ ਕਿ ਵਿਚਕਾਰਲਾ ਰਾਹ ਚੰਗਾ ਹੈ।')),
 B.mcq('Questions on the text',[
  'Why do supporters want a ban?|Phones are expensive;Phones distract students;Phones are broken|1|distract and make concentration harder.',
  'What can students do with phones in a positive way?|Play games;Look up words and take notes;Watch films|1|educational uses.',
  'What is the writer\'s opinion?|Ban all phones;Allow phones always;Find a compromise|2|compromise.',
  'Where could phones be used?|In lessons;In the library or for projects;Nowhere|1|library / projects.']),
 B.mcq('Practice 1 — Vocabulary and grammar',[
  'We should ___ paper, glass and plastic.|recycle;waste;pollute|0|recycle.|हमें पेपर, काँच और प्लास्टिक रीसाइकिल करना चाहिए।|ਸਾਨੂੰ ਕਾਗਜ਼, ਸ਼ੀਸ਼ਾ ਅਤੇ ਪਲਾਸਟਿਕ ਰੀਸਾਈਕਲ ਕਰਨੇ ਚਾਹੀਦੇ ਹਨ।',
  'Solar and wind power are ___ energy sources.|renewable;endangered;addicted|0|renewable.',
  'More trees ___ be planted.|should;are;have|0|should be planted.',
  'Many people are ___ to their smartphones.|addicted;interested;depend|0|addicted to.',
  'Forests ___ cut down every year.|are being;is being;were being|0|passive continuous.',
  '___ my opinion, social media has more disadvantages.|On;In;At|1|In my opinion.',
  'The main ___ of cars is air pollution.|drawback;advantage;benefit|0|drawback = disadvantage.',
  'All things ___, I think technology helps us.|considered;thought;seen|0|all things considered.']),
 B.gap('Practice 2 — Complete the sentences',[
  'I think we should use public transport ___ of cars.|instead|मेरा मानना है कि हमें कारों की जगह सार्वजनिक परिवहन का उपयोग करना चाहिए।|ਮੇਰਾ ਮੰਨਣਾ ਹੈ ਕਿ ਸਾਨੂੰ ਕਾਰਾਂ ਦੀ ਥਾਂ ਜਨਤਕ ਆਵਾਜਾਈ ਵਰਤਣੀ ਚਾਹੀਦੀ ਹੈ।',
  'Plastic bags ___ banned in many states.|are/have been|कई राज्यों में प्लास्टिक बैग प्रतिबंधित हैं।|ਕਈ ਰਾਜਾਂ ਵਿੱਚ ਪਲਾਸਟਿਕ ਦੇ ਥੈਲੇ ਬੰਦ ਹਨ।',
  'The ___ of this phone is its battery life.|advantage|इस फ़ोन का फ़ायदा इसकी बैटरी है।|ਇਸ ਫ਼ੋਨ ਦਾ ਫ਼ਾਇਦਾ ਇਸਦੀ ਬੈਟਰੀ ਹੈ।',
  'We need to reduce, reuse and ___.|recycle|हमें कम करना, दोबारा उपयोग करना और रीसाइकिल करना है।|ਸਾਨੂੰ ਘਟਾਉਣਾ, ਮੁੜ ਵਰਤਣਾ ਅਤੇ ਰੀਸਾਈਕਲ ਕਰਨਾ ਹੈ।',
  'On the other ___, online classes are flexible.|hand|दूसरी तरफ़, ऑनलाइन कक्षाएँ लचीली हैं।|ਦੂਜੇ ਪਾਸੇ, ਆਨਲਾਈਨ ਕਲਾਸਾਂ ਲਚਕੀਲੀਆਂ ਹਨ।']),
 B.write('Practice 3 — Opinion essay','Write 100–120 words: "Is technology making our lives better?" Give advantages, disadvantages and your conclusion.',['Introduction','One advantage','One disadvantage','Conclusion'],
  'Technology has changed our lives in many ways. One advantage is that we can communicate with anyone in seconds. Moreover, online banking and shopping save time. On the other hand, people spend too much time on their phones and sometimes forget to talk to their families. Privacy is also a serious problem. In my opinion, technology is a useful tool if we use it carefully. To sum up, it makes life better, but we must control it, not let it control us.')

UNIT('b1_media','14','Topics & vocabulary','News, Media and Social Life','समाचार, मीडिया और सामाजिक जीवन · ਖ਼ਬਰਾਂ, ਮੀਡੀਆ ਅਤੇ ਸਮਾਜਕ ਜੀਵਨ',

 B.vok('Key vocabulary',[

  'reporter|A reporter interviewed the minister.|संवाददाता|ਪੱਤਰਕਾਰ',
  'announce|The government announced a new scheme.|घोषणा करना|ਐਲਾਨ ਕਰਨਾ',

  'rumour|It\'s only a rumour, not a fact.|अफ़वाह|ਅਫ਼ਵਾਹ',
  'trend|Short videos are a popular trend.|चलन|ਰੁਝਾਨ',
  'celebrate|We celebrate Baisakhi in April.|मनाना|ਮਨਾਉਣਾ',
  'invite|They invited us to the wedding.|आमंत्रित करना|ਸੱਦਾ ਦੇਣਾ',
  'get together|Let\'s get together this weekend.|मिलना-जुलना|ਮਿਲਣਾ-ਜੁਲਣਾ',
  'neighbour|Our neighbours are very kind.|पड़ोसी|ਗੁਆਂਢੀ',
  'relationship|They have a good relationship.|रिश्ता|ਰਿਸ਼ਤਾ',

  'Jaspreet|Really? I heard that it was delayed.|सच में? मैंने सुना था कि देरी हो गई है।|ਸੱਚੀਂ? ਮੈਂ ਸੁਣਿਆ ਸੀ ਕਿ ਦੇਰੀ ਹੋ ਗਈ ਹੈ।',
  'Simran|That was only a rumour. The minister announced the date yesterday.|वह सिर्फ़ अफ़वाह थी। मंत्री ने कल तारीख़ बताई।|ਉਹ ਸਿਰਫ਼ ਅਫ਼ਵਾਹ ਸੀ। ਮੰਤਰੀ ਨੇ ਕੱਲ੍ਹ ਤਾਰੀਖ਼ ਦੱਸੀ।']),

UNIT('b1_culture','15','Topics & vocabulary','Travel, Culture and Experiences','यात्रा, संस्कृति और अनुभव · ਯਾਤਰਾ, ਸੱਭਿਆਚਾਰ ਅਤੇ ਤਜਰਬੇ',
'Tell stories about trips and traditions, describe places in detail and talk about life experiences with the present perfect and past tenses.',
'यात्राओं और परंपराओं की कहानियाँ सुनाएँ, जगहों का विस्तार से वर्णन करें और जीवन के अनुभवों के बारे में बात करें।',
'ਯਾਤਰਾਵਾਂ ਅਤੇ ਪਰੰਪਰਾਵਾਂ ਦੀਆਂ ਕਹਾਣੀਆਂ ਸੁਣਾਓ, ਥਾਵਾਂ ਦਾ ਵਿਸਤਾਰ ਨਾਲ ਵਰਣਨ ਕਰੋ ਅਤੇ ਜੀਵਨ ਦੇ ਤਜਰਬਿਆਂ ਬਾਰੇ ਗੱਲ ਕਰੋ।',[
 B.vok('Key vocabulary',[
  'tradition|Langar is a Sikh tradition.|परंपरा|ਪਰੰਪਰਾ',
  'custom|It is a local custom to remove shoes.|रीति-रिवाज|ਰੀਤ-ਰਿਵਾਜ',
  'heritage|The Golden Temple is part of our heritage.|विरासत|ਵਿਰਾਸਤ',

  'souvenir|I bought a souvenir for my mother.|यादगार भेंट|ਯਾਦਗਾਰੀ ਤੋਹਫ਼ਾ',
  'itinerary|Our itinerary includes three cities.|यात्रा कार्यक्रम|ਯਾਤਰਾ ਪ੍ਰੋਗਰਾਮ',
  'accommodation|Accommodation is expensive in summer.|ठहरने की व्यवस्था|ਰਿਹਾਇਸ਼',
  'journey|The journey took ten hours.|सफ़र|ਸਫ਼ਰ',
  'delay|There was a two-hour delay.|देरी|ਦੇਰੀ',
  'breathtaking|The view was breathtaking.|लाजवाब / साँस रोक देने वाला|ਲਾਜਵਾਬ',
  'crowded|The market was crowded.|भीड़-भाड़ वाला|ਭੀੜ ਵਾਲਾ',
  'unforgettable|It was an unforgettable trip.|अविस्मरणीय|ਅਭੁੱਲ']),
 B.rule('Talking about experiences',
  '<div class="rule"><b>Have you ever…?</b> → present perfect: <i>Have you ever been to Shimla?</i> — <i>Yes, I have. / No, never.</i><br>When you give details, switch to <b>past simple</b>: <i>I went there in 2022. We stayed for three days.</i><br><b>Adjectives with -ed / -ing:</b> The trip was <b>amazing</b>; I was <b>amazed</b>. The film was <b>boring</b>; I was <b>bored</b>.'+T('-ing = चीज़ कैसी है (boring); -ed = मैं कैसा महसूस करता हूँ (bored)।','-ing = ਚੀਜ਼ ਕਿਹੋ ਜਿਹੀ ਹੈ (boring); -ed = ਮੈਂ ਕਿਵੇਂ ਮਹਿਸੂਸ ਕਰਦਾ ਹਾਂ (bored)।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ I have been there last year → ✓ <b class="eng">I went there last year.</b> (finished time word → past simple)</div>'),
 B.text('Reading — A trip to Rajasthan','Travel story · B1',
  '<p>Last winter I travelled to Rajasthan with my cousins. We had never been to a desert before, so we were really excited. We took the night train from Chandigarh and arrived in Jaisalmer at ten the next morning. Although the journey was long, the view from the window was breathtaking. In the evening we rode camels across the sand dunes and watched the sun go down. After that we had dinner in a camp where musicians were singing folk songs. The night was freezing, but the stars were unforgettable. If I had more time, I would stay a week. I have already decided to go back next year.</p>'+
  T('पिछली सर्दियों में मैं चचेरे भाई-बहनों के साथ राजस्थान गया। हम पहली बार रेगिस्तान देखने गए। जैसलमेर में ऊँटों की सवारी की, सूर्यास्त देखा और लोकगीत सुने। रात ठंडी थी पर सितारे अविस्मरणीय थे। मैं अगले साल फिर जाऊँगा।','ਪਿਛਲੀਆਂ ਸਰਦੀਆਂ ਵਿੱਚ ਮੈਂ ਚਚੇਰੇ ਭੈਣ-ਭਰਾਵਾਂ ਨਾਲ ਰਾਜਸਥਾਨ ਗਿਆ। ਜੈਸਲਮੇਰ ਵਿੱਚ ਊਠ ਦੀ ਸਵਾਰੀ ਕੀਤੀ, ਸੂਰਜ ਛਿਪਦਾ ਵੇਖਿਆ ਅਤੇ ਲੋਕ ਗੀਤ ਸੁਣੇ। ਰਾਤ ਠੰਡੀ ਸੀ ਪਰ ਤਾਰੇ ਅਭੁੱਲ ਸਨ। ਮੈਂ ਅਗਲੇ ਸਾਲ ਫਿਰ ਜਾਵਾਂਗਾ।')),
 B.mcq('Questions on the text',[
  'How did the writer travel to Jaisalmer?|By plane;By night train;By bus|1|night train from Chandigarh.',
  'Had they visited a desert before?|Yes, often;No, never;Only once|1|had never been.',
  'What did they do in the evening?|Rode camels and watched the sunset;Visited a fort;Went shopping|0|camels, sunset.',
  'What will the writer do next year?|Stay at home;Go back;Visit Kerala|1|go back.']),
 B.mcq('Practice 1 — Choose the correct form',[
  'Have you ever ___ to Goa?|be;been;was|1|been (present perfect).|क्या तुम कभी गोवा गए हो?|ਕੀ ਤੂੰ ਕਦੇ ਗੋਆ ਗਿਆ ਹੈਂ?',
  'We ___ to Manali in 2021.|have gone;went;go|1|finished time → past simple.',
  'The film was so ___ that I fell asleep.|bored;boring;bore|1|-ing describes the film.',
  'I was ___ by the beauty of the Taj Mahal.|amazed;amazing;amaze|0|-ed = feeling.',
  'We had never ___ snow before.|see;saw;seen|2|past perfect.',

  'If I ___ more money, I would travel more.|have;had;would have|1|second conditional.',
  'The train was delayed ___ two hours.|since;for;during|1|for + period.']),
 B.gap('Practice 2 — Complete the sentences',[
  'I have ___ been to Europe. (not once)|never|मैं कभी यूरोप नहीं गया।|ਮੈਂ ਕਦੇ ਯੂਰਪ ਨਹੀਂ ਗਿਆ।',
  'We ___ (stay) in a small hotel last night.|stayed|हम कल रात एक छोटे होटल में रुके।|ਅਸੀਂ ਕੱਲ੍ਹ ਰਾਤ ਇੱਕ ਛੋਟੇ ਹੋਟਲ ਵਿੱਚ ਰੁਕੇ।',
  'The food was ___ (amaze). I loved it.|amazing|खाना लाजवाब था। मुझे बहुत पसंद आया।|ਖਾਣਾ ਲਾਜਵਾਬ ਸੀ। ਮੈਨੂੰ ਬਹੁਤ ਪਸੰਦ ਆਇਆ।',
  'I was very ___ (excite) about the trip.|excited|मैं यात्रा को लेकर बहुत उत्साहित था।|ਮੈਂ ਯਾਤਰਾ ਨੂੰ ਲੈ ਕੇ ਬਹੁਤ ਉਤਸ਼ਾਹਿਤ ਸੀ।',

  'Last year I visited Amritsar with my family. We travelled by car and arrived early in the morning. We had never seen the Golden Temple before, so we were deeply moved. The atmosphere was peaceful and the view was breathtaking. We ate langar with thousands of people and I was amazed by the volunteers. In the evening we watched the flag ceremony at Wagah border, which was crowded but exciting. It was an unforgettable trip, and I would love to go back.')

UNIT('b1_read','16','Exam practice','Reading Skills: Skimming, Scanning & Inference','पढ़ने के कौशल · ਪੜ੍ਹਨ ਦੇ ਹੁਨਰ',
'B1 reading tests ask for main ideas, details and the writer\'s attitude. Learn a three-step method and practise on two texts.',
'B1 reading में मुख्य विचार, विवरण और लेखक का रवैया पूछा जाता है। तीन चरणों की विधि सीखें और दो पाठों पर अभ्यास करें।',
'B1 reading ਵਿੱਚ ਮੁੱਖ ਵਿਚਾਰ, ਵੇਰਵੇ ਅਤੇ ਲੇਖਕ ਦਾ ਰਵੱਈਆ ਪੁੱਛਿਆ ਜਾਂਦਾ ਹੈ। ਤਿੰਨ ਕਦਮਾਂ ਦੀ ਵਿਧੀ ਸਿੱਖੋ ਅਤੇ ਦੋ ਪਾਠਾਂ ਤੇ ਅਭਿਆਸ ਕਰੋ।',[
 B.rule('Three-step method',
  '<div class="rule"><b>1. Skim</b> (30 seconds): read the title, first and last sentences. What is the text about?<br><b>2. Scan</b>: read the question, then look for key words (names, numbers, dates) in the text.<br><b>3. Check</b>: find the exact sentence that proves your answer. Do not use your own opinion.'+T('1. जल्दी पढ़ें 2. सवाल के keywords खोजें 3. प्रमाण वाला वाक्य ढूँढें। अपनी राय नहीं।','1. ਜਲਦੀ ਪੜ੍ਹੋ 2. ਸਵਾਲ ਦੇ keywords ਲੱਭੋ 3. ਸਬੂਤ ਵਾਲਾ ਵਾਕ ਲੱਭੋ। ਆਪਣੀ ਰਾਇ ਨਹੀਂ।')+'</div>'+
  '<div class="rule"><span class="lbl">True / False / Not given</span><b>True</b> = the text says it. <b>False</b> = the text says the opposite. <b>Not given</b> = the text does not say anything about it. Do not guess from your general knowledge.</div>'+
  '<div class="rule"><span class="lbl">Inference</span>Words like <b>seems, probably, suggests, apparently</b> show the writer is not 100% sure. Words like <b>always, never, all</b> in the answer options are often wrong.</div>'),
 B.text('Text 1 — Article: Why sleep matters','Reading · B1',
  '<p>Many students believe that staying awake all night before an exam is the best way to prepare. Research, however, suggests the opposite. When we sleep, the brain organises what we learnt during the day and stores it in long-term memory. Students who sleep for at least seven hours usually perform better than those who study until 3 a.m. Doctors recommend turning off screens an hour before bed because the blue light makes it harder to fall asleep. They also advise going to bed at the same time every night. Although the idea of a short nap in the afternoon is popular, experts warn that napping for more than thirty minutes can spoil your night\'s sleep.</p>'+
  T('कई छात्र मानते हैं कि परीक्षा से पहले रात भर जागना अच्छा है, लेकिन शोध उलटा कहता है। नींद में दिमाग सीखी हुई बातें व्यवस्थित कर दीर्घकालिक स्मृति में रखता है। सात घंटे की नींद बेहतर है; सोने से एक घंटा पहले स्क्रीन बंद करें; तीस मिनट से ज़्यादा झपकी न लें।','ਕਈ ਵਿਦਿਆਰਥੀ ਮੰਨਦੇ ਹਨ ਕਿ ਪ੍ਰੀਖਿਆ ਤੋਂ ਪਹਿਲਾਂ ਸਾਰੀ ਰਾਤ ਜਾਗਣਾ ਚੰਗਾ ਹੈ, ਪਰ ਖੋਜ ਉਲਟ ਕਹਿੰਦੀ ਹੈ। ਨੀਂਦ ਵਿੱਚ ਦਿਮਾਗ ਸਿੱਖੀਆਂ ਗੱਲਾਂ ਨੂੰ ਵਿਵਸਥਿਤ ਕਰ ਕੇ ਲੰਮੇ ਸਮੇਂ ਦੀ ਯਾਦ ਵਿੱਚ ਰੱਖਦਾ ਹੈ। ਸੱਤ ਘੰਟੇ ਦੀ ਨੀਂਦ ਚੰਗੀ ਹੈ; ਸੌਣ ਤੋਂ ਇੱਕ ਘੰਟਾ ਪਹਿਲਾਂ ਸਕਰੀਨ ਬੰਦ ਕਰੋ; ਤੀਹ ਮਿੰਟ ਤੋਂ ਵੱਧ ਝਪਕੀ ਨਾ ਲਓ।')),
 B.mcq('Questions on Text 1 — True / False / Not given',[
  'Staying awake all night is the best way to prepare.|True;False;Not given|1|The text says research suggests the opposite.',
  'The brain stores learning in long-term memory during sleep.|True;False;Not given|0|stated.',
  'Doctors say students should drink warm milk before bed.|True;False;Not given|2|not mentioned.',
  'A long nap in the afternoon is always helpful.|True;False;Not given|1|more than 30 minutes can spoil sleep.',
  'What is the main idea of the text?|Sleep helps learning;Exams are difficult;Screens are useful|0|sleep helps learning.',
  'The word "recommend" is closest to...|forbid;suggest;ignore|1|suggest.']),
 B.text('Text 2 — Notice','Reading · B1',
  '<p><b>CITY LIBRARY — NEW OPENING HOURS FROM 1 NOVEMBER</b><br>Monday to Friday: 9 a.m. – 8 p.m.<br>Saturday: 10 a.m. – 5 p.m.<br>Sunday: closed (except during exam season, 1 March – 15 April: 10 a.m. – 2 p.m.).<br>Students must show a valid ID card to borrow books. Books can be kept for 14 days and renewed once online. A fine of ₹5 per day is charged for late returns. Silence must be maintained in the reading rooms. Mobile phones should be on silent.</p>'+
  T('1 नवंबर से लाइब्रेरी का समय: सोम-शुक्र 9-8; शनि 10-5; रविवार बंद (परीक्षा के मौसम में 10-2)। किताब लेने के लिए ID कार्ड; 14 दिन; देर पर ₹5 प्रतिदिन जुर्माना।','1 ਨਵੰਬਰ ਤੋਂ ਲਾਇਬ੍ਰੇਰੀ ਦਾ ਸਮਾਂ: ਸੋਮ-ਸ਼ੁੱਕਰ 9-8; ਸਨਿੱਚਰ 10-5; ਐਤਵਾਰ ਬੰਦ (ਪ੍ਰੀਖਿਆ ਦੇ ਮੌਸਮ ਵਿੱਚ 10-2)। ਕਿਤਾਬ ਲਈ ID ਕਾਰਡ; 14 ਦਿਨ; ਦੇਰ ਤੇ ₹5 ਰੋਜ਼ ਜੁਰਮਾਨਾ।')),
 B.mcq('Questions on Text 2',[
  'When does the library close on Saturday?|2 p.m.;5 p.m.;8 p.m.|1|5 p.m.',
  'Is the library open on Sunday in March?|Yes, 10 a.m. – 2 p.m.;No, never;Yes, all day|0|exam season.',
  'How long can you keep a book?|7 days;14 days;30 days|1|14 days.',
  'What happens if you return a book late?|You pay a fine;You lose your card;Nothing|0|₹5 per day.',
  'What do you need to borrow a book?|A passport;A valid ID card;Money|1|ID card.']),
 B.pairs('Matching — words and meanings',['reluctant|not willing to do something','reliable|can be trusted','urgent|needs immediate action','obvious|easy to see or understand','fluent|able to speak smoothly and easily','vague|not clear or exact'])
]);

UNIT('b1_write','17','Exam practice','Writing: Emails, Letters and Opinion Essays','लिखना: ईमेल, पत्र और निबंध · ਲਿਖਣਾ: ਈਮੇਲ, ਪੱਤਰ ਅਤੇ ਲੇਖ',
'Learn the structure of a formal letter, an informal email and a short opinion essay, with model answers and phrases.',
'औपचारिक पत्र, अनौपचारिक ईमेल और छोटे निबंध की संरचना सीखें, नमूना उत्तर और वाक्यांशों के साथ।',
'ਰਸਮੀ ਪੱਤਰ, ਗੈਰ-ਰਸਮੀ ਈਮੇਲ ਅਤੇ ਛੋਟੇ ਲੇਖ ਦੀ ਬਣਤਰ ਸਿੱਖੋ, ਨਮੂਨਾ ਉੱਤਰਾਂ ਅਤੇ ਵਾਕਾਂਸ਼ਾਂ ਸਮੇਤ।',[
 B.rule('Structure and useful phrases',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Opening</th><th>Closing</th></tr></thead><tbody>'+
  '<tr><td class="g">Informal email</td><td class="e">Hi Amit, / Thanks for your email. / Hope you\'re well.</td><td class="n">Write soon! / Take care, / Love, Simran</td></tr>'+
  '<tr><td class="g">Formal letter</td><td class="e">Dear Sir or Madam, / Dear Mr Singh, I am writing to…</td><td class="n">I look forward to hearing from you. Yours faithfully, (Dear Sir/Madam) / Yours sincerely, (Dear Mr Singh)</td></tr>'+
  '<tr><td class="g">Opinion essay</td><td class="e">Nowadays many people think that… In this essay I will discuss…</td><td class="n">To sum up, … In my opinion, …</td></tr>'+
  '</tbody></table></div>'+
  T('Dear Sir/Madam → Yours faithfully; Dear Mr Singh → Yours sincerely। औपचारिक पत्र में I\'m, don\'t जैसे संक्षिप्त रूप नहीं।','Dear Sir/Madam → Yours faithfully; Dear Mr Singh → Yours sincerely। ਰਸਮੀ ਪੱਤਰ ਵਿੱਚ I\'m, don\'t ਵਰਗੇ ਛੋਟੇ ਰੂਪ ਨਹੀਂ।')+
  '<div class="rule"><span class="lbl">Complaint letter phrases</span>I am writing to complain about… · Unfortunately, … · I would like to request a refund. · I would be grateful if you could… · I look forward to your reply.</div>'+
