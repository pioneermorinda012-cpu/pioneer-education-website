<style>
/* ============================================================
   GLEIS A1  —  design tokens
   Visual language: German rail & post signage.
   Enamel white boards, signal yellow, signage blue, ink black.
============================================================ */
:root{
  --ink:#101820;
  --ink-soft:#2C3844;
  --enamel:#E9EBE7;
  --enamel-dim:#DADDD6;
  --board:#151B22;
  --signal:#FF6A2B;
  --signal-dim:#C43000;
  --rail:#0E5C4A;
  --rail-light:#3A7CC4;
  --rot:#B8202E;
  --gruen:#1F7A5A;
  --paper:#FBFBF9;

  --sans:"Arial Narrow","Helvetica Neue Condensed","Liberation Sans Narrow",
         "Helvetica Neue",Arial,sans-serif;
  --sans-w:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;

  --rad:3px;
  --shadow:0 1px 0 rgba(16,24,32,.10), 0 2px 10px rgba(16,24,32,.06);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--enamel); color:var(--ink);
  font-family:var(--serif); font-size:17px; line-height:1.62;
}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- signage type ---------- */
.sig{
  font-family:var(--sans-w); font-weight:800;
  text-transform:uppercase; letter-spacing:.09em;
}
.mono{font-family:var(--mono)}

/* ============================================================
   BOARD HEADER  (signature element: departure board)
============================================================ */
header.board{
  background:var(--board); color:var(--enamel);
  border-bottom:5px solid var(--signal);
  padding:14px 20px 12px;
  position:sticky; top:0; z-index:60;
}
.board-top{
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  max-width:1180px; margin:0 auto;
}
.brand{
  font-family:var(--sans-w); font-weight:800; letter-spacing:.16em;
  text-transform:uppercase; font-size:19px; color:var(--signal);
}
.brand span{color:var(--enamel)}
.board-sub{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:#8A96A3;
}
.board-strip{
  max-width:1180px; margin:10px auto 0;
  display:grid; grid-template-columns:64px 1fr auto;
  gap:14px; align-items:center;
  background:#0A0E13; border:1px solid #232C36; border-radius:var(--rad);
  padding:9px 13px;
}
.gleis-no{
  font-family:var(--mono); font-weight:700; font-size:24px;
  color:var(--board); background:var(--signal);
  text-align:center; border-radius:2px; padding:3px 0; line-height:1.2;
}
.strip-title{
  font-family:var(--sans-w); font-weight:700; font-size:16px;
  letter-spacing:.03em; color:var(--enamel);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.strip-title small{
  display:block; font-weight:500; font-size:11.5px; letter-spacing:.13em;
  text-transform:uppercase; color:#7C8896; margin-top:1px;
}
.flip{animation:flip .34s ease}
@keyframes flip{
  0%{opacity:0; transform:translateY(-7px) scaleY(.7)}
  100%{opacity:1; transform:none}
}
.xp-pod{
  font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  color:var(--signal); text-align:right; white-space:nowrap;
}
.xp-pod b{font-size:17px; display:block; color:#fff}

/* ============================================================
   LAYOUT
============================================================ */
.wrap{
  max-width:1180px; margin:0 auto; padding:0 20px 90px;
  display:grid; grid-template-columns:262px 1fr; gap:30px;
  align-items:start;
}

/* ---------- Fahrplan sidebar ---------- */
nav.fahrplan{
  position:sticky; top:132px; max-height:calc(100vh - 156px);
  overflow-y:auto; padding:22px 0 30px;
}
.fp-head{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--ink-soft);
  border-bottom:2px solid var(--ink); padding-bottom:6px; margin-bottom:4px;
  display:flex; justify-content:space-between;
}
.fp-kat{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em;
  text-transform:uppercase; color:#78838F;
  margin:16px 0 4px; padding-left:2px;
}
.fp-item{
  display:grid; grid-template-columns:30px 1fr 30px; gap:8px;
  align-items:center; width:100%; text-align:left;
  background:none; border:0; border-bottom:1px solid var(--enamel-dim);
  padding:8px 2px; cursor:pointer; line-height:1.28;
}
.fp-item:hover{background:#E0E3DD}
.fp-item.on{background:var(--ink); color:var(--enamel)}
.fp-item.on .fp-g{color:var(--signal)}
.fp-g{font-family:var(--mono); font-size:12px; color:#78838F; font-weight:700}
.fp-t{font-family:var(--sans-w); font-size:13.5px; font-weight:600; letter-spacing:.01em}
.fp-t em{
  display:block; font-style:normal; font-size:10.5px; font-weight:500;
  color:#78838F; letter-spacing:.04em;
}
.fp-item.on .fp-t em{color:#9AA6B2}
.fp-dot{
  width:12px; height:12px; border-radius:50%; justify-self:end;
  border:2px solid #B6BCB4; background:transparent;
}
.fp-dot.part{background:var(--signal); border-color:var(--signal-dim)}
.fp-dot.done{background:var(--gruen); border-color:var(--gruen)}

/* ---------- main ---------- */
main{padding:26px 0 0; min-width:0}

.station-head{margin-bottom:26px}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--rail); margin-bottom:7px;
}
h1{
  font-family:var(--sans-w); font-weight:800; font-size:clamp(28px,4.6vw,42px);
  line-height:1.06; letter-spacing:-.015em; margin:0 0 6px;
}
h1 .en{
  display:block; font-size:15px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:#6E7A86; margin-top:9px;
}
.lead{
  font-size:17.5px; color:var(--ink-soft); max-width:60ch; margin:14px 0 0;
  border-left:4px solid var(--signal); padding-left:15px;
}

.blk{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-radius:var(--rad); box-shadow:var(--shadow);
  margin:22px 0; overflow:hidden;
}
.blk-head{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--ink); color:var(--enamel); padding:9px 16px;
}
.blk-head .tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em;
  text-transform:uppercase; background:var(--signal); color:var(--ink);
  padding:2px 7px; border-radius:2px; font-weight:700;
}
.blk-head .tag.gram{background:var(--rail-light); color:#fff}
.blk-head .tag.ueb{background:var(--gruen); color:#fff}
.blk-head h2{
  font-family:var(--sans-w); font-weight:700; font-size:15.5px;
  letter-spacing:.03em; margin:0;
}
.blk-body{padding:18px 18px 20px}
.blk-body>*:first-child{margin-top:0}
.blk-body>*:last-child{margin-bottom:0}

h3{
  font-family:var(--sans-w); font-weight:700; font-size:14.5px;
  letter-spacing:.05em; text-transform:uppercase;
  margin:22px 0 9px; color:var(--rail);
}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px; padding-left:22px}
li{margin-bottom:5px}
b,strong{color:var(--ink)}
.de{font-weight:700; color:var(--rail)}
.en-i{color:#6E7A86; font-style:italic}

/* rule / grammar callout */
.rule{
  background:#F3F5F8; border-left:4px solid var(--rail);
  padding:13px 16px; margin:14px 0; border-radius:0 var(--rad) var(--rad) 0;
}
.rule .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--rail); display:block; margin-bottom:5px;
}
.warn{background:#FFF8E4; border-left-color:var(--signal-dim)}
.warn .lbl{color:var(--signal-dim)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto; margin:14px 0; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:15.5px; min-width:340px}
th{
  font-family:var(--mono); font-size:10px; letter-spacing:.15em;
  text-transform:uppercase; text-align:left; color:#fff; background:var(--ink-soft);
  padding:7px 11px; font-weight:600; white-space:nowrap;
}
td{padding:7px 11px; border-bottom:1px solid var(--enamel-dim); vertical-align:top}
tbody tr:nth-child(even){background:#F5F6F3}
td.g{font-family:var(--sans-w); font-weight:700; color:var(--rail); white-space:nowrap}
td.e{color:var(--ink-soft)}
td.n{font-size:13.5px; color:#78838F; font-style:italic}

/* speak button */
.spk{
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  width:26px; height:24px; cursor:pointer; padding:0; line-height:1;
  color:var(--rail); font-size:13px; vertical-align:middle;
}
.spk:hover{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.spk:active{transform:translateY(1px)}

/* ---------- dialog ---------- */
.dlg{margin:14px 0}
.dlg-row{
  display:grid; grid-template-columns:78px 1fr auto; gap:11px;
  padding:8px 0; border-bottom:1px dashed var(--enamel-dim); align-items:start;
}
.dlg-who{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--rail); padding-top:3px; font-weight:700;
}
.dlg-de{font-weight:600}
.dlg-en{display:block; font-size:14px; color:#78838F; font-style:italic; font-weight:400}

/* ---------- reading text / sign ---------- */
.lesetext{
  background:#fff; border:1px solid var(--enamel-dim);
  border-top:4px solid var(--ink); padding:16px 18px; margin:14px 0;
  font-size:16.5px;
}
.lesetext .meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  color:#78838F; text-transform:uppercase; margin-bottom:9px;
  border-bottom:1px solid var(--enamel-dim); padding-bottom:7px;
}
.schild{
  background:var(--rail); color:#fff; border:3px solid #fff;
  outline:2px solid var(--rail); border-radius:var(--rad);
  padding:16px 18px; margin:12px 0; text-align:center;
  font-family:var(--sans-w); font-weight:700; letter-spacing:.05em; font-size:18px;
}
.schild.gelb{background:var(--signal); color:var(--ink); outline-color:var(--signal-dim)}

/* ============================================================
   EXERCISES
============================================================ */
.ex{margin:6px 0 0}
.ex-bar{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  flex-wrap:wrap; margin-bottom:12px; padding-bottom:9px;
  border-bottom:2px solid var(--ink);
}
.ex-count{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:#78838F;
}
.q{
  padding:13px 0; border-bottom:1px solid var(--enamel-dim);
}
.q:last-of-type{border-bottom:0}
.q-txt{margin-bottom:9px; font-size:16.5px}
.q-no{
  font-family:var(--mono); font-size:12px; color:#98A2AC;
  margin-right:9px; font-weight:700;
}
.q-en{display:block; font-size:13.5px; color:#8A939C; font-style:italic; margin-top:3px}

.opts{display:flex; flex-direction:column; gap:7px; max-width:640px}
.opt{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 13px; cursor:pointer; font-family:var(--serif); font-size:16px;
  transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--rail); background:#F3F7FC}
.opt:disabled{cursor:default}
.opt .key{
  font-family:var(--mono); font-size:11px; font-weight:700; color:#98A2AC;
  border:1px solid var(--enamel-dim); border-radius:2px;
  width:21px; height:21px; display:grid; place-items:center; flex:none;
}
.opt.right{border-color:var(--gruen); background:#EAF6F1}
.opt.right .key{background:var(--gruen); color:#fff; border-color:var(--gruen)}
.opt.wrong{border-color:var(--rot); background:#FBEDEE}
.opt.wrong .key{background:var(--rot); color:#fff; border-color:var(--rot)}

.inrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
input.gap{
  border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:8px 11px; font-family:var(--serif); font-size:16px; background:#fff;
  min-width:190px; flex:1 1 190px; max-width:340px;
}
input.gap:focus{outline:2px solid var(--rail); outline-offset:0; border-color:var(--rail)}
input.gap.right{border-color:var(--gruen); background:#EAF6F1}
input.gap.wrong{border-color:var(--rot); background:#FBEDEE}
.btn{
  font-family:var(--sans-w); font-weight:700; font-size:12.5px;
  letter-spacing:.09em; text-transform:uppercase;
  background:var(--ink); color:var(--enamel); border:0; border-radius:var(--rad);
  padding:9px 16px; cursor:pointer;
}
.btn:hover{background:var(--rail)}
.btn:active{transform:translateY(1px)}
.btn.gelb{background:var(--signal); color:var(--ink)}
.btn.gelb:hover{background:var(--signal-dim)}
.btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink); color:var(--enamel)}
.btn.sm{padding:6px 11px; font-size:11px}

.umlaut{display:flex; gap:4px; flex-wrap:wrap; margin:8px 0}
.umlaut button{
  font-family:var(--serif); font-size:15px; width:32px; height:30px;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px; cursor:pointer;
}
.umlaut button:hover{background:var(--signal); border-color:var(--signal-dim)}

.fb{
  margin-top:8px; font-size:14.5px; padding:7px 11px; border-radius:var(--rad);
  display:none;
}
.fb.show{display:block}
.fb.ok{background:#EAF6F1; color:#14513C; border-left:3px solid var(--gruen)}
.fb.no{background:#FBEDEE; color:#7C1620; border-left:3px solid var(--rot)}

/* word ordering */
.pool,.slot{
  display:flex; flex-wrap:wrap; gap:6px; min-height:44px; padding:8px;
  border-radius:var(--rad);
}
.slot{border:2px dashed var(--rail); background:#F3F7FC; margin-bottom:7px}
.pool{border:1px solid var(--enamel-dim); background:#fff}
.word{
  font-family:var(--serif); font-size:16px; background:var(--ink); color:var(--enamel);
  border:0; border-radius:2px; padding:6px 11px; cursor:pointer;
}
.word:hover{background:var(--rail)}
.slot .word{background:var(--signal); color:var(--ink)}
.slot .word:hover{background:var(--signal-dim)}

/* matching pairs */
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:620px}
.pcol{display:flex; flex-direction:column; gap:6px}
.pbtn{
  background:#fff; border:1.5px solid var(--enamel-dim); border-radius:var(--rad);
  padding:9px 12px; cursor:pointer; text-align:left; font-family:var(--serif); font-size:15.5px;
}
.pbtn:hover:not(:disabled){border-color:var(--rail)}
.pbtn.sel{background:var(--rail); color:#fff; border-color:var(--rail)}
.pbtn.done{background:#EAF6F1; border-color:var(--gruen); color:#14513C; cursor:default; opacity:.72}
.pbtn.miss{border-color:var(--rot); animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* dictation */
.dikt-row{display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-bottom:8px}
.big-spk{
  background:var(--rail); color:#fff; border:0; border-radius:var(--rad);
  padding:9px 15px; cursor:pointer; font-family:var(--sans-w); font-weight:700;
  font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
}
.big-spk:hover{background:var(--rail-light)}
.speed{
  font-family:var(--mono); font-size:11px; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:7px 9px; cursor:pointer;
}

/* writing */
textarea.schreib{
  width:100%; min-height:150px; border:1.5px solid var(--enamel-dim);
  border-radius:var(--rad); padding:12px; font-family:var(--serif); font-size:16px;
  background:#fff; resize:vertical; line-height:1.6;
}
textarea.schreib:focus{outline:2px solid var(--rail); border-color:var(--rail)}
.muster{
  display:none; background:#F3F5F8; border-left:4px solid var(--gruen);
  padding:13px 16px; margin-top:12px; white-space:pre-wrap; font-size:16px;
}
.muster.show{display:block}
.checklist{list-style:none; padding:0; margin:10px 0}
.checklist li{
  padding-left:24px; position:relative; font-size:15.5px; margin-bottom:6px;
}
.checklist li::before{
  content:"□"; position:absolute; left:0; color:var(--rail);
  font-size:17px; line-height:1;
}

/* flashcards */
.fc-stage{display:flex; flex-direction:column; align-items:center; gap:14px}
.card{
  width:100%; max-width:430px; min-height:170px; background:var(--ink);
  color:var(--enamel); border-radius:var(--rad); display:grid; place-items:center;
  text-align:center; padding:26px 20px; cursor:pointer; box-shadow:var(--shadow);
}
.card .face{font-family:var(--sans-w); font-weight:700; font-size:26px; letter-spacing:.01em}
.card .back{font-size:19px; color:var(--signal); margin-top:9px; font-family:var(--serif)}
.card .hint{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:#7C8896; margin-top:13px;
}

/* score panel */
.score{
  margin-top:16px; background:var(--ink); color:var(--enamel);
  border-radius:var(--rad); padding:14px 17px;
  display:flex; justify-content:space-between; align-items:center; gap:13px; flex-wrap:wrap;
}
.score .num{font-family:var(--mono); font-size:26px; color:var(--signal); font-weight:700}
.score .lbl{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3;
}

/* footer nav */
.stepper{
  display:flex; justify-content:space-between; gap:12px; margin:34px 0 0;
  padding-top:20px; border-top:3px solid var(--ink);
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%,90px);
  background:var(--ink); color:var(--signal); font-family:var(--mono);
  font-size:13px; letter-spacing:.06em; padding:11px 20px; border-radius:var(--rad);
  z-index:200; transition:transform .26s ease; box-shadow:0 6px 24px rgba(0,0,0,.25);
}
#toast.up{transform:translate(-50%,0)}

/* mobile drawer button */
.menu-btn{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr; gap:0; padding:0 15px 80px}
  nav.fahrplan{
    position:fixed; inset:0 auto 0 0; width:288px; background:var(--enamel);
    z-index:90; transform:translateX(-102%); transition:transform .24s ease;
    box-shadow:6px 0 24px rgba(0,0,0,.2); padding:18px 16px 40px;
    max-height:none; overflow-y:auto;
  }
  nav.fahrplan.open{transform:none}
  .menu-btn{
    display:inline-block; background:var(--signal); color:var(--ink); border:0;
    font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; padding:8px 13px; border-radius:var(--rad); cursor:pointer;
  }
  .scrim{
    display:none; position:fixed; inset:0; background:rgba(16,24,32,.5); z-index:80;
  }
  .scrim.on{display:block}
  .pairs{grid-template-columns:1fr}
  body{font-size:16px}
  .board-strip{grid-template-columns:52px 1fr; gap:11px}
  .xp-pod{grid-column:1/-1; text-align:left; border-top:1px solid #232C36; padding-top:6px}
  .xp-pod b{display:inline; font-size:14px}
  .dlg-row{grid-template-columns:1fr}
  .dlg-who{padding-top:0}
}
/* ============================================================
   HOME / LEVEL SELECT
============================================================ */
.home-head{margin:26px 0 24px}
.home-head h1{margin-bottom:10px}
.resume{
  display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  background:var(--ink); color:var(--enamel); border-left:6px solid var(--signal);
  border-radius:var(--rad); padding:16px 18px; margin:0 0 26px; cursor:pointer;
  box-shadow:var(--shadow); width:100%; text-align:left; border-top:0;border-right:0;border-bottom:0;
}
.resume:hover{background:#1B2husk}
.resume:hover{background:#1A2430}
.resume .rg{
  font-family:var(--mono); font-weight:700; font-size:26px; color:var(--ink);
  background:var(--signal); border-radius:2px; padding:6px 11px; line-height:1.1;
}
.resume .rt{font-family:var(--sans-w); font-weight:700; font-size:17px; letter-spacing:.02em}
.resume .rt small{
  display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.16em;
  text-transform:uppercase; color:#8A96A3; margin-bottom:4px; font-weight:500;
}
.resume .ra{
  font-family:var(--sans-w); font-weight:800; font-size:12px; letter-spacing:.1em;
  text-transform:uppercase; color:var(--signal); white-space:nowrap;
}

.lvl-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin:0 0 30px}
.lvl-card{
  background:var(--paper); border:1px solid var(--enamel-dim); border-top:5px solid var(--rail);
  border-radius:var(--rad); padding:18px 18px 16px; text-align:left; cursor:pointer;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px;
  transition:transform .12s, box-shadow .12s;
}
.lvl-card:hover{transform:translateY(-2px); box-shadow:0 4px 18px rgba(16,24,32,.13)}
.lvl-card.l2{border-top-color:#1B4D89}
.lvl-card.l3{border-top-color:#C43000}
.lvl-card.l4{border-top-color:#8C2200}
.lvl-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px}
.lvl-code{
  font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--rail); font-weight:700;
}
.lvl-card.l2 .lvl-code{color:#1B4D89}
.lvl-card.l3 .lvl-code{color:#C43000}
.lvl-card.l4 .lvl-code{color:#8C2200}
.lvl-name{
  font-family:var(--sans-w); font-weight:800; font-size:20px; letter-spacing:-.01em;
  line-height:1.15; margin:2px 0 0;
}
.lvl-name em{
  display:block; font-style:normal; font-size:12px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:#78838F; margin-top:4px;
}
.lvl-desc{font-size:15px; color:var(--ink-soft); margin:0}
.lvl-meta{
  font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:#78838F;
  border-top:1px solid var(--enamel-dim); padding-top:9px; margin-top:auto;
  display:flex; justify-content:space-between; gap:10px;
}
.ring{width:52px; height:52px; flex:none; position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{
  position:absolute; inset:0; display:grid; place-items:center;
  font-family:var(--mono); font-size:12px; font-weight:700; color:var(--ink);
}
.lvl-stations{display:flex; flex-wrap:wrap; gap:4px}
.lvl-chip{
  font-family:var(--mono); font-size:10.5px; font-weight:700; color:#78838F;
  border:1px solid var(--enamel-dim); background:#fff; border-radius:2px;
  padding:2px 6px; line-height:1.5;
}
.lvl-chip.part{background:var(--signal); border-color:var(--signal-dim); color:var(--ink)}
.lvl-chip.done{background:var(--gruen); border-color:var(--gruen); color:#fff}

.home-tools{display:flex; gap:11px; flex-wrap:wrap; margin-bottom:30px}

/* placement test */
.place{
  background:var(--paper); border:1px solid var(--enamel-dim);
  border-left:5px solid var(--signal); border-radius:var(--rad);
  padding:18px; box-shadow:var(--shadow); margin-bottom:30px;
}
.place h3{margin-top:0}
.place-result{
  background:var(--ink); color:var(--enamel); border-radius:var(--rad);
  padding:16px 18px; margin-top:14px;
}
.place-result b{color:var(--signal); font-size:19px; display:block; margin-bottom:5px;
  font-family:var(--sans-w); letter-spacing:.02em}

/* level badge in sidebar + station head */
.fp-lvl{
  display:flex; justify-content:space-between; align-items:center;
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase;
  color:#fff; background:var(--rail); padding:4px 8px; border-radius:2px;
  margin:16px 0 5px;
}
.fp-lvl.l2{background:#1B4D89}
.fp-lvl.l3{background:#C43000}
.fp-lvl.l4{background:#8C2200}
.home-btn{
  background:transparent; border:1.5px solid #3A4653; color:var(--enamel);
  font-family:var(--sans-w); font-weight:700; font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 12px; border-radius:var(--rad); cursor:pointer;
}
.home-btn:hover{background:var(--signal); color:var(--ink); border-color:var(--signal)}

@media (max-width:900px){
  .lvl-grid{grid-template-columns:1fr}
  .resume{grid-template-columns:auto 1fr; gap:12px}
  .resume .ra{grid-column:1/-1}
}

@media print{
  nav.fahrplan,.stepper,header.board{display:none}
  .wrap{grid-template-columns:1fr}
  .blk{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important; transition:none!important}
}

.board-top{display:flex; align-items:center; gap:14px; max-width:1180px; margin:0 auto}

.bname{

  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;

.levelchip{

 B.rule('Form: was / were + verb-ing',

  P('Hindi/Punjabi: "मैं खा रहा था" = <b class="eng">I was eating</b>. The long action is in the <b>past continuous</b>; the short, interrupting action is in the <b>past simple</b>: <b class="eng">I was eating when the phone rang.</b>','"मैं खा रहा था" = I was eating। लंबी चलती क्रिया past continuous में; बीच में आने वाली छोटी क्रिया past simple में।','"ਮੈਂ ਖਾ ਰਿਹਾ ਸੀ" = I was eating। ਲੰਮੀ ਚੱਲ ਰਹੀ ਕਿਰਿਆ past continuous ਵਿੱਚ; ਵਿਚਕਾਰ ਆਉਣ ਵਾਲੀ ਛੋਟੀ ਕਿਰਿਆ past simple ਵਿੱਚ।')+

UNIT('a2_pp','03','Past & Future','Present Perfect: have / has + past participle','पूर्ण वर्तमान काल · ਪੂਰਨ ਵਰਤਮਾਨ ਕਾਲ',
'The present perfect connects the past with now. It is used for experience ("I have been to Delhi"), recent news and unfinished time ("for / since").',

 B.rule('Form & participles',
  '<div class="tbl-wrap"><table><thead><tr><th>Positive</th><th>Negative</th><th>Question</th></tr></thead><tbody>'+

  '<tr><td class="e">She <b>has finished</b>.</td><td class="e">She <b>hasn\'t finished</b>.</td><td class="e"><b>Has</b> she finished?</td></tr>'+
  '</tbody></table></div>'+
  P('Regular verbs: past participle = <b>-ed</b> (worked). Irregular: <b>go → gone / been, see → seen, eat → eaten, do → done, write → written, take → taken, give → given, break → broken, know → known, buy → bought, have → had, make → made</b>.','Regular verbs में past participle = -ed। Irregular का तीसरा रूप (V3) याद करें: go → gone/been, see → seen, eat → eaten, do → done, write → written।','Regular verbs ਵਿੱਚ past participle = -ed। Irregular ਦਾ ਤੀਜਾ ਰੂਪ (V3) ਯਾਦ ਕਰੋ: go → gone/been, see → seen, eat → eaten, do → done, write → written।')+
  '<h3>Uses</h3>'+
  '<div class="tbl-wrap"><table><thead><tr><th>Use</th><th>Example</th><th>Key words</th></tr></thead><tbody>'+

  '</tbody></table></div>'+
  '<div class="rule"><span class="lbl">for vs since</span><b>for</b> + length of time: for two hours, for five years. &nbsp; <b>since</b> + starting point: since Monday, since 2020, since I was a child.'+T('for = कितने समय से (दो साल से); since = कब से (2020 से)।','for = ਕਿੰਨੇ ਸਮੇਂ ਤੋਂ (ਦੋ ਸਾਲ ਤੋਂ); since = ਕਦੋਂ ਤੋਂ (2020 ਤੋਂ)।')+'</div>'+
  '<div class="rule warn"><span class="lbl">Present perfect or past simple?</span>Finished time word (yesterday, last week, in 2019) → <b>past simple</b>: <i>I saw him yesterday.</i> No time word / time not finished → <b>present perfect</b>: <i>I have seen him.</i> ✗ <i>I have seen him yesterday.</i><br><b>been</b> = went and came back (<i>I have been to Delhi</i>); <b>gone</b> = is still there (<i>He has gone to Delhi</i>).'+T('"yesterday, last week" जैसे बीते समय के साथ present perfect नहीं लगता।','"yesterday, last week" ਵਰਗੇ ਬੀਤੇ ਸਮੇਂ ਨਾਲ present perfect ਨਹੀਂ ਲੱਗਦਾ।')+'</div>'),

UNIT('a2_fut','04','Past & Future','Talking about the Future: will, going to & Present Continuous','भविष्य की बात: will, going to · ਭਵਿੱਖ ਦੀ ਗੱਲ: will, going to',
'English has three common ways to talk about the future. Each has a different meaning: decisions now, plans, and arrangements.',
'अंग्रेज़ी में भविष्य के तीन आम तरीके हैं। हर का अर्थ अलग है: अभी लिया निर्णय, पहले से बनी योजना, और तय कार्यक्रम।',
'ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ ਭਵਿੱਖ ਦੇ ਤਿੰਨ ਆਮ ਤਰੀਕੇ ਹਨ। ਹਰ ਇੱਕ ਦਾ ਅਰਥ ਵੱਖਰਾ ਹੈ: ਹੁਣੇ ਲਿਆ ਫ਼ੈਸਲਾ, ਪਹਿਲਾਂ ਬਣੀ ਯੋਜਨਾ, ਅਤੇ ਤੈਅ ਪ੍ਰੋਗਰਾਮ।',[
 B.rule('will, going to, present continuous',
  '<div class="tbl-wrap"><table><thead><tr><th>Form</th><th>Use</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">will + verb</td><td class="e">decision made now, promise, offer, prediction (opinion)</td><td class="n">I\'ll help you. / It will rain tomorrow, I think. / I will call you.</td></tr>'+
  '<tr><td class="g">am/is/are going to + verb</td><td class="e">plan or intention already decided; prediction with evidence</td><td class="n">I\'m going to study abroad. / Look at those clouds! It\'s going to rain.</td></tr>'+
  '<tr><td class="g">am/is/are + verb-ing</td><td class="e">fixed arrangement (time and place fixed)</td><td class="n">I\'m meeting the doctor at 5 p.m. tomorrow.</td></tr>'+
  '</tbody></table></div>'+
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>will</th><th>going to</th></tr></thead><tbody>'+
  '<tr><td class="g">Positive</td><td class="e">I will go. (I\'ll go)</td><td class="e">I am going to go.</td></tr>'+
  '<tr><td class="g">Negative</td><td class="e">I won\'t go. (will not)</td><td class="e">I\'m not going to go.</td></tr>'+
  '<tr><td class="g">Question</td><td class="e">Will you go?</td><td class="e">Are you going to go?</td></tr>'+
  '</tbody></table></div>'+
  T('अभी निर्णय लिया: "ठीक है, मैं मदद करूँगा" = I\'ll help. पहले से योजना: "मैं विदेश पढ़ने जाने वाला हूँ" = I\'m going to study abroad।','ਹੁਣੇ ਫ਼ੈਸਲਾ ਕੀਤਾ: "ਠੀਕ ਹੈ, ਮੈਂ ਮਦਦ ਕਰਾਂਗਾ" = I\'ll help। ਪਹਿਲਾਂ ਦੀ ਯੋਜਨਾ: "ਮੈਂ ਵਿਦੇਸ਼ ਪੜ੍ਹਨ ਜਾਣ ਵਾਲਾ ਹਾਂ" = I\'m going to study abroad।')+
  '<div class="rule"><span class="lbl">Time words</span><b class="eng">tomorrow, next week / month / year, soon, in two days, tonight, this evening, in the future</b></div>'+
  '<div class="rule warn"><span class="lbl">Careful</span>✗ I will going to go. ✗ I am going to went. ✓ <b class="eng">I am going to go.</b> After <i>if / when / as soon as</i> do <b>not</b> use will: ✗ If it will rain… ✓ <b class="eng">If it rains, I will stay home.</b></div>'),
 B.mcq('Practice 1 — will or going to?',[
  'The phone is ringing. — I ___ answer it.|am going to;will;am answering|1|decision now → will.|फ़ोन बज रहा है — मैं उठाता हूँ।|ਫ਼ੋਨ ਵੱਜ ਰਿਹਾ ਹੈ — ਮੈਂ ਚੁੱਕਦਾ ਹਾਂ।',
  'I have decided. I ___ buy a new bike next month.|will;am going to;buy|1|plan → going to.',

  'I ___ meet my teacher at 4 p.m. tomorrow. (fixed)|am meeting;will meeting;meet|0|arrangement → present continuous.',
  'Don\'t worry. I ___ help you.|am going to;will;help|1|offer → will.',
  'He ___ come to the party. He is ill.|isn\'t going to;won\'t going;not will|0|negative.',
  '___ you going to study abroad?|Will;Are;Do|1|Are you going to…?',
  'If it rains, we ___ at home.|stay;will stay;are staying|1|if-clause → will in result clause.']),
 B.gap('Practice 2 — Complete',[

UNIT('a2_comp','05','Grammar','Comparatives, Superlatives, as … as, too & enough','तुलना: comparative और superlative · ਤੁਲਨਾ: comparative ਅਤੇ superlative',
'Compare people, places and things. Learn all the rules for short and long adjectives, plus useful patterns like "as … as", "too" and "enough".',
'लोगों, जगहों और चीज़ों की तुलना करना सीखें — छोटे-लंबे विशेषण के नियम, साथ में "as … as", "too" और "enough"।',
'ਲੋਕਾਂ, ਥਾਵਾਂ ਅਤੇ ਚੀਜ਼ਾਂ ਦੀ ਤੁਲਨਾ ਕਰਨਾ ਸਿੱਖੋ — ਛੋਟੇ-ਲੰਮੇ ਵਿਸ਼ੇਸ਼ਣਾਂ ਦੇ ਨਿਯਮ, ਨਾਲ "as … as", "too" ਅਤੇ "enough"।',[
 B.rule('Rules',
  '<div class="tbl-wrap"><table><thead><tr><th>Type</th><th>Comparative</th><th>Superlative</th></tr></thead><tbody>'+
  '<tr><td class="g">1 syllable: tall, cold, fast</td><td class="e">taller, colder, faster</td><td class="e">the tallest, the coldest, the fastest</td></tr>'+
  '<tr><td class="g">ends in e: nice, large</td><td class="e">nicer, larger</td><td class="e">the nicest, the largest</td></tr>'+
  '<tr><td class="g">1 vowel + 1 consonant: big, hot</td><td class="e">bigger, hotter</td><td class="e">the biggest, the hottest</td></tr>'+
  '<tr><td class="g">consonant + y: easy, happy</td><td class="e">easier, happier</td><td class="e">the easiest, the happiest</td></tr>'+
  '<tr><td class="g">2+ syllables: beautiful, expensive</td><td class="e">more beautiful, more expensive</td><td class="e">the most beautiful, the most expensive</td></tr>'+
  '<tr><td class="g">irregular</td><td class="e">good → better, bad → worse, far → farther/further, little → less, much → more</td><td class="e">the best, the worst, the farthest, the least, the most</td></tr>'+
  '</tbody></table></div>'+
  P('Use <b class="eng">than</b> after a comparative: <i>Delhi is bigger <b>than</b> Chandigarh.</i> Use <b class="eng">the</b> before a superlative: <i>She is <b>the</b> youngest in the class.</i> Use <b class="eng">in</b> + place / group: <i>the tallest <b>in</b> the family</i>; use <b class="eng">of</b> + plural: <i>the best <b>of</b> all</i>.','comparative के बाद than; superlative से पहले the। group/जगह के साथ in (the tallest in the class), plural के साथ of।','comparative ਤੋਂ ਬਾਅਦ than; superlative ਤੋਂ ਪਹਿਲਾਂ the। group/ਥਾਂ ਨਾਲ in (the tallest in the class), plural ਨਾਲ of।')+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ more better ✗ most best ✗ more cheaper ✗ taller from ✓ <b class="eng">better, the best, cheaper, taller than</b></div>'),
 B.rule('as … as, not as … as, too, enough',
  '<div class="tbl-wrap"><table><thead><tr><th>Pattern</th><th>Meaning</th><th>Example</th></tr></thead><tbody>'+
  '<tr><td class="g">as + adjective + as</td><td class="e">equal</td><td class="n">She is as tall as her brother.</td></tr>'+
  '<tr><td class="g">not as + adjective + as</td><td class="e">less than</td><td class="n">This phone isn\'t as expensive as that one.</td></tr>'+
  '<tr><td class="g">too + adjective</td><td class="e">more than needed (negative)</td><td class="n">It\'s too hot to go out. (✗ very hot to)</td></tr>'+
  '<tr><td class="g">adjective + enough</td><td class="e">sufficient</td><td class="n">He is old enough to drive.</td></tr>'+
  '<tr><td class="g">enough + noun</td><td class="e">sufficient amount</td><td class="n">We have enough time.</td></tr>'+
  '<tr><td class="g">the same as / different from</td><td class="e">similarity</td><td class="n">My bag is the same as yours.</td></tr>'+
  '</tbody></table></div>'),
 B.mcq('Practice 1 — Choose the correct form',[
  'This book is ___ than that one.|interesting;more interesting;most interesting|1|2+ syllables → more.|यह किताब उससे ज़्यादा दिलचस्प है।|ਇਹ ਕਿਤਾਬ ਉਸ ਨਾਲੋਂ ਵੱਧ ਦਿਲਚਸਪ ਹੈ।',
  'Mount Everest is ___ mountain in the world.|the higher;the highest;most high|1|the + -est.',
  'My sister is ___ than me.|youngest;younger;more young|1|young → younger.',
  'This is the ___ film I have ever seen. (bad)|worse;worst;baddest|1|bad → worst.',
  'She isn\'t ___ tall as her father.|so;as;more|1|not as … as.',
  'The room is ___ small for ten people.|enough;too;very|1|too = more than needed.',
  'He is old ___ to drive.|enough;too;as|0|adjective + enough.',
  'Ludhiana is ___ than Morinda.|more big;bigger;biggest|1|big → bigger.',
  'She is the ___ girl in the class. (clever)|cleverest;more clever;cleverer|0|the cleverest.',
  'It is ___ to walk. It is 40 km away.|too far;far enough;as far|0|too far.']),
 B.gap('Practice 2 — Comparatives & superlatives',[
  'My phone is ___ than yours. (good)|better|मेरा फ़ोन तुम्हारे से बेहतर है।|ਮੇਰਾ ਫ਼ੋਨ ਤੁਹਾਡੇ ਨਾਲੋਂ ਬਿਹਤਰ ਹੈ।','August is the ___ month in Punjab. (wet)|wettest|अगस्त पंजाब का सबसे गीला महीना है।|ਅਗਸਤ ਪੰਜਾਬ ਦਾ ਸਭ ਤੋਂ ਗਿੱਲਾ ਮਹੀਨਾ ਹੈ।','Gold is ___ expensive than silver. (more/less)|more|सोना चाँदी से महँगा है।|ਸੋਨਾ ਚਾਂਦੀ ਨਾਲੋਂ ਮਹਿੰਗਾ ਹੈ।','This exam was ___ difficult than the last one. (less)|less|यह परीक्षा पिछली से कम कठिन थी।|ਇਹ ਪ੍ਰੀਖਿਆ ਪਿਛਲੀ ਨਾਲੋਂ ਘੱਟ ਔਖੀ ਸੀ।','He is not ___ fast ___ his brother. (as … as: write "as as")|as as|वह अपने भाई जितना तेज़ नहीं है।|ਉਹ ਆਪਣੇ ਭਰਾ ਜਿੰਨਾ ਤੇਜ਼ ਨਹੀਂ ਹੈ।','The tea is ___ hot to drink. (too)|too|चाय पीने के लिए बहुत गर्म है।|ਚਾਹ ਪੀਣ ਲਈ ਬਹੁਤ ਗਰਮ ਹੈ।']),
 B.ord('Practice 3 — Make sentences',[
  'This is the best restaurant in town|यह शहर का सबसे अच्छा रेस्तरां है|ਇਹ ਸ਼ਹਿਰ ਦਾ ਸਭ ਤੋਂ ਵਧੀਆ ਰੈਸਟੋਰੈਂਟ ਹੈ','She is taller than her mother|वह अपनी माँ से लंबी है|ਉਹ ਆਪਣੀ ਮਾਂ ਨਾਲੋਂ ਲੰਮੀ ਹੈ','It is too cold to swim today|आज तैरने के लिए बहुत ठंड है|ਅੱਜ ਤੈਰਨ ਲਈ ਬਹੁਤ ਠੰਢ ਹੈ','I am not as tired as yesterday|मैं कल जितना थका हुआ नहीं हूँ|ਮੈਂ ਕੱਲ੍ਹ ਜਿੰਨਾ ਥੱਕਿਆ ਹੋਇਆ ਨਹੀਂ ਹਾਂ']),
 B.write('Practice 4 — Compare two places','Write 6–8 sentences comparing your village / town with a big city.',['Size and population','Prices and food','Air, traffic, life','Which do you prefer and why?'],
  'Morinda is smaller than Chandigarh, but it is quieter. The air in my town is cleaner than in the city. Chandigarh has bigger shops and better hospitals, but everything is more expensive. Life in Morinda is slower and more relaxed. I think the best place to live is a small town near a big city.')
]);

/* ══════════ UNIT 06 — Quantifiers ══════════ */
UNIT('a2_quant','06','Grammar','Quantifiers: some, any, much, many, a few, a little, a lot of','मात्रा बताने वाले शब्द · ਮਾਤਰਾ ਦੱਸਣ ਵਾਲੇ ਸ਼ਬਦ',
'Say how much or how many. The right word depends on whether the noun is countable or uncountable.',
'कितना या कितने — सही शब्द इस पर निर्भर करता है कि संज्ञा गिनी जा सकती है या नहीं।',
'ਕਿੰਨਾ ਜਾਂ ਕਿੰਨੇ — ਸਹੀ ਸ਼ਬਦ ਇਸ ਉੱਤੇ ਨਿਰਭਰ ਹੈ ਕਿ ਨਾਂਵ ਗਿਣਿਆ ਜਾ ਸਕਦਾ ਹੈ ਜਾਂ ਨਹੀਂ।',[
 B.rule('Which quantifier?',
  '<div class="tbl-wrap"><table><thead><tr><th>Meaning</th><th>Countable (books, apples)</th><th>Uncountable (water, money, time)</th></tr></thead><tbody>'+
  '<tr><td class="g">a large amount</td><td class="e">many / a lot of / lots of</td><td class="e">much / a lot of / lots of</td></tr>'+
  '<tr><td class="g">a small amount (enough)</td><td class="e">a few</td><td class="e">a little</td></tr>'+
  '<tr><td class="g">almost none (negative idea)</td><td class="e">few</td><td class="e">little</td></tr>'+
  '<tr><td class="g">some / any</td><td class="e">some / any</td><td class="e">some / any</td></tr>'+
  '<tr><td class="g">zero</td><td class="e">no / none</td><td class="e">no / none</td></tr>'+
  '<tr><td class="g">all / every</td><td class="e">all the books / every book (+ singular verb)</td><td class="e">all the water</td></tr>'+
  '</tbody></table></div>'+
  P('<b class="eng">a few / a little</b> = some, enough (positive). <b class="eng">few / little</b> = hardly any (negative): <i>I have a few friends here</i> (good) vs <i>I have few friends here</i> (sad). Use <b class="eng">many / much</b> mostly in questions and negatives; in positive sentences use <b class="eng">a lot of</b>.','a few/a little = थोड़े-बहुत (पर्याप्त, सकारात्मक); few/little = लगभग नहीं (नकारात्मक)। many/much प्रश्न और नकारात्मक वाक्यों में; सकारात्मक में a lot of।','a few/a little = ਥੋੜ੍ਹੇ-ਬਹੁਤ (ਕਾਫ਼ੀ, ਸਕਾਰਾਤਮਕ); few/little = ਲਗਭਗ ਨਹੀਂ (ਨਕਾਰਾਤਮਕ)। many/much ਪ੍ਰਸ਼ਨ ਅਤੇ ਨਕਾਰਾਤਮਕ ਵਿੱਚ; ਸਕਾਰਾਤਮਕ ਵਿੱਚ a lot of।')+
  '<div class="rule"><span class="lbl">some & any</span><b>some</b>: positive, offers, requests (<i>Would you like some tea?</i>). <b>any</b>: negatives, questions, and "it doesn\'t matter which" (<i>Take any book you like.</i>). Compounds: <b class="eng">somebody, anything, nowhere, everyone</b>.</div>'+
  '<div class="rule warn"><span class="lbl">Common mistakes</span>✗ many water, ✗ much books, ✗ a lot of informations, ✗ I have a little friends. ✓ <b class="eng">much water, many books, a lot of information, a few friends.</b></div>'),
 B.mcq('Practice 1 — Choose the correct quantifier',[
  'How ___ money do you have?|many;much;few|1|money = uncountable.|आपके पास कितने पैसे हैं?|ਤੁਹਾਡੇ ਕੋਲ ਕਿੰਨੇ ਪੈਸੇ ਹਨ?',
  'How ___ students are in your class?|much;many;little|1|students = countable.',
  'I have ___ friends in this city. I feel lonely.|a few;few;a little|1|few = almost none.',
  'There is ___ milk left. We can make tea.|a little;little;few|0|a little = some.',
  'She doesn\'t have ___ time.|many;much;a few|1|negative + uncountable → much.',
  'Would you like ___ coffee?|any;some;many|1|offer → some.',
  'I haven\'t got ___ questions.|some;any;much|1|negative → any.',
  '___ of my friends play cricket. (nearly all)|Most;Much;Any|0|most of my friends.',
  'There is ___ furniture in the room.|a lot of;many;a few|0|furniture = uncountable.',
  '___ student in this class has a mobile.|All;Every;Many|1|Every + singular.']),
 B.gap('Practice 2 — Complete',[
  'We don\'t have ___ rice. (much/many)|much|हमारे पास ज़्यादा चावल नहीं है।|ਸਾਡੇ ਕੋਲ ਬਹੁਤੇ ਚੌਲ ਨਹੀਂ ਹਨ।','Can I have ___ water, please? (some/any)|some|क्या मुझे थोड़ा पानी मिल सकता है?|ਕੀ ਮੈਨੂੰ ਥੋੜ੍ਹਾ ਪਾਣੀ ਮਿਲ ਸਕਦਾ ਹੈ?','There are ___ cars on the road today. (a lot of / much)|a lot of|आज सड़क पर बहुत कारें हैं।|ਅੱਜ ਸੜਕ ਤੇ ਬਹੁਤ ਕਾਰਾਂ ਹਨ।','I need ___ eggs for the cake. (a few / a little)|a few|केक के लिए मुझे कुछ अंडे चाहिए।|ਕੇਕ ਲਈ ਮੈਨੂੰ ਕੁਝ ਆਂਡੇ ਚਾਹੀਦੇ ਹਨ।','Is there ___ sugar in the tea? (any/some)|any|क्या चाय में चीनी है?|ਕੀ ਚਾਹ ਵਿੱਚ ਖੰਡ ਹੈ?','He has ___ experience. He is new. (little / a little)|little|उसके पास बहुत कम अनुभव है।|ਉਸ ਕੋਲ ਬਹੁਤ ਘੱਟ ਤਜਰਬਾ ਹੈ।']),
 B.dikt('Practice 3 — Dictation',[
  'There isn\'t much traffic on Sundays.|रविवार को ज़्यादा ट्रैफ़िक नहीं होता।|ਐਤਵਾਰ ਨੂੰ ਬਹੁਤੀ ਟ੍ਰੈਫ਼ਿਕ ਨਹੀਂ ਹੁੰਦੀ।','I have a few good friends.|मेरे कुछ अच्छे दोस्त हैं।|ਮੇਰੇ ਕੁਝ ਚੰਗੇ ਦੋਸਤ ਹਨ।','How many people came to the party?|पार्टी में कितने लोग आए?|ਪਾਰਟੀ ਵਿੱਚ ਕਿੰਨੇ ਲੋਕ ਆਏ?','Is there any milk in the fridge?|क्या फ़्रिज में दूध है?|ਕੀ ਫ਼ਰਿੱਜ ਵਿੱਚ ਦੁੱਧ ਹੈ?'])
]);

/* ══════════ UNIT 07 — Modal Verbs ══════════ */
UNIT('a2_modal','07','Grammar','Modal Verbs: should, must, have to, could, may, would like','मॉडल क्रियाएँ · ਮਾਡਲ ਕਿਰਿਆਵਾਂ',
'Modal verbs add meaning: advice, obligation, permission, possibility and polite requests. They never change form and are followed by the plain verb.',
'Modal verbs में सलाह, अनिवार्यता, अनुमति, संभावना और शिष्ट अनुरोध का भाव होता है। इनका रूप कभी नहीं बदलता और इनके बाद क्रिया का सादा रूप आता है।',
'Modal verbs ਵਿੱਚ ਸਲਾਹ, ਲਾਜ਼ਮੀਅਤ, ਇਜਾਜ਼ਤ, ਸੰਭਾਵਨਾ ਅਤੇ ਸ਼ਿਸ਼ਟ ਬੇਨਤੀ ਦਾ ਭਾਵ ਹੁੰਦਾ ਹੈ। ਇਨ੍ਹਾਂ ਦਾ ਰੂਪ ਕਦੇ ਨਹੀਂ ਬਦਲਦਾ ਅਤੇ ਇਨ੍ਹਾਂ ਤੋਂ ਬਾਅਦ ਕਿਰਿਆ ਦਾ ਸਾਦਾ ਰੂਪ ਆਉਂਦਾ ਹੈ।',[
 B.rule('The most useful modals',
  '<div class="tbl-wrap"><table><thead><tr><th>Modal</th><th>Meaning</th><th>Example</th><th class="hi">हिन्दी</th><th class="pa">ਪੰਜਾਬੀ</th></tr></thead><tbody>'+
  '<tr><td class="g">can / can\'t</td><td class="e">ability, permission</td><td class="n">I can swim. Can I come in?</td><td class="hi">सकना</td><td class="pa">ਸਕਣਾ</td></tr>'+
  '<tr><td class="g">could</td><td class="e">past ability; polite request</td><td class="n">I could run fast. Could you help me?</td><td class="hi">सकता था / क्या आप कृपया</td><td class="pa">ਸਕਦਾ ਸੀ / ਕੀ ਤੁਸੀਂ ਕਿਰਪਾ</td></tr>'+
  '<tr><td class="g">should / shouldn\'t</td><td class="e">advice</td><td class="n">You should rest. You shouldn\'t smoke.</td><td class="hi">चाहिए</td><td class="pa">ਚਾਹੀਦਾ ਹੈ</td></tr>'+
  '<tr><td class="g">must / mustn\'t</td><td class="e">strong obligation / prohibition</td><td class="n">You must wear a helmet. You mustn\'t park here.</td><td class="hi">ज़रूर करना चाहिए / नहीं करना</td><td class="pa">ਜ਼ਰੂਰ ਕਰਨਾ / ਨਹੀਂ ਕਰਨਾ</td></tr>'+
  '<tr><td class="g">have to / don\'t have to</td><td class="e">necessary (rule) / not necessary</td><td class="n">I have to get up early. You don\'t have to come.</td><td class="hi">करना पड़ता है / ज़रूरी नहीं</td><td class="pa">ਕਰਨਾ ਪੈਂਦਾ ਹੈ / ਲੋੜ ਨਹੀਂ</td></tr>'+
  '<tr><td class="g">may / might</td><td class="e">possibility; formal permission</td><td class="n">It may rain. May I sit here?</td><td class="hi">शायद / क्या मैं</td><td class="pa">ਸ਼ਾਇਦ / ਕੀ ਮੈਂ</td></tr>'+
  '<tr><td class="g">would like</td><td class="e">polite want</td><td class="n">I\'d like some tea. Would you like to dance?</td><td class="hi">मैं चाहूँगा</td><td class="pa">ਮੈਂ ਚਾਹਾਂਗਾ</td></tr>'+
  '</tbody></table></div>'+
  '<div class="rule warn"><span class="lbl">Careful</span><b>mustn\'t</b> = forbidden (<i>You mustn\'t smoke here</i>). <b>don\'t have to</b> = not necessary (<i>You don\'t have to pay</i>). They are NOT the same! &nbsp; ✗ She musts go. ✗ He should to study. ✗ Can you to help? ✓ <b class="eng">She must go. He should study. Can you help?</b>'+T('mustn\'t = मना है; don\'t have to = ज़रूरी नहीं। दोनों अलग हैं!','mustn\'t = ਮਨ੍ਹਾ ਹੈ; don\'t have to = ਲੋੜ ਨਹੀਂ। ਦੋਵੇਂ ਵੱਖਰੇ ਹਨ!')+'</div>'+
  '<div class="rule"><span class="lbl">Polite requests (from casual to formal)</span>Can you help me? → <b>Could</b> you help me? → <b>Would you mind</b> helping me? → I was wondering if you could help me.</div>'),
 B.mcq('Practice 1 — Choose the correct modal',[
  'You look ill. You ___ see a doctor.|can;should;would|1|advice → should.|आप बीमार लग रहे हैं। आपको डॉक्टर को दिखाना चाहिए।|ਤੁਸੀਂ ਬਿਮਾਰ ਲੱਗ ਰਹੇ ਹੋ। ਤੁਹਾਨੂੰ ਡਾਕਟਰ ਨੂੰ ਵਿਖਾਉਣਾ ਚਾਹੀਦਾ ਹੈ।',
  'Cars ___ park here. It is a no-parking zone.|mustn\'t;don\'t have to;shouldn\'t to|0|forbidden → mustn\'t.',
  'Tomorrow is a holiday. You ___ come to school.|mustn\'t;don\'t have to;must|1|not necessary → don\'t have to.',
  '___ you open the window, please?|Must;Could;Should|1|polite request → could.',
  'She ___ to work on Sundays. It is her job.|have;has to;must to|1|she → has to.',
  'I ___ swim when I was five.|can;could;should|1|past ability → could.',
  'It ___ rain tonight. Take an umbrella.|may;must;has to|0|possibility → may.',
  'I ___ like a glass of water, please.|will;would;should|1|I\'d like = I would like.',
  'Which is correct?|He can sings.;He can sing.;He can to sing.|1|modal + plain verb.',
  'Students ___ wear uniform. It is a school rule.|have to;can;may|0|rule → have to.']),
 B.gap('Practice 2 — Complete',[

UNIT('a2_read','15','Exam practice','Reading Skills: True / False, Notices & Short Texts','पढ़ने के कौशल · ਪੜ੍ਹਨ ਦੇ ਹੁਨਰ',
'In A2 exams you read signs, emails and short articles and answer True / False / Not given questions. Learn the strategy and practise.',
'A2 परीक्षाओं में आप संकेत, ईमेल और छोटे लेख पढ़कर True / False / Not given प्रश्न हल करते हैं। रणनीति सीखें और अभ्यास करें।',
'A2 ਪ੍ਰੀਖਿਆਵਾਂ ਵਿੱਚ ਤੁਸੀਂ ਸੰਕੇਤ, ਈਮੇਲ ਅਤੇ ਛੋਟੇ ਲੇਖ ਪੜ੍ਹ ਕੇ True / False / Not given ਪ੍ਰਸ਼ਨ ਹੱਲ ਕਰਦੇ ਹੋ। ਰਣਨੀਤੀ ਸਿੱਖੋ ਅਤੇ ਅਭਿਆਸ ਕਰੋ।',[
 B.rule('Strategy',
  '<div class="tbl-wrap"><table><thead><tr><th>Step</th><th>What to do</th></tr></thead><tbody>'+
  '<tr><td class="g">1</td><td class="e">Read the questions first, then the text.</td></tr>'+
  '<tr><td class="g">2</td><td class="e">Underline key words in the question (names, numbers, times).</td></tr>'+
  '<tr><td class="g">3</td><td class="e"><b>True</b> = the text says the same thing. <b>False</b> = the text says the opposite. <b>Not given</b> = the text does not say it at all.</td></tr>'+
  '<tr><td class="g">4</td><td class="e">Don\'t use your own knowledge — use only the text.</td></tr>'+
  '<tr><td class="g">5</td><td class="e">Watch for words like <i>all, never, always, only, most</i>.</td></tr>'+
  '</tbody></table></div>'+
  T('True = पाठ में वही लिखा है; False = पाठ में उल्टा लिखा है; Not given = पाठ में इसके बारे में कुछ नहीं लिखा।','True = ਪਾਠ ਵਿੱਚ ਉਹੀ ਲਿਖਿਆ ਹੈ; False = ਪਾਠ ਵਿੱਚ ਉਲਟਾ ਲਿਖਿਆ ਹੈ; Not given = ਪਾਠ ਵਿੱਚ ਇਸ ਬਾਰੇ ਕੁਝ ਨਹੀਂ ਲਿਖਿਆ।')),
 B.text('Text 1 — Article: Learning English online','Reading · A2',
  '<p>More and more people in India are learning English online. They watch videos, use apps and join live classes on their phones. Priya, 22, lives in a small village near Ludhiana. She works in a shop in the morning and studies English for one hour every evening. "I can\'t go to a big city for a course," she says, "but I can learn from my phone." After six months, Priya can speak with tourists and she is now looking for a job in a hotel. Experts say online learning is cheaper than a classroom course, but you need discipline.</p>'+
  T('प्रिया लुधियाना के पास गाँव में रहती है, सुबह दुकान में काम करती है और हर शाम एक घंटा फ़ोन पर अंग्रेज़ी सीखती है। छह महीने बाद वह पर्यटकों से बात कर सकती है। विशेषज्ञ कहते हैं कि ऑनलाइन सीखना सस्ता है पर अनुशासन चाहिए।','ਪ੍ਰਿਯਾ ਲੁਧਿਆਣੇ ਨੇੜੇ ਪਿੰਡ ਵਿੱਚ ਰਹਿੰਦੀ ਹੈ, ਸਵੇਰੇ ਦੁਕਾਨ ਵਿੱਚ ਕੰਮ ਕਰਦੀ ਹੈ ਅਤੇ ਹਰ ਸ਼ਾਮ ਇੱਕ ਘੰਟਾ ਫ਼ੋਨ ਤੇ ਅੰਗਰੇਜ਼ੀ ਸਿੱਖਦੀ ਹੈ। ਛੇ ਮਹੀਨੇ ਬਾਅਦ ਉਹ ਸੈਲਾਨੀਆਂ ਨਾਲ ਗੱਲ ਕਰ ਸਕਦੀ ਹੈ। ਮਾਹਿਰ ਕਹਿੰਦੇ ਹਨ ਕਿ ਆਨਲਾਈਨ ਸਿੱਖਣਾ ਸਸਤਾ ਹੈ ਪਰ ਅਨੁਸ਼ਾਸਨ ਚਾਹੀਦਾ ਹੈ।')),
 B.mcq('Questions on Text 1 — True / False / Not given',[
  'Priya lives in a big city.|True;False;Not given|1|She lives in a small village near Ludhiana.',
  'Priya studies English every evening.|True;False;Not given|0|one hour every evening.',
  'Priya\'s family is rich.|True;False;Not given|2|Nothing is said about her family.',
  'She is looking for a job in a hotel.|True;False;Not given|0|she is now looking for a job in a hotel.',
  'Experts say online learning is more expensive than classroom courses.|True;False;Not given|1|The text says cheaper.',
  'Priya wants to move abroad.|True;False;Not given|2|Not mentioned.']),

  '<p><b>From:</b> Anita<br><b>To:</b> Simran<br><b>Subject:</b> Weekend plans<br><br>Hi Simran,<br>Are you free this Saturday? Some friends and I are going to Sukhna Lake in Chandigarh. We are leaving at 8 a.m. by car, so we will be back before dinner. Can you bring some sandwiches? I\'ll bring the drinks. Please tell me by Thursday if you can come. It will be fun!<br>Love, Anita</p>'),

UNIT('a2_write','16','Exam practice','Writing: Emails, Messages & Short Paragraphs','लिखना: ईमेल, संदेश और छोटे अनुच्छेद · ਲਿਖਣਾ: ਈਮੇਲ, ਸੁਨੇਹੇ ਅਤੇ ਛੋਟੇ ਪੈਰੇ',
'Write clear, correct short texts of 50–100 words: informal emails, formal requests, and a paragraph about your life.',
'50–100 शब्दों के स्पष्ट और शुद्ध छोटे पाठ लिखें: अनौपचारिक ईमेल, औपचारिक अनुरोध और अपने जीवन पर एक अनुच्छेद।',

 B.rule('Informal vs formal',
  '<div class="tbl-wrap"><table><thead><tr><th></th><th>Informal (friend)</th><th>Formal (office, school, hotel)</th></tr></thead><tbody>'+
  '<tr><td class="g">Greeting</td><td class="e">Hi Anita, / Dear Anita,</td><td class="e">Dear Sir or Madam, / Dear Mr Sharma,</td></tr>'+
  '<tr><td class="g">Opening</td><td class="e">Thanks for your email. How are you?</td><td class="e">I am writing to ask about … / to apply for …</td></tr>'+
  '<tr><td class="g">Request</td><td class="e">Can you send me …?</td><td class="e">Could you please send me …? I would be grateful if …</td></tr>'+
  '<tr><td class="g">Apology</td><td class="e">Sorry I can\'t come!</td><td class="e">I am sorry, but I will not be able to attend.</td></tr>'+
  '<tr><td class="g">Closing</td><td class="e">See you soon! / Write back soon. / Love, / Best wishes,</td><td class="e">I look forward to hearing from you. / Yours faithfully, (Dear Sir/Madam) / Yours sincerely, (Dear Mr …)</td></tr>'+
  '<tr><td class="g">Style</td><td class="e">contractions: I\'m, can\'t, don\'t</td><td class="e">no contractions: I am, cannot, do not</td></tr>'+
  '</tbody></table></div>'+

 B.write('Task 1 — Informal email (about 60 words)','Your friend invited you to a birthday party next Saturday. Write an email: thank her, say you will come, ask what to bring, ask where and when.',['Thank her for the invitation','Say you will come','Ask what to bring','Ask for the place and time'],

UNIT('a2_speak','17','Exam practice','Speaking & Listening Practice','बोलना और सुनना · ਬੋਲਣਾ ਅਤੇ ਸੁਣਨਾ',

 B.dlg('Model answers — personal questions',[
  'Examiner|Tell me about your family.|अपने परिवार के बारे में बताइए।|ਆਪਣੇ ਪਰਿਵਾਰ ਬਾਰੇ ਦੱਸੋ।',
  'You|There are five people in my family: my parents, my sister, my brother and me. My father is a farmer and my mother is a housewife.|मेरे परिवार में पाँच लोग हैं: माता-पिता, बहन, भाई और मैं। पिता किसान हैं और माँ गृहिणी।|ਮੇਰੇ ਪਰਿਵਾਰ ਵਿੱਚ ਪੰਜ ਜੀਅ ਹਨ: ਮਾਪੇ, ਭੈਣ, ਭਰਾ ਅਤੇ ਮੈਂ। ਪਿਤਾ ਜੀ ਕਿਸਾਨ ਹਨ ਅਤੇ ਮਾਂ ਘਰੇਲੂ ਔਰਤ।',

  'You|I visited my cousins and we played kabaddi. After that we had dinner together. It was a great day.|मैं अपने चचेरे भाइयों से मिला और हमने कबड्डी खेली। फिर साथ खाना खाया। बहुत अच्छा दिन था।|ਮੈਂ ਆਪਣੇ ਚਚੇਰੇ ਭਰਾਵਾਂ ਨੂੰ ਮਿਲਿਆ ਅਤੇ ਅਸੀਂ ਕਬੱਡੀ ਖੇਡੀ। ਫਿਰ ਇਕੱਠੇ ਖਾਣਾ ਖਾਧਾ। ਬਹੁਤ ਵਧੀਆ ਦਿਨ ਸੀ।',

(function(){
'use strict';

function levelOf(stId){
  for(var i=0;i<LEVELS.length;i++){ if(LEVELS[i].ids.indexOf(stId)>-1) return i; }
  return 0;
}
function idxOfId(id){
  for(var i=0;i<STATIONEN.length;i++){ if(STATIONEN[i].id===id) return i; }
  return 0;
}

/* ---------- safe storage (never breaks if blocked) ---------- */
var mem = {};
var STORE = {
  get:function(k){ try{ var v=localStorage.getItem(k); return v===null?mem[k]:v; }catch(e){ return mem[k]; } },
  set:function(k,v){ mem[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
};
var KEY='pioneerEnglishA2_v1';
var save={xp:0, done:{}, last:null, ans:{}, typed:{}};
try{ var raw=STORE.get(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==='object'){ save.xp=p.xp||0; save.done=p.done||{}; save.last=p.last||null; save.ans=p.ans||{}; save.typed=p.typed||{}; } } }catch(e){}
function persist(){ try{ STORE.set(KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- answers survive leaving a station ---------- */
function setAns(blk, idx, val){
  if(!save.ans) save.ans={};
  if(!save.ans[blk._st]) save.ans[blk._st]={};
  if(!save.ans[blk._st][blk._k]) save.ans[blk._st][blk._k]={};
  save.ans[blk._st][blk._k][idx]=val;
  persist();
}
function getAns(blk, idx){
  try{ return save.ans[blk._st][blk._k][idx]; }catch(e){ return undefined; }
}
function restoreTyped(stId){
  var main=document.getElementById('main');
  if(!main) return;
  var nodes=main.querySelectorAll('input[type=text], textarea');
  if(!save.typed) save.typed={};
  var store=save.typed[stId]||{};
  Array.prototype.forEach.call(nodes, function(nd, i){
    var k='n'+i;
    if(store[k]!==undefined && store[k]!=='' && !nd.value) nd.value=store[k];
    nd.addEventListener('input', function(){
      if(!save.typed[stId]) save.typed[stId]={};
      save.typed[stId][k]=nd.value;
      persist();
    });
  });
}

/* ---------- speech (browser built-in, no network) ---------- */
var voice=null, voiceReady=false;
function pickVoice(){
  try{
    var vs = window.speechSynthesis.getVoices()||[];
    voice = vs.filter(function(v){return /^en-(IN|GB)/i.test(v.lang);})[0] || vs.filter(function(v){return /^en/i.test(v.lang);})[0] || null;
    voiceReady = true;
  }catch(e){ voiceReady=true; }
}
if('speechSynthesis' in window){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
var warned=false;
function say(text, rate){
  if(!('speechSynthesis' in window)){
    if(!warned){ toast('Audio not supported in this browser'); warned=true; }
    return;
  }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,''));
    u.lang=(voice&&voice.lang)||'en-GB';
    u.rate = rate||0.9;
    if(voice) u.voice=voice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- helpers ---------- */
function el(tag, cls, html){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  if(html!=null) n.innerHTML=html;
  return n;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('up');
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('up'); },2000);
}
/* normalise an answer for comparison */
function norm(s){
  return String(s).toLowerCase().trim()
    .replace(/[\u2018\u2019\u02BC]/g,"'")
    .replace(/[.,!?;:"'()\u201C\u201D]/g,'')
    .replace(/\s+/g,' ');
}
function trh(it){
  return (it.hi?'<span class="trl hi">'+esc(it.hi)+'</span>':'')+(it.pa?'<span class="trl pa">'+esc(it.pa)+'</span>':'');
}
function matches(input, answers){
  var n=norm(input);
  if(!n) return false;
  for(var i=0;i<answers.length;i++){ if(norm(answers[i])===n) return true; }
  return false;
}
function speakBtn(text){
  var b=el('button','spk','▶');
  b.type='button';
  b.title='Listen';
  b.setAttribute('aria-label','Play English audio');
  b.onclick=function(e){ e.stopPropagation(); say(text); };
  return b;
}
function umlautBar(input){ return document.createElement('span'); }

/* ---------- progress ---------- */
function addXP(n){
  save.xp += n; persist(); paintXP();
}
function markProgress(stationId, blockKey, pct){
  if(!save.done[stationId]) save.done[stationId]={};
  var cur = save.done[stationId][blockKey]||0;
  if(pct>cur){ save.done[stationId][blockKey]=pct; persist(); }
  paintNav(); paintXP();
}
function stationPct(st){
  var total=0, sum=0;
  st.bloecke.forEach(function(b,i){
    if(b.typ!=='ueb' && b.typ!=='schreiben') return;
    total++;
    var d=(save.done[st.id]||{})['b'+i]||0;
    sum+=d;
  });
  if(!total) return (save.done[st.id]&&save.done[st.id].seen)?100:0;
  return Math.round(sum/total);
}
function paintXP(){
  var totals=0;
  STATIONEN.forEach(function(s){ totals+=stationPct(s); });
  var overall = Math.round(totals/STATIONEN.length);
  document.getElementById('xpVal').textContent=save.xp;
  document.getElementById('xpLbl').textContent='Points · '+overall+' % complete';
}

/* ============================================================
   EXERCISE RENDERERS
============================================================ */

/* --- multiple choice --- */
function renderMCQ(blk, onDone){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' questions'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, answered=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var opts=el('div','opts');
    var btns=[];
    var fb=el('div','fb');
    function apply(i, restoring){
      btns.forEach(function(x){ x.disabled=true; });
      answered++;
      if(i===item.a){
        btns[i].classList.add('right'); right++;
        if(!restoring) addXP(2);
      }else{
        btns[i].classList.add('wrong');
        btns[item.a].classList.add('right');
      }
      fb.className='fb show '+(i===item.a?'ok':'no');
      fb.innerHTML=(i===item.a?'✓ Correct! ':'✗ ')+(item.fb||'');
      scoreLbl.textContent=right+' correct';
      if(!restoring) setAns(blk, idx, i);
      markProgress(blk._st, blk._k, Math.round(right/n*100));
    }
    item.opts.forEach(function(o,i){
      var b=el('button','opt');
      b.type='button';
      b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
      b.onclick=function(){ if(b.disabled) return; apply(i, false); };
      btns.push(b);
      opts.appendChild(b);
    });
    q.appendChild(opts);
    q.appendChild(fb);
    wrap.appendChild(q);
    var prevA=getAns(blk, idx);
    if(prevA!==undefined && prevA!==null) apply(prevA, true);
  });
  return wrap;
}

/* --- gap fill --- */
function renderLuecke(blk){

  var right=0, checked=0, n=blk.items.length;

    var q=el('div','q');
    var t=el('div','q-txt');
    t.innerHTML='<span class="q-no">'+(idx+1)+'</span>'+item.q + trh(item);
    q.appendChild(t);

    var row=el('div','inrow');
    var inp=el('input','gap');
    inp.type='text';
    inp.setAttribute('autocomplete','off');
    inp.setAttribute('autocapitalize','off');
    inp.setAttribute('spellcheck','false');
    inp.placeholder='Type your answer …';
    var btn=el('button','btn sm','Check');
    btn.type='button';
    var show=el('button','btn sm ghost','Show answer');
    show.type='button';
    row.appendChild(inp); row.appendChild(btn); row.appendChild(show);
    q.appendChild(row);
    q.appendChild(umlautBar(inp));
    var fb=el('div','fb');
    q.appendChild(fb);

    var settled=false;
    function check(){
      if(settled) return;
      var ok=matches(inp.value, item.a);
      inp.classList.remove('right','wrong');
      inp.classList.add(ok?'right':'wrong');
      fb.className='fb show '+(ok?'ok':'no');
      if(ok){
        settled=true; right++; checked++; addXP(3);
        fb.textContent='✓ Correct!';
        btn.disabled=true;
        scoreLbl.textContent=right+' correct';
        if(checked===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
      }else{
        fb.textContent='✗ Not yet. Try again.';
      }
    }
    btn.onclick=check;
    inp.onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); check(); } };
    show.onclick=function(){
      if(settled) return;
      settled=true; checked++;
      inp.value=item.a[0]; inp.classList.add('wrong');
      fb.className='fb show no';
      fb.innerHTML='Answer: <b>'+esc(item.a[0])+'</b>';
      btn.disabled=true;
      if(checked===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
    };

  });

}

/* --- word ordering --- */
function renderOrdnen(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' sentences'));
  var scoreLbl=el('div','ex-count','0 correct');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var right=0, done=0, n=blk.items.length;

  blk.items.forEach(function(item, idx){
    var target=item.a.split(' ');
    var q=el('div','q');
    q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+
      '<span class="cue">'+esc(item.hi||'')+'</span><span class="cue pa-i">'+esc(item.pa||'')+'</span>'));

    var slot=el('div','slot');
    var pool=el('div','pool');
    var settled=false;

    function mkWord(w, inSlot){
      var b=el('button','word', esc(w));
      b.type='button';
      b.onclick=function(){
        if(settled) return;
        b.remove();
        (inSlot?pool:slot).appendChild(mkWord(w, !inSlot));
      };
      return b;
    }
    shuffle(target).forEach(function(w){ pool.appendChild(mkWord(w,false)); });
    q.appendChild(slot); q.appendChild(pool);

    var row=el('div','inrow');
    row.style.marginTop='8px';
    var btn=el('button','btn sm','Check'); btn.type='button';
    var show=el('button','btn sm ghost','Show answer'); show.type='button';
    row.appendChild(btn); row.appendChild(show);
    q.appendChild(row);
    var fb=el('div','fb'); q.appendChild(fb);

    btn.onclick=function(){
      if(settled) return;
      var got=Array.prototype.map.call(slot.children,function(c){return c.textContent;}).join(' ');
      var ok = norm(got)===norm(item.a);
      fb.className='fb show '+(ok?'ok':'no');
      if(ok){
        settled=true; right++; done++; addXP(4);
        fb.innerHTML='✓ Richtig! <b>'+esc(item.a)+'.</b> ';
        var s=speakBtn(item.a); fb.appendChild(s);
        btn.disabled=true;
        scoreLbl.textContent=right+' correct';
        if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
      }else{
        fb.textContent='✗ Not quite. Check the word order: Subject + Verb + Object, with time words at the end.';
      }
    };
    show.onclick=function(){
      if(settled) return;
      settled=true; done++;
      slot.innerHTML=''; pool.innerHTML='';
      target.forEach(function(w){ slot.appendChild(mkWord(w,true)); });
      fb.className='fb show no';
      fb.innerHTML='Answer: <b>'+esc(item.a)+'.</b> ';
      fb.appendChild(speakBtn(item.a));
      btn.disabled=true;
      if(done===n) markProgress(blk._st, blk._k, Math.round(right/n*100));
    };
    wrap.appendChild(q);
  });
  return wrap;
}

/* --- matching pairs --- */
function renderPaare(blk){
  var wrap=el('div','ex');
  var bar=el('div','ex-bar');
  bar.appendChild(el('div','ex-count', blk.items.length+' pairs'));
  var scoreLbl=el('div','ex-count','0 found');
  bar.appendChild(scoreLbl);
  wrap.appendChild(bar);

  var grid=el('div','pairs');
  var L=el('div','pcol'), R=el('div','pcol');
  grid.appendChild(L); grid.appendChild(R);
  wrap.appendChild(grid);

  var found=0, n=blk.items.length, sel=null;
  var leftItems=shuffle(blk.items.map(function(p,i){return {t:p[0],i:i};}));
  var rightItems=shuffle(blk.items.map(function(p,i){return {t:p[1],i:i};}));

  function mk(col, obj, side){
    var b=el('button','pbtn', esc(obj.t));
    b.type='button';
    b.dataset.i=obj.i;
    b.onclick=function(){
      if(b.classList.contains('done')) return;
      if(side==='L'){ say(obj.t); }
      if(!sel){ 
        if(side!=='L'){ toast('Choose from the left column first'); return; }
        sel=b; b.classList.add('sel'); return;
      }
      if(sel===b){ sel=null; b.classList.remove('sel'); return; }
      if(side==='L'){ sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.i===b.dataset.i){
        sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done');
        sel=null; found++; addXP(2);
        scoreLbl.textContent=found+' found';
        if(found===n){ markProgress(blk._st, blk._k, 100); toast('All pairs found!'); }
      }else{
        b.classList.add('miss');
        setTimeout(function(){ b.classList.remove('miss'); },320);
      }
    };
    col.appendChild(b);
  }
  leftItems.forEach(function(o){ mk(L,o,'L'); });
  rightItems.forEach(function(o){ mk(R,o,'R'); });
  return wrap;
}

/* --- flashcards --- */
function renderKarten(blk){
  var wrap=el('div','ex');
  var stage=el('div','fc-stage');
  var order=shuffle(blk.items.map(function(_,i){return i;}));
  var pos=0, flipped=false;

  var card=el('div','card');
  var counter=el('div','ex-count','');
  var ctrls=el('div','inrow');

  function paint(){
    var it=blk.items[order[pos]];
    card.innerHTML='';
    card.appendChild(el('div','face', esc(it[0])));
    if(flipped){ card.appendChild(el('div','back', esc(it[1])+(it[2]?'<br>'+esc(it[2]):''))); }
    card.appendChild(el('div','hint', flipped?'Tap to flip back':'Tap for the meaning'));
    counter.textContent='Card '+(pos+1)+' of '+order.length;
  }
  card.onclick=function(){ flipped=!flipped; paint(); };

  var prev=el('button','btn sm ghost','◀ Back'); prev.type='button';
  var hear=el('button','btn sm gelb','▶ Listen'); hear.type='button';
  var next=el('button','btn sm','Next ▶'); next.type='button';
  var mix=el('button','btn sm ghost','Shuffle'); mix.type='button';

  prev.onclick=function(){ pos=(pos-1+order.length)%order.length; flipped=false; paint(); };
  next.onclick=function(){
    pos=(pos+1)%order.length; flipped=false; paint();
    if(pos===0){ markProgress(blk._st, blk._k, 100); addXP(5); toast('Deck finished!'); }
  };
  hear.onclick=function(){ var it=blk.items[order[pos]]; say(it[0]); };
  mix.onclick=function(){ order=shuffle(order); pos=0; flipped=false; paint(); toast('Shuffled'); };

  ctrls.appendChild(prev); ctrls.appendChild(hear); ctrls.appendChild(next); ctrls.appendChild(mix);
  stage.appendChild(card); stage.appendChild(counter); stage.appendChild(ctrls);
  wrap.appendChild(stage);
  paint();
  return wrap;
}

function levelPct(lv){
  var sum=0;
  lv.ids.forEach(function(id){ sum+=stationPct(STATIONEN[idxOfId(id)]); });
  return Math.round(sum/lv.ids.length);
}
function ring(pct, colour){
  var w=el('div','ring');
  var r=22, c=2*Math.PI*r, off=c*(1-pct/100);
  w.innerHTML='<svg width="52" height="52" viewBox="0 0 52 52">'+
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="#DADDD6" stroke-width="5"/>'+
    '<circle cx="26" cy="26" r="'+r+'" fill="none" stroke="'+colour+'" stroke-width="5" '+
    'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" stroke-linecap="round"/>'+
    '</svg><span>'+pct+'%</span>';
  return w;
}

function renderPlacement(){
  var box=el('div','place');
  box.appendChild(el('h3',null,'Placement test — where should I start?'));
  box.appendChild(el('p',null,PLACEMENT.length+' quick questions. Answer honestly and skip nothing — the result tells you which part to open first.'));

  var start=el('button','btn gelb','Start test'); start.type='button';
  box.appendChild(start);
  var area=el('div');
  box.appendChild(area);

  start.onclick=function(){
    start.style.display='none';
    area.innerHTML='';
    var score=[0,0,0,0], count=[0,0,0,0], answered=0;
    PLACEMENT.forEach(function(item, idx){
      count[item.lvl]++;
      var q=el('div','q');
      q.appendChild(el('div','q-txt','<span class="q-no">'+(idx+1)+'</span>'+item.q));
      var opts=el('div','opts'); var btns=[];
      item.opts.forEach(function(o,i){
        var b=el('button','opt'); b.type='button';
        b.innerHTML='<span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span>';
        b.onclick=function(){
          if(b.disabled) return;
          btns.forEach(function(x){x.disabled=true;});
          answered++;
          if(i===item.a){ b.classList.add('right'); score[item.lvl]++; }
          else{ b.classList.add('wrong'); btns[item.a].classList.add('right'); }
          if(answered===PLACEMENT.length) finish();
        };
        btns.push(b); opts.appendChild(b);
      });
      q.appendChild(opts);
      area.appendChild(q);
    });

    function finish(){
      /* recommended level = first level where the student scored below 70% */
      var rec=LEVELS.length-1;
      for(var i=0;i<4;i++){
        if(count[i] && (score[i]/count[i])<0.7){ rec=i; break; }
      }
      var total=score.reduce(function(a,b){return a+b;},0);
      var res=el('div','place-result');
      var lv=LEVELS[rec];
      res.innerHTML='<b>Recommended: Part '+(rec+1)+' — '+esc(lv.name)+' ('+lv.code+')</b>'+
        'You scored '+total+' out of '+PLACEMENT.length+'. '+
        'Per part: '+LEVELS.map(function(l,i){return l.code+' '+score[i]+'/'+count[i];}).join(' · ')+'.';
      var goBtn=el('button','btn gelb','Open Part '+(rec+1)+' ▶');
      goBtn.type='button'; goBtn.style.marginTop='12px';
      goBtn.onclick=function(){ go(idxOfId(lv.ids[0])); };
      res.appendChild(goBtn);
      area.appendChild(res);
      addXP(10);
      res.scrollIntoView({block:'nearest'});
    }
  };
  return box;
}

  var over=el('button','btn ghost','⌂ Overview'); over.type='button';
  over.onclick=function(){ goHome(); };

  var isLast = (posInLvl===lv.ids.length);
  var next=el('button','btn', isLast
    ? (lvi<LEVELS.length-1 ? 'Part '+(lvi+2)+' ▶' : 'To overview ▶')
    : 'Unit '+STATIONEN[idxOfId(lv.ids[posInLvl])].g+' ▶');
  next.type='button';
  next.onclick=function(){
    if(!isLast){ go(idxOfId(lv.ids[posInLvl])); return; }
    if(lvi<LEVELS.length-1){ go(idxOfId(LEVELS[lvi+1].ids[0])); toast('Part '+(lvi+2)+' — '+LEVELS[lvi+1].name); }
    else{ goHome(); }
  };
  step.appendChild(prev); step.appendChild(over); step.appendChild(next);
  main.appendChild(step);

  if(!save.done[st.id]) save.done[st.id]={};
  save.done[st.id].seen=1; persist();

  var g=document.getElementById('stripG'), t=document.getElementById('stripT');
  g.textContent=st.g;
  t.innerHTML=esc(st.t)+'<small>'+esc(st.en)+'</small>';
  g.classList.remove('flip'); t.classList.remove('flip');
  void g.offsetWidth;
  g.classList.add('flip'); t.classList.add('flip');

  restoreTyped(st.id);
  paintNav(); paintXP();
}
function go(i){
  renderStation(i);
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}
function goHome(){
  renderHome();
  window.scrollTo({top:0, behavior:'auto'});
  closeNav();
}

/* ---------- sidebar ---------- */
function paintNav(){
  var nav=document.getElementById('fahrplan');
  nav.innerHTML='';
  var h=el('div','fp-head');
  h.appendChild(el('span',null,'Course map'));
  h.appendChild(el('span',null,STATIONEN.length+' units'));
  nav.appendChild(h);

  var hb=el('button','fp-item'+(current===-1?' on':''));
  hb.type='button';
  hb.appendChild(el('span','fp-g','⌂'));
  hb.appendChild(el('span','fp-t','Overview<em>All levels</em>'));
  hb.appendChild(el('span'));
  hb.onclick=goHome;
  nav.appendChild(hb);

  LEVELS.forEach(function(lv, li){
    var lh=el('div','fp-lvl '+lv.cls);
    lh.appendChild(el('span',null,'Part '+(li+1)+' · '+lv.code));
    lh.appendChild(el('span',null, levelPct(lv)+'%'));
    nav.appendChild(lh);

    lv.ids.forEach(function(id){
      var i=idxOfId(id), st=STATIONEN[i];
      var b=el('button','fp-item'+(i===current?' on':''));
      b.type='button';
      b.appendChild(el('span','fp-g', st.g));
      b.appendChild(el('span','fp-t', esc(st.t)+'<em>'+esc(st.en)+'</em>'));
      var p=stationPct(st);
      b.appendChild(el('span','fp-dot'+(p>=100?' done':(p>0?' part':''))));
      b.onclick=function(){ go(i); };
      nav.appendChild(b);
    });
  });

  var reset=el('button','btn sm ghost','Reset progress');
  reset.type='button';
  reset.style.marginTop='18px';
  reset.onclick=function(){
    if(confirm('Delete all your progress?')){
      save={xp:0,done:{},last:null,ans:{},typed:{}}; persist(); goHome(); toast('Progress reset');
    }
  };
  nav.appendChild(reset);
}
function closeNav(){
  document.getElementById('fahrplan').classList.remove('open');
  document.getElementById('scrim').classList.remove('on');
}
document.getElementById('menuBtn').onclick=function(){
  document.getElementById('fahrplan').classList.toggle('open');
  document.getElementById('scrim').classList.toggle('on');
};
document.getElementById('scrim').onclick=closeNav;
document.getElementById('homeBtn').onclick=goHome;

/* keyboard: arrows move between stations, Esc returns to the overview */
document.addEventListener('keydown', function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea') return;
  if(e.key==='Escape'){ goHome(); return; }
  if(current<0) return;
  if(e.key==='ArrowLeft') go((current-1+STATIONEN.length)%STATIONEN.length);
  if(e.key==='ArrowRight') go((current+1)%STATIONEN.length);
});

/* ---------- translation toggles ---------- */
var TRKEY=KEY+'_tr';
var trs={hi:true, pa:true};
try{ var rawT=STORE.get(TRKEY); if(rawT){ var pt=JSON.parse(rawT); trs.hi=!!pt.hi; trs.pa=!!pt.pa; } }catch(e){}
function applyTr(){
  document.body.classList.toggle('t-hi', trs.hi);
  document.body.classList.toggle('t-pa', trs.pa);
  document.getElementById('trHi').classList.toggle('on', trs.hi);
  document.getElementById('trPa').classList.toggle('on', trs.pa);
  STORE.set(TRKEY, JSON.stringify(trs));
}
document.getElementById('trHi').onclick=function(){ trs.hi=!trs.hi; applyTr(); };
document.getElementById('trPa').onclick=function(){ trs.pa=!trs.pa; applyTr(); };
applyTr();

renderHome();
})();
</script>
</body>
</html>
