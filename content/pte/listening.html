<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTE Listening Trainer · Pioneer Education</title>
<style>:root{
  --bg:#f5f6fa;--card:#ffffff;--ink:#1b2233;--muted:#5d667a;--line:#e1e4ec;
  --brand:#16306b;--brand2:#e8731c;--brand-soft:#e9eefb;--accent-soft:#fff1e5;
  --ok:#1e8a4c;--ok-soft:#e5f5ec;--bad:#c23a3a;--bad-soft:#fbe9e9;--warn:#a86a00;--warn-soft:#fff5dc;
  --radius:14px;--shadow:0 1px 3px rgba(20,30,60,.08),0 6px 20px rgba(20,30,60,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10131b;--card:#181d28;--ink:#e8ebf2;--muted:#9aa3b6;--line:#2a3141;
  --brand:#8fb0ff;--brand2:#ff9b4d;--brand-soft:#1d2842;--accent-soft:#3a2615;
  --ok:#4ccf85;--ok-soft:#15301f;--bad:#ff7b7b;--bad-soft:#3a1a1a;--warn:#f0c040;--warn-soft:#352b10;
  --shadow:none;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:var(--brand);color:#fff;padding:14px 16px}
@media (prefers-color-scheme:dark){header.top{background:#16306b}}
.top-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand2);display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.brand b{display:block;font-size:17px;letter-spacing:.2px}
.brand small{opacity:.8;font-size:12.5px}
.top-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.top-ctrl input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px;width:170px}
.top-ctrl input::placeholder{color:rgba(255,255,255,.7)}
.top-ctrl label{font-size:13.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
.top-ctrl select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:5px 6px}
.top-ctrl select option{color:#000}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.hero h1{margin:4px 0 2px;font-size:clamp(22px,4vw,30px);color:var(--brand)}
.hero p.sub{margin:0 0 12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin:14px 0}
.overview ul{margin:6px 0 0;padding-left:20px}
.overview li{margin:4px 0}
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
nav.tasks{position:sticky;top:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow)}
@media (max-width:820px){nav.tasks{position:static;display:flex;overflow-x:auto;gap:6px;padding:8px}}
nav.tasks button{display:flex;width:100%;text-align:left;gap:8px;align-items:center;justify-content:space-between;background:none;border:0;border-radius:9px;padding:8px 10px;cursor:pointer;font-size:14.5px}
@media (max-width:820px){nav.tasks button{width:auto;white-space:nowrap;flex:0 0 auto;border:1px solid var(--line)}}
nav.tasks button:hover{background:var(--brand-soft)}
nav.tasks button.on{background:var(--brand);color:#fff}
nav.tasks .sc{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.b-new{background:var(--brand2);color:#fff}
.b-human{background:var(--warn-soft);color:var(--warn);border:1px solid currentColor}
.b-un{background:var(--line);color:var(--muted)}
.task-head h2{margin:0;font-size:22px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{font-size:13px;background:var(--brand-soft);color:var(--brand);border-radius:999px;padding:3px 10px}
details.strat{margin-top:12px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--bg)}
details.strat summary{cursor:pointer;padding:10px 0;font-weight:700;color:var(--brand)}
.strat h4{margin:10px 0 4px;font-size:14.5px}
.strat ol,.strat ul{margin:0 0 10px;padding-left:20px}
.strat li{margin:3px 0}
.pattern{background:var(--accent-soft);border-left:4px solid var(--brand2);padding:8px 12px;border-radius:8px;margin:8px 0 12px;font-weight:600}
.human-note{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0 0}
.item{border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.item-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.item-h b{color:var(--muted);font-size:14px;letter-spacing:.3px;text-transform:uppercase}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;line-height:1.75}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
@media (prefers-color-scheme:dark){.btn{color:#10131b}}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.warm{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.status{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar>i{display:block;height:100%;width:0;background:var(--brand2);transition:width .2s linear}
.bar.rec>i{background:var(--bad)}
.feedback{margin-top:10px;border-radius:10px;padding:10px 14px;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.mid{background:var(--warn-soft);color:var(--warn)}
.feedback .fb-body{color:var(--ink);margin-top:6px}
.model{margin-top:10px;background:var(--brand-soft);border-radius:10px;padding:10px 14px;white-space:pre-wrap}
.model h5{margin:0 0 4px;color:var(--brand);font-size:13.5px;text-transform:uppercase;letter-spacing:.4px}
.checklist label{display:flex;gap:8px;align-items:flex-start;margin:4px 0;font-size:15px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);resize:vertical;line-height:1.6}
textarea.essay{min-height:280px}
input.gap,select.gap{border:1px solid var(--brand);border-radius:7px;padding:2px 6px;background:var(--card);min-width:90px;margin:0 2px}
input.wfd{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.gap.right{border-color:var(--ok);background:var(--ok-soft)}
.gap.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt input{margin-top:4px}
.ro-list{list-style:none;padding:0;margin:10px 0}
.ro-list li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--card)}
.ro-list li .n{font-weight:800;color:var(--brand2);min-width:18px}
.ro-list li .t{flex:1}
.ro-list li .mv{display:flex;flex-direction:column;gap:2px}
.ro-list li .mv button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:26px;cursor:pointer}
.ro-list li.right{border-color:var(--ok)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;padding:10px;border:1px dashed var(--line);border-radius:10px}
.word{border:1px solid var(--brand);background:var(--brand-soft);color:var(--brand);border-radius:8px;padding:4px 10px;cursor:pointer;user-select:none}
.word.sel{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.word.used{opacity:.3;pointer-events:none}
.slot{display:inline-block;min-width:100px;border-bottom:2px solid var(--brand);padding:0 6px;margin:0 3px;cursor:pointer;text-align:center;color:var(--brand);font-weight:600}
.slot.empty{color:var(--muted);font-weight:400}
.slot.right{border-color:var(--ok);color:var(--ok)}
.slot.wrong{border-color:var(--bad);color:var(--bad)}
.hiw span.w{cursor:pointer;border-radius:4px;padding:0 1px}
.hiw span.w:hover{background:var(--brand-soft)}
.hiw span.w.on{background:#ffe066;color:#000}
.hiw span.w.right{background:var(--ok-soft);outline:2px solid var(--ok)}
.hiw span.w.wrong{background:var(--bad-soft);outline:2px solid var(--bad)}
.hiw span.w.missed{outline:2px dashed var(--ok)}
.counter{font-size:13.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.counter.badc{color:var(--bad);font-weight:700}
.dialogue{font-size:14.5px}
.dialogue p{margin:4px 0}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0;max-width:620px}
.chartbox svg{width:100%;height:auto;display:block}
.summary table{width:100%;border-collapse:collapse;font-size:14.5px}
.summary th,.summary td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.summary td.num{text-align:right;font-variant-numeric:tabular-nums}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.vocab div{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:14px}
.vocab b{color:var(--brand);font-size:16px}
.vocab i{display:block;color:var(--muted);margin-top:4px}
.vocab .de{margin-top:4px;color:var(--brand2);font-weight:600}
.note{font-size:13.5px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 16px 30px}
.hide{display:none!important}
.transcript{font-style:italic;color:var(--muted);margin-top:6px;font-size:14.5px}
audio{width:100%;max-width:420px;margin-top:6px}
