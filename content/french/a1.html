<style>
/* Layout: one centred reading column (max 980px); units as a 2–3 column grid that stacks on phones. Blue ink on cool paper, poppy red only for sound highlights. */
:root{
  --pa:#8a4b12; --pa-bg:#fdf3e7;
  --bg:#f2f4f9; --surface:#ffffff; --sunk:#e8ecf5; --ink:#17203b; --muted:#56607e; --line:#d9deea;
  --accent:#2343a8; --accent-soft:#e3e9fb; --on-accent:#ffffff; --poppy:#c93c27;
  --good:#1b7a4c; --good-bg:#e2f4ea; --bad:#b0281e; --bad-bg:#fbe6e3;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-ipa:"Noto Sans", "Charis SIL", "Doulos SIL", "Segoe UI", "Arial Unicode MS", sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1322; --surface:#161d31; --sunk:#1d2640; --ink:#e7ebf6; --muted:#9ba4c2; --line:#2b3452;
  --accent:#8aa2ff; --accent-soft:#232f57; --on-accent:#0e1322; --poppy:#ff8a72;
  --good:#5fd09a; --good-bg:#16352a; --bad:#ff8b80; --bad-bg:#3d1c1c; --pa:#f0b47a; --pa-bg:#2e2416; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1322; --surface:#161d31; --sunk:#1d2640; --ink:#e7ebf6; --muted:#9ba4c2; --line:#2b3452;
  --accent:#8aa2ff; --accent-soft:#232f57; --on-accent:#0e1322; --poppy:#ff8a72;
  --good:#5fd09a; --good-bg:#16352a; --bad:#ff8b80; --bad-bg:#3d1c1c; --pa:#f0b47a; --pa-bg:#2e2416; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(2rem,6vw,3rem)} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ipa{font-family:var(--f-ipa);font-weight:400}
.muted{color:var(--muted)}
.eyebrow{text-transform:uppercase;letter-spacing:.09em;font-size:.75rem;font-weight:700;color:var(--muted)}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.badge{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.05rem}
.brand b{display:block;font-size:.95rem} .brand span{display:block;font-size:.78rem;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--sunk);font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--good-bg);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);padding:11px 18px;border:1px solid var(--line);background:var(--surface);font-weight:700;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;padding-inline:8px;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.play{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;color:var(--accent);padding:0}
.play:hover{background:var(--accent-soft)}
.play svg{width:14px;height:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* home */
.hero{display:grid;gap:14px;margin-bottom:28px}
.hero p.lead{max-width:60ch;font-size:1.05rem;color:var(--muted)}
.voice-warn{background:var(--bad-bg);color:var(--bad);border-radius:var(--r);padding:10px 14px;font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}

/* unit */
.uhead{display:grid;gap:6px;margin-bottom:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:700;color:var(--muted);white-space:nowrap}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}

.sounds{display:grid;gap:8px}
.snd{display:grid;grid-template-columns:minmax(110px,1.1fr) 70px auto minmax(0,2.4fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}

.snd .w{display:flex;align-items:center;gap:8px;white-space:nowrap}

.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px}
.vrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.vrow div{min-width:0} .vrow b{display:block} .vrow span{color:var(--muted);font-size:.9rem}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.mode{display:grid;gap:4px;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.mode:hover{border-color:var(--accent)}
.mode b{font-size:1.05rem} .mode span{font-size:.88rem;color:var(--muted)}
.mode .chip{justify-self:start;margin-top:6px}

/* session */
.sess{max-width:680px;margin:0 auto;display:grid;gap:18px}
.shead{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.opts{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);font-weight:700;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.fb{border-radius:var(--r);padding:12px 14px;display:grid;gap:4px}
.fb.right{background:var(--good-bg);color:var(--good)} .fb.wrong{background:var(--bad-bg);color:var(--bad)}
.fb p{color:var(--ink)}
input.ans{font:inherit;font-size:1.15rem;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px}
.key{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:1.05rem}
.line{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:2px dashed var(--line);border-radius:var(--r)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.05rem}
.tile:disabled{opacity:.25}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:grid;gap:8px;align-content:start}
.mt{padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--bg);text-align:left;font-weight:700;min-height:48px;overflow-wrap:anywhere}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.done{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.mt.miss{background:var(--bad-bg);border-color:var(--bad)}
.bigplay{width:84px;height:84px;border-radius:50%;justify-self:center}
.bigplay svg{width:30px;height:30px}
.flash{min-height:220px;display:grid;place-items:center;text-align:center;gap:10px;cursor:pointer}
.flash .fr{font-family:var(--f-display);font-size:2rem;line-height:1.2}
.score{font-family:var(--f-display);font-size:3.5rem;line-height:1}
.reslist{display:grid;gap:6px}
.resrow{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}

.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);margin-bottom:14px}
#sndout:empty{display:none}
.cellsay{display:flex;align-items:center;gap:8px}
.cellsay .play{width:28px;height:28px}
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.al{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.al-l{display:flex;align-items:baseline;justify-content:space-between;gap:6px;background:var(--accent-soft);color:var(--accent);border:0;border-radius:8px;padding:8px 10px;text-align:left}
.al-l b{font-family:var(--f-display);font-size:1.3rem;font-weight:400}
.al-l .ipa{font-size:1rem}
.al-w{display:flex;align-items:center;gap:8px;min-width:0}
/* menu, language buttons, translations */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
.menu-btn{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-content:center;gap:4px;padding:0}
.menu-btn span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
.bar .brand{margin-right:auto}
.langbar{display:flex;align-items:center;gap:6px;flex-basis:100%}
.lb-l{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.trbtn{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.85rem;color:var(--muted)}
.trbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
[lang="pa"]{font-family:"Noto Sans Gurmukhi","Raavi","Nirmala UI","Gurmukhi MN",var(--f-body)}
.tr{display:block}
body:not(.t-en) .tr-en{display:none!important}
body:not(.t-pa) .tr-pa{display:none!important}
.tr-en{color:var(--muted);font-size:.92rem}
.tr-pa{color:var(--pa);font-size:.95rem;line-height:1.6}
td.tr-pa{display:table-cell}
.pa-note{background:var(--pa-bg);border-left:3px solid var(--pa);padding:8px 12px;border-radius:0 8px 8px 0;max-width:68ch;margin:0}
.uh-pa{margin:0;font-size:1rem}
.q-pa{display:block;font-size:1rem;font-weight:400;margin-top:4px;color:var(--pa)}
.ucard .tr-pa{font-size:.85rem}
.scrim{position:fixed;inset:0;background:rgba(10,14,30,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(330px,88vw);z-index:41;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(20px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));transform:translateX(-102%);transition:transform .22s ease;display:grid;align-content:start;gap:2px;visibility:hidden}
body.menu-open .drawer{transform:none;visibility:visible}
body.menu-open .scrim{opacity:1;pointer-events:auto}
body.menu-open{overflow:hidden}
.dr-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px}
.dr-x{border:0;background:none;font-size:1.1rem;padding:6px 10px;border-radius:8px}
.dr-g{margin:12px 6px 4px;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dr-g span{text-transform:none;letter-spacing:0}
.dr-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px;border-radius:8px}
.dr-row:hover{background:var(--sunk)}
.dr-row.cur{background:var(--accent-soft);color:var(--accent)}
.dr-n{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--sunk);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.dr-t{flex:1;min-width:0;font-weight:700;font-size:.92rem;line-height:1.3}
.dr-t small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-p{font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.dr-p.ok{color:var(--good)}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
/* skills, AI, exam */
.small{font-size:.85rem}
.skillsec{margin-top:40px;display:grid;gap:16px}
.sechead{display:grid;gap:6px}
.fr-sub{font-family:var(--f-display);font-size:.95rem;color:var(--accent)!important}
.mode.exam{border-color:var(--accent);background:var(--accent-soft)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:grid;gap:8px;max-width:72ch;overflow-wrap:anywhere}
.paper.task{border-left:4px solid var(--accent)}
.doc{background:var(--sunk);border-radius:8px;padding:10px 12px;margin:0}
.cq{display:grid;gap:14px;padding-left:1.3em;margin:14px 0}
.cq li{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;min-height:40px}
.ch:hover:not(:disabled){border-color:var(--accent)}
.ch.pick{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ch.right{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.ch.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.ch:disabled{cursor:default}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:8px 0}
.fld{display:grid;gap:4px;font-weight:700;font-size:.9rem;min-width:0}
.fld input{font:inherit;font-weight:400;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.wt{font:inherit;font-size:1.05rem;line-height:1.6;width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);resize:vertical}
.check{margin:0;padding-left:1.2em;color:var(--muted)}
.sp{display:grid;gap:10px}
.spq{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card-word{display:inline-block;padding:4px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-size:1.1rem}
.ans.sm{font-size:1rem;padding:10px 12px;flex:1;min-width:0}

.msg.user{background:var(--accent);color:var(--on-accent);justify-self:end}
.ai-out{display:grid;gap:10px;margin-top:10px;white-space:pre-wrap}
.ai-out .tbl{white-space:normal}
td.num{white-space:nowrap;text-align:right}
td.num input{width:4.2em;font:inherit;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.tutor{background:var(--accent-soft);border-radius:var(--r);padding:16px;border-bottom:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// Pioneer French A1 — content part 1 (units 0–7)
// Conventions: straight apostrophes ('), a normal space before ? ! : ; (French typography).
// mcq: [question, [options], correctIndex, explanation]
// fill: [sentence with ___, [accepted answers], explanation]
// order: [French sentence, English meaning]
var UNITS = [];

UNITS.push({
  id: 0, fr: "Les sons du français", en: "Sounds & spelling",
  notes: [
    { h: "The alphabet", html: "<p>Most letters are named close to English, but watch these: <b>e</b> [ə], <b>g</b> [ʒe], <b>i</b> [i], <b>j</b> [ʒi], <b>r</b> [ɛʁ], <b>u</b> [y], <b>w</b> [dubləve], <b>y</b> [igʁɛk]. Students often swap <b>g</b> and <b>j</b>: in French, g sounds like English “zhay” and j like “zhee”. Tap the letter to hear its name, and the word to hear it in use.</p>",
      alpha: [["a", "[a]", "a", "ami", "friend"], ["b", "[be]", "bé", "bonjour", "hello"], ["c", "[se]", "cé", "café", "coffee"], ["d", "[de]", "dé", "deux", "two"], ["e", "[ə]", "e", "le", "the"], ["f", "[ɛf]", "effe", "fille", "girl"], ["g", "[ʒe]", "gé", "gare", "station"], ["h", "[aʃ]", "hache", "hôtel", "hotel (h is silent)"], ["i", "[i]", "i", "ici", "here"], ["j", "[ʒi]", "ji", "jour", "day"], ["k", "[ka]", "ka", "kilo", "kilo"], ["l", "[ɛl]", "elle", "lune", "moon"], ["m", "[ɛm]", "emme", "mère", "mother"], ["n", "[ɛn]", "enne", "nuit", "night"], ["o", "[o]", "o", "orange", "orange"], ["p", "[pe]", "pé", "pain", "bread"], ["q", "[ky]", "cu", "quatre", "four"], ["r", "[ɛʁ]", "erre", "rouge", "red"], ["s", "[ɛs]", "esse", "sœur", "sister"], ["t", "[te]", "té", "thé", "tea"], ["u", "[y]", "u", "tu", "you"], ["v", "[ve]", "vé", "vin", "wine"], ["w", "[dubləve]", "double vé", "kiwi", "kiwi"], ["x", "[iks]", "ixe", "taxi", "taxi"], ["y", "[igʁɛk]", "i grec", "stylo", "pen"], ["z", "[zɛd]", "zède", "zéro", "zero"]] },
    { h: "Accents", html: "<p>Accents are part of the spelling. A missing accent is a spelling mistake, and sometimes it changes the word.</p>",
      table: { say: [3], head: ["Mark", "Name", "Effect", "Example"], rows: [
        ["é", "accent aigu", "closed [e]", "café, été"],
        ["è", "accent grave", "open [ɛ] on e; on a/u it only separates words", "père · à (to) vs a (has) · où (where) vs ou (or)"],

        ["ç", "cédille", "c sounds [s] before a, o, u", "ça, garçon, reçu"]] } },
    { h: "Vowel sounds", sounds: [
      ["a, à, â", "[a]", "ami", "friend", "Open mouth, like the a in Hindi/Punjabi “aam”."],
      ["é, -er, -ez, et", "[e]", "café", "coffee", "Short and tense. No “ay-ee” glide."],
      ["è, ê, ai, e + 2 consonants", "[ɛ]", "père", "father", "More open than é, like e in English “bed”."],
      ["e (unstressed)", "[ə]", "le", "the", "Short, relaxed; often dropped in fast speech: petit [p(ə)ti]."],
      ["i, î, y", "[i]", "lit", "bed", "Lips spread, like ee in “see”, but shorter."],
      ["o, ô, au, eau", "[o]", "beau", "beautiful", "Closed o, lips rounded. No “ow” glide."],
      ["o + pronounced consonant", "[ɔ]", "porte", "door", "Open o, as in British “pot”."],
      ["ou, où", "[u]", "vous", "you", "Like oo in “food”."],
      ["u, û", "[y]", "tu", "you (informal)", "Say “ee” and round your lips as for “oo”. Not in English."],
      ["eu, œu (word end)", "[ø]", "deux", "two", "Say “ay” with rounded lips."],
      ["eu, œu + consonant", "[œ]", "sœur", "sister", "Like [ø] but more open."],
      ["oi, oy", "[wa]", "moi", "me", "Always “wa”: trois [tʁwa], voyage [vwajaʒ]."],
      ["ui", "[ɥi]", "huit", "eight", "A quick [y] gliding into [i]: nuit, lui."]
    ] },
    { h: "Nasal vowels", html: "<p>The vowel goes through the nose and the <b>n/m is not pronounced</b>. A vowel is <b>not</b> nasal when n/m is followed by a vowel or doubled: <b>bon</b> [bɔ̃] but <b>bonne</b> [bɔn]; <b>un</b> [œ̃] but <b>une</b> [yn].</p>", sounds: [
      ["an, am, en, em", "[ɑ̃]", "enfant", "child", "Mouth open as for “a”, air through the nose."],
      ["on, om", "[ɔ̃]", "bon", "good", "Lips rounded, air through the nose."],
      ["in, im, ain, ein, yn", "[ɛ̃]", "vin", "wine", "Mouth wider; also pain, plein."],
      ["un, um", "[œ̃]", "un", "one / a", "Many speakers in France say it like [ɛ̃]. Both are understood."],
      ["ien", "[jɛ̃]", "bien", "well", "Also chien, indien."]
    ] },
    { h: "Consonants to watch", sounds: [
      ["r", "[ʁ]", "rouge", "red", "Made at the back of the throat, close to the Punjabi/Urdu ‘ग़’ (ġ). Never rolled with the tongue tip."],
      ["ch", "[ʃ]", "chat", "cat", "Like sh in “shop”, never “ch” as in “chair”."],
      ["j, g + e/i/y", "[ʒ]", "rouge", "red", "Like s in “measure”: je, girafe."],
      ["g + a/o/u, gu + e/i", "[g]", "gare", "station", "Hard g: guitare, gomme."],
      ["c + e/i/y, ç", "[s]", "garçon", "boy", "ce, ici, ça. Before a/o/u plain c is [k]: café."],
      ["gn", "[ɲ]", "montagne", "mountain", "Like ny in “canyon”."],
      ["ill, il after a vowel", "[j]", "fille", "girl, daughter", "Like y in “yes”: travail [tʁavaj]. Exceptions: ville, mille, tranquille have [l]."],
      ["s between two vowels", "[z]", "maison", "house", "Single s between vowels is [z]; ss is [s]: poison [z] vs poisson [s]."],
      ["qu", "[k]", "quatre", "four", "No w sound: qui [ki]."],
      ["th / ph", "[t] / [f]", "thé", "tea", "photo [fɔto]."],
      ["h", "silent", "l'homme", "the man", "Never pronounced. See h muet / h aspiré below."]
    ] },
    { h: "Silent letters", html: "<ul><li>Final <b>-e</b> is silent: <i>petite</i> [pətit].</li><li>Most final consonants are silent: <i>grand, petit, trop, nez, deux</i>. Exceptions are usually <b>c, r, f, l</b> (“CaReFuL”): <i>sac, mer, neuf, sel</i>. But <b>-er</b> in verbs is [e]: <i>parler</i>.</li><li>The verb ending <b>-ent</b> (ils/elles) is completely silent: <i>ils parlent</i> [il paʁl].</li><li><b>h</b> is always silent.</li></ul>" },
    { h: "Liaison and élision", html: "<p><b>Liaison</b>: a normally silent final consonant is pronounced when the next word starts with a vowel or h muet: <i>les‿amis</i> [lezami], <i>vous‿avez</i> [vuzave], <i>ils‿ont</i> [ilzɔ̃]. An s or x in liaison sounds [z]. Never make a liaison after <b>et</b>: <i>et | il</i>.</p><p><b>Élision</b>: some short words drop their vowel before a vowel or h muet and take an apostrophe: <i>je → j'</i>, <i>le/la → l'</i>, <i>de → d'</i>, <i>ne → n'</i>, <i>que → qu'</i>, <i>me/te/se → m'/t'/s'</i>, <i>si → s'</i> (only before il/ils).</p><p><b>h muet vs h aspiré</b>: most h words allow élision and liaison (<i>l'homme, les‿hôtels</i>). A few, marked in dictionaries, block them: <i>le héros, les | haricots</i>.</p>",
      ex: [["les amis", "the friends"], ["vous avez", "you have"], ["ils ont", "they have"], ["l'homme", "the man"], ["le héros", "the hero"]] }
  ],

  mcq: [
    ["Which word has the nasal vowel [ɔ̃]?", ["bon", "bonne", "beau", "bus"], 0, "In bon the n is not pronounced and the vowel is nasal. In bonne the n is followed by e, so the vowel is not nasal: [bɔn]."],

UNITS.push({

    { h: "Subject pronouns", html: "<p><b>je</b> (j' before a vowel) I · <b>tu</b> you (one friend, child, family) · <b>il</b> he / it · <b>elle</b> she / it · <b>on</b> we (informal), one, people · <b>nous</b> we · <b>vous</b> you (polite, or more than one person) · <b>ils</b> they (masculine or mixed group) · <b>elles</b> they (only feminine).</p><p>Use <b>vous</b> with teachers, officials and adults you don't know. <b>on</b> takes the same verb form as il.</p>" },
    { h: "être — to be", conj: [["je","suis"],["tu","es"],["il / elle / on","est"],["nous","sommes"],["vous","êtes"],["ils / elles","sont"]], say: ["je suis","tu es","il est","nous sommes","vous êtes","ils sont"] },
    { h: "s'appeler — to be called", conj: [["je","m'appelle"],["tu","t'appelles"],["il / elle / on","s'appelle"],["nous","nous appelons"],["vous","vous appelez"],["ils / elles","s'appellent"]], say: ["je m'appelle","tu t'appelles","il s'appelle","nous nous appelons","vous vous appelez","ils s'appellent"], html: "<p>Note the spelling: <b>ll</b> in the je, tu, il, ils forms (stressed), single <b>l</b> with nous and vous.</p>" },
    { h: "Nationalities", html: "<p>Nationality adjectives agree with the person and take <b>no capital letter</b>: <i>Elle est indienne.</i> The noun for a person takes a capital: <i>un Indien, une Française</i>.</p>",
      table: { say: [0, 1], head: ["Masculine", "Feminine", "English"], rows: [["indien","indienne","Indian"],["français","française","French"],["canadien","canadienne","Canadian"],["anglais","anglaise","English"],["allemand","allemande","German"],["américain","américaine","American"],["espagnol","espagnole","Spanish"],["italien","italienne","Italian"],["chinois","chinoise","Chinese"],["suisse","suisse","Swiss"],["belge","belge","Belgian"],["russe","russe","Russian"]] } },
    { h: "Jobs after être", html: "<p>No article after être with a job or nationality: <i>Je suis professeur. Il est médecin.</i> With <b>c'est</b> you need un/une: <i>C'est un médecin.</i></p>" },
    { h: "French punctuation", html: "<p>French puts a space before <b>? ! : ;</b> → <i>Ça va ?</i> Quotation marks are « like this ».</p>" }

    ["À bientôt", "See you soon"], ["Merci", "Thank you"], ["Merci beaucoup", "Thank you very much"], ["De rien", "You're welcome"],

  ],

UNITS.push({

    { h: "Clues to gender", html: "<p>Usually <b>feminine</b>: -tion, -sion, -té, -ure, -ette, -ence, -ie (<i>la nation, la liberté, la voiture</i>). Usually <b>masculine</b>: -ment, -age, -eau, -isme (<i>le moment, le fromage, le bateau</i>).</p><p>Common exceptions: <i>la page, la plage, l'image (f), l'eau (f), la peau</i>.</p>" },

UNITS.push({

function norm(s){return String(s).normalize("NFC").replace(/[  ]/g," ").replace(/[’`´ʼ]/g,"'").toLowerCase().replace(/\s+/g," ").replace(/\s*[.!?]+$/,"").trim();}
function bare(s){return norm(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/œ/g,"oe");}
function playBtn(text,label){return '<button class="play" data-say="'+esc(text)+'" aria-label="Play '+esc(label||text)+'">'+ICON_PLAY+'</button>';}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function touchStreak(){var t=today();if(S.last===t)return;S.streak=(S.last===yesterday())?S.streak+1:1;S.last=t;}
function unitPct(u){var b=S.best[u.id]||{},sum=0;TYPES.forEach(function(t){if(t.graded)sum+=(b[t.id]||0);});return Math.round(sum/5);}

/* ---------- speech ---------- */
/* iPhone notes: Safari only lets a page speak after a tap, can drop an utterance
   spoken in the same instant as cancel(), may lose an utterance that is garbage-
   collected mid-sentence, and often never fires voiceschanged. Each is handled. */
var HAS_TTS=("speechSynthesis" in window)&&typeof window.SpeechSynthesisUtterance==="function";
var VOICE=null,voiceChecked=false,UTTS=[],unlocked=false;
var NOVELTY=/eddy|flo|grand|reed|rocko|sandy|shelley|jacques|eloquence|bahh|bells|boing|bubbles|cellos|wobble|zarvox|whisper|organ|trinoids|albert|superstar|bad news|good news|jester/i;
var GOOD=/thomas|audrey|aur[ée]lie|am[ée]lie|marie|google|denise|henri|julie|hortense|paul|claude|daniel|virginie|celine|c[ée]line/i;
function voiceScore(x){var s=0;if(/^fr[-_]FR/i.test(x.lang))s+=4;else if(/^fr/i.test(x.lang))s+=2;else return -99;if(GOOD.test(x.name))s+=2;if(NOVELTY.test(x.name))s-=6;if(x.localService)s+=1;return s;}
function pickVoice(){if(!HAS_TTS)return;var v=[];try{v=speechSynthesis.getVoices()||[];}catch(e){}if(!v.length)return;voiceChecked=true;
  var best=null,bs=-50;v.forEach(function(x){var sc=voiceScore(x);if(sc>bs){bs=sc;best=x;}});VOICE=bs>0?best:null;}
if(HAS_TTS){pickVoice();try{speechSynthesis.onvoiceschanged=function(){var had=!!VOICE;pickVoice();if(!had&&view.name==="home")render();};}catch(e){}
  var vp=0,vt=setInterval(function(){vp++;if(!voiceChecked)pickVoice();if(voiceChecked||vp>12){clearInterval(vt);if(!voiceChecked)voiceChecked=true;if(view.name==="home")render();}},300);
  var unlock=function(){if(unlocked)return;unlocked=true;try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;u.lang="fr-FR";speechSynthesis.speak(u);}catch(e){}};
  document.addEventListener("touchend",unlock,{passive:true});document.addEventListener("click",unlock,true);}
function utter(text,rate,pitch,voice){var u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";var v=voice||VOICE;if(v)u.voice=v;u.rate=rate||0.88;if(pitch)u.pitch=pitch;
  UTTS.push(u);if(UTTS.length>40)UTTS.shift();u.onend=u.onerror=function(){var i=UTTS.indexOf(u);if(i>=0)UTTS.splice(i,1);};return u;}
function sayQueue(list){if(!HAS_TTS||!list.length)return;
  function run(){try{speechSynthesis.resume();}catch(e){}list.forEach(function(u){try{speechSynthesis.speak(u);}catch(e){}});}
  var busy=false;try{busy=speechSynthesis.speaking||speechSynthesis.pending;}catch(e){}
  if(busy){try{speechSynthesis.cancel();}catch(e){}setTimeout(run,120);}else run();}
function sayText(t){return String(t).replace(/\(.*?\)/g,"").replace(/\s*→\s*/g,", ").replace(/\s\/\s/g,", ").replace(/\s[·—–]\s/g,", ").replace(/…/g,"").replace(/\s+,/g,",").replace(/^[,\s]+|[,\s]+$/g,"").trim();}
function speak(t){if(!HAS_TTS)return;var x=sayText(t);if(!x)return;try{sayQueue([utter(x)]);}catch(e){}}
document.addEventListener("click",function(e){var b=e.target.closest("[data-say]");if(b){e.preventDefault();speak(b.getAttribute("data-say"));}});

/* ---------- sessions ---------- */
function startSession(uid,type){
  var u=UNITS[uid],items=[];
  if(type==="mcq")items=shuffle(u.mcq).map(function(q){return{kind:"mcq",q:q[0],opts:shuffle(q[1]),ans:q[1][q[2]],why:q[3]};});
  else if(type==="fill")items=shuffle(u.fill).map(function(q){return{kind:"fill",q:q[0],ans:q[1],why:q[2]};});
  else if(type==="order")items=shuffle(u.order).map(function(q){return{kind:"order",fr:q[0],en:q[1]};});
  else if(type==="flash")items=u.vocab.map(function(v){return{kind:"flash",fr:v[0],en:v[1]};});
  else if(type==="match"){var v=shuffle(u.vocab);for(var r=0;r<2&&r*5+5<=v.length;r++)items.push({kind:"match",pairs:v.slice(r*5,r*5+5)});}
  else if(type==="listen")items=listenItems(u);
  touchStreak();save();
  go({name:"session",u:uid,type:type,items:items,i:0,correct:0,total:0,state:null});snap();
}
function listenItems(u){
  if(u.pairs)return shuffle(u.pairs).slice(0,10).map(function(p){var t=p[Math.random()<.5?0:1];return{kind:"listen",say:t,opts:shuffle(p),ans:t};});
  var words=u.vocab.map(function(v){return v[0];}),sents=u.order.map(function(o){return o[0];}),out=[];
  function sk(w){return bare(w).replace(/(es|e|s|ent)(?=\b|$)/g,"");}
  function others(list,w){return shuffle(list.filter(function(x){return x!==w&&sk(x)!==sk(w);})).slice(0,3);}
  shuffle(words).slice(0,6).forEach(function(w){out.push({kind:"listen",say:w,ans:w,opts:shuffle([w].concat(others(words,w)))});});

var AI=null,aiChecked=false;
/* On the Pioneer website the trainer is served under /practice/, and the site's own
   endpoint answers (signed-in students only). Inside Claude, the viewer's sample. */
function siteAI(){
  function call(input,opts,json){opts=opts||{};
    var body={messages:typeof input==="string"?[{role:"user",content:input}]:input,json:!!json,quick:opts.modelTier==="quick"};
    return fetch("/api/practice/tutor",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(body),signal:opts.signal})
      .then(function(r){return r.json().catch(function(){return{};}).then(function(d){
        if(!r.ok||typeof d.text!=="string")throw{code:r.status===429?"rate_limited":r.status===401?"session_expired":r.status===503?"sampling_disabled":"upstream_error",message:d.error||""};
        if(opts.onText)opts.onText({text:d.text,delta:d.text});
        if(!json)return{text:d.text,truncated:false};
        var t=d.text.replace(/^```(?:json)?\s*|\s*```$/g,"").trim(),a=t.indexOf("{"),b=t.lastIndexOf("}");
        try{return JSON.parse(t.slice(a,b+1));}catch(e){throw{code:"invalid_json",text:d.text};}});},
      function(e){if(e&&e.name==="AbortError")throw{code:"cancelled"};throw e&&e.code?e:{code:"upstream_error"};});}
  var f=function(i,o){return call(i,o,false);};f.json=function(i,o){return call(i,o,true);};return f;}
try{
  if(window.claude&&typeof window.claude.use==="function"){window.claude.use("sample").then(function(s){AI=s||null;aiChecked=true;render();},function(){aiChecked=true;});}
  else if(/^\/practice\//.test(location.pathname)&&location.protocol.indexOf("http")===0){AI=siteAI();aiChecked=true;}
  else aiChecked=true;
}catch(e){aiChecked=true;}
function aiErr(e){var c=e&&e.code;
  if(c==="not_granted"||c==="sampling_disabled"||c==="not_declared"||c==="capability_disabled"||c==="capability_removed"){AI=null;return "The AI tutor is not available in this view. Use the model answer instead.";}
  if(c==="rate_limited")return "Too many requests right now. Wait a minute, then try again.";
  if(c==="session_expired")return "Please sign in to Claude again, then try again.";
  if(c==="cancelled")return "";
  if(c==="invalid_json"||c==="empty_completion")return "The tutor's answer could not be read. Try again.";
  return "Something went wrong reaching the tutor. Try again.";}

        var p=TUTOR_RULES+"\n\nMark this DELF A1 writing paper strictly but fairly, like an official examiner.\nExercise 1 (10 points): the candidate completes a form for a language school in Paris. Give 1 point per field that is filled with an appropriate, understandable answer.\n"+formTxt+"\n\nExercise 2 (15 points): "+W.text.task+"\nCandidate's text:\n<<<\n"+(E.wt||"")+"\n>>>\nGrid: "+g.map(function(r){return r[0]+" /"+r[1];}).join("; ")+".\nUse half points if needed. Reply with only JSON: {\"form\": number 0-10, \"grid\": [6 numbers in the grid's order], \"summary\": 2–3 English sentences explaining the mark, \"corrections\": [{\"wrong\":...,\"right\":...,\"why\":...}] (max 10)}.";
        askJSON(am,document.getElementById("aiw"),p,"default",function(r){var mx=g.map(function(x){return x[1];});
          if(typeof r.form==="number")document.getElementById("eg-form").value=Math.min(10,Math.max(0,r.form));
          if(Array.isArray(r.grid))r.grid.slice(0,6).forEach(function(v,i){document.getElementById("eg"+i).value=Math.min(mx[i],Math.max(0,+v||0));});
          readMarks();document.getElementById("wtot").textContent=(E.wform+sumGrid(E.wg))+" / 25";save();renderFeedback(document.getElementById("aiw"),r);});};
    });
  }
  if(sec==="O"){
    var O=EXAM.speaking;
    h+=O.parts.map(function(p){return '<section class="note"><h3>'+esc(p.title)+'</h3><p>'+fr(p.task)+'</p><p>'+p.examples.map(function(x){return '<span class="chip">'+fr(x)+'</span>';}).join(" ")+'</p></section>';}).join("");
    h+='<section class="note"><h3>Examiner\'s marks</h3><p class="muted">The teacher listens and enters marks. Modelled on the DELF A1 oral marking grid.</p><div class="tbl"><table><tbody>'+O.grid.map(function(r,i){return '<tr><td>'+esc(r[0])+'</td><td class="num"><input type="number" min="0" max="'+r[1]+'" step="0.5" id="og'+i+'" value="'+(E.og[i]||0)+'"> / '+r[1]+'</td></tr>';}).join("")+'</tbody></table></div><div class="row" style="margin-top:12px"><button class="btn primary" id="osave">Save speaking mark</button><span class="chip acc" id="otot">'+sumGrid(E.og)+' / 25</span></div></section>';
    POST.push(function(){function rd(){E.og=O.grid.map(function(r,i){return Math.min(r[1],Math.max(0,+document.getElementById("og"+i).value||0));});document.getElementById("otot").textContent=sumGrid(E.og)+" / 25";save();}
      O.grid.forEach(function(r,i){document.getElementById("og"+i).oninput=rd;});document.getElementById("osave").onclick=function(){rd();E.O=sumGrid(E.og);E.Odone=true;save();render();};});
  }
  if(sec==="res"){
    var parts=[["L","Compréhension de l'oral"],["R","Compréhension des écrits"],["W","Production écrite"],["O","Production orale"]],tot=examTotal(),all=parts.every(function(p){return E[p[0]+"done"];}),minOk=parts.every(function(p){return (E[p[0]]||0)>=5;}),pass=all&&tot>=50&&minOk;
    E.done=all;save();
    h+='<div class="qcard" style="text-align:center;justify-items:center"><p class="eyebrow">Mock DELF A1 result</p><div class="score">'+tot+' / 100</div><h3>'+(!all?"Finish all four parts to get your result":pass?"Admis — you would pass":"Not yet — keep practising")+'</h3>'+
      (all&&!pass?'<p class="muted">'+(tot<50?"You need 50 / 100 in total. ":"")+(!minOk?"Every part needs at least 5 / 25.":"")+'</p>':'')+
      '<div class="reslist" style="width:100%;text-align:left">'+parts.map(function(p){var v=E[p[0]]||0;return '<div class="resrow"><span>'+esc(p[1])+'</span><b style="color:var(--'+(!E[p[0]+"done"]?"muted":v>=5?"good":"bad")+')">'+(E[p[0]+"done"]?v+" / 25":"not done")+'</b></div>';}).join("")+'</div></div>';
  }
  return h;
}

/* ---------- ask the tutor (lesson tab) ---------- */
function tutorBox(u){
  if(!AI)return '';
  POST.push(function(){var b=document.getElementById("askb"),q=document.getElementById("askq"),out=document.getElementById("askout"),ctl=null;
    function ask(){var t=q.value.trim();if(!t)return;b.disabled=true;out.textContent="Thinking…";ctl=new AbortController();
      var notes=u.notes.map(function(n){return n.h+": "+stripTags(n.html||"")+(n.table?" "+n.table.rows.map(function(r){return r.join(" | ");}).join("; "):"")+(n.conj?" "+n.conj.map(function(r){return r.join(" ");}).join(", "):"");}).join("\n").slice(0,6000);
      AI(TUTOR_RULES+"\n\nThe student is studying Unit "+u.id+" (\""+u.fr+"\" — "+u.en+"). Lesson notes:\n"+notes+"\n\nStudent's question: "+t+"\n\nAnswer in clear, short English (under 150 words) with one or two French examples. If the question is not about French, gently bring them back to the lesson. Plain text, no markdown headings.",
        {signal:ctl.signal,onText:function(x){out.textContent=x.text;}}).then(function(){b.disabled=false;},function(e){b.disabled=false;var m=aiErr(e);if(m)out.textContent=m;});}
    b.onclick=ask;q.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();ask();}};});
  return '<section class="note tutor"><h3>Ask the AI tutor</h3><p class="muted">Stuck on something in this lesson? Ask in English, Punjabi or Hindi.</p><div class="row"><input class="ans sm" id="askq" placeholder="e.g. When do I use du and when de la?" autocomplete="off" aria-label="Your question"><button class="btn primary" id="askb">Ask</button></div><p class="ai-out" id="askout" aria-live="polite"></p></section>';
}

if(m&&UNITS[+m[1]])view={name:"unit",u:+m[1],tab:"lesson"};
