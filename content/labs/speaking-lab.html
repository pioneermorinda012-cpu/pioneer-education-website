<style>
/* Layout: an app shell. Skill meters on top, track tabs, then unit rows.
   Every passage, script and sentence sits on a dotted notebook sheet in a serif face. */
:root{
  --bg:#f5f2f3; --card:#ffffff; --sunk:#ece6e8; --ink:#25181c; --muted:#6c5d62; --line:#e2d8db;

  --good:#1d7449; --good-soft:#dff1e6; --bad:#b0281f; --bad-soft:#fae2df;
  --dot:rgba(110,80,90,.15); --mark:#ffe19c; --mark-on:#ffc94d;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;

}

  --brand:#e5788d; --brand-ink:#1a0c10; --brand-soft:#3b1c24;
  --c0:#e5788d; --c1:#5cc6bf; --c2:#e8ab4f; --c3:#97a6f0;
  --c0-soft:#3b1c24; --c1-soft:#12302e; --c2-soft:#33250f; --c3-soft:#1f2442;
  --good:#62c895; --good-soft:#14301f; --bad:#f08b81; --bad-soft:#391b19;
  --dot:rgba(235,205,215,.09); --mark:#5a4313; --mark-on:#8a6418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141012; --card:#1e181a; --sunk:#271f22; --ink:#f1e9eb; --muted:#b0a2a6; --line:#382d31;
  --brand:#e5788d; --brand-ink:#1a0c10; --brand-soft:#3b1c24;
  --c0:#e5788d; --c1:#5cc6bf; --c2:#e8ab4f; --c3:#97a6f0;

.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.prompt{font-size:14px;font-weight:600;color:var(--muted)}
.b5{font-size:12px;font-weight:700;color:var(--bad);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px;font-family:var(--f-ui)}

.fixed{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}

.gapin{display:flex;gap:10px;flex-wrap:wrap}

.line{min-height:56px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;align-items:center}

.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{font-family:var(--f-letter);font-size:17px;padding:7px 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--card);cursor:pointer}

.ord{display:flex;flex-direction:column;gap:8px}
.ord .tile,.ordline .tile{text-align:left;line-height:1.4;display:flex;gap:10px;align-items:flex-start;width:100%}

.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer;display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.audio .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 160px}

.audio .meta span{font-size:13px;color:var(--muted)}
.speed{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.speed button{border:0;background:var(--card);padding:7px 11px;font-size:13px;font-weight:600;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.script{font-family:var(--f-letter);font-size:16px;line-height:1.6;white-space:pre-line;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.big{font-family:var(--f-num);font-size:52px;font-weight:700;line-height:1}
.review{display:flex;flex-direction:column;gap:10px}

.notes li.on{background:var(--brand-soft)}

.notes q{font-family:var(--f-letter);quotes:none}

.clock{font-family:var(--f-num);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.phase{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.checks{display:flex;flex-direction:column;gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.checks input{width:18px;height:18px;margin-top:2px;accent-color:var(--brand)}
.tablebox{overflow-x:auto}
table.words{width:100%;border-collapse:collapse;font-size:15px;min-width:520px}
table.words th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.danger{color:var(--bad);border-color:var(--bad)}
@media (max-width:560px){
  .meters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .letter{font-size:18px}
  .unit{grid-template-columns:42px minmax(0,1fr) auto;gap:10px;padding:12px}

</style>

<script>

{id:"p1",code:"P1",name:"Part 1",short:"4–5 minutes · familiar topics",blurb:"Short answers, extended naturally"},
{id:"p2",code:"P2",name:"Part 2",short:"1 minute to prepare · 2 minutes to speak",blurb:"The long turn: structure and storytelling"},
{id:"p3",code:"P3",name:"Part 3",short:"4–5 minutes · abstract discussion",blurb:"Opinions, comparisons and the future"},

{id:"s1",track:"p1",title:"Extending short answers",crit:["FC","LR"],

<script>
(function(){
const KEY=APP.key;
const CK=Object.keys(APP.crit);                       // criterion keys in display order
const CRIT=Object.fromEntries(CK.map(k=>[k,APP.crit[k]]));
const cc=k=>"c"+CK.indexOf(k);
const TAGS=APP.tags;
const TYPE_PROMPT={mc:"Choose the correct answer.",up:"Choose the Band 7 version.",reg:"Which register is this?",fx:"Choose the answer.",gap:"Type the answer.",build:"Tap the words in the right order.",order:"Tap them in a logical order."};
const MODELS_=typeof MODELS!=="undefined"?MODELS:[], WORDS_=typeof WORDS!=="undefined"?WORDS:[], CUES_=typeof CUES!=="undefined"?CUES:[];
const app=document.getElementById("app");
document.getElementById("appName").textContent=APP.name;
document.getElementById("appSub").textContent=APP.sub;
const U_BY=Object.fromEntries(UNITS.map(u=>[u.id,u]));
const M_BY=Object.fromEntries(MODELS_.map(m=>[m.id,m]));

// ---------------- persistence: device + account + backup code ----------------
function blank(){return {v:1,name:"",best:{},tries:{},mistakes:{},models:{},cues:{},last:"",updated:0};}
let S=blank(), localOK=true, cloudRef=null, saveTimer=null;
function merge(a,b){
  const o=blank(), newer=(b.updated||0)>(a.updated||0)?b:a;
  o.name=newer.name||a.name||b.name||""; o.last=newer.last||a.last||b.last||"";
  for(const f of ["best","tries","cues"]) for(const k of new Set([...Object.keys(a[f]||{}),...Object.keys(b[f]||{})])) o[f][k]=Math.max(a[f]?.[k]??0,b[f]?.[k]??0);
  o.models={...(a.models||{}),...(b.models||{})};
  o.mistakes={...(newer.mistakes||{})};
  o.updated=Math.max(a.updated||0,b.updated||0);
  return o;
}
function loadLocal(){try{const r=localStorage.getItem(KEY);if(r) S=merge(blank(),JSON.parse(r));}catch(e){localOK=false;}}
function persist(){
  S.updated=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));localOK=true;}catch(e){localOK=false;}
  if(cloudRef){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{cloudRef.set(JSON.parse(JSON.stringify(S))).then(status).catch(()=>{cloudRef=null;status();});},600);}
  status();
}
function status(){
  const b=document.getElementById("save"),l=document.getElementById("saveLbl");
  b.classList.remove("ok","warn");
  if(cloudRef){b.classList.add("ok");l.textContent="Saved to your account";}
  else if(localOK){b.classList.add("ok");l.textContent="Saved on this device";}
  else{b.classList.add("warn");l.textContent="Not saved: use a backup code";}
}
async function connectCloud(){
  try{
    if(!window.claude||!claude.use) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.doc("data/users/"+id+"/"+APP.doc);
    const snap=await ref.get();
    if(snap.exists){S=merge(S,snap.data());try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
    cloudRef=ref; await ref.set(JSON.parse(JSON.stringify(S)));
    status(); if(!document.querySelector("[data-busy]")) route();
  }catch(e){cloudRef=null;status();}
}
const exportCode=()=>APP.code+"-"+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function importCode(c){c=c.trim();if(!c.startsWith(APP.code+"-")) throw 0;S=merge(S,JSON.parse(decodeURIComponent(escape(atob(c.slice(APP.code.length+1))))));persist();}

// ---------------- speech (Listening and pronunciation) ----------------
const TTS="speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
let rate=1, voices=[];
function loadVoices(){ if(!TTS) return; const all=speechSynthesis.getVoices();
  const en=all.filter(v=>/^en[-_]/i.test(v.lang));
  const gb=en.filter(v=>/GB|UK/i.test(v.lang)), au=en.filter(v=>/AU/i.test(v.lang)), rest=en.filter(v=>!gb.includes(v)&&!au.includes(v));
  voices=[...gb,...au,...rest]; }
if(TTS){loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}
const lines=say=>say.split("\n").map(l=>{const m=l.match(/^([A-Z][a-z]*):\s*(.*)$/);return m?{who:m[1],text:m[2]}:{who:"",text:l};}).filter(l=>l.text);
function speak(say,onEnd){
  if(!TTS) return false;
  speechSynthesis.cancel();
  const ls=lines(say), who=[...new Set(ls.map(l=>l.who))];
  ls.forEach((l,k)=>{const u=new SpeechSynthesisUtterance(l.text);
    const w=who.indexOf(l.who); const v=voices.length?voices[Math.min(w,voices.length-1)]||voices[0]:null;
    if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-GB";
    u.rate=rate; u.pitch=w===1&&voices.length<2?1.25:1;
    if(k===ls.length-1&&onEnd) u.onend=onEnd;
    speechSynthesis.speak(u);});
  return true;
}
const stopSpeech=()=>{if(TTS) speechSynthesis.cancel();};

// ---------------- helpers ----------------
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const blanks=q=>esc(q).replace("___",'<span class="blank" aria-label="blank"></span>');
const norm=s=>s.toLowerCase().replace(/[’]/g,"'").replace(/[£$€]/g,"").replace(/[.,!?;]+$/,"").replace(/[\s-]+/g,"").trim();
const chips=c=>c.map(k=>`<span class="chip ${cc(k)}" title="${esc(CRIT[k][0])}">${k}</span>`).join("");
const trackOf=u=>TRACKS.find(t=>t.id===u.track);
const unitCode=u=>(trackOf(u).code||u.track.toUpperCase())+"·"+(UNITS.filter(x=>x.track===u.track).indexOf(u)+1);
function ring(p){const r=19,c=2*Math.PI*r,col=p>=85?"var(--good)":p>=60?"var(--brand)":p>0?"var(--bad)":"var(--sunk)";
  return `<div class="ring" aria-label="${p?p+'% best score':'Not started'}"><svg viewBox="0 0 46 46"><circle class="bg" cx="23" cy="23" r="${r}" fill="none" stroke-width="5"/><circle class="fg" cx="23" cy="23" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}"/></svg><span>${p?p+"%":"–"}</span></div>`;}
const critScore=k=>{const us=UNITS.filter(u=>u.crit.includes(k));return us.length?Math.round(us.reduce((n,u)=>n+(S.best[u.id]||0),0)/us.length):0;};
function correctText(it){
  if(it.t==="mc"||it.t==="up") return it.o[0];
  if(it.t==="reg") return TAGS[it.a]||it.a;
  if(it.t==="fx") return it.c[it.a];
  if(it.t==="gap") return it.a[0];
  if(it.t==="build") return it.s;
  if(it.t==="order") return it.s.map((s,k)=>(k+1)+". "+s).join("\n");
}
const itemLabel=it=>it.t==="build"?"Build: "+it.s:it.t==="order"?"Put in order: "+it.s[0]:(it.say&&!it.q?"Listening question":it.q);
const ICON_PLAY='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3l12 7-12 7z" fill="currentColor"/></svg>';
const ICON_STOP='<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="2" fill="currentColor"/></svg>';
let tab=(()=>{try{return localStorage.getItem(KEY+"-tab")||TRACKS[0].id;}catch(e){return TRACKS[0].id;}})();

// ---------------- routing ----------------
function go(h){ if(location.hash.slice(1)===h) route(); else location.hash=h; }
window.addEventListener("hashchange",route);
document.getElementById("home").onclick=()=>go("");
document.getElementById("save").onclick=()=>go("progress");
let cueTimer=null;
function route(){
  stopSpeech(); clearInterval(cueTimer);
  const h=location.hash.slice(1); window.scrollTo(0,0);
  if(U_BY[h]) return unitView(U_BY[h]);
  if(M_BY[h]) return modelView(M_BY[h]);
  if(h.startsWith("cue")&&CUES_[+h.slice(3)]) return cueView(+h.slice(3));
  if(h==="progress") return progressView();
  if(h==="check") return startDrill({kind:"check"});
  if(h==="mistakes") return startDrill({kind:"mistakes"});
  home();
}

  const t=TRACKS.find(x=>x.id===tab)||TRACKS[0];

  app.innerHTML=`
  <section class="hello">
    <span class="eyebrow">${esc(APP.eyebrow)}</span>

  <div class="row">
    ${last?`<button class="btn" id="resume">Continue: ${esc(last.title)}</button>`:`<button class="btn" id="qc">Take the 2-minute quick check</button>`}
    ${last?`<button class="btn quiet" id="qc">Quick check</button>`:""}
    <button class="btn quiet" id="mk" ${nm?"":"disabled"}>Practise my mistakes${nm?" ("+nm+")":""}</button>
  </div>
  ${APP.audio&&!TTS?`<div class="tipbox"><b>Audio is not available in this browser</b><p>You can still practise: each question lets you read the script instead. For audio, open the Lab in Chrome or Safari.</p></div>`:""}
  ${S.name?"":`<label class="f" for="nm">Your name (shown on shared results)<input type="text" id="nm" autocomplete="name" placeholder="e.g. Mehtab Singh"></label>`}
  <div class="tabs" role="tablist">${TRACKS.map(x=>`<button class="tab" role="tab" aria-selected="${x.id===t.id}" data-t="${x.id}">${esc(x.name)}</button>`).join("")}</div>
  <div class="trackhead"><span class="eyebrow">${esc(t.short)}</span><h2>${esc(t.blurb)}</h2></div>
  ${units.length?`<div class="units">${units.map(u=>`<button class="unit" data-u="${u.id}"><span class="code">${unitCode(u)}</span><span class="ut"><b>${esc(u.title)}</b><span class="chips">${chips(u.crit)}<span class="chip n">${u.items.length} questions</span></span></span>${ring(S.best[u.id]||0)}</button>`).join("")}</div>`:""}
  ${models.length?`<div class="trackhead"><span class="eyebrow">${esc(APP.modelsEyebrow||"Read like an examiner")}</span><h2>${esc(APP.modelsTitle||"Band 8 model answers")}</h2></div>
  <div class="models">${models.map(m=>`<button class="model" data-m="${m.id}"><b>${esc(m.title)}</b><small>${esc(m.task.split("\n")[0])}</small>${S.models[m.id]?'<span class="seen">✓ Read</span>':""}</button>`).join("")}</div>`:""}
  ${cues.length?`<div class="trackhead"><span class="eyebrow">Timed practice</span><h2>Cue cards: 1 minute to prepare, 2 minutes to speak</h2></div>
  <div class="models">${cues.map(x=>`<button class="model" data-c="${x.k}"><b>${esc(x.c.title)}</b><small>${esc(x.c.points.join(" · "))}</small>${S.cues[x.k]?`<span class="seen">✓ Practised ${S.cues[x.k]}×</span>`:""}</button>`).join("")}</div>`:""}
  ${WORDS_.length?`<div class="trackhead"><span class="eyebrow">Word bank</span><h2>${esc(APP.wordsTitle||"Band 7 words with German")}</h2></div>
  <div class="sheet tablebox"><table class="words"><thead><tr><th>Word</th><th>Meaning</th><th>Example</th><th>German</th></tr></thead><tbody>${WORDS_.map(w=>`<tr><td>${esc(w[0])}</td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td>${esc(w[3])}</td></tr>`).join("")}</tbody></table></div>`:""}`;

}

  app.innerHTML=`
  <div><button class="link" id="back">← All units</button></div>
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1 1 300px">
      <span class="eyebrow">${unitCode(u)} · ${esc(trackOf(u).short)}</span>
      <h1>${esc(u.title)}</h1>
      <div class="chips">${u.crit.map(k=>`<span class="chip ${cc(k)}">${k} · ${esc(CRIT[k][0])}</span>`).join("")}</div>
    </div>${ring(p)}
  </div>
  <div class="tipbox"><b>Band 7 target</b><p>${esc(u.tip)}</p></div>
  <h2>${esc(APP.bankTitle||"Language bank")}</h2>
  <div class="sheet bank">${u.bank.map(b=>`<div class="${b[0]}"><span class="tag ${b[0]}">${esc(TAGS[b[0]]||b[0])}</span><span class="ph">${esc(b[1])}</span><span class="use">${esc(b[2])}</span></div>`).join("")}</div>
  <div class="row"><button class="btn" id="start">${p?"Practise again":"Start the drill"} · ${u.items.length} questions</button>${S.tries[u.id]?`<span class="muted">Best ${p}% · ${S.tries[u.id]} attempt${S.tries[u.id]>1?"s":""}</span>`:""}</div>`;
  document.getElementById("back").onclick=()=>{tab=u.track;go("");};

// ---------------- drills ----------------
function findItem(key){const [u,i]=key.split(":");return U_BY[u]?.items[+i]?{u:U_BY[u],i:+i,it:U_BY[u].items[+i]}:null;}
function startDrill(cfg){
  let list=[];
  if(cfg.kind==="unit") list=cfg.unit.items.map((it,i)=>({u:cfg.unit,i,it}));
  else if(cfg.kind==="mistakes") list=shuffle(Object.keys(S.mistakes).map(findItem).filter(Boolean)).slice(0,15);
  else for(const t of TRACKS){const pool=[];UNITS.filter(u=>u.track===t.id).forEach(u=>u.items.forEach((it,i)=>pool.push({u,i,it})));list.push(...shuffle(pool).slice(0,Math.max(2,Math.ceil(10/TRACKS.length))));}
  if(!list.length) return go("");
  ask({cfg,list,pos:0,res:[],t0:Date.now()});
}
const dotsHTML=D=>D.list.map((_,k)=>`<i class="${D.res[k]?(D.res[k].ok?"ok":"no"):""} ${k===D.pos?"cur":""}"></i>`).join("");
function dhead(D){
  const title=D.cfg.kind==="unit"?D.cfg.unit.title:D.cfg.kind==="check"?"Quick check":"My mistakes";
  return `<div><button class="link" id="quit">← Leave drill</button></div>
  <div class="dhead"><span class="eyebrow">${D.cfg.kind==="unit"?unitCode(D.cfg.unit):"Mixed"} · ${esc(title)}</span><span class="num muted" style="font-size:13px">${D.pos+1} / ${D.list.length}</span></div>
  <div class="dots" aria-hidden="true">${dotsHTML(D)}</div>`;
}
function audioBox(it){
  return `<div class="audio" id="ab"><button class="play" id="play" aria-label="Play the recording">${ICON_PLAY}</button>
  <div class="meta"><b id="pstate">${TTS?"Press play and listen":"Audio is not available here"}</b><span id="pcount">${TTS?(it.once?"Exam mode: listen once":"You can replay as often as you need"):"Read the script instead"}</span></div>
  ${TTS?`<div class="speed" role="group" aria-label="Speed"><button data-r="1" aria-pressed="${rate===1}">Normal</button><button data-r="0.8" aria-pressed="${rate!==1}">Slower</button></div>`:`<button class="btn quiet" id="showscript">Show the script</button>`}</div>
  <div id="noscript"></div>`;
}
function wireAudio(it){
  let plays=0,playing=false;
  const pb=document.getElementById("play"), st=document.getElementById("pstate"), ct=document.getElementById("pcount");
  if(!TTS){pb.disabled=true;document.getElementById("showscript").onclick=e=>{document.getElementById("noscript").innerHTML=`<div class="sheet passage"><span class="lbl">Script</span>${esc(it.say)}</div>`;e.target.remove();};return;}
  const end=()=>{playing=false;pb.innerHTML=ICON_PLAY;st.textContent="Finished";if(it.once&&plays>=1){pb.disabled=true;}};
  pb.onclick=()=>{
    if(playing){stopSpeech();end();return;}
    if(it.once&&plays>=1) return;
    plays++;playing=true;pb.innerHTML=ICON_STOP;st.textContent="Playing…";
    ct.textContent=it.once?"Exam mode: listen once":"Played "+plays+"×";
    speak(it.say,end);
  };
  document.querySelectorAll(".speed button").forEach(b=>b.onclick=()=>{rate=+b.dataset.r;document.querySelectorAll(".speed button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));});
}
function ask(D){
  const {u,it}=D.list[D.pos];
  const ctx=D.cfg.kind==="unit"?"":`<span class="chips"><span class="chip n">${esc(u.title)}</span></span>`;
  const pass=it.p?`<div class="sheet passage"><span class="lbl">${esc(it.pl||"Read the text")}</span>${esc(it.p)}</div>`:"";
  const aud=it.say?audioBox(it):"";
  const qtext=it.q||"";
  let body="";
  if(it.t==="mc"||it.t==="up"){
    D.opts=shuffle(it.o);
    body=`${qtext?`<div class="sheet letter">${it.t==="up"?'<span class="b5">Band 5 answer</span>'+esc(qtext):blanks(qtext)}</div>`:""}
      <div class="opts">${D.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>`;
  } else if(it.t==="reg"||it.t==="fx"){
    const ch=it.t==="reg"?Object.keys(TAGS).filter(k=>["F","S","I"].includes(k)):it.c.map((_,k)=>k);
    body=`${qtext?`<div class="sheet letter">${blanks(qtext)}</div>`:""}<div class="fixed">${ch.map(r=>`<button class="opt" data-r="${r}">${esc(it.t==="reg"?TAGS[r]:it.c[r])}</button>`).join("")}</div>`;
  } else if(it.t==="gap"){
    body=`<div class="sheet letter">${blanks(qtext)}</div>${it.lim?`<span class="prompt">${esc(it.lim)}</span>`:""}<form class="gapin" id="gf"><input id="gi" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn" id="gb">Check</button></form>`;
  } else if(it.t==="build"){
    body=`<div class="sheet"><div class="line letter" id="line"></div></div><div class="tiles" id="pool"></div><div class="row"><button class="btn" id="chk" disabled>Check</button><button class="btn quiet" id="clr">Clear</button></div>`;
  } else if(it.t==="order"){
    body=`${qtext?`<p>${esc(qtext)}</p>`:""}<div class="sheet"><div class="ordline" id="line"></div></div><div class="ord" id="pool"></div><div class="row"><button class="btn" id="chk" disabled>Check</button><button class="btn quiet" id="clr">Clear</button></div>`;
  }
  app.innerHTML=`${dhead(D)}<div style="display:flex;flex-direction:column;gap:6px">${ctx}<span class="prompt">${esc(it.ask||TYPE_PROMPT[it.t])}</span></div>${pass}${aud}${body}<div id="fb" style="display:flex;flex-direction:column;gap:12px"></div>`;
  app.firstElementChild.setAttribute("data-busy","1");
  document.getElementById("quit").onclick=()=>{stopSpeech();D.cfg.kind==="unit"?go(D.cfg.unit.id):go("");};
  if(it.say) wireAudio(it);
  const done=(ok,yours)=>answer(D,ok,yours);
  if(it.t==="mc"||it.t==="up"){
    const bs=[...app.querySelectorAll(".opt")];
    bs.forEach(b=>b.onclick=()=>{const pick=D.opts[+b.dataset.k],ok=pick===it.o[0];
      bs.forEach(x=>{x.disabled=true;if(D.opts[+x.dataset.k]===it.o[0])x.classList.add("right");});
      if(!ok)b.classList.add("wrong");done(ok,pick);});
  } else if(it.t==="reg"||it.t==="fx"){
    const bs=[...app.querySelectorAll(".fixed .opt")];
    const right=String(it.a);
    bs.forEach(b=>b.onclick=()=>{const ok=b.dataset.r===right;
      bs.forEach(x=>{x.disabled=true;if(x.dataset.r===right)x.classList.add("right");});
      if(!ok)b.classList.add("wrong");done(ok,b.textContent);});
  } else if(it.t==="gap"){
    const inp=document.getElementById("gi"); if(!it.say) inp.focus();
    document.getElementById("gf").onsubmit=e=>{e.preventDefault();if(!inp.value.trim())return;
      const ok=it.a.some(a=>norm(a)===norm(inp.value));
      inp.disabled=true;document.getElementById("gb").disabled=true;inp.classList.add(ok?"right":"wrong");done(ok,inp.value.trim());};
  } else {
    const isOrder=it.t==="order", target=isOrder?it.s:it.s.split(" ");
    let pool=shuffle(target.map((w,k)=>({w,k}))); if(pool.every((p,k)=>p.k===k)) pool.reverse();
    let placed=[],locked=false;
    const line=document.getElementById("line"),pe=document.getElementById("pool"),chk=document.getElementById("chk");
    const tile=(p,k,cls)=>isOrder?`<button class="tile ${cls}" data-k="${k}"><span class="no">${cls==="placed"?k+1:"·"}</span><span>${esc(p.w)}</span></button>`:`<button class="tile ${cls}" data-k="${k}">${esc(p.w)}</button>`;
    const draw=()=>{
      line.innerHTML=placed.map((p,k)=>tile(p,k,"placed")).join("");
      pe.innerHTML=pool.map((p,k)=>placed.includes(p)?(isOrder?"":`<button class="tile used" tabindex="-1" aria-hidden="true">${esc(p.w)}</button>`):tile(p,k,"")).join("");
      chk.disabled=locked||placed.length!==pool.length;
      if(locked) return;
      line.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{placed.splice(+b.dataset.k,1);draw();});
      pe.querySelectorAll(".tile:not(.used)").forEach(b=>b.onclick=()=>{placed.push(pool[+b.dataset.k]);draw();});
    };
    draw();
    document.getElementById("clr").onclick=()=>{if(!locked){placed=[];draw();}};
    chk.onclick=()=>{const ok=placed.every((p,k)=>p.w===target[k]);locked=true;draw();line.classList.add(ok?"ok":"no");document.getElementById("clr").disabled=true;done(ok,placed.map(p=>p.w).join(" "));};
  }
}
function answer(D,ok,yours){
  const {u,i,it}=D.list[D.pos], key=u.id+":"+i;
  D.res[D.pos]={ok,yours,u,i,it};
  if(ok) delete S.mistakes[key]; else S.mistakes[key]=Date.now();
  persist();
  const last=D.pos===D.list.length-1;
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b>${ok?"":`<span class="fix" style="white-space:pre-line">${esc(correctText(it))}</span>`}<span>${esc(it.why)}</span>${it.say?`<div class="script"><b style="font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)">Script</b>\n${esc(it.say)}</div>`:""}</div>
    <div class="row"><button class="btn" id="next">${last?"See my results":"Next question"}</button></div>`;
  const ns=document.getElementById("noscript"); if(ns) ns.innerHTML="";
  document.querySelector(".dots").innerHTML=dotsHTML(D);
  const n=document.getElementById("next"); n.focus({preventScroll:true}); n.scrollIntoView({block:"nearest"});
  n.onclick=()=>{stopSpeech();if(last) results(D); else {D.pos++;ask(D);window.scrollTo(0,0);}};
}
function results(D){
  const right=D.res.filter(r=>r.ok).length,total=D.list.length,pct=Math.round(right/total*100);
  const secs=Math.round((Date.now()-D.t0)/1000), time=Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0");
  let prev=0;
  if(D.cfg.kind==="unit"){const id=D.cfg.unit.id;prev=S.best[id]||0;S.best[id]=Math.max(prev,pct);S.tries[id]=(S.tries[id]||0)+1;persist();}
  const wrong=D.res.filter(r=>!r.ok);
  const title=D.cfg.kind==="unit"?D.cfg.unit.title:D.cfg.kind==="check"?"Quick check":"My mistakes";
  const verdict=pct>=85?"Band 7 control. Move on to the next unit.":pct>=60?"Close. Read the bank again and repeat the drill.":"Read the strategy first, then repeat the drill tomorrow.";
  let recs="";
  if(D.cfg.kind==="check"){const weak=[...new Set(wrong.map(r=>r.u.id))].map(id=>U_BY[id]);
    recs=weak.length?`<h2>Start with these units</h2><div class="units">${weak.map(u=>`<button class="unit" data-u="${u.id}"><span class="code">${unitCode(u)}</span><span class="ut"><b>${esc(u.title)}</b><span class="chips">${chips(u.crit)}</span></span>${ring(S.best[u.id]||0)}</button>`).join("")}</div>`:`<p>No weak areas found. Work through the units in order.</p>`;}
  const share=`Pioneer ${APP.name}\nName: ${S.name||"Student"}\n${title}: ${right}/${total} (${pct}%)\nTime: ${time}`+(D.cfg.kind==="unit"?`\nBest so far: ${S.best[D.cfg.unit.id]}%`:"");
  const sib=D.cfg.kind==="unit"?UNITS.filter(u=>u.track===D.cfg.unit.track):[], nextU=D.cfg.kind==="unit"?sib[sib.indexOf(D.cfg.unit)+1]:null;
  app.innerHTML=`
  <span class="eyebrow">Results${S.name?" · "+esc(S.name):""}</span>
  <h1>${esc(title)}</h1>
  <div class="row" style="align-items:flex-end;gap:16px"><span class="big">${right}<span class="muted" style="font-size:26px">/${total}</span></span><span class="muted">${pct}% · ${time}${D.cfg.kind==="unit"&&pct>prev&&prev?" · new best (was "+prev+"%)":""}</span></div>
  <p>${verdict}</p>
  <div class="row">
    ${nextU?`<button class="btn" id="nu">Next unit: ${esc(nextU.title)}</button>`:""}
    <button class="btn ${nextU?"quiet":""}" id="again">${D.cfg.kind==="unit"?"Repeat this unit":"Back to all units"}</button>
    <a class="btn quiet" href="https://wa.me/?text=${encodeURIComponent(share)}" target="_blank" rel="noopener">Send on WhatsApp</a>
    <button class="btn quiet" id="cp">Copy result</button>
  </div>
  <div class="toast" id="toast"></div>
  ${recs}
  ${wrong.length?`<h2>Review your mistakes</h2><p class="muted">These stay in “Practise my mistakes” until you answer them correctly.</p><div class="review">${wrong.map(r=>`<article><small>${esc(r.u.title)}</small><span>${esc(itemLabel(r.it))}</span><span class="y">✗ ${esc(r.yours)}</span><span class="c" style="white-space:pre-line">✓ ${esc(correctText(r.it))}</span><small>${esc(r.it.why)}</small></article>`).join("")}</div>`:""}`;
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>go(b.dataset.u));
  const nu=document.getElementById("nu"); if(nu) nu.onclick=()=>go(nextU.id);
  document.getElementById("again").onclick=()=>D.cfg.kind==="unit"?startDrill(D.cfg):go("");
  document.getElementById("cp").onclick=()=>{const t=document.getElementById("toast");
    navigator.clipboard.writeText(share).then(()=>t.textContent="Result copied.").catch(()=>t.textContent=share.replace(/\n/g," · "));};
}

// ---------------- model answers ----------------
function modelView(m){
  let html=esc(m.text);
  m.marks.forEach((mk,k)=>{const e=esc(mk[0]),idx=html.indexOf(e);if(idx<0)return;
    html=html.slice(0,idx)+`<button class="hl" data-k="${k}">${e}<sup>${k+1}</sup></button>`+html.slice(idx+e.length);});
  const words=m.text.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w)).length;
  app.innerHTML=`
  <div><button class="link" id="back">← All units</button></div>
  <span class="eyebrow">Model answer · ${esc(TRACKS.find(t=>t.id===m.track).short)} · ${words} words</span>
  <h1>${esc(m.title)}</h1>
  <div class="taskbox"><b>${esc(m.taskLabel||"Task")}.</b> ${esc(m.task)}</div>
  <div class="row">${TTS&&APP.speakModels?`<button class="btn quiet" id="listen">${ICON_PLAY} Listen to this answer</button>`:""}${m.cue!=null?`<button class="btn" id="try">Try this cue card with the timer</button>`:""}</div>
  <p class="muted">Tap a highlighted phrase to see why it earns marks.</p>
  <div class="sheet model-text">${html}</div>
  <h2>What the examiner notices</h2>
  <ol class="notes">${m.marks.map((mk,k)=>`<li data-k="${k}"><span>${k+1}</span><span><q>${esc(mk[0])}</q> ${esc(mk[1])}</span></li>`).join("")}</ol>`;
  document.getElementById("back").onclick=()=>{stopSpeech();tab=m.track;go("");};
  const l=document.getElementById("listen"); if(l){let on=false;l.onclick=()=>{if(on){stopSpeech();on=false;l.innerHTML=ICON_PLAY+" Listen to this answer";return;}
    on=true;l.innerHTML=ICON_STOP+" Stop";speak(m.text,()=>{on=false;l.innerHTML=ICON_PLAY+" Listen to this answer";});};}
  const tr=document.getElementById("try"); if(tr) tr.onclick=()=>go("cue"+m.cue);
  const hs=[...app.querySelectorAll(".hl")],ns=[...app.querySelectorAll(".notes li")];
  hs.forEach(h=>h.onclick=()=>{const k=h.dataset.k;hs.forEach(x=>x.classList.toggle("on",x.dataset.k===k));ns.forEach(x=>x.classList.toggle("on",x.dataset.k===k));
    ns[k].scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});});
  S.models[m.id]=true; persist();
}

// ---------------- cue card timer (Speaking Part 2) ----------------
function cueView(k){
  const c=CUES_[k];
  const card=`<div class="cue"><b>${esc(c.title)}</b><span class="muted" style="font-size:14px">You should say:</span><ul>${c.points.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>${c.explain?`<span style="font-family:var(--f-letter);font-size:17px">${esc(c.explain)}</span>`:""}</div>`;
  app.innerHTML=`
  <div><button class="link" id="back">← All units</button></div>
  <span class="eyebrow">Part 2 · Cue card practice</span>
  <h1>Prepare for 1 minute, then speak for 2</h1>
  ${card}
  <div class="panel" id="stage" style="align-items:flex-start">
    <span class="phase muted" id="ph">Ready</span>
    <span class="clock" id="clk">1:00</span>
    <div class="row"><button class="btn" id="go">Start preparation</button><button class="btn quiet" id="skip" hidden>Start speaking now</button></div>
  </div>
  <label class="f" for="notes">Your notes (one or two keywords per point)<textarea id="notes" placeholder="where · when · what · why"></textarea></label>
  <div class="panel" id="after" hidden>
    <h3>Check yourself</h3>
    <div class="checks">${["I spoke until the timer ended.","I covered every point on the card.","I kept my past tenses accurate.","I used at least two less common words or phrases.","I gave a reason or feeling, not only facts.","I did not stop for long silences."].map((t,i)=>`<label><input type="checkbox" id="ck${i}"> ${esc(t)}</label>`).join("")}</div>
    <p class="muted">Practise again with the same card until you can tick every line. Record yourself on your phone to check pronunciation.</p>
    <div class="row"><button class="btn" id="again">Practise again</button></div>
  </div>`;
  document.getElementById("back").onclick=()=>{clearInterval(cueTimer);tab=c.track;go("");};
  const clk=document.getElementById("clk"),ph=document.getElementById("ph"),gob=document.getElementById("go"),sk=document.getElementById("skip");
  const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  function run(secs,label,color,next){clearInterval(cueTimer);let left=secs;ph.textContent=label;ph.style.color=color;clk.textContent=fmt(left);
    cueTimer=setInterval(()=>{left--;clk.textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(cueTimer);next();}},1000);}
  function speakPhase(){sk.hidden=true;gob.hidden=true;run(120,"Speak now","var(--good)",()=>{ph.textContent="Time is up";ph.style.color="var(--brand)";S.cues[k]=(S.cues[k]||0)+1;persist();document.getElementById("after").hidden=false;});}
  gob.onclick=()=>{gob.hidden=true;sk.hidden=false;run(60,"Preparation","var(--brand)",speakPhase);document.getElementById("notes").focus();};
  sk.onclick=speakPhase;
  document.getElementById("again").onclick=()=>cueView(k);
}

// ---------------- progress panel ----------------
function progressView(){
  const done=UNITS.filter(u=>S.best[u.id]).length;
  app.innerHTML=`
  <div><button class="link" id="back">← All units</button></div>
  <span class="eyebrow">Your progress</span>
  <h1>Keep your progress safe</h1>
  <div class="panel">
    <h3>Where it is saved</h3>
    <p>${cloudRef?"Your progress is saved to your claude.ai account and on this device. It loads automatically when you open the Lab signed in.":localOK?"Your progress is saved in this browser on this device. It stays when you close and reopen the page. To move to another phone or browser, use a backup code.":"This browser is not allowing the page to save. Copy a backup code before you leave, and paste it back next time."}</p>
    <p class="muted">${done} of ${UNITS.length} units done · ${Object.keys(S.mistakes).length} mistakes saved</p>
    <label class="f" for="pn">Your name<input type="text" id="pn" autocomplete="name" value="${esc(S.name)}"></label>
  </div>
  <div class="panel">
    <h3>Backup code</h3>
    <p class="muted">Copy this code and keep it in WhatsApp or Notes. Paste it on any device to restore your scores.</p>
    <textarea class="code" id="code" readonly aria-label="Your backup code">${esc(exportCode())}</textarea>
    <div class="row"><button class="btn" id="cpc">Copy backup code</button></div>
    <label class="f" for="rc">Restore from a code<textarea class="code" id="rc" placeholder="Paste a code that starts with ${APP.code}-"></textarea></label>
    <div class="row"><button class="btn quiet" id="rst">Restore progress</button></div>
    <div class="toast" id="toast"></div>
  </div>
  <div class="panel">
    <h3>Start again</h3>
    <p class="muted">Clears every score and mistake on this device${cloudRef?" and in your account":""}. Copy your backup code first.</p>
    <div class="row"><button class="btn quiet danger" id="clear">Clear my progress</button><span id="confirm"></span></div>
  </div>`;
  const t=document.getElementById("toast");
  document.getElementById("back").onclick=()=>go("");
  document.getElementById("pn").onchange=e=>{S.name=e.target.value.trim();persist();document.getElementById("code").value=exportCode();};
  document.getElementById("cpc").onclick=()=>{const c=document.getElementById("code");
    navigator.clipboard.writeText(c.value).then(()=>t.textContent="Backup code copied.").catch(()=>{c.select();t.textContent="Code selected. Copy it with your keyboard or long-press.";});};
  document.getElementById("rst").onclick=()=>{try{importCode(document.getElementById("rc").value);t.style.color="var(--good)";t.textContent="Progress restored.";document.getElementById("code").value=exportCode();}
    catch(e){t.style.color="var(--bad)";t.textContent="That code is not valid. Paste the whole code, starting with "+APP.code+"-.";}};
  document.getElementById("clear").onclick=()=>{document.getElementById("confirm").innerHTML='<button class="btn danger" id="yes">Yes, clear everything</button>';
    document.getElementById("yes").onclick=()=>{const nm=S.name;S=blank();S.name=nm;persist();progressView();};};
}

loadLocal(); status(); route(); connectCloud();
})();
</script>
