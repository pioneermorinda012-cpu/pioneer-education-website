var D = {"n": 1, "total": 9, "title": "What is a Pronoun?", "sub": "Subject pronouns · pronoun + be", "test": false, "video": true, "learn": ["<section class=\"card \"><h3>The big idea</h3><p>A <b>pronoun</b> is a word that takes the place of a noun, so we don't repeat the same name again and again.</p><ul class=\"exl\"><li><span class=\"say\">Meera is my friend. <s>Meera</s> wears a pretty dress.</span></li><li><span class=\"say\">Meera is my friend. <b>She</b> wears a pretty dress.</span></li></ul><p>The noun that a pronoun replaces is called its <b>antecedent</b> (you will practise this in Lesson 6).</p></section>", "<section class=\"card \"><h3>Subject pronouns — the doers</h3><p>These pronouns come <b>before the verb</b>. They tell us <i>who does the action</i>.</p><div class=\"tw\"><table class=\"\"><thead><tr><th>Person</th><th>Singular</th><th>Plural</th></tr></thead><tbody><tr><td>1st (the speaker)</td><td><b>I</b></td><td><b>we</b></td></tr><tr><td>2nd (the listener)</td><td><b>you</b></td><td><b>you</b></td></tr><tr><td>3rd (someone else)</td><td><b>he</b> (male)<br><b>she</b> (female)<br><b>it</b> (thing / animal)</td><td><b>they</b></td></tr></tbody></table></div><ul class=\"exl\"><li><span class=\"say\"><b>I</b> go to school.</span></li><li><span class=\"say\"><b>You</b> are a student.</span></li><li><span class=\"say\"><b>He</b> works here.</span></li><li><span class=\"say\"><b>She</b> is alone.</span></li><li><span class=\"say\"><b>It</b> looks scary.</span></li><li><span class=\"say\"><b>They</b> are Korean.</span></li><li><span class=\"say\"><b>We</b> gave her food.</span></li></ul></section>", "<section class=\"card \"><h3>Pronoun + be = short forms (contractions)</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Full form</th><th>Short form</th><th>Example</th></tr></thead><tbody><tr><td>I am</td><td>I'm</td><td><span class='say'>I'm ready.</span></td></tr><tr><td>you are</td><td>you're</td><td><span class='say'>You're late.</span></td></tr><tr><td>he is / she is</td><td>he's / she's</td><td><span class='say'>She's my teacher.</span></td></tr><tr><td>it is</td><td>it's</td><td><span class='say'>It's on the table.</span></td></tr><tr><td>we are</td><td>we're</td><td><span class='say'>We're sisters.</span></td></tr><tr><td>they are</td><td>they're</td><td><span class='say'>They're twins.</span></td></tr></tbody></table></div><p class='note'><b>it's</b> = it is. <b>its</b> = belonging to it. <i>It's</i> raining. The dog wagged <i>its</i> tail.</p></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\"><b>Pronoun</b> ਨੂੰ ਪੰਜਾਬੀ ਵਿੱਚ <b>ਪੜਨਾਂਵ</b> ਕਹਿੰਦੇ ਹਨ। ਇਹ ਨਾਂਵ (noun) ਦੀ ਥਾਂ ਵਰਤਿਆ ਜਾਂਦਾ ਹੈ ਤਾਂ ਜੋ ਇੱਕੋ ਨਾਂ ਵਾਰ-ਵਾਰ ਨਾ ਦੁਹਰਾਉਣਾ ਪਵੇ। I = ਮੈਂ, we = ਅਸੀਂ, you = ਤੁਸੀਂ/ਤੂੰ, he = ਉਹ (ਮੁੰਡਾ), she = ਉਹ (ਕੁੜੀ), it = ਉਹ/ਇਹ (ਚੀਜ਼ ਜਾਂ ਜਾਨਵਰ), they = ਉਹ (ਇੱਕ ਤੋਂ ਵੱਧ)।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ My brother he is a doctor.</div><div class=\"good\">✓ My brother is a doctor.</div><div class=\"why\">Don't use the noun and its pronoun together as the subject.</div></div><div class=\"mk\"><div class=\"bad\">✗ Its raining.</div><div class=\"good\">✓ It's raining.</div><div class=\"why\">It's = it is.</div></div><div class=\"mk\"><div class=\"bad\">✗ Me and Aman are friends.</div><div class=\"good\">✓ Aman and I are friends.</div><div class=\"why\">Subject position needs I, and put yourself last — it's polite.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>In IELTS Speaking, examiners notice when every sentence starts with the same name. Replace repeated nouns with pronouns: <i>My hometown is Morinda. <b>It</b> is a small city. <b>It</b> has…</i> — this improves your <b>Coherence</b> score.</p></section>"], "sets": [{"title": "A · Spot the pronoun", "instr": "Choose the pronoun(s) in each sentence.", "items": [{"t": "mcq", "q": "Shimul is my friend.", "o": ["my", "is", "Shimul", "friend"], "a": 0, "e": "“my” belongs to the pronoun family (possessive — Lesson 3)."}, {"t": "mcq", "q": "She is a good girl.", "o": ["good", "She", "is", "girl"], "a": 1, "e": ""}, {"t": "mcq", "q": "Her mother is a lawyer.", "o": ["lawyer", "is", "mother", "Her"], "a": 3, "e": ""}, {"t": "mcq", "q": "Can you help me lift this bag?", "o": ["lift, this", "you, me", "Can, bag", "help, lift"], "a": 1, "e": ""}, {"t": "mcq", "q": "I went to the store with Kiran.", "o": ["store", "I", "went", "Kiran"], "a": 1, "e": ""}, {"t": "mcq", "q": "He bought many things.", "o": ["bought", "He", "things", "many"], "a": 1, "e": ""}, {"t": "mcq", "q": "We are going for a picnic.", "o": ["are", "We", "picnic", "going"], "a": 1, "e": ""}, {"t": "mcq", "q": "It is a beautiful day.", "o": ["day", "is", "It", "beautiful"], "a": 2, "e": ""}, {"t": "mcq", "q": "They are coming with us.", "o": ["are, us", "They, coming", "They, us", "coming, with"], "a": 2, "e": ""}, {"t": "mcq", "q": "I am very happy today.", "o": ["happy", "I", "very", "today"], "a": 1, "e": ""}]}, {"title": "B · Replace the noun", "instr": "Write one pronoun for the words in the brackets.", "items": [{"t": "fill", "q": "(Kavita) ___ made dinner for the whole family.", "a": [["She"]], "e": ""}, {"t": "fill", "q": "Krish played cricket with ___ (Santosh and Sunny).", "a": [["them"]], "e": "After a preposition (with) we use the object form — them."}, {"t": "fill", "q": "(Santosh and Sunny) ___ are good players.", "a": [["They"]], "e": ""}, {"t": "fill", "q": "(Garima) ___ went to the movies.", "a": [["She"]], "e": ""}, {"t": "fill", "q": "(The movie) ___ was interesting.", "a": [["It"]], "e": ""}, {"t": "fill", "q": "I ate an apple. ___ was delicious.", "a": [["It"]], "e": ""}, {"t": "fill", "q": "You look tired. ___ should rest.", "a": [["You"]], "e": ""}, {"t": "fill", "q": "He saw the movie. ___ was fun.", "a": [["It"]], "e": ""}]}, {"title": "C · Pronoun + be", "instr": "Complete with a pronoun + be. Short forms ineering.", "o": ["We", "His", "He"], "a": 2, "e": ""}, {"t": "mcq", "q": "Susan doesn't take the bus to work. ___ drives her own car.", "o": ["She", "Her", "We"], "a": 0, "e": ""}, {"t": "mcq", "q": "The phone is new. ___ has a great camera.", "o": ["He", "They", "It"], "a": 2, "e": ""}]}], "next": "Lesson 2 — Subject & Object Pronouns"};

          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.test?"the Pronouns Final Test":"Pronouns Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
