<!DOCTYPE html>
<html lang="en">

<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#152033; --muted:#5b6678; --line:#e3e8f0;
  --brand:#1f3f93; --brand-2:#2f5bd3; --accent:#f28c28; --accent-soft:#fff3e6;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}

.tabs{display:flex;gap:8px;margin:18px 0 8px}

:root[data-theme="dark"] .tabs button.on{color:#0f1420}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}

.card p{margin:8px 0}
.card.pun{background:var(--pun-soft);border-color:transparent}.card.pun h3{color:var(--pun)}

.card.exam{background:var(--exam-soft);border-color:transparent}.card.exam h3{color:var(--exam)}

table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}

.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
textarea.fi{font:500 16px system-ui,sans-serif;line-height:1.5}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>
</head>

var VIDEO_URL = "";
var D = {"n": 1, "total": 2, "title": "Describing in the Past", "sub": "was/were · there was/were · had · used to", "test": false, "unit": "Descriptive Past", "chip": null, "share": null, "video": true, "js": null, "learn": ["<section class=\"card \"><h3>Present → past</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Present</th><th>Past</th><th>Example</th></tr></thead><tbody><tr><td>am / is</td><td><b>was</b></td><td>The room <b>was</b> small and dark.</td></tr><tr><td>are</td><td><b>were</b></td><td>The streets <b>were</b> narrow and crowded.</td></tr><tr><td>there is / there are</td><td><b>there was / there were</b></td><td><b>There was</b> a big tree. <b>There were</b> no shops.</td></tr><tr><td>has / have</td><td><b>had</b></td><td>My grandfather <b>had</b> a long white beard.</td></tr><tr><td>(habit) I go…</td><td><b>used to</b> go / went</td><td>We <b>used to</b> play cricket every evening.</td></tr></tbody></table></div><p>I / he / she / it / singular → <b>was</b>. You / we / they / plural → <b>were</b>.</p></section>", "<section class=\"card \"><h3>Four tools for a past description</h3><ol><li><b>Qualities:</b> was/were + adjective — <i>The water was cold and clear.</i></li><li><b>What existed:</b> there was / there were — <i>There were mango trees everywhere.</i></li><li><b>Features & possessions:</b> had — <i>The school had a small library.</i></li><li><b>Habits:</b> used to + verb — <i>I used to walk to school with my cousins.</i></li></ol><p>Add the <b>background</b> with the past continuous: <i>The sun <b>was shining</b> and birds <b>were singing</b>.</i></p></section>", "<section class=\"card \"><h3>A past description — example</h3><ul class=\"exl\"><li><span class=\"say\">My first school was a small government school in our village.</span></li><li><span class=\"say\">It had only four classrooms, and there was a big playground behind it.</span></li><li><span class=\"say\">The teachers were strict but kind.</span></li><li><span class=\"say\">There were no computers, but there was a lovely garden.</span></li><li><span class=\"say\">Every morning we used to sing the prayer under the peepal tree.</span></li></ul></section>", "<section class=\"card \"><h3>Negatives and questions</h3><div class=\"tw\"><table class=\"\"><thead><tr><th></th><th>Example</th></tr></thead><tbody><tr><td>✘</td><td>It <b>wasn't</b> expensive. There <b>weren't</b> any buses. We <b>didn't have</b> a TV. I <b>didn't use to</b> like milk.</td></tr><tr><td>?</td><td><b>Was</b> it far? <b>Were</b> there many people? <b>Did</b> you <b>have</b> a bicycle? <b>Did</b> you <b>use to</b> play outside?</td></tr></tbody></table></div></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਬੀਤੇ ਸਮੇਂ ਦਾ ਵਰਣਨ: “ਸੀ” = <b>was</b> (ਇੱਕ), “ਸਨ” = <b>were</b> (ਬਹੁਤੇ)। “ਉੱਥੇ ਇੱਕ ਦਰੱਖ਼ਤ ਸੀ” = <b>There was</b> a tree। “ਉਸ ਕੋਲ … ਸੀ” = he <b>had</b> …। ਪੁਰਾਣੀ ਆਦਤ “ਅਸੀਂ ਖੇਡਿਆ ਕਰਦੇ ਸੀ” = we <b>used to</b> play।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ We was very happy.</div><div class=\"good\">✓ We were very happy.</div></div><div class=\"mk\"><div class=\"bad\">✗ There was many people.</div><div class=\"good\">✓ There were many people.</div></div><div class=\"mk\"><div class=\"bad\">✗ My school was having a big ground.</div><div class=\"good\">✓ My school had a big playground.</div><div class=\"why\">have (possession) isn't used in the continuous.</div></div><div class=\"mk\"><div class=\"bad\">✗ I use to play cricket.</div><div class=\"good\">✓ I used to play cricket.</div><div class=\"why\">Always used to in positive sentences.</div></div><div class=\"mk\"><div class=\"bad\">✗ Did you used to live there?</div><div class=\"good\">✓ Did you use to live there?</div><div class=\"why\">After did → use to.</div></div><div class=\"mk\"><div class=\"bad\">✗ In my childhood my house was have a garden.</div><div class=\"good\">✓ My house had a garden when I was a child.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>IELTS Speaking Part 2 often asks about the past: <i>“Describe a place you visited as a child”</i> or <i>“Describe an old friend”</i>. Mix <b>was/were, there was/were, had</b> and <b>used to</b> — using a range of structures raises your Grammatical Range score.</p></section>"], "sets": [{"title": "A · was or were?", "instr": "Choose the correct word.", "items": [{"t": "mcq", "q": "The weather ___ perfect last weekend.", "o": ["was", "were"], "a": 0, "e": ""}, {"t": "mcq", "q": "My grandparents ___ very kind people.", "o": ["was", "were"], "a": 1, "e": ""}, {"t": "mcq", "q": "The streets ___ narrow and crowded.", "o": ["was", "were"], "a": 1, "e": ""}, {"t": "mcq", "q": "I ___ very nervous on my first day.", "o": ["was", "were"], "a": 0, "e": ""}, {"t": "mcq", "q": "You ___ late again yesterday.", "o": ["was", "were"], "a": 1, "e": "you → were (singular and plural)."}, {"t": "mcq", "q": "The food at the wedding ___ delicious.", "o": ["was", "were"], "a": 0, "e": ""}, {"t": "mcq", "q": "There ___ a small shop near our house.", "o": ["was", "were"], "a": 0, "e": ""}, {"t": "mcq", "q": "There ___ no computers in our school.", "o": ["was", "were"], "a": 1, "e": ""}, {"t": "mcq", "q": "There ___ a lot of noise in the street.", "o": ["was", "were"], "a": 0, "e": "noise is uncountable → was."}, {"t": "mcq", "q": "___ there many people at the mela?", "o": ["was", "were"], "a": 1, "e": ""}]}, {"title": "B · Change to the past", "instr": "Type the past form of the verb in brackets.", "items": [{"t": "fill", "q": "Our village (have) ___ only one bus a day.", "a": [["had"]], "e": ""}, {"t": "fill", "q": "There (be) ___ a big pond near the gurdwara.", "a": [["was"]], "e": ""}, {"t": "fill", "q": "My uncle (have) ___ a red tractor.", "a": [["had"]], "e": ""}, {"t": "fill", "q": "The houses (be) ___ made of mud and bricks.", "a": [["were"]], "e": ""}, {"t": "fill", "q": "There (be) ___ hundreds of stalls at the fair.", "a": [["were"]], "e": ""}, {"t": "fill", "q": "It (not be) ___ very expensive.", "a": [["wasn't", "was not"]], "e": ""}, {"t": "fill", "q": "We (not have) ___ a television.", "a": [["didn't have", "did not have"]], "e": ""}, {"t": "fill", "q": "There (not be) ___ any street lights.", "a": [["weren't", "were not"]], "e": ""}]}, {"title": "C · used to", "instr": "Complete with used to / didn't use to / Did … use to.", "items": [{"t": "fill", "q": "When I was young, I ___ play kabaddi every evening.", "a": [["used to"]], "e": ""}, {"t": "fill", "q": "My father ___ smoke, but he stopped ten years ago.", "a": [["used to"]], "e": ""}, {"t": "fill", "q": "I ___ like vegetables, but now I love them.", "a": [["didn't use to", "did not use to"]], "e": ""}, {"t": "fill", "q": "___ you ___ walk to school?", "a": [["Did"], ["use to"]], "e": ""}, {"t": "mcq", "q": "Which is correct?", "o": ["We use to live in Patiala.", "We used to live in Patiala.", "We were used to live in Patiala."], "a": 1, "e": ""}, {"t": "mcq", "q": "Which is correct?", "o": ["Did she used to work here?", "Was she used to work here?", "Did she use to work here?"], "a": 2, "e": ""}]}, {"title": "D · Build a description", "instr": "Choose the best word.", "items": [{"t": "mcq", "q": "My old school ___ a beautiful garden.", "o": ["were", "was", "had"], "a": 2, "e": ""}, {"t": "mcq", "q": "___ a peepal tree in the middle of the playground.", "o": ["There were", "It had", "There was"], "a": 2, "e": ""}, {"t": "mcq", "q": "The teachers ___ strict but kind.", "o": ["had", "were", "was"], "a": 1, "e": ""}, {"t": "mcq", "q": "Every morning we ___ sing the prayer outside.", "o": ["were used to", "used to", "use to"], "a": 1, "e": ""}, {"t": "mcq", "q": "When we arrived, it ___ heavily.", "o": ["rained", "was raining", "has rained"], "a": 1, "e": "Background action → past continuous."}, {"t": "mcq", "q": "The hotel room was ___ small, and the walls were ___ thin.", "o": ["enough / enough", "very / very", "much / many"], "a": 1, "e": ""}]}], "next": "Lesson 2 — Past Description: Translate & Write"};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';

  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
