<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advanced Synonyms · Pioneer Education</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#152033; --muted:#5b6678; --line:#e3e8f0;
  --brand:#1f3f93; --brand-2:#2f5bd3; --accent:#f28c28; --accent-soft:#fff3e6;
  --ok:#16803c; --ok-soft:#e7f6ec; --bad:#c62828; --bad-soft:#fdecec;
  --pun:#6d3fb8; --pun-soft:#f3edfc; --exam:#0f766e; --exam-soft:#e6f6f4;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}
header.hero .wrap{padding-bottom:0}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:10px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.9;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0f1420}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;color:var(--brand)}
.card p{margin:8px 0}
.card.pun{background:var(--pun-soft);border-color:transparent}.card.pun h3{color:var(--pun)}
.pa{font-size:16.5px;line-height:1.8}
.card.exam{background:var(--exam-soft);border-color:transparent}.card.exam h3{color:var(--exam)}
.card.mist h3{color:var(--bad)}
.mk{border-top:1px dashed var(--line);padding:8px 0}.mk:first-of-type{border-top:0}
.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}.why{font-size:14px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
.exl{list-style:none;padding:0;margin:8px 0}
.exl li{padding:6px 0;border-bottom:1px solid var(--line)}.exl li:last-child{border-bottom:0}
.say{cursor:pointer}
.say::after{content:" 🔊";font-size:13px;opacity:.55}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted)}
table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.qt{margin:0 0 10px;font-weight:500}
.qn{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;margin-right:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
textarea.fi{font:500 16px system-ui,sans-serif;line-height:1.5}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>
</head>

<div class="bar"><div class="wrap">

  <div id="practice" class="hide"></div>

/span>, <span class=say>overjoyed</span>, <span class=say>delighted</span></td></tr><tr><td><span class='say'>jovial</span></td><td lang='pa' class='pa'>ਹਸਮੁੱਖ</td><td><span class=say>cheerful</span>, <span class=say>jolly</span>, <span class=say>merry</span></td></tr><tr><td><span class='say'>lament</span></td><td lang='pa' class='pa'>ਸੋਗ ਮਨਾਉਣਾ</td><td><span class=say>mourn</span>, <span class=say>grieve</span></td></tr><tr><td><span class='say'>liberty</span></td><td lang='pa' class='pa'>ਆਜ਼ਾਦੀ</td><td><span class=say>freedom</span>, <span class=say>independence</span></td></tr><tr><td><span class='say'>malice</span></td><td lang='pa' class='pa'>ਬਦਨੀਅਤੀ / ਕੀਨਾ</td><td><span class=say>spite</span>, <span class=say>ill will</span>, <span class=say>hatred</span></td></tr><tr><td><span class='say'>meagre</span></td><td lang='pa' class='pa'>ਬਹੁਤ ਥੋੜ੍ਹਾ</td><td><span class=say>small</span>, <span class=say>scanty</span>, <span class=say>insufficient</span></td></tr><tr><td><span class='say'>melancholy</span></td><td lang='pa' class='pa'>ਉਦਾਸੀ / ਉਦਾਸ</td><td><span class=say>sad</span>, <span class=say>gloomy</span>, <span class=say>sorrowful</span></td></tr><tr><td><span class='say'>negligent</span></td><td lang='pa' class='pa'>ਲਾਪਰਵਾਹ</td><td><span class=say>careless</span>, <span class=say>heedless</span></td></tr><tr><td><span class='say'>obsolete</span></td><td lang='pa' class='pa'>ਪੁਰਾਣਾ (ਹੁਣ ਨਾ ਵਰਤਿਆ ਜਾਂਦਾ)</td><td><span class=say>outdated</span>, <span class=say>out of date</span>, <span class=say>antiquated</span></td></tr><tr><td><span class='say'>pensive</span></td><td lang='pa' class='pa'>ਸੋਚਾਂ ਵਿੱਚ ਡੁੱਬਿਆ</td><td><span class=say>thoughtful</span>, <span class=say>reflective</span></td></tr><tr><td><span class='say'>persuade</span></td><td lang='pa' class='pa'>ਮਨਾਉਣਾ / ਰਾਜ਼ੀ ਕਰਨਾ</td><td><span class=say>convince</span>, <span class=say>urge</span></td></tr><tr><td><span class='say'>pretext</span></td><td lang='pa' class='pa'>ਬਹਾਨਾ</td><td><span class=say>excuse</span>, <span class=say>pretence</span></td></tr><tr><td><span class='say'>quaint</span></td><td lang='pa' class='pa'>ਅਜੀਬ ਪਰ ਪਿਆਰਾ (ਪੁਰਾਣੇ ਢੰਗ ਦਾ)</td><td><span class=say>charming</span>, <span class=say>old-fashioned</span>, <span class=say>picturesque</span></td></tr><tr><td><span class='say'>radiant</span></td><td lang='pa' class='pa'>ਚਮਕਦਾ / ਖਿੜਿਆ</td><td><span class=say>bright</span>, <span class=say>glowing</span>, <span class=say>brilliant</span></td></tr><tr><td><span class='say'>reiterate</span></td><td lang='pa' class='pa'>ਦੁਹਰਾਉਣਾ</td><td><span class=say>repeat</span>, <span class=say>restate</span></td></tr><tr><td><span class='say'>remorse</span></td><td lang='pa' class='pa'>ਪਛਤਾਵਾ</td><td><span class=say>regret</span>, <span class=say>guilt</span>, <span class=say>repentance</span></td></tr><tr><td><span class='say'>reticent</span></td><td lang='pa' class='pa'>ਘੱਟ ਬੋਲਣ ਵਾਲਾ</td><td><span class=say>reserved</span>, <span class=say>quiet</span>, <span class=say>silent</span></td></tr><tr><td><span class='say'>sterile</span></td><td lang='pa' class='pa'>ਬੰਜਰ / ਕੀਟਾਣੂ-ਰਹਿਤ</td><td><span class=say>barren</span>, <span class=say>infertile</span>, <span class=say>germ-free</span></td></tr><tr><td><span class='say'>tedious</span></td><td lang='pa' class='pa'>ਅਕਾਊ</td><td><span class=say>boring</span>, <span class=say>tiresome</span>, <span class=say>monotonous</span></td></tr><tr><td><span class='say'>thrifty</span></td><td lang='pa' class='pa'>ਕਿਫ਼ਾਇਤੀ</td><td><span class=say>economical</span>, <span class=say>careful with money</span></td></tr><tr><td><span class='say'>urbane</span></td><td lang='pa' class='pa'>ਸਭਿਅ / ਸਲੀਕੇਦਾਰ</td><td><span class=say>polite</span>, <span class=say>courteous</span>, <span class=say>sophisticated</span></td></tr><tr><td><span class='say'>vacillate</span></td><td lang='pa' class='pa'>ਡਾਵਾਂਡੋਲ ਹੋਣਾ</td><td><span class=say>waver</span>, <span class=say>hesitate</span></td></tr><tr><td><span class='say'>vigilance</span></td><td lang='pa' class='pa'>ਚੌਕਸੀ</td><td><span class=say>watchfulness</span>, <span class=say>alertness</span>, <span class=say>caution</span></td></tr><tr><td><span class='say'>vindictive</span></td><td lang='pa' class='pa'>ਬਦਲਾਖ਼ੋਰ</td><td><span class=say>revengeful</span>, <span class=say>spiteful</span></td></tr><tr><td><span class='say'>weary</span></td><td lang='pa' class='pa'>ਥੱਕਿਆ ਹੋਇਆ</td><td><span class=say>tired</span>, <span class=say>exhausted</span></td></tr><tr><td><span class='say'>wreck</span></td><td lang='pa' class='pa'>ਤਬਾਹ ਕਰਨਾ</td><td><span class=say>ruin</span>, <span class=say>destroy</span></td></tr><tr><td><span class='say'>yearn</span></td><td lang='pa' class='pa'>ਤਰਸਣਾ</td><td><span class=say>long</span>, <span class=say>crave</span>, <span class=say>desire</span></td></tr><tr><td><span class='say'>zeal</span></td><td lang='pa' class='pa'>ਜੋਸ਼</td><td><span class=say>passion</span>, <span class=say>enthusiasm</span></td></tr><tr><td><span class='say'>zenith</span></td><td lang='pa' class='pa'>ਸਿਖਰ</td><td><span class=say>top</span>, <span class=say>peak</span>, <span class=say>summit</span></td></tr><tr><td><span class='say'>zest</span></td><td lang='pa' class='pa'>ਉਤਸ਼ਾਹ</td><td><span class=say>enthusiasm</span>, <span class=say>energy</span>, <span class=say>eagerness</span></td></tr></tbody></table></div></section>", "<section class=\"card \"><h3>In context</h3><ul class=\"exl\"><li><span class=\"say\">The workers were indignant about the low wages.</span></li><li><span class=\"say\">She is diligent — she never misses a class.</span></li><li><span class=\"say\">Typewriters are now obsolete.</span></li><li><span class=\"say\">The rain was incessant for three days.</span></li><li><span class=\"say\">He felt deep remorse for lying to his parents.</span></li><li><span class=\"say\">Students should emulate their best teachers.</span></li></ul></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਇਹ ਸ਼ਬਦ ਮੁਕਾਬਲੇ ਦੀਆਂ ਪ੍ਰੀਖਿਆਵਾਂ (Bank, SSC, PCS) ਅਤੇ IELTS Reading ਵਿੱਚ ਆਉਂਦੇ ਹਨ। Speaking ਵਿੱਚ ਸਿਰਫ਼ ਉਹੀ ਵਰਤੋ ਜਿਨ੍ਹਾਂ ਦਾ ਅਰਥ ਤੇ ਵਰਤੋਂ ਤੁਹਾਨੂੰ ਪੱਕੀ ਆਉਂਦੀ ਹੋਵੇ।</p></section>", "<section class=\"card mist\"><h3>Corrections to the old list</h3><ul><li><b>Baggy</b> means loose — <i>tight</i> is its <b>opposite</b>, not a synonym (removed).</li><li><b>Diligent</b> = industrious, <b>persevering</b> (not “preserving”).</li><li><b>Quaint</b> = charming and old-fashioned (the old meaning “queer” is out of date and can offend).</li><li><b>Cynical</b> ≈ distrustful, not exactly “misanthropic”; <b>temporal, sublime, warlike</b> removed as rarely useful.</li></ul></section>"], "sets": [{"title": "A · Choose the synonym", "instr": "", "items": [{"t": "mcq", "q": "Which word means the same as “persuade”?", "o": ["fragile", "energetic", "savage", "convince"], "a": 3, "e": "persuade = convince, urge (ਮਨਾਉਣਾ / ਰਾਜ਼ੀ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “melancholy”?", "o": ["ridiculous", "pity", "sad", "heedless"], "a": 2, "e": "melancholy = sad, gloomy, sorrowful (ਉਦਾਸੀ / ਉਦਾਸ)"}, {"t": "mcq", "q": "Which word means the same as “brisk”?", "o": ["strange", "unfeeling", "pretence", "lively"], "a": 3, "e": "brisk = lively, quick, energetic (ਫੁਰਤੀਲਾ / ਤੇਜ਼)"}, {"t": "mcq", "q": "Which word means the same as “quaint”?", "o": ["germ-free", "charming", "assent", "grieve"], "a": 1, "e": "quaint = charming, old-fashioned, picturesque (ਅਜੀਬ ਪਰ ਪਿਆਰਾ (ਪੁਰਾਣੇ ਢੰਗ ਦਾ))"}, {"t": "mcq", "q": "Which word means the same as “vacillate”?", "o": ["make up", "overjoyed", "waver", "joy"], "a": 2, "e": "vacillate = waver, hesitate (ਡਾਵਾਂਡੋਲ ਹੋਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “diligent”?", "o": ["quiet", "hard-working", "skill", "charming"], "a": 1, "e": "diligent = hard-working, industrious, persevering (ਮਿਹਨਤੀ)"}, {"t": "mcq", "q": "Which word means the same as “compassion”?", "o": ["hinder", "serious", "enthusiasm", "sympathy"], "a": 3, "e": "compassion = sympathy, kindness, pity (ਹਮਦਰਦੀ / ਤਰਸ)"}, {"t": "mcq", "q": "Which word means the same as “denounce”?", "o": ["brilliant", "condemn", "offended", "outdated"], "a": 1, "e": "denounce = condemn, criticise (ਨਿੰਦਾ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “absurd”?", "o": ["industrious", "invent", "silly", "peak"], "a": 2, "e": "absurd = silly, ridiculous (ਬੇਤੁਕਾ)"}, {"t": "mcq", "q": "Which word means the same as “liberty”?", "o": ["repentance", "freedom", "kindness", "detest"], "a": 1, "e": "liberty = freedom, independence (ਆਜ਼ਾਦੀ)"}, {"t": "mcq", "q": "Which word means the same as “remorse”?", "o": ["scanty", "heedless", "fierce", "regret"], "a": 3, "e": "remorse = regret, guilt, repentance (ਪਛਤਾਵਾ)"}, {"t": "mcq", "q": "Which word means the same as “ferocious”?", "o": ["reflective", "fierce", "industrious", "sympathy"], "a": 1, "e": "ferocious = fierce, savage, violent (ਖੂੰਖਾਰ)"}, {"t": "mcq", "q": "Which word means the same as “fabricate”?", "o": ["germ-free", "invent", "agree", "tired"], "a": 1, "e": "fabricate = invent, make up, forge (ਘੜਨਾ / ਬਣਾਉਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “negligent”?", "o": ["careful with money", "long", "forge", "careless"], "a": 3, "e": "negligent = careless, heedless (ਲਾਪਰਵਾਹ)"}, {"t": "mcq", "q": "Which word means the same as “indignant”?", "o": ["insufficient", "heedless", "angry", "glowing"], "a": 2, "e": "indignant = angry, annoyed, offended (ਰੋਹ ਵਿੱਚ)"}, {"t": "mcq", "q": "Which word means the same as “weary”?", "o": ["top", "tired", "charming", "thoughtful"], "a": 1, "e": "weary = tired, exhausted (ਥੱਕਿਆ ਹੋਇਆ)"}, {"t": "mcq", "q": "Which word means the same as “vindictive”?", "o": ["give up", "wasteful", "barren", "revengeful"], "a": 3, "e": "vindictive = revengeful, spiteful (ਬਦਲਾਖ਼ੋਰ)"}, {"t": "mcq", "q": "Which word means the same as “jovial”?", "o": ["forge", "cheerful", "hinder", "energetic"], "a": 1, "e": "jovial = cheerful, jolly, merry (ਹਸਮੁੱਖ)"}, {"t": "mcq", "q": "Which word means the same as “yearn”?", "o": ["weak", "violent", "boring", "long"], "a": 3, "e": "yearn = long, crave, desire (ਤਰਸਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “eccentric”?", "o": ["scanty", "appropriate", "watchfulness", "odd"], "a": 3, "e": "eccentric = odd, strange, unusual (ਅਜੀਬ ਸੁਭਾਅ ਵਾਲਾ)"}, {"t": "mcq", "q": "Which word means the same as “flimsy”?", "o": ["savage", "thin", "reserved", "hatred"], "a": 1, "e": "flimsy = thin, weak, fragile (ਕਮਜ਼ੋਰ / ਪਤਲਾ)"}, {"t": "mcq", "q": "Which word means the same as “radiant”?", "o": ["monotonous", "odd", "fierce", "bright"], "a": 3, "e": "radiant = bright, glowing, brilliant (ਚਮਕਦਾ / ਖਿੜਿਆ)"}, {"t": "mcq", "q": "Which word means the same as “inanimate”?", "o": ["heedless", "lifeless", "energetic", "sorrowful"], "a": 1, "e": "inanimate = lifeless (ਬੇਜਾਨ)"}, {"t": "mcq", "q": "Which word means the same as “urbane”?", "o": ["hate", "polite", "infertile", "old-fashioned"], "a": 1, "e": "urbane = polite, courteous, sophisticated (ਸਭਿਅ / ਸਲੀਕੇਦਾਰ)"}, {"t": "mcq", "q": "Which word means the same as “pretext”?", "o": ["restate", "overjoyed", "excuse", "condense"], "a": 2, "e": "pretext = excuse, pretence (ਬਹਾਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “bliss”?", "o": ["heartless", "tiresome", "joy", "persevering"], "a": 2, "e": "bliss = joy, happiness, delight (ਪਰਮ ਆਨੰਦ)"}, {"t": "mcq", "q": "Which word means the same as “humane”?", "o": ["restate", "kind", "weak", "freedom"], "a": 1, "e": "humane = kind, compassionate, benevolent (ਦਇਆਵਾਨ)"}, {"t": "mcq", "q": "Which word means the same as “hamper”?", "o": ["fragile", "hinder", "independence", "ruin"], "a": 1, "e": "hamper = hinder, obstruct, impede (ਰੁਕਾਵਟ ਪਾਉਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “abhor”?", "o": ["long", "sincere", "hate", "jolly"], "a": 2, "e": "abhor = hate, detest (ਬਹੁਤ ਨਫ਼ਰਤ ਕਰਨਾ)"}]}, {"title": "B · Meaning in Punjabi", "instr": "", "items": [{"t": "mcq", "q": "What does “dexterity” mean?", "o": ["ਮਿਹਨਤੀ", "ਹੱਥ ਦੀ ਸਫ਼ਾਈ / ਨਿਪੁੰਨਤਾ", "ਅਕਾਊ", "ਪੁਰਾਣਾ (ਹੁਣ ਨਾ ਵਰਤਿਆ ਜਾਂਦਾ)"], "a": 1, "e": "dexterity = skill, deftness"}, {"t": "mcq", "q": "What does “meagre” mean?", "o": ["ਦੁਹਰਾਉਣਾ", "ਸੋਚਾਂ ਵਿੱਚ ਡੁੱਬਿਆ", "ਬਹੁਤ ਥੋੜ੍ਹਾ", "ਸੰਖੇਪ ਕਰਨਾ"], "a": 2, "e": "meagre = small, scanty, insufficient"}, {"t": "mcq", "q": "What does “vigilance” mean?", "o": ["ਸਪਸ਼ਟ / ਖਰਾ", "ਚੌਕਸੀ", "ਗੰਭੀਰ / ਦੁਖਦਾਈ", "ਬਹੁਤ ਖ਼ੁਸ਼"], "a": 1, "e": "vigilance = watchfulness, alertness, caution"}, {"t": "mcq", "q": "What does “tedious” mean?", "o": ["ਬੇਤੁਕਾ", "ਦਇਆਵਾਨ", "ਆਜ਼ਾਦੀ", "ਅਕਾਊ"], "a": 3, "e": "tedious = boring, tiresome, monotonous"}, {"t": "mcq", "q": "What does “reiterate” mean?", "o": ["ਬਹਾਨਾ", "ਦੁਹਰਾਉਣਾ", "ਹਸਮੁੱਖ", "ਨਕਲ ਕਰਨਾ / ਬਰਾਬਰੀ ਕਰਨਾ"], "a": 1, "e": "reiterate = repeat, restate"}, {"t": "mcq", "q": "What does “emulate” mean?", "o": ["ਛੱਡ ਦੇਣਾ", "ਘੱਟ ਬੋਲਣ ਵਾਲਾ", "ਦਇਆਵਾਨ", "ਨਕਲ ਕਰਨਾ / ਬਰਾਬਰੀ ਕਰਨਾ"], "a": 3, "e": "emulate = imitate, copy, follow"}, {"t": "mcq", "q": "What does “apposite” mean?", "o": ["ਸੋਗ ਮਨਾਉਣਾ", "ਢੁੱਕਵਾਂ", "ਬਹੁਤ ਨਫ਼ਰਤ ਕਰਨਾ", "ਬਹਾਨਾ"], "a": 1, "e": "apposite = suitable, appropriate"}, {"t": "mcq", "q": "What does “obsolete” mean?", "o": ["ਢੁੱਕਵਾਂ", "ਸਭਿਅ / ਸਲੀਕੇਦਾਰ", "ਘੜਨਾ / ਬਣਾਉਣਾ", "ਪੁਰਾਣਾ (ਹੁਣ ਨਾ ਵਰਤਿਆ ਜਾਂਦਾ)"], "a": 3, "e": "obsolete = outdated, out of date, antiquated"}, {"t": "mcq", "q": "What does “thrifty” mean?", "o": ["ਹਸਮੁੱਖ", "ਕਿਫ਼ਾਇਤੀ", "ਬੇਜਾਨ", "ਬਹਾਨਾ"], "a": 1, "e": "thrifty = economical, careful with money"}, {"t": "mcq", "q": "What does “zeal” mean?", "o": ["ਤਬਾਹ ਕਰਨਾ", "ਨਕਲ ਕਰਨਾ / ਬਰਾਬਰੀ ਕਰਨਾ", "ਜੋਸ਼", "ਨਿੰਦਾ ਕਰਨਾ"], "a": 2, "e": "zeal = passion, enthusiasm"}, {"t": "mcq", "q": "What does “sterile” mean?", "o": ["ਘੜਨਾ / ਬਣਾਉਣਾ", "ਬੰਜਰ / ਕੀਟਾਣੂ-ਰਹਿਤ", "ਗੰਭੀਰ / ਦੁਖਦਾਈ", "ਪਛਤਾਵਾ"], "a": 1, "e": "sterile = barren, infertile, germ-free"}, {"t": "mcq", "q": "What does “zest” mean?", "o": ["ਰੁਕਾਵਟ ਪਾਉਣਾ", "ਉਤਸ਼ਾਹ", "ਅਕਾਊ", "ਹਸਮੁੱਖ"], "a": 1, "e": "zest = enthusiasm, energy, eagerness"}, {"t": "mcq", "q": "What does “acquiesce” mean?", "o": ["ਚੌਕਸੀ", "ਚੁੱਪ-ਚਾਪ ਮੰਨ ਲੈਣਾ", "ਹੱਥ ਦੀ ਸਫ਼ਾਈ / ਨਿਪੁੰਨਤਾ", "ਤਬਾਹ ਕਰਨਾ"], "a": 1, "e": "acquiesce = agree, assent, comply"}, {"t": "mcq", "q": "What does “candid” mean?", "o": ["ਅਜੀਬ ਪਰ ਪਿਆਰਾ (ਪੁਰਾਣੇ ਢੰਗ ਦਾ)", "ਆਜ਼ਾਦੀ", "ਸਪਸ਼ਟ / ਖਰਾ", "ਪਰਮ ਆਨੰਦ"], "a": 2, "e": "candid = frank, honest, sincere"}, {"t": "mcq", "q": "What does “callous” mean?", "o": ["ਡਾਵਾਂਡੋਲ ਹੋਣਾ", "ਕਠੋਰ / ਬੇਦਰਦ", "ਆਜ਼ਾਦੀ", "ਖ਼ੁਸ਼ੀ / ਰੌਣਕ"], "a": 1, "e": "callous = heartless, unfeeling, cruel"}, {"t": "mcq", "q": "What does “incessant” mean?", "o": ["ਕਠੋਰ / ਬੇਦਰਦ", "ਛੱਡ ਦੇਣਾ", "ਲਗਾਤਾਰ", "ਬੇਤੁਕਾ"], "a": 2, "e": "incessant = continuous, constant, non-stop"}, {"t": "mcq", "q": "What does “zenith” mean?", "o": ["ਚਮਕਦਾ / ਖਿੜਿਆ", "ਸਿਖਰ", "ਬੇਰਹਿਮ", "ਸਪਸ਼ਟ / ਖਰਾ"], "a": 1, "e": "zenith = top, peak, summit"}, {"t": "mcq", "q": "What does “extravagant” mean?", "o": ["ਖੂੰਖਾਰ", "ਫ਼ਜ਼ੂਲ-ਖ਼ਰਚ", "ਮਨਾਉਣਾ / ਰਾਜ਼ੀ ਕਰਨਾ", "ਦਇਆਵਾਨ"], "a": 1, "e": "extravagant = wasteful, lavish"}, {"t": "mcq", "q": "What does “jubilant” mean?", "o": ["ਸੰਖੇਪ ਕਰਨਾ", "ਖ਼ੁਸ਼ੀ / ਰੌਣਕ", "ਬਹੁਤ ਖ਼ੁਸ਼", "ਬੇਤੁਕਾ"], "a": 2, "e": "jubilant = joyful, overjoyed, delighted"}, {"t": "mcq", "q": "What does “wreck” mean?", "o": ["ਪਰਮ ਆਨੰਦ", "ਤਬਾਹ ਕਰਨਾ", "ਜੋਸ਼", "ਸੰਖੇਪ ਕਰਨਾ"], "a": 1, "e": "wreck = ruin, destroy"}, {"t": "mcq", "q": "What does “brutal” mean?", "o": ["ਅਕਾਊ", "ਤਰਸਣਾ", "ਦੁਹਰਾਉਣਾ", "ਬੇਰਹਿਮ"], "a": 3, "e": "brutal = savage, cruel"}, {"t": "mcq", "q": "What does “grievous” mean?", "o": ["ਬਦਲਾਖ਼ੋਰ", "ਗੰਭੀਰ / ਦੁਖਦਾਈ", "ਬਹਾਨਾ", "ਨਕਲ ਕਰਨਾ / ਬਰਾਬਰੀ ਕਰਨਾ"], "a": 1, "e": "grievous = serious, severe, painful"}, {"t": "mcq", "q": "What does “pensive” mean?", "o": ["ਘੱਟ ਬੋਲਣ ਵਾਲਾ", "ਬੰਜਰ / ਕੀਟਾਣੂ-ਰਹਿਤ", "ਸੋਚਾਂ ਵਿੱਚ ਡੁੱਬਿਆ", "ਹਮਦਰਦੀ / ਤਰਸ"], "a": 2, "e": "pensive = thoughtful, reflective"}, {"t": "mcq", "q": "What does “abridge” mean?", "o": ["ਰੁਕਾਵਟ ਪਾਉਣਾ", "ਫ਼ਜ਼ੂਲ-ਖ਼ਰਚ", "ਸੰਖੇਪ ਕਰਨਾ", "ਚਮਕਦਾ / ਖਿੜਿਆ"], "a": 2, "e": "abridge = shorten, condense"}, {"t": "mcq", "q": "What does “malice” mean?", "o": ["ਗੰਭੀਰ / ਦੁਖਦਾਈ", "ਚਮਕਦਾ / ਖਿੜਿਆ", "ਅਕਾਊ", "ਬਦਨੀਅਤੀ / ਕੀਨਾ"], "a": 3, "e": "malice = spite, ill will, hatred"}, {"t": "mcq", "q": "What does “reticent” mean?", "o": ["ਉਤਸ਼ਾਹ", "ਡਾਵਾਂਡੋਲ ਹੋਣਾ", "ਪਛਤਾਵਾ", "ਘੱਟ ਬੋਲਣ ਵਾਲਾ"], "a": 3, "e": "reticent = reserved, quiet, silent"}, {"t": "mcq", "q": "What does “lament” mean?", "o": ["ਉਦਾਸੀ / ਉਦਾਸ", "ਪਰਮ ਆਨੰਦ", "ਸਪਸ਼ਟ / ਖਰਾ", "ਸੋਗ ਮਨਾਉਣਾ"], "a": 3, "e": "lament = mourn, grieve"}, {"t": "mcq", "q": "What does “gaiety” mean?", "o": ["ਚੁੱਪ-ਚਾਪ ਮੰਨ ਲੈਣਾ", "ਥੱਕਿਆ ਹੋਇਆ", "ਖ਼ੁਸ਼ੀ / ਰੌਣਕ", "ਫੁਰਤੀਲਾ / ਤੇਜ਼"], "a": 2, "e": "gaiety = cheerfulness, merriment, happiness"}, {"t": "mcq", "q": "What does “abandon” mean?", "o": ["ਬੰਜਰ / ਕੀਟਾਣੂ-ਰਹਿਤ", "ਫੁਰਤੀਲਾ / ਤੇਜ਼", "ਛੱਡ ਦੇਣਾ", "ਸੰਖੇਪ ਕਰਨਾ"], "a": 2, "e": "abandon = leave, desert, give up"}]}, {"title": "C · Use it in a sentence", "instr": "Choose the word that fits best.", "items": [{"t": "mcq", "q": "He's very ___ — he saves money and never wastes anything.", "o": ["extravagant", "jovial", "callous", "thrifty"], "a": 3, "e": ""}, {"t": "mcq", "q": "The ___ noise from the construction site gave me a headache.", "o": ["pensive", "incessant", "quaint", "apposite"], "a": 1, "e": ""}, {"t": "mcq", "q": "Fax machines are almost ___ now.", "o": ["brisk", "radiant", "obsolete", "diligent"], "a": 2, "e": ""}, {"t": "mcq", "q": "She's a ___ student who studies every day.", "o": ["flimsy", "diligent", "vindictive", "negligent"], "a": 1, "e": ""}, {"t": "mcq", "q": "Bad weather ___ the rescue work.", "o": ["lamented", "reiterated", "hampered", "emulated"], "a": 2, "e": ""}]}], "next": "Lesson 4 — Synonyms & Antonyms: Exam Practice"};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
