<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pronouns — Final Test · Pioneer Education</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#152033; --muted:#5b6678; --line:#e3e8f0;
  --brand:#1f3f93; --brand-2:#2f5bd3; --accent:#f28c28; --accent-soft:#fff3e6;
  --ok:#16803c; --ok-soft:#e7f6ec; --bad:#c62828; --bad-soft:#fdecec;
  --pun:#6d3fb8; --pun-soft:#f3edfc; --exam:#0f766e; --exam-soft:#e6f6f4;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}
header.hero .wrap{padding-bottom:0}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:10px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.9;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0f1420}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;color:var(--brand)}
.card p{margin:8px 0}
.card.pun{background:var(--pun-soft);border-color:transparent}.card.pun h3{color:var(--pun)}
.pa{font-size:16.5px;line-height:1.8}
.card.exam{background:var(--exam-soft);border-color:transparent}.card.exam h3{color:var(--exam)}
.card.mist h3{color:var(--bad)}
.mk{border-top:1px dashed var(--line);padding:8px 0}.mk:first-of-type{border-top:0}
.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}.why{font-size:14px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
.exl{list-style:none;padding:0;margin:8px 0}
.exl li{padding:6px 0;border-bottom:1px solid var(--line)}.exl li:last-child{border-bottom:0}
.say{cursor:pointer}
.say::after{content:" 🔊";font-size:13px;opacity:.55}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted)}
table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.qt{margin:0 0 10px;font-weight:500}
.qn{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;margin-right:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand">Pioneer Education · English Grammar</div>
  <span class="chip" id="chip"></span>
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
</div></header>
<div class="bar"><div class="wrap">
  <div class="prog"><i id="pbar"></i></div>
  <div class="stat" id="stat">0 / 0</div>
</div></div>
<main class="wrap">
  <div class="tabs"><button id="tLearn" class="on">📘 Learn</button><button id="tPractice">✍️ Practice</button></div>
  <div id="learn"></div>
  <div id="practice" class="hide"></div>
  <div id="result" class="card result hide"></div>
  <footer>© Pioneer Education, Prem Nagar, Morinda · Pronouns unit</footer>
</main>
<script>
/* Optional: paste your YouTube link or a video URL for this lesson here. Leave "" to hide the video. */
var VIDEO_URL = "";
var D = {"n": 10, "total": 9, "title": "Pronouns — Final Test", "sub": "30 mixed questions + 10 error-spotting", "test": true, "video": false, "learn": ["<section class=\"card \"><h3>Before you start</h3><p>This test mixes everything from Lessons 1–9: subject/object, possessive, reflexive, demonstrative, indefinite and relative pronouns.</p><ul><li>Answer every question — one attempt each.</li><li>Read the explanation after each answer.</li><li>Target: <b>80%</b> or more to complete the Pronouns unit.</li></ul></section>"], "sets": [{"title": "Part 1 · Choose the correct answer", "instr": "30 questions.", "items": [{"t": "mcq", "q": "Your brother is so rude. I don't like ___.", "o": ["he", "himself", "his", "him"], "a": 3, "e": ""}, {"t": "mcq", "q": "May I take ___ umbrella?", "o": ["you", "your", "you're", "yours"], "a": 1, "e": ""}, {"t": "mcq", "q": "Whose car is this? This car is ___.", "o": ["we", "ours", "our", "our's"], "a": 1, "e": ""}, {"t": "mcq", "q": "This is Jane's book. The book is ___.", "o": ["he", "her's", "her", "hers"], "a": 3, "e": ""}, {"t": "mcq", "q": "Who are these people? I don't remember ___.", "o": ["they", "them", "their", "themselves"], "a": 1, "e": ""}, {"t": "mcq", "q": "What a wonderful pillow! Did you make it by ___?", "o": ["yours", "you", "your", "yourself"], "a": 3, "e": ""}, {"t": "mcq", "q": "Jerry didn't do ___ wrong.", "o": ["anything", "everything", "something", "nothing"], "a": 0, "e": ""}, {"t": "mcq", "q": "The classroom is empty. I can see ___ here.", "o": ["nobody", "somebody", "anybody", "everybody"], "a": 0, "e": ""}, {"t": "mcq", "q": "Sara spoke to James ___. (not to his assistant)", "o": ["yourself", "itself", "himself", "themselves"], "a": 2, "e": "Emphasis: James personally."}, {"t": "mcq", "q": "I am so sorry, but I can do ___ in this situation.", "o": ["nothing", "anything", "everything", "something"], "a": 0, "e": ""}, {"t": "mcq", "q": "Jake, we haven't seen you for ages. When will you come and see ___?", "o": ["we", "us", "them", "our"], "a": 1, "e": ""}, {"t": "mcq", "q": "Look at ___; he is very happy.", "o": ["he", "him", "them", "his"], "a": 1, "e": ""}, {"t": "mcq", "q": "They have done ___ work properly.", "o": ["their", "themselves", "them", "there"], "a": 0, "e": ""}, {"t": "mcq", "q": "Tom, be careful with the knife; you can cut ___.", "o": ["your", "yourself", "you", "it"], "a": 1, "e": ""}, {"t": "mcq", "q": "Sandra had to send an email to the headmaster ___. (not to his secretary)", "o": ["itself", "yourself", "himself", "herself"], "a": 2, "e": ""}, {"t": "mcq", "q": "Oh no, am I alone here? I can't find ___.", "o": ["everybody", "somebody", "nobody", "anybody"], "a": 3, "e": ""}, {"t": "mcq", "q": "Chris moved out when he was 18. He has lived by ___ since then.", "o": ["herself", "himself", "yourself", "myself"], "a": 1, "e": ""}, {"t": "mcq", "q": "If someone comes, tell ___ to wait for a while.", "o": ["his", "them", "he", "they"], "a": 1, "e": "Unknown person → singular “them” (or him/her)."}, {"t": "mcq", "q": "We have bought a boat for ___.", "o": ["we", "our", "us", "ours"], "a": 2, "e": ""}, {"t": "mcq", "q": "Jill didn't answer Martin. She didn't know what to tell ___.", "o": ["his", "himself", "him", "he"], "a": 2, "e": ""}, {"t": "mcq", "q": "He went to the shop, but he bought ___.", "o": ["nothing", "something", "anything", "everything"], "a": 0, "e": ""}, {"t": "mcq", "q": "Nicky left Peter and returned to London. Now she lives by ___.", "o": ["herself", "she", "her", "hers"], "a": 0, "e": ""}, {"t": "mcq", "q": "Jack said that he saw Jessica ___ in the street. (the famous singer, in person)", "o": ["itself", "herself", "himself", "yourself"], "a": 1, "e": ""}, {"t": "mcq", "q": "Is there ___ who can speak Italian?", "o": ["nothing", "everybody", "anybody", "nobody"], "a": 2, "e": ""}, {"t": "mcq", "q": "Liza, do you want to give these flowers to anybody? — No, I bought them for ___.", "o": ["yourself", "herself", "myself", "himself"], "a": 2, "e": ""}, {"t": "mcq", "q": "Vicky, if someone sends a message, answer ___.", "o": ["his", "he", "they", "them"], "a": 3, "e": ""}, {"t": "mcq", "q": "It seems Mark and Jane have taken my umbrella, because I can see only ___ on the shelf.", "o": ["theirs", "them", "they", "their"], "a": 0, "e": ""}, {"t": "mcq", "q": "Hey Carol, do you see ___? I am standing in front of the monument.", "o": ["mine", "my", "me", "myself"], "a": 2, "e": ""}, {"t": "mcq", "q": "Darrel, could you hold on, please? I want to tell you ___.", "o": ["everything", "something", "anything", "someone"], "a": 1, "e": ""}, {"t": "mcq", "q": "Jessica, do you know ___ who can help me?", "o": ["something", "everything", "anybody", "nobody"], "a": 2, "e": ""}]}, {"title": "Part 2 · Spot the correct sentence", "instr": "10 questions — the kind of errors examiners notice.", "items": [{"t": "mcq", "q": "Choose the correct sentence.", "o": ["My friend and I went to Delhi.", "Me and my friend went to Delhi."], "a": 0, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["Myself Harjot, from Morinda.", "I am Harjot, from Morinda."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["The company increased it's profits.", "The company increased its profits."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["Everybody are happy.", "Everybody is happy."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["This is the man who helped me.", "This is the man which helped me."], "a": 0, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["Is this bag your's?", "Is this bag yours?"], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["I didn't see anybody.", "I didn't see nobody."], "a": 0, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence (Ravi's own mother).", "o": ["Ravi called her mother.", "Ravi called his mother."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["The teacher gave the book to Simran and I.", "The teacher gave the book to Simran and me."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["These kind of problems are common.", "These kinds of problems are common."], "a": 1, "e": ""}]}], "next": null};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.test?"the Pronouns Final Test":"Pronouns Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
