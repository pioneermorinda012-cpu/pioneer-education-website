hold my bag?</span></td></tr><tr><td><b>Would you mind + -ing?</b></td><td>very polite</td><td><span class='say'>Would you mind closing the window?</span></td></tr></tbody></table></div><p><b>Permission</b> = <i>I</i> want to do something (Can <b>I</b>…?). <b>Request</b> = I want <i>you</i> to do something (Can <b>you</b>…?).</p></section>", "<section class=\"card \"><h3>Other meanings of can and may</h3><p><b>can</b> = ability: <i>He <b>can</b> drive a car. James <b>can</b> repair laptops.</i><br><b>may</b> = possibility: <i>It <b>may</b> rain tomorrow. Uncle John <b>may</b> visit us this weekend.</i></p></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\"><b>Can I…?</b> = ਕੀ ਮੈਂ… ਸਕਦਾ/ਸਕਦੀ ਹਾਂ? (ਦੋਸਤਾਂ ਨਾਲ)। <b>May I…?</b> = ਇਜਾਜ਼ਤ ਮੰਗਣ ਦਾ ਸਤਿਕਾਰ ਵਾਲਾ ਤਰੀਕਾ — ਅਧਿਆਪਕ, ਬੌਸ ਜਾਂ ਵੱਡਿਆਂ ਨਾਲ ਵਰਤੋ। <b>Could you please…?</b> = ਕਿਸੇ ਨੂੰ ਨਿਮਰਤਾ ਨਾਲ ਕੋਈ ਕੰਮ ਕਰਨ ਲਈ ਕਹਿਣਾ (ਬੇਨਤੀ)। ਨਾਂਹ ਕਰਨੀ ਹੋਵੇ ਤਾਂ ਸਿਰਫ਼ “No” ਨਾ ਕਹੋ — “I'm sorry, but…” ਕਹੋ।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ May I go to drink water?</div><div class=\"good\">✓ May I go and get some water?</div></div><div class=\"mk\"><div class=\"bad\">✗ Can you drop me to the bus stand?</div><div class=\"good\">✓ Can you drop me at the bus stand?</div></div><div class=\"mk\"><div class=\"bad\">✗ Can you click my picture?</div><div class=\"good\">✓ Could you take my photo?</div><div class=\"why\">“take a photo” is standard; “click” is informal Indian English.</div></div><div class=\"mk\"><div class=\"bad\">✗ Can I take tea?</div><div class=\"good\">✓ Can I have some tea?</div><div class=\"why\">We “have” food and drinks.</div></div><div class=\"mk\"><div class=\"bad\">✗ Give me your pen.</div><div class=\"good\">✓ Could I borrow your pen, please?</div><div class=\"why\">An order sounds rude — make it a question.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>In IELTS Speaking, if you don't understand a question you <b>can</b> ask: <i>“<b>Could you</b> repeat the question, please?”</i> or <i>“<b>Could you</b> explain what you mean by…?”</i> This is allowed and sounds natural — much better than staying silent.</p></section>"], "sets": [{"title": "A · Permission or request?", "instr": "Is the speaker asking to do something (permission) or asking someone else to do it (request)?", "items": [{"t": "mcq", "q": "Can I turn on the TV?", "o": ["Permission", "Request"], "a": 0, "e": ""}, {"t": "mcq", "q": "Can you pass me the sugar, please?", "o": ["Permission", "Request"], "a": 1, "e": ""}, {"t": "mcq", "q": "Can we play in the garden?", "o": ["Permission", "Request"], "a": 0, "e": ""}, {"t": "mcq", "q": "Can you turn off the radio?", "o": ["Permission", "Request"], "a": 1, "e": ""}, {"t": "mcq", "q": "Can you go to the shop for me?", "o": ["Permission", "Request"], "a": 1, "e": ""}, {"t": "mcq", "q": "Can we go out for dinner, Mum?", "o": ["Permission", "Request"], "a": 0, "e": ""}, {"t": "mcq", "q": "Could you please pay the bill?", "o": ["Permission", "Request"], "a": 1, "e": ""}, {"t": "mcq", "q": "May I use your cellphone?", "o": ["Permission", "Request"], "a": 0, "e": ""}]}, {"title": "B · Write sentences to ask permission", "instr": "Make a question with Can, Could or May. Example: I / have / an apple → Can I have an apple?", "items": [{"t": "fill", "q": "I / have / an apple  → ___", "a": [["Can I have an apple", "May I have an apple", "Could I have an apple"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "I / turn off / the radio  → ___", "a": [["Can I turn off the radio", "May I turn off the radio", "Could I turn off the radio", "Can I turn the radio off", "May I turn the radio off", "Could I turn the radio off"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "I / take / this pen  → ___", "a": [["Can I take this pen", "May I take this pen", "Could I take this pen"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "we / turn on / the DVD player  → ___", "a": [["Can we turn on the DVD player", "May we turn on the DVD player", "Could we turn on the DVD player", "Can we turn the DVD player on", "May we turn the DVD player on", "Could we turn the DVD player on"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "I / go to / the cinema / with Susan / on Sunday, Mum  → ___", "a": [["Can I go to the cinema with Susan on Sunday, Mum", "May I go to the cinema with Susan on Sunday, Mum", "Could I go to the cinema with Susan on Sunday, Mum", "Can I go to the cinema with Susan on Sunday Mum", "May I go to the cinema with Susan on Sunday Mum", "Could I go to the cinema with Susan on Sunday Mum"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "I / turn on / the PlayStation  → ___", "a": [["Can I turn on the PlayStation", "May I turn on the PlayStation", "Could I turn on the PlayStation", "Can I turn the PlayStation on", "May I turn the PlayStation on", "Could I turn the PlayStation on"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "we / borrow / these books  → ___", "a": [["Can we borrow these books", "May we borrow these books", "Could we borrow these books"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}, {"t": "fill", "q": "we / play tennis / this afternoon, Dad  → ___", "a": [["Can we play tennis this afternoon, Dad", "May we play tennis this afternoon, Dad", "Could we play tennis this afternoon, Dad", "Can we play tennis this afternoon Dad", "May we play tennis this afternoon Dad", "Could we play tennis this afternoon Dad"]], "e": "Can (informal), Could (more polite) and May (formal) are all correct."}]}, {"title": "C · can or may?", "instr": "can = ability · may = possibility or formal permission. Some have two correct answers.", "items": [{"t": "fill", "q": "___ Mary write poems?", "a": [["Can"]], "e": "Ability."}, {"t": "fill", "q": "It ___ rain tomorrow.", "a": [["may"]], "e": "Possibility."}, {"t": "fill", "q": "The jug ___ hold one litre of juice.", "a": [["can"]], "e": "Ability / capacity."}, {"t": "fill", "q": "___ I go with you to the library?", "a": [["May", "Can"]], "e": "Permission — May is more polite."}, {"t": "fill", "q": "___ you recycle these bottles?", "a": [["Can"]], "e": "Request / ability."}, {"t": "fill", "q": "You ___ use my phone.", "a": [["may", "can"]], "e": "Giving permission."}, {"t": "fill", "q": "I ___ solve this problem.", "a": [["can"]], "e": "Ability."}, {"t": "fill", "q": "Mrs. Nkosi ___ ask you to start again on a fresh paper.", "a": [["may"]], "e": "Possibility."}, {"t": "fill", "q": "James ___ repair laptops.", "a": [["can"]], "e": "Ability."}, {"t": "fill", "q": "___ I join you on your trip to the park?", "a": [["May", "Can"]], "e": ""}, {"t": "fill", "q": "He ___ help you with your homework.", "a": [["can", "may"]], "e": ""}, {"t": "fill", "q": "___ I borrow your pencil?", "a": [["May", "Can"]], "e": ""}, {"t": "fill", "q": "My aunt ___ sing in the gurdwara on Sunday if she is not sick.", "a": [["may", "can"]], "e": "Possibility — may is best."}]}, {"title": "D · Say it the right way", "instr": "Choose the best sentence for the situation.", "items": [{"t": "mcq", "q": "You are late and want to enter the classroom.", "o": ["I am coming in.", "May I come in, sir?", "Can I come inside or not?"], "a": 1, "e": ""}, {"t": "mcq", "q": "You want your friend to lend you a pen.", "o": ["Can I borrow your pen?", "Give me pen.", "May you give me pen?"], "a": 0, "e": ""}, {"t": "mcq", "q": "You want a stranger to take your photo.", "o": ["Click my picture.", "You take my photo.", "Could you please take a photo of us?"], "a": 2, "e": ""}, {"t": "mcq", "q": "In the IELTS Speaking test you didn't hear the     if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
