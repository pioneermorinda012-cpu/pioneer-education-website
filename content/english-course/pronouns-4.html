var VIDEO_URL = "";
var D = {"n": 4, "total": 9, "title": "Reflexive Pronouns", "sub": "myself · by myself · each other", "test": false, "video": false, "learn": ["<section class=\"card \"><h3>The -self / -selves words</h3><div class=\"tw\"><table class=\"two\"><thead><tr><th>Subject</th><th>Reflexive</th></tr></thead><tbody><tr><td>I</td><td>myself</td></tr><tr><td>you (one)</td><td>yourself</td></tr><tr><td>he</td><td>himself</td></tr><tr><td>she</td><td>herself</td></tr><tr><td>it</td><td>itself</td></tr><tr><td>we</td><td>ourselves</td></tr><tr><td>you (many)</td><td>yourselves</td></tr><tr><td>they</td><td>themselves</td></tr></tbody></table></div></section>", "<section class=\"card \"><h3>Three uses</h3><p><b>1. Same person does and receives the action</b></p><ul class=\"exl\"><li><span class=\"say\">I cut <b>myself</b> while cooking.</span></li><li><span class=\"say\">She looked at <b>herself</b> in the mirror.</span></li></ul><p><b>2. Emphasis — “personally, nobody else”</b></p><ul class=\"exl\"><li><span class=\"say\">I washed the dishes <b>myself</b>.</span></li><li><span class=\"say\">The principal <b>himself</b> came to meet us.</span></li></ul><p><b>3. by + reflexive = alone / without help</b></p><ul class=\"exl\"><li><span class=\"say\">I cleaned the house <b>by myself</b>. (I was alone.)</span></li><li><span class=\"say\">She lives <b>by herself</b>.</span></li></ul></section>", "<section class=\"card \"><h3>Reflexive or each other?</h3><p><b>-selves</b>: each person does the action to himself/herself. <b>each other</b>: people do it to one another.</p><ul class=\"exl\"><li><span class=\"say\">They blamed <b>themselves</b>. (each blamed himself)</span></li><li><span class=\"say\">They blamed <b>each other</b>. (A blamed B, B blamed A)</span></li></ul><p class='note'>We usually <b>don't</b> use reflexives with <i>wash, shave, dress, feel, relax</i>: <i>I shaved and got dressed.</i> (not <s>shaved myself</s>)</p></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">Reflexive pronoun ਉਦੋਂ ਵਰਤੋ ਜਦੋਂ ਕੰਮ ਕਰਨ ਵਾਲਾ ਅਤੇ ਜਿਸ ਉੱਤੇ ਕੰਮ ਹੋਇਆ, ਦੋਵੇਂ <b>ਇੱਕੋ</b> ਹੋਣ — “ਆਪਣੇ ਆਪ ਨੂੰ”। <b>by myself</b> = ਇਕੱਲਿਆਂ / ਬਿਨਾਂ ਮਦਦ ਤੋਂ। <b>each other</b> = ਇੱਕ ਦੂਜੇ ਨੂੰ। ਆਪਣੀ ਜਾਣ-ਪਛਾਣ ਵਿੱਚ “Myself Narinder” ਨਾ ਕਹੋ — “I am Narinder” ਜਾਂ “My name is Narinder” ਕਹੋ।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ Myself Harjot Singh, from Morinda.</div><div class=\"good\">✓ I am Harjot Singh, from Morinda.</div><div class=\"why\">“Myself” can never be the subject.</div></div><div class=\"mk\"><div class=\"bad\">✗ Myself and Aman will attend.</div><div class=\"good\">✓ Aman and I will attend.</div></div><div class=\"mk\"><div class=\"bad\">✗ He hurt hisself.</div><div class=\"good\">✓ He hurt himself.</div><div class=\"why\">hisself / theirselves are not standard English.</div></div><div class=\"mk\"><div class=\"bad\">✗ Ram and Sita love themselves.</div><div class=\"good\">✓ Ram and Sita love each other.</div><div class=\"why\">They love one another → each other.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>In IELTS Speaking Part 1, begin with <i>“My name is…”</i> or <i>“I'm…”</i>. Starting with <i>“Myself…”</i> is a common Indian-English error that examiners notice immediately.</p></section>"], "sets": [{"title": "A · Choose the correct answer", "instr": "Choose the correct reflexive pronoun.", "items": [{"t": "mcq", "q": "My mother does the housework ___.", "o": ["herself", "himself"], "a": 0, "e": ""}, {"t": "mcq", "q": "I prepared this work ___.", "o": ["ourselves", "myself"], "a": 1, "e": ""}, {"t": "mcq", "q": "She made this cake ___.", "o": ["herself", "myself"], "a": 0, "e": ""}, {"t": "mcq", "q": "My mother and I do the shopping ___.", "o": ["ourselves", "myself"], "a": 0, "e": "My mother and I = we → ourselves."}, {"t": "mcq", "q": "Kerem cuts his hair ___.", "o": ["itself", "himself"], "a": 1, "e": ""}, {"t": "mcq", "q": "Seher and Yaşar prepare the dinner ___.", "o": ["ourselves", "themselves"], "a": 1, "e": ""}, {"t": "mcq", "q": "I introduced ___ to the tourists.", "o": ["ourselves", "myself"], "a": 1, "e": ""}]}, {"title": "B · Fill in the reflexive pronoun", "instr": "Write the reflexive pronoun.", "items": [{"t": "fill", "q": "Our friends and we go to school ___.", "a": [["ourselves"]], "e": ""}, {"t": "fill", "q": "My father does his work ___.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "Serkan cut the trees ___.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "My mother and father decorate the house ___.", "a": [["themselves"]], "e": ""}, {"t": "fill", "q": "Kerem and I did the project ___.", "a": [["ourselves"]], "e": ""}, {"t": "fill", "q": "My grandparents planned their holiday ___.", "a": [["themselves"]], "e": ""}, {"t": "fill", "q": "Fidan cooked this delicious meal ___.", "a": [["herself"]], "e": ""}, {"t": "fill", "q": "Our teacher (Mr Sharma) plans the lesson ___.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "Our cat drinks the milk ___.", "a": [["itself"]], "e": ""}, {"t": "fill", "q": "Hakan does the shopping ___.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "Su and Selim went on holiday by ___.", "a": [["themselves"]], "e": ""}, {"t": "fill", "q": "Vedat walked in the darkness by ___.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "I stayed at home last night by ___.", "a": [["myself"]], "e": ""}]}, {"title": "C · Who is the subject?", "instr": "Write the subject pronoun that matches the reflexive.", "items": [{"t": "fill", "q": "___ washed the dishes myself.", "a": [["I"]], "e": ""}, {"t": "fill", "q": "___ played outside themselves.", "a": [["They"]], "e": ""}, {"t": "fill", "q": "___ eats her meal herself.", "a": [["She"]], "e": ""}, {"t": "fill", "q": "___ goes to the sports centre himself.", "a": [["He"]], "e": ""}, {"t": "fill", "q": "___ do my homework myself.", "a": [["I"]], "e": ""}, {"t": "fill", "q": "___ watched the film ourselves.", "a": [["We"]], "e": ""}, {"t": "fill", "q": "___ sleeps in its bed itself.", "a": [["It"]], "e": ""}, {"t": "fill", "q": "___ takes care of the baby herself.", "a": [["She"]], "e": ""}, {"t": "fill", "q": "___ drives to work himself.", "a": [["He"]], "e": ""}]}, {"title": "D · Alone, or just emphasis?", "instr": "“by + myself” = alone. Without “by” = emphasis (did it personally).", "items": [{"t": "mcq", "q": "I went out last night by myself.", "o": ["Alone", "Emphasis"], "a": 0, "e": ""}, {"t": "mcq", "q": "She decorated her room herself.", "o": ["Alone", "Emphasis"], "a": 1, "e": ""}, {"t": "mcq", "q": "We had a picnic with our children ourselves.", "o": ["Alone", "Emphasis"], "a": 1, "e": ""}, {"t": "mcq", "q": "My mother goes to work by herself.", "o": ["Alone", "Emphasis"], "a": 0, "e": ""}, {"t": "mcq", "q": "I sewed that dress by myself.", "o": ["Alone", "Emphasis"], "a": 0, "e": ""}, {"t": "mcq", "q": "Serdar watched TV at home himself.", "o": ["Alone", "Emphasis"], "a": 1, "e": ""}, {"t": "mcq", "q": "Sevgi lives in this house by herself.", "o": ["Alone", "Emphasis"], "a": 0, "e": ""}, {"t": "mcq", "q": "I went to the museum by myself.", "o": ["Alone", "Emphasis"], "a": 0, "e": ""}]}, {"title": "E · Reflexive or each other? (Pro)", "instr": "Write “each other” or a reflexive pronoun.", "items": [{"t": "fill", "q": "Why are you talking to ___? Don't you think it's a bit weird?", "a": [["yourself"]], "e": ""}, {"t": "fill", "q": "He cut ___ while he was shaving.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "Mary and I are best friends and we trust ___ completely.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "Did you enjoy ___ at the party last night?", "a": [["yourself", "yourselves"]], "e": ""}, {"t": "fill", "q": "Lucy always remembers my birthday and I remember hers. We always send ___ birthday cards.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "Look at ___! You're soaking wet.", "a": [["yourself", "yourselves"]], "e": ""}, {"t": "fill", "q": "We have been friends for years. We know ___ very well.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "We haven't seen ___ for ages.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "I've made the cake ___. I hope you'll enjoy it.", "a": [["myself"]], "e": ""}, {"t": "fill", "q": "You should be proud of ___. You've done a good job.", "a": [["yourself", "yourselves"]], "e": ""}, {"t": "fill", "q": "Friends can always rely on ___.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "She blames ___ for the mistake.", "a": [["herself"]], "e": ""}, {"t": "fill", "q": "Adam only thinks of ___. He is so selfish.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "I sometimes talk to ___. I know it's a bit weird.", "a": [["myself"]], "e": ""}, {"t": "fill", "q": "John is proud of ___ because his business has grown.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "We are angry with ___ because we lied to our parents.", "a": [["ourselves"]], "e": ""}, {"t": "fill", "q": "Sue looked at ___ in the mirror.", "a": [["herself"]], "e": ""}, {"t": "fill", "q": "My parents love ___ and they always show ___ a lot of affection.", "a": [["each other"], ["each other"]], "e": ""}, {"t": "fill", "q": "Our town should promote ___ as a tourist resort.", "a": [["itself"]], "e": ""}, {"t": "fill", "q": "Katya and Andy aren't seeing ___ anymore. They broke up last week.", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "She kept repeating to ___, 'You can make it.'", "a": [["herself"]], "e": ""}, {"t": "fill", "q": "Do we know ___? Have we met before?", "a": [["each other"]], "e": ""}, {"t": "fill", "q": "Stop panicking! Pull ___ together, guys!", "a": [["yourselves"]], "e": ""}]}, {"title": "F · Advanced reflexives (Pro)", "instr": "Write myself, yourself, himself, herself, itself, ourselves, yourselves or themselves.", "items": [{"t": "fill", "q": "We wrote these poems ___ in the English lesson.", "a": [["ourselves"]], "e": ""}, {"t": "fill", "q": "At first Marianne found the party boring, but after she met Tommy she began to enjoy ___.", "a": [["herself"]], "e": ""}, {"t": "fill", "q": "Why don't you go to the party and see for ___ how she is?", "a": [["yourself"]], "e": ""}, {"t": "fill", "q": "Romeo and Juliet sacrificed ___ because their parents were against their love.", "a": [["themselves"]], "e": ""}, {"t": "fill", "q": "What's the matter with Peter? — I think he cut ___ with a knife.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "We often ask ___ why we didn't win the match.", "a": [["ourselves"]], "e": ""}, {"t": "fill", "q": "Be careful, children, or you will hurt ___.", "a": [["yourselves"]], "e": ""}, {"t": "fill", "q": "This machine will switch ___ off in ten minutes.", "a": [["itself"]], "e": ""}, {"t": "fill", "q": "John was so angry that he threw ___ on the ground.", "a": [["himself"]], "e": ""}, {"t": "fill", "q": "My friends enjoyed ___ very much at the birthday party.", "a": [["themselves"]], "e": ""}, {"t": "fill", "q": "Tom, control ___. You can't shout here.", "a": [["yourself"]], "e": ""}, {"t": "fill", "q": "If I were a magician, I would turn ___ into a bird.", "a": [["myself"]], "e": ""}, {"t": "fill", "q": "Don't worry, Mum. We can look after ___ when you are away.", "a": [["ourselves"]], "e": ""}]}], "next": "Lesson 5 — This, That, These, Those"};

    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.test?"the Pronouns Final Test":"Pronouns Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
