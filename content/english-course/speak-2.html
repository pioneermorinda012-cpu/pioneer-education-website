lass='badge'>4 model</span></summary><ol><li><span class='say'>Are your friends mostly your age or different ages?</span><div class='model'><b>Model answer:</b> Most of them are about my age, because we met at school or college. But I also have one or two older friends from my neighbourhood who give me good advice.</div></li><li><span class='say'>Do you usually see your friends during the week or at weekends?</span><div class='model'><b>Model answer:</b> It depends. I see my college friends almost every day because we attend classes together, but my friends who have part-time jobs are only free at weekends.</div></li><li><span class='say'>The last time you saw your friends, what did you do together?</span><div class='model'><b>Model answer:</b> A couple of days ago we went to watch a movie at a multiplex in Mohali. After that we had lunch together and spent ages talking about the cricket match. It was a great day out.</div></li><li><span class='say'>In what ways are your friends important to you?</span><div class='model'><b>Model answer:</b> They&#x27;re very important to me. Firstly, we share a lot of interests, so I never get bored with them. Secondly, they&#x27;ve always supported me in difficult times, which I really value.</div></li></ol></details><details><summary><b>2. Food and cooking</b> <span class='cnt'>(6 questions)</span> <span class='badge'>6 model</span></summary><ol><li><span class='say'>What kinds of food do you like to eat?</span><div class='model'><b>Model answer:</b> I mostly prefer home-made food because it&#x27;s hygienic and less oily. But I also enjoy eating out now and then — I&#x27;m quite fond of pizza and Chinese noodles.</div></li><li><span class='say'>What kind of new food would you like to try?</span><div class='model'><b>Model answer:</b> I&#x27;ve never tried Thai food, and I&#x27;d love to. One of my cousins is crazy about it, and he&#x27;s convinced me to give it a try.</div></li><li><span class='say'>Do you like cooking?</span><div class='model'><b>Model answer:</b> Yes, I do. I find it quite relaxing, and it feels good when my family enjoys what I&#x27;ve made.</div></li><li><span class='say'>What was the last meal you cooked?</span><div class='model'><b>Model answer:</b> Last night I made egg fried rice with some mixed vegetables. Everyone liked it, so I was quite proud of myself.</div></li><li><span class='say'>Do you prefer home-cooked food or food from restaurants?</span><div class='model'><b>Model answer:</b> Definitely home-cooked food. Restaurant meals are expensive and not always hygienic, and my father isn&#x27;t keen on eating out too often.</div></li><li><span class='say'>What types of food are popular in your country?</span><div class='model'><b>Model answer:</b> It varies from region to region. In Punjab, dishes like makki di roti with sarson da saag and butter chicken are very popular, while in the south people love dosa and idli.</div></li></ol></details><details><summary><b>3. Leisure</b> <span class='cnt'>(5 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>Do you have any hobbies or interests?</span><div class='model'><b>Model answer:</b> Yes, I love travelling and reading. I&#x27;ve visited many parts of my state, and in my free time I mostly read novels and travel blogs.</div></li><li><span class='say'>How did you become interested in it?</span><div class='model'><b>Model answer:</b> I think I got it from my father — he loves exploring new places. As for reading, my mother and grandfather encouraged me to read from a very young age.</div></li><li><span class='say'>What is there to do in your free time in your hometown?</span></li><li><span class='say'>How do you usually spend your holidays?</span><div class='model'><b>Model answer:</b> I usually spend them with my family. If the holiday is longer than five days, we visit another city; for shorter breaks we go to a park, a museum or simply watch movies at home.</div></li><li><span class='say'>Is there anywhere you would particularly like to visit?</span></li></ol></details><details><summary><b>4. Favourite place</b> <span class='cnt'>(3 questions)</span></summary><ol><li><span class='say'>What place do you most like to visit?</span></li><li><span class='say'>Is it popular with other people?</span></li><li><span class='say'>Has it changed much since you first went there?</span></li></ol></details><details><summary><b>5. Your country</b> <span class='cnt'>(4 questions)</span> <span class='badge'>4 model</span></summary><ol><li><span class='say'>Which part of your country do most people live in?</span><div class='model'><b>Model answer:</b> Most people live in cities and big towns these days, mainly because of better job opportunities and public services like hospitals and colleges.</div></li><li><span class='say'>Tell me about the main industries there.</span><div class='model'><b>Model answer:</b> Agriculture is still the backbone of Punjab. Apart from that, Ludhiana is famous for textiles and bicycle parts, and Jalandhar is well known for sports goods.</div></li><li><span class='say'>How easy is it to travel around your country?</span><div class='model'><b>Model answer:</b> It&#x27;s fairly easy. India has a huge railway network and good highways, and flights between major cities have become quite affordable.</div></li><li><span class='say'>Has your country changed much since you were a child?</span><div class='model'><b>Model answer:</b> Yes, a lot — mostly for the better. There are better roads, much faster internet and more online services. On the other hand, the population has grown a lot, so cities are more crowded.</div></li></ol></details><details><summary><b>6. Colour</b> <span class='cnt'>(5 questions)</span> <span class='badge'>1 model</span></summary><ol><li><span class='say'>What is your favourite colour?</span><div class='model'><b>Model answer:</b> My favourite colour is yellow. It reminds me of sunshine and mustard fields, and it  gifts for people?</span></li></ol></details><details><summary><b>23. Telephoning</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How often do you make telephone calls?</span></li><li><span class='say'>Who do you spend most time talking to on the telephone?</span></li><li><span class='say'>When do you think you will next make a telephone call?</span></li><li><span class='say'>Do you sometimes prefer to send a text message instead of phoning?</span></li></ol></details><details><summary><b>24. Bicycles</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How popular are bicycles in your hometown?</span></li><li><span class='say'>How often do you ride a bicycle?</span></li><li><span class='say'>Do you think that bicycles are suitable for all ages?</span></li><li><span class='say'>What are the advantages of a bicycle compared to a car?</span></li></ol></details><details><summary><b>25. Food and cooking (2)</b> <span class='cnt'>(6 questions)</span></summary><ol><li><span class='say'>What sorts of food do you like eating most?</span></li><li><span class='say'>Who normally does the cooking in your home?</span></li><li><span class='say'>Do you watch cookery programmes on TV?</span></li><li><span class='say'>Do you prefer eating out or eating at home?</span></li><li><span class='say'>When was the first time you cooked something yourself?</span></li><li><span class='say'>How happy are you to try eating new things?</span></li></ol></details><details><summary><b>26. Photographs</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>What type of photos do you like taking?</span></li><li><span class='say'>What do you do with the photos you take?</span></li><li><span class='say'>When you visit other places, do you take photos or buy postcards?</span></li><li><span class='say'>Do you like people taking photos of you?</span></li></ol></details><details><summary><b>27. Names</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Does your name have any special meaning?</span></li><li><span class='say'>How did your parents choose your name?</span></li><li><span class='say'>Is your name common or unusual in your country?</span></li><li><span class='say'>If you could change your name, would you?</span></li></ol></details><details><summary><b>28. Weekends</b> <span class='cnt'>(6 questions)</span></summary><ol><li><span class='say'>What do you usually do at the weekend?</span></li><li><span class='say'>What is your favourite part of the weekend?</span></li><li><span class='say'>Do you think your weekends are long enough?</span></li><li><span class='say'>What do you think you will do next weekend?</span></li><li><span class='say'>Do you enjoy your weekends now more than you did when you were a child?</span></li><li><span class='say'>How important is it for you to relax at the end of the week?</span></li></ol></details><details><summary><b>29. Music</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>What types of music do you like to listen to?</span></li><li><span class='say'>At what times of day do you like to listen to music?</span></li><li><span class='say'>Did you learn to play a musical instrument when you were a child?</span></li><li><span class='say'>Do you think all children should learn to play a musical instrument?</span></li></ol></details><details><summary><b>30. Travel</b> <span class='cnt'>(7 questions)</span></summary><ol><li><span class='say'>Do you enjoy travelling?</span></li><li><span class='say'>Have you done much travelling?</span></li><li><span class='say'>Have you ever travelled outside your country?</span></li><li><span class='say'>What do you think is the best way to travel?</span></li><li><span class='say'>Do you think it&#x27;s better to travel alone or with other people?</span></li><li><span class='say'>If you were going on a long trip, who would you prefer to go with?</span></li><li><span class='say'>Where would you like to travel in the future?</span></li></ol></details><details><summary><b>31. School</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Did you go to secondary school near where you lived?</span></li><li><span class='say'>What did you like about your secondary school?</span></li><li><span class='say'>Tell me about anything you didn&#x27;t like at your school.</span></li><li><span class='say'>How do you think your school could be improved?</span></li></ol></details><details><summary><b>32. Where you live</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you live in a town or in the country?</span></li><li><span class='say'>Is it a convenient place to live?</span></li><li><span class='say'>What is interesting about the area where you live?</span></li><li><span class='say'>Where would you like to live in the future?</span></li></ol></details><details><summary><b>33. Sport</b> <span class='cnt'>(3 questions)</span></summary><ol><li><span class='say'>Which is the most popular sport in your country?</span></li><li><span class='say'>What are the advantages of doing sports regularly?</span></li><li><span class='say'>Which new sport would you like to try?</span></li></ol></details><details><summary><b>34. Home</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you live in a house or a flat?</span></li><li><span class='say'>What do you like most about your house or flat?</span></li><li><span class='say'>Is there anything about it that you would like to change?</span></li><li><span class='say'>What is your idea of a perfect home?</span></li></ol></details><details><summary><b>35. Hobbies</b> <span class='cnt'>(4 questions)</span> <span class='badge'>1 model</span></summary><ol><li><span class='say'>Tell me about any hobbies you have now or had in the past.</span></li><li><span class='say'>Do you feel you have enough free time for hobbies?</span></li><li><span class='say'>How important is it for people to have hobbies at different ages?</span></li><li><span class='say'>If you had the chance to take up a new hobby, what would it be?</span><div class='model'><b>Model answer:</b> I&#x27;d love to learn a musical instrument — probably the guitar. I really admire people who can play, and I hope to take lessons once my exams are over.</div></li></ol></details><details><summary><b>36. Entertainment (2)</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you go out a lot or do you prefer home entertainment?</span></li><li><span class='say'>What kind of things do you watch on TV?</span></li><li><span class='say'>Can you easily entertain yourself when you are alone?</span></li><li><span class='say'>Are there many places for entertainment in your area?</span></li></ol></details><details><summary><b>37. Computers and the internet</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How often do you use the computer? What for?</span></li><li><span class='say'>Do you like using the internet?</span></li><li><span class='say'>How did you learn to use a computer?</span></li><li><span class='say'>Do you think it is important to know how to use a computer?</span></li></ol></details><details><summary><b>38. City</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How long have you lived in this city?</span></li><li><span class='say'>Do tourists visit your city?</span></li><li><span class='say'>What places do you think tourists should see in your city?</span></li><li><span class='say'>What is the best way for tourists to travel around your city?</span></li></ol></details><details><summary><b>39. Reading</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Did your parents read to you when you were a child?</span></li><li><span class='say'>Do you read for pleasure very often?</span></li><li><span class='say'>What kind of books or magazines do you buy?</span></li><li><span class='say'>Which do you find easier, reading in English or writing in English?</span></li></ol></details><details><summary><b>40. Holidays</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How often do you get holidays from work or college?</span></li><li><span class='say'>Do you usually stay at home when you have a holiday, or do you go somewhere?</span></li><li><span class='say'>What did you do the last time you had a holiday?</span></li><li><span class='say'>Do you wish you had more holidays?</span></li></ol></details><details><summary><b>41. Dreams</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you remember your dreams when you wake up?</span></li><li><span class='say'>Do you like hearing about other people&#x27;s dreams?</span></li><li><span class='say'>Do you share your dreams with other people?</span></li><li><span class='say'>Do you think dreams affect our lives?</span></li></ol></details><details><summary><b>42. Housework</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you often do housework?</span></li><li><span class='say'>What kind of housework did you do when you were a child?</span></li><li><span class='say'>Do you like using machines to do housework?</span></li><li><span class='say'>Who usually does the housework in your family?</span></li></ol></details><details><summary><b>43. Birthdays</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>How do children in your country celebrate their birthdays?</span></li><li><span class='say'>Are birthdays important?</span></li><li><span class='say'>Which birthdays are especially important in your country?</span></li><li><span class='say'>Are birthdays more important for young people or elderly people?</span></li></ol></details><details><summary><b>44. Parents and family</b> <span class='cnt'>(8 questions)</span></summary><ol><li><span class='say'>Do you often stay with your parents?</span></li><li><span class='say'>What do you do when you are with your parents?</span></li><li><span class='say'>Do you have a close relationship with your family?</span></li><li><span class='say'>Who do you resemble most in your family, and in what ways?</span></li><li><span class='say'>Should parents be strict with their children?</span></li><li><span class='say'>What is the most valuable thing parents can give to their children?</span></li><li><span class='say'>Are parents the best teachers for children?</span></li><li><span class='say'>Do your parents teach you things that cannot be learnt at school?</span></li></ol></details><details><summary><b>45. Weather</b> <span class='cnt'>(5 questions)</span></summary><ol><li><span class='say'>Which season do you like best?</span></li><li><span class='say'>Which season has the most rain?</span></li><li><span class='say'>Does the weather have any influence on you?</span></li><li><span class='say'>Do you discuss the weather with others?</span></li><li><span class='say'>Do you think the climate in your country is getting worse than before?</span></li></ol></details><details><summary><b>46. Sunny days</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you like sunny days? Why?</span></li><li><span class='say'>What do you usually do on sunny days?</span></li><li><span class='say'>What things are harder to do in sunshine?</span></li><li><span class='say'>Have you ever been to a place without much sunshine?</span></li></ol></details><details><summary><b>47. Toys</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>What toys did you like to play with when you were a child?</span></li><li><span class='say'>What was the most important toy for you?</span></li><li><span class='say'>What toys do children like these days?</span></li><li><span class='say'>Why do children play with toys?</span></li></ol></details><details><summary><b>48. Chocolate</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you eat chocolate?</span></li><li><span class='say'>When do people give chocolate?</span></li><li><span class='say'>Have you ever received chocolate as a gift?</span></li><li><span class='say'>Why do friends send each other chocolate?</span></li></ol></details><details><summary><b>49. Books</b> <span class='cnt'>(5 questions)</span></summary><ol><li><span class='say'>Do you like reading books?</span></li><li><span class='say'>Where do you read?</span></li><li><span class='say'>Did you read much when you were a child?</span></li><li><span class='say'>Do young children like reading books?</span></li><li><span class='say'>What do you think are the benefits of reading?</span></li></ol></details><details><summary><b>50. Teachers</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you like any of your teachers?</span></li><li><span class='say'>What have you learnt from this teacher?</span></li><li><span class='say'>Is there any teacher that you didn&#x27;t like?</span></li><li><span class='say'>Do you still keep in touch with your teachers?</span></li></ol></details><details><summary><b>51. Celebrities</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you have an idol?</span></li><li><span class='say'>Have you ever seen a celebrity you admire?</span></li><li><span class='say'>Would you like to become a celebrity in the future?</span></li><li><span class='say'>How do celebrities influence their fans in your country?</span></li></ol></details><details><summary><b>52. Visitors</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you prefer going to other people&#x27;s houses or inviting people to yours?</span></li><li><span class='say'>How often do visitors come to your house?</span></li><li><span class='say'>How do you treat these visitors?</span></li><li><span class='say'>What do you usually prepare for guests?</span></li></ol></details><details><summary><b>53. Sports (2)</b> <span class='cnt'>(5 questions)</span></summary><ol><li><span class='say'>What sports do you like best?</span></li><li><span class='say'>Do you like to watch sports on TV?</span></li><li><span class='say'>Do you have a favourite sports star?</span></li><li><span class='say'>What is the most popular sport in your country?</span></li><li><span class='say'>Have you ever tried a dangerous sport?</span></li></ol></details><details><summary><b>54. Indoor games</b> <span class='cnt'>(3 questions)</span></summary><ol><li><span class='say'>What indoor games did you play when you were a child?</span></li><li><span class='say'>What indoor games do you like now?</span></li><li><span class='say'>What sorts of indoor games do children play now?</span></li></ol></details><details><summary><b>55. Outdoor activities</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you prefer going out or staying at home?</span></li><li><span class='say'>What outdoor activities do you like?</span></li><li><span class='say'>How much time do you spend outdoors every week?</span></li><li><span class='say'>What outdoor activities are popular in your country?</span></li></ol></details><details><summary><b>56. Computer games</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Do you prefer playing computer games alone or with friends?</span></li><li><span class='say'>At what age did you first play computer games?</span></li><li><span class='say'>Do you ever buy computer games?</span></li><li><span class='say'>In general, are computer games more popular with men or women?</span></li></ol></details><details><summary><b>57. Animals</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Are there many animals or birds where you live?</span></li><li><span class='say'>How often do you watch programmes or read articles about wild animals?</span></li><li><span class='say'>Have you ever been to a zoo or a wildlife park?</span></li><li><span class='say'>Would you like a job working with animals?</span></li></ol></details><details><summary><b>58. Money</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>When you go shopping, do you prefer to pay in cash or by card?</span></li><li><span class='say'>Do you ever save money to buy special things?</span></li><li><span class='say'>Would you ever take a job with low pay?</span></li><li><span class='say'>Would winning a lot of money make a big difference to your life?</span></li></ol></details><details><summary><b>59. Age</b> <span class='cnt'>(4 questions)</span></summary><ol><li><span class='say'>Are you happy to be the age you are now?</span></li><li><span class='say'>When you were a child, did you think a lot about your future?</span></li><li><span class='say'>Do you think you have changed as you have got older?</span></li><li><span class='say'>What will be different about your future?</span></li></ol></details></section><style>details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'▸ ';color:var(--muted)}details[open] summary::before{content:'▾ '}.cnt{color:var(--muted);font-size:13px}.badge{background:var(--ok-soft);color:var(--ok);font-size:12px;border-radius:99px;padding:1px 8px;margin-left:4px}.model{background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:6px 0 10px;border-radius:6px;font-size:15px}details ol{padding-left:22px}details li{margin:6px 0}</style>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>Practise <b>one topic a day</b>. Record yourself on your phone, listen back and check: Did I answer directly? Did I give a reason? Did I use the right tense?</p></section>"], "sets": [{"title": "Which tense should your answer be in?", "instr": "Read the examiner's question and choose the best tense for your answer.", "items": [{"t": "mcq", "q": "“What toys did you like to play with when you were a child?”", "o": ["future", "past simple / used to", "present simple"], "a": 1, "e": ""}, {"t": "mcq", "q": "“Do you often do housework?”", "o": ["past simple", "present perfect", "present simple"], "a": 2, "e": ""}, {"t": "mcq", "q": "“Have you ever been to a zoo or a wildlife park?”", "o": ["future", "present perfect", "present continuous"], "a": 1, "e": ""}, {"t": "mcq", "q": "“What do you think you will do next weekend?”", "o": ["past simple", "future (will / going to)", "present perfect"], "a": 1, "e": ""}, {"t": "mcq", "q": "“Would you like a job working with animals?”", "o": ["present perfect", "would / conditional", "past simple"], "a": 1, "e": ""}, {"t": "mcq", "q": "“How long have you lived in this city?”", "o": ["future", "present perfect (for / since)", "past simple"], "a": 1, "e": ""}, {"t": "mcq", "q": "“When did you last receive a gift?”", "o": ["present simple", "past simple", "future"], "a": 1, "e": ""}, {"t": "mcq", "q": "“If you could change your name, would you?”", "o": ["present perfect", "past simple", "would / conditional"], "a": 2, "e": ""}]}], "next": null};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
