var D = {"n": 1, "total": 1, "title": "Speaking Part 1: Week 4 Topics", "sub": "Books · sleep · animals · maps · jeans", "test": false, "unit": "IELTS Speaking", "chip": "IELTS Speaking", "share": "Speaking Part 1 — Week 4 topics", "video": true, "js": "\ndocument.querySelectorAll('.vsearch').forEach(function(inp){inp.addEventListener('input',function(){var q=inp.value.toLowerCase().trim();\n inp.closest('section').querySelectorAll('details').forEach(function(d){var hit=!q||d.textContent.toLowerCase().indexOf(q)>-1;d.style.display=hit?'':'none';if(q&&hit)d.open=true;});});});\n\nvar Q=[[\"Books & reading\", \"How often do you read?\"], [\"Books & reading\", \"Do you have many books at home?\"], [\"Books & reading\", \"Do Indian people do enough reading?\"], [\"Books & reading\", \"Do Indian people like to read?\"], [\"Sleep\", \"How many hours do you sleep every day?\"], [\"Sleep\", \"Is it necessary to take a nap every day?\"], [\"Sleep\", \"Do old people sleep a lot? Why?\"], [\"Sleep\", \"What time do you usually go to bed?\"], [\"Sleep\", \"Do you always sleep well?\"], [\"Animals\", \"Do you like animals?\"], [\"Animals\", \"What's your favourite animal? Why?\"], [\"Animals\", \"What's your favourite wild animal? Why?\"], [\"Maps\", \"Do you often use maps?\"], [\"Maps\", \"Who taught you how to use a map?\"], [\"Maps\", \"Do you prefer electronic maps or paper maps?\"], [\"Jeans\", \"Do you wear jeans?\"], [\"Jeans\", \"How often do you wear jeans?\"], [\"Jeans\", \"Do you like wearing jeans? Why?\"], [\"Jeans\", \"Why do you think jeans are popular?\"]]; var box=document.getElementById('pq'); if(!box) return;\nvar t=null, left=0;\nfunction pick(){ var r=Q[Math.floor(Math.random()*Q.length)]; document.getElementById('pq_topic').textContent=r[0]; document.getElementById('pq_q').textContent=r[1];\n clearInterval(t); left=30; tick(); say(r[1]); t=setInterval(function(){left--; tick(); if(left<=0){clearInterval(t);}},1000); }\nfunction tick(){ var el=document.getElementById('pq_t'); el.textContent=left>0?('⏱ '+left+'s — answer now: Answer + Reason + Example'):'⏹ Time! Did you give a reason and an example?'; }\nfunction say(s){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}\ndocument.getElementById('pq_go').onclick=pick;\ndocument.getElementById('pq_again').onclick=function(){say(document.getElementById('pq_q').textContent)};\n", "learn": ["<section class=\"card\" id=\"pq\"><h3>🎤 Practice mode</h3>\n<p class=\"instr\">Tap the button. The examiner's question is read aloud. Answer out loud in about 20–30 seconds.</p>\n<div class=\"intro\" style=\"background:var(--bg);border-radius:12px;padding:14px\"><div id=\"pq_topic\" style=\"color:var(--muted);font-size:13px\">Topic</div>\n<div id=\"pq_q\" style=\"font-size:18px;font-weight:600;margin:6px 0\">Tap “New question” to start.</div><div id=\"pq_t\" style=\"color:var(--accent);font-weight:600\"></div></div>\n<div class=\"btns\"><button class=\"btn pri\" id=\"pq_go\">🎲 New question</button><button class=\"btn\" id=\"pq_again\">🔊 Repeat</button></div></section>", "<section class=\"card\"><h3>5 topics with model answers</h3><input class=\"vsearch fi\" style=\"width:100%;margin:0 0 10px\" placeholder=\"🔍 Search a topic or word…\"><details><summary><b>1. Books &amp; reading</b> <span class='cnt'>(4 questions)</span> <span class='badge'>4 model</span></summary><ol><li><span class='say'>How often do you read?</span><div class='model'><b>Model answer:</b> Quite often, actually. Apart from my textbooks, I read the newspaper most mornings, and I try to finish one novel a month. Recently I read Pinjar by Amrita Pritam, and I couldn&#x27;t put it down.</div></li><li><span class='say'>Do you have many books at home?</span><div class='model'><b>Model answer:</b> Not really. Apart from my textbooks, I only have a few novels and some religious books that belong to my grandmother. I mostly borrow books or read them on my phone.</div></li><li><span class='say'>Do Indian people do enough reading?</span><div class='model'><b>Model answer:</b> I&#x27;d say it depends on the age group. Older people still read newspapers every day, but many young people spend more time on social media than on books, so I don&#x27;t think we read enough.</div></li><li><span class='say'>Do Indian people like to read?</span><div class='model'><b>Model answer:</b> Yes, many do — especially newspapers, religious books and exam-preparation books. Fiction is becoming popular again too, thanks to cheap e-books and audiobooks.</div></li></ol></details><details><summary><b>2. Sleep</b> <span class='cnt'>(5 questions)</span> <span class='badge'>5 model</span></summary><ol><li><span class='say'>How many hours do you sleep every day?</span><div class='model'><b>Model answer:</b> Usually about seven hours. I know experts recommend seven to eight, so on weekends I try to catch up a little.</div></li><li><span class='say'>Is it necessary to take a nap every day?</span><div class='model'><b>Model answer:</b> I don&#x27;t think it&#x27;s necessary, but a short nap of twenty minutes after lunch can be really refreshing, especially in the hot Punjab summer.</div></li><li><span class='say'>Do old people sleep a lot? Why?</span><div class='model'><b>Model answer:</b> In my experience, they often sleep less at night but take naps during the day. They get tired more easily, so they need more rest overall.</div></li><li><span class='say'>What time do you usually go to bed?</span><div class='model'><b>Model answer:</b> Normally around eleven. During exams I sometimes go to bed earlier, so that I can get up at five and study when it&#x27;s quiet.</div></li><li><span class='say'>Do you always sleep well?</span><div class='model'><b>Model answer:</b> Most of the time, yes. But if I&#x27;m stressed about something, like an interview, I find it hard to fall asleep.</div></li></ol></details><details><summary><b>3. Animals</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>Do you like animals?</span><div class='model'><b>Model answer:</b> Yes, I do. I grew up in a village, so I&#x27;ve always been around cows, buffaloes and dogs, and I find them really calming.</div></li><li><span class='say'>What&#x27;s your favourite animal? Why?</span><div class='model'><b>Model answer:</b> Definitely dogs. They&#x27;re loyal and affectionate, and our dog, Sheru, always runs to greet me when I come home.</div></li><li><span class='say'>What&#x27;s your favourite wild animal? Why?</span><div class='model'><b>Model answer:</b> The tiger. It&#x27;s powerful and majestic, and it&#x27;s also our national animal. I saw one at Chhatbir Zoo, and I was amazed by its size.</div></li></ol></details><details><summary><b>4. Maps</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>Do you often use maps?</span><div class='model'><b>Model answer:</b> Yes, almost every time I travel somewhere new. I use Google Maps on my phone because it shows the traffic and how long the journey will take.</div></li><li><span class='say'>Who taught you how to use a map?</span><div class='model'><b>Model answer:</b> Our geography teacher taught us the basics at school, but honestly, I learnt most of it by using map apps on my phone.</div></li><li><span class='say'>Do you prefer electronic maps or paper maps?</span><div class='model'><b>Model answer:</b> Electronic maps, without a doubt. They&#x27;re interactive, they update in real time and they can even suggest a faster route. Paper maps are useful only when there&#x27;s no signal.</div></li></ol></details><details><summary><b>5. Jeans</b> <span class='cnt'>(4 questions)</span> <span class='badge'>4 model</span></summary><ol><li><span class='say'>Do you wear jeans?</span><div class='model'><b>Model answer:</b> Yes, I do. They&#x27;re one of my favourite things to wear.</div></li><li><span class='say'>How often do you wear jeans?</span><div class='model'><b>Model answer:</b> Almost every day — to college, to the market, even on short trips.</div></li><li><span class='say'>Do you like wearing jeans? Why?</span><div class='model'><b>Model answer:</b> Yes, because they&#x27;re comfortable and they go with almost anything — a shirt, a T-shirt or even a kurta.</div></li><li><span class='say'>Why do you think jeans are popular?</span><div class='model'><b>Model answer:</b> I think it&#x27;s because they&#x27;re practical. They&#x27;re tough, they last for years, you don&#x27;t need to wash them every day, and they suit people of all ages.</div></li></ol></details></section><style>details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'▸ ';color:var(--muted)}details[open] summary::before{content:'▾ '}.cnt{color:var(--muted);font-size:13px}.badge{background:var(--ok-soft);color:var(--ok);font-size:12px;border-radius:99px;padding:1px 8px;margin-left:4px}.model{background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:6px 0 10px;border-radius:6px;font-size:15px}details ol{padding-left:22px}details li{margin:6px 0}</style>", "<section class=\"card \"><h3>Useful language for these topics</h3><ul class=\"exl\"><li><span class=\"say\">I can't put it down. (a very good book)</span></li><li><span class=\"say\">I try to catch up on sleep at the weekend.</span></li><li><span class=\"say\">I find it hard to fall asleep when I'm stressed.</span></li><li><span class=\"say\">It goes with almost anything.</span></li><li><span class=\"say\">without a doubt / definitely / not really</span></li><li><span class=\"say\">In my experience, …</span></li></ul></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਮਾਡਲ ਜਵਾਬ ਰਟਣ ਲਈ ਨਹੀਂ ਹਨ — ਇਹਨਾਂ ਵਿੱਚੋਂ ਚੰਗੇ ਸ਼ਬਦ ਤੇ ਵਾਕ-ਢਾਂਚੇ ਚੁਣੋ ਅਤੇ ਆਪਣੀ ਸੱਚੀ ਜਾਣਕਾਰੀ ਨਾਲ ਆਪਣਾ ਜਵਾਬ ਬਣਾਓ। ਹਰ ਜਵਾਬ: <b>ਜਵਾਬ + ਕਾਰਨ + ਉਦਾਹਰਨ</b>।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ I sleep around 7-8 hours everyday.</div><div class=\"good\">✓ I sleep about seven or eight hours every day.</div><div class=\"why\">every day (two words) = each day; everyday (one word) = ordinary.</div></div><div class=\"mk\"><div class=\"bad\">✗ I go to the bed at 11.</div><div class=\"good\">✓ I go to bed at 11.</div><div class=\"why\">No article in “go to bed”.</div></div><div class=\"mk\"><div class=\"bad\">✗ My favourite animal is dog.</div><div class=\"good\">✓ My favourite animal is the dog. / My favourite animals are dogs.</div></div><div class=\"mk\"><div class=\"bad\">✗ Do you prefer electronic map or paper maps?</div><div class=\"good\">✓ Do you prefer electronic maps or paper maps?</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>A strong Part 1 answer is 2–3 sentences: <b>direct answer → reason → example</b>. Don't stop at “Yes, I do.” and don't give a 2-minute speech either.</p></section>"], "sets": [{"title": "A · Choose the better answer", "instr": "Which answer would score higher?", "items": [{"t": "mcq", "q": "“Do you have many books at home?”", "o": ["Not really. Apart from my textbooks, I only have a few novels — I mostly read on my phone.", "No."], "a": 0, "e": ""}, {"t": "mcq", "q": "“Do you prefer electronic or paper maps?”", "o": ["Maps are very important in today's modern world.", "Electronic maps, because they update in real time and suggest faster routes."], "a": 1, "e": "Answer the question directly — avoid memorised clichés."}, {"t": "mcq", "q": "“Who taught you how to use a map?”", "o": ["My geography teacher teaches me at school.", "My geography teacher taught me the basics at school."], "a": 1, "e": "Past question → past tense."}, {"t": "mcq", "q": "“Do you always sleep well?”", "o": ["Yes. Sleep is necessary for health.", "Most of the time, but when I'm stressed I find it hard to fall asleep."], "a": 1, "e": ""}]}, {"title": "B · Fix the mistake", "instr": "Type the correct word.", "items": [{"t": "fill", "q": "I sleep about seven hours ___ day. (every / everyday)", "a": [["every"]], "e": ""}, {"t": "fill", "q": "I usually go to ___ at eleven. (bed / the bed)", "a": [["bed"]], "e": ""}, {"t": "fill", "q": "My favourite animal is ___ dog.", "a": [["the"]], "e": ""}, {"t": "fill", "q": "Jeans go ___ almost anything. (with / to)", "a": [["with"]], "e": ""}, {"t": "fill", "q": "I find it hard to fall ___ when I'm stressed.", "a": [["asleep"]], "e": ""}]}], "next": null};

    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
