<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speaking Part 1: Daily Life · Pioneer Education</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#152033; --muted:#5b6678; --line:#e3e8f0;
  --brand:#1f3f93; --brand-2:#2f5bd3; --accent:#f28c28; --accent-soft:#fff3e6;
  --ok:#16803c; --ok-soft:#e7f6ec; --bad:#c62828; --bad-soft:#fdecec;
  --pun:#6d3fb8; --pun-soft:#f3edfc; --exam:#0f766e; --exam-soft:#e6f6f4;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}
header.hero .wrap{padding-bottom:0}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:10px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.9;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0f1420}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;color:var(--brand)}
.card p{margin:8px 0}
.card.pun{background:var(--pun-soft);border-color:transparent}.card.pun h3{color:var(--pun)}
.pa{font-size:16.5px;line-height:1.8}
.card.exam{background:var(--exam-soft);border-color:transparent}.card.exam h3{color:var(--exam)}
.card.mist h3{color:var(--bad)}
.mk{border-top:1px dashed var(--line);padding:8px 0}.mk:first-of-type{border-top:0}
.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}.why{font-size:14px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
.exl{list-style:none;padding:0;margin:8px 0}
.exl li{padding:6px 0;border-bottom:1px solid var(--line)}.exl li:last-child{border-bottom:0}
.say{cursor:pointer}
.say::after{content:" 🔊";font-size:13px;opacity:.55}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted)}
table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.qt{margin:0 0 10px;font-weight:500}
.qn{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;margin-right:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
textarea.fi{font:500 16px system-ui,sans-serif;line-height:1.5}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>
</head>

var D = {"n": 1, "total": 1, "title": "Speaking Part 1: Daily Life", "sub": "Routine · mornings · weekends · free time · work/study", "test": false, "unit": "IELTS Speaking", "chip": "IELTS Speaking", "share": "Speaking Part 1 — daily life topics", "video": true, "js": "\ndocument.querySelectorAll('.vsearch').forEach(function(inp){inp.addEventListener('input',function(){var q=inp.value.toLowerCase().trim();\n inp.closest('section').querySelectorAll('details').forEach(function(d){var hit=!q||d.textContent.toLowerCase().indexOf(q)>-1;d.style.display=hit?'':'none';if(q&&hit)d.open=true;});});});\n\nvar Q=[[\"Daily routine\", \"What is your daily routine?\"], [\"Daily routine\", \"Do you usually have the same routine every day?\"], [\"Daily routine\", \"What part of your day do you like best?\"], [\"Daily routine\", \"Has your routine changed recently?\"], [\"Mornings\", \"Do you like getting up early?\"], [\"Mornings\", \"What do you usually do in the morning?\"], [\"Mornings\", \"Do you have breakfast every day?\"], [\"Weekends\", \"What do you usually do at the weekend?\"], [\"Weekends\", \"Do you prefer to spend weekends at home or outside?\"], [\"Weekends\", \"What did you do last weekend?\"], [\"Free time\", \"What do you do in your free time?\"], [\"Free time\", \"Do you have more free time now than before?\"], [\"Free time\", \"Do you prefer to spend free time alone or with others?\"], [\"Work or study\", \"Do you work or are you a student?\"], [\"Work or study\", \"Why did you choose that subject?\"], [\"Work or study\", \"What do you like most about your studies?\"]]; var box=document.getElementById('pq'); if(!box) return;\nvar t=null, left=0;\nfunction pick(){ var r=Q[Math.floor(Math.random()*Q.length)]; document.getElementById('pq_topic').textContent=r[0]; document.getElementById('pq_q').textContent=r[1];\n clearInterval(t); left=30; tick(); say(r[1]); t=setInterval(function(){left--; tick(); if(left<=0){clearInterval(t);}},1000); }\nfunction tick(){ var el=document.getElementById('pq_t'); el.textContent=left>0?('⏱ '+left+'s — answer now: Answer + Reason + Example'):'⏹ Time! Did you give a reason and an example?'; }\nfunction say(s){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u);}catch(e){}}\ndocument.getElementById('pq_go').onclick=pick;\ndocument.getElementById('pq_again').onclick=function(){say(document.getElementById('pq_q').textContent)};\n", "learn": ["<section class=\"card\" id=\"pq\"><h3>🎤 Practice mode</h3>\n<p class=\"instr\">Tap the button. The examiner's question is read aloud. Answer out loud in about 20–30 seconds.</p>\n<div class=\"intro\" style=\"background:var(--bg);border-radius:12px;padding:14px\"><div id=\"pq_topic\" style=\"color:var(--muted);font-size:13px\">Topic</div>\n<div id=\"pq_q\" style=\"font-size:18px;font-weight:600;margin:6px 0\">Tap “New question” to start.</div><div id=\"pq_t\" style=\"color:var(--accent);font-weight:600\"></div></div>\n<div class=\"btns\"><button class=\"btn pri\" id=\"pq_go\">🎲 New question</button><button class=\"btn\" id=\"pq_again\">🔊 Repeat</button></div></section>", "<section class=\"card\"><h3>5 topics with model answers</h3><input class=\"vsearch fi\" style=\"width:100%;margin:0 0 10px\" placeholder=\"🔍 Search a topic or word…\"><details><summary><b>1. Daily routine</b> <span class='cnt'>(4 questions)</span> <span class='badge'>4 model</span></summary><ol><li><span class='say'>What is your daily routine?</span><div class='model'><b>Model answer:</b> On weekdays I get up at about six, have breakfast with my family and catch the bus to college at eight. I&#x27;m usually back by three, and in the evening I study and sometimes go for a walk.</div></li><li><span class='say'>Do you usually have the same routine every day?</span><div class='model'><b>Model answer:</b> Pretty much, yes — at least on weekdays. At the weekend it&#x27;s more relaxed; I get up later and often visit my relatives.</div></li><li><span class='say'>What part of your day do you like best?</span><div class='model'><b>Model answer:</b> I&#x27;d say the evening, because I can finally relax. I usually go for a walk with my cousin and we chat about our day.</div></li><li><span class='say'>Has your routine changed recently?</span><div class='model'><b>Model answer:</b> Yes, a little. Since I started my IELTS classes, I get up an hour earlier to practise speaking and listening.</div></li></ol></details><details><summary><b>2. Mornings</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>Do you like getting up early?</span><div class='model'><b>Model answer:</b> Honestly, not really — I&#x27;m not a morning person. But I know it&#x27;s good for me, so I set two alarms!</div></li><li><span class='say'>What do you usually do in the morning?</span><div class='model'><b>Model answer:</b> I brush my teeth, take a quick shower and have breakfast. If I have time, I revise vocabulary on my phone on the bus.</div></li><li><span class='say'>Do you have breakfast every day?</span><div class='model'><b>Model answer:</b> Yes, I never skip breakfast. My mother insists on it, and I usually have parathas or porridge with a cup of tea.</div></li></ol></details><details><summary><b>3. Weekends</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>What do you usually do at the weekend?</span><div class='model'><b>Model answer:</b> I usually sleep in on Sunday, help my parents with the housework and meet my friends in the evening.</div></li><li><span class='say'>Do you prefer to spend weekends at home or outside?</span><div class='model'><b>Model answer:</b> A mix of both. I like relaxing at home, but by Sunday evening I usually want to go out for a while.</div></li><li><span class='say'>What did you do last weekend?</span><div class='model'><b>Model answer:</b> Last weekend I went to my cousin&#x27;s wedding in Ludhiana. We danced, ate far too much and came back really late.</div></li></ol></details><details><summary><b>4. Free time</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>What do you do in your free time?</span><div class='model'><b>Model answer:</b> I often play cricket with my friends, and I sometimes watch Punjabi films. I also enjoy cooking simple dishes.</div></li><li><span class='say'>Do you have more free time now than before?</span><div class='model'><b>Model answer:</b> No, less, actually. Between college and coaching classes, I hardly have any free time on weekdays.</div></li><li><span class='say'>Do you prefer to spend free time alone or with others?</span><div class='model'><b>Model answer:</b> It depends on my mood, but usually with others. I&#x27;m quite sociable, so I enjoy spending time with friends.</div></li></ol></details><details><summary><b>5. Work or study</b> <span class='cnt'>(3 questions)</span> <span class='badge'>3 model</span></summary><ol><li><span class='say'>Do you work or are you a student?</span><div class='model'><b>Model answer:</b> I&#x27;m a student. I&#x27;m in the final year of a BCom at a college in Morinda.</div></li><li><span class='say'>Why did you choose that subject?</span><div class='model'><b>Model answer:</b> Mainly because I&#x27;ve always been good with numbers, and my father runs a small business, so I&#x27;d like to help him in the future.</div></li><li><span class='say'>What do you like most about your studies?</span><div class='model'><b>Model answer:</b> I really enjoy accounting classes, because the problems are logical and I feel satisfied when everything balances.</div></li></ol></details></section><style>details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'▸ ';color:var(--muted)}details[open] summary::before{content:'▾ '}.cnt{color:var(--muted);font-size:13px}.badge{background:var(--ok-soft);color:var(--ok);font-size:12px;border-radius:99px;padding:1px 8px;margin-left:4px}.model{background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:6px 0 10px;border-radius:6px;font-size:15px}details ol{padding-left:22px}details li{margin:6px 0}</style>", "<section class=\"card \"><h3>Grammar for these topics</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Question</th><th>Tense to use</th></tr></thead><tbody><tr><td>What do you usually do…? / Do you…?</td><td>present simple + frequency adverbs</td></tr><tr><td>What did you do last…?</td><td>past simple</td></tr><tr><td>Has your routine changed?</td><td>present perfect / since</td></tr><tr><td>Do you prefer…?</td><td>prefer + noun / -ing, “I'd rather…”</td></tr></tbody></table></div></section>", "<section class=\"card \"><h3>Useful phrases</h3><ul class=\"exl\"><li><span class=\"say\">I'm (not) really a morning person.</span></li><li><span class=\"say\">It depends on my mood.</span></li><li><span class=\"say\">I hardly have any free time.</span></li><li><span class=\"say\">I usually sleep in on Sundays.</span></li><li><span class=\"say\">Pretty much, yes.</span></li><li><span class=\"say\">To be honest, …</span></li></ul></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਇਹ week ਦੇ grammar (present simple, adverbs of frequency, daily routine) ਦੀ ਵਰਤੋਂ ਕਰਕੇ ਜਵਾਬ ਦਿਓ। ਹਰ ਜਵਾਬ: <b>ਜਵਾਬ + ਕਾਰਨ + ਉਦਾਹਰਨ</b>।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ I am wake up at 6.</div><div class=\"good\">✓ I wake up at 6.</div></div><div class=\"mk\"><div class=\"bad\">✗ Last weekend I go to a wedding.</div><div class=\"good\">✓ Last weekend I went to a wedding.</div></div><div class=\"mk\"><div class=\"bad\">✗ I am student.</div><div class=\"good\">✓ I'm a student.</div></div></section           q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
