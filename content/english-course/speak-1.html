<style>
:root{

}

  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}
header.hero .wrap{padding-bottom:0}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:10px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.9;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}

.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}

:root[data-theme="dark"] .tabs button.on{color:#0f1420}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}

.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}

table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted)}
table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}

.qt{margin:0 0 10px;font-weight:500}
.qn{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;margin-right:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>

var VIDEO_URL = "";
var D = {"n": 1, "total": 2, "title": "Speaking Part 1: How to Answer", "sub": "Introduction · home · hometown", "test": false, "unit": "IELTS Speaking Part 1", "chip": null, "share": null, "video": true, "js": "\ndocument.querySelectorAll('.vsearch').forEach(function(inp){inp.addEventListener('input',function(){var q=inp.value.toLowerCase().trim();\n inp.closest('section').querySelectorAll('details').forEach(function(d){var hit=!q||d.textContent.toLowerCase().indexOf(q)>-1;d.style.display=hit?'':'none';if(q&&hit)d.open=true;});});});\n", "learn": ["<section class=\"card \"><h3>What happens in Part 1</h3><ul><li>Lasts <b>4–5 minutes</b>. The examiner checks your ID, then asks about <b>2–3 familiar topics</b> (you, your home, studies, hobbies…).</li><li>Questions are short and personal. There are no right or wrong opinions — the examiner scores your <b>Fluency, Vocabulary, Grammar and Pronunciation</b>.</li></ul></section>", "<section class=\"card \"><h3>The answer formula: A + R + E</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Step</th><th>What to say</th><th>Example</th></tr></thead><tbody><tr><td><b>A</b>nswer</td><td>answer the question directly</td><td>Yes, I'm an early bird.</td></tr><tr><td><b>R</b>eason</td><td>say why</td><td>I like the fresh air and quiet before the day starts.</td></tr><tr><td><b>E</b>xample / extra</td><td>add a detail</td><td>I usually go for a short walk at six.</td></tr></tbody></table></div><p>Aim for <b>2–3 sentences</b> (about 15–25 seconds). Too short (“Yes.”) shows no language; too long sounds memorised.</p></section>", "<section class=\"card \"><h3>Match the tense to the question</h3><ul class=\"exl\"><li><span class=\"say\">Do you like…? → present simple: Yes, I like…</span></li><li><span class=\"say\">Did you…when you were a child? → past simple: Yes, I used to…</span></li><li><span class=\"say\">Have you ever…? → present perfect: Yes, I've been… / No, I've never…</span></li><li><span class=\"say\">Would you like to…? → would: I'd love to…</span></li><li><span class=\"say\">What will you do next weekend? → future: I'm going to… / I'll probably…</span></li></ul></section>", "<section class=\"card \"><h3>Useful starters</h3><ul class=\"exl\"><li><span class=\"say\">Well, to be honest, …</span></li><li><span class=\"say\">Actually, I'd say …</span></li><li><span class=\"say\">It depends. …</span></li><li><span class=\"say\">Not really, because …</span></li><li><span class=\"say\">Definitely! …</span></li><li><span class=\"say\">That's an interesting question. I've never really thought about it, but …</span></li></ul></section>", "<section class=\"card\"><h3>Introductory questions with model answers</h3><input class=\"vsearch fi\" style=\"width:100%;margin:0 0 10px\" placeholder=\"🔍 Search a topic or word…\"><details open><summary><b>1. Introduction (ID check)</b> <span class='cnt'>(4 questions)</span> <span class='badge'>4 model</span></summary><ol><li><span class='say'>What&#x27;s your full name?</span><div class='model'><b>Model answer:</b> My full name is Harpreet Kaur Sandhu.</div></li><li><span class='say'>What should I call you?</span><div class='model'><b>Model answer:</b> You can call me Harpreet — or Preet, which is what my friends call me.</div></li><li><span class='say'>Where are you from?</span><div class='model'><b>Model answer:</b> I&#x27;m from Morinda, a small city in Ropar district in Punjab.</div></li><li><span class='say'>Do you work or are you a student?</span><div class='model'><b>Model answer:</b> I&#x27;m a student. I&#x27;m in the final year of a bachelor&#x27;s degree in commerce.</div></li></ol></details><details><summary><b>2. Daily life</b> <span class='cnt'>(5 questions)</span> <span class='badge'>5 model</span></summary><ol><li><span class='say'>Do you have many friends?</span><div class='model'><b>Model answer:</b> Not many, honestly — I have three or four really close friends who have always stood by me, and that&#x27;s enough for me.</div></li><li><span class='say'>Do you have any hobbies?</span><div class='model'><b>Model answer:</b> Yes, I&#x27;m really into badminton and cooking. Badminton keeps me fit, and cooking helps me relax after a long day.</div></li><li><span class='say'>Do you like playing games?</span><div class='model'><b>Model answer:</b> Definitely. Games are a great way to relax, and outdoor games especially keep me fit.</div></li><li><span class='say'>What is your favourite game?</span><div class='model'><b>Model answer:</b> Badminton, without a doubt. It&#x27;s fast, it refreshes my mind and I can play it with my cousins in the evening.</div></li><li><span class='say'>Do you get up early in the morning?</span><div class='model'><b>Model answer:</b> Yes, I&#x27;m an early bird. I usually wake up at around six and go for a short walk before college.</div></li></ol></details><details><summary><b>3. Home and accommodation</b> <span class='cnt'>(5 questions)</span> <span class='badge'>5 model</span></summary><ol><li><span class='say'>Do you live in a house or a flat?</span><div class='model'><b>Model answer:</b> I live in a house — a two-storey house with a small garden in front.</div></li><li><span class='say'>Can you describe it a little?</span><div class='model'><b>Model answer:</b> It&#x27;s not very big, but it&#x27;s comfortable. There are three bedrooms, a kitchen and a large living room where the whole family sits together in the evening.</div></li><li><span class='say'>Which is your favourite room in your home?</span><div class='model'><b>Model answer:</b> My bedroom, definitely. I decorated it myself, and it&#x27;s the quietest place to study.</div></li><li><span class='say'>Who do you live with?</span><div class='model'><b>Model answer:</b> I live with my parents and my younger brother.</div></li><li><span class='say'>How long have you lived there?</span><div class='model'><b>Model answer:</b> We&#x27;ve lived there all my life. / We moved there two years ago, when my father was transferred.</div></li></ol></details><details><summary><b>4. Hometown</b> <span class='cnt'>(6 questions)</span> <span class='badge'>6 model</span></summary><ol><li><span class='say'>Where is your hometown?</span><div class='model'><b>Model answer:</b> I&#x27;m from Morinda, a small city in Ropar district, about forty kilometres from Chandigarh.</div></li><li><span class='say'>Is it a big city or a small town?</span><div class='model'><b>Model answer:</b> It&#x27;s a small town, but it has most of the basic facilities — good schools, a hospital and a busy market.</div></li><li><span class='say'>Do you like your hometown?</span><div class='model'><b>Model answer:</b> Yes, I do. The people are friendly and life is quite peaceful compared to big cities.</div></li><li><span class='say'>What do you like about your hometown?</span><div class='model'><b>Model answer:</b> I love the greenery and the peace. It&#x27;s less crowded, so it&#x27;s less polluted, and people from different backgrounds live together in harmony.</div></li><li><span class='say'>What&#x27;s your favourite part of your hometown?</span><div class='model'><b>Model answer:</b> The area around the old gurdwara. It&#x27;s calm, and in the evenings people gather there and chat.</div></li><li><span class='say'>Is there anything you dislike about it?</span><div class='model'><b>Model answer:</b> Well, there isn&#x27;t much entertainment — no big cinema or shopping mall — so young people often go to Chandigarh to hang out. I also think the parks need more dustbins.</div></li></ol></details></section><style>details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary::before{content:'▸ ';color:var(--muted)}details[open] summary::before{content:'▾ '}.cnt{color:var(--muted);font-size:13px}.badge{background:var(--ok-soft);color:var(--ok);font-size:12px;border-radius:99px;padding:1px 8px;margin-left:4px}.model{background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;margin:6px 0 10px;border-radius:6px;font-size:15px}details ol{padding-left:22px}details li{margin:6px 0}</style>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">Part 1 ਵਿੱਚ ਛੋਟੇ ਪਰ ਪੂਰੇ ਜਵਾਬ ਦਿਓ: <b>ਜਵਾਬ + ਕਾਰਨ + ਉਦਾਹਰਨ</b>। ਸਿਰਫ਼ “Yes” ਜਾਂ “No” ਨਾ ਕਹੋ, ਅਤੇ ਰਟੇ ਹੋਏ ਲੰਮੇ ਭਾਸ਼ਣ ਵੀ ਨਾ ਦਿਓ। ਸਵਾਲ ਜਿਸ tense ਵਿੱਚ ਹੈ, ਜਵਾਬ ਵੀ ਉਸੇ tense ਵਿੱਚ ਦਿਓ।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ I belong to Morinda district Ropar.</div><div class=\"good\">✓ I'm from Morinda, in Ropar district.</div></div><div class=\"mk\"><div class=\"bad\">✗ I have been living there since my birth.</div><div class=\"good\">✓ I've lived there all my life.</div></div><div class=\"mk\"><div class=\"bad\">✗ It is two story building with having all modern facilities.</div><div class=\"good\">✓ It's a two-storey house with all modern facilities.</div></div><div class=\"mk\"><div class=\"bad\">✗ Games keep us hale and healthy, fit as a fiddle.</div><div class=\"good\">✓ Games keep me fit and help me relax.</div><div class=\"why\">Avoid stacking memorised idioms — examiners notice.</div></div><div class=\"mk\"><div class=\"bad\">✗ My father transferred here.</div><div class=\"good\">✓ My father was transferred here.</div><div class=\"why\">Passive voice.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>Examiners are trained to spot memorised answers and can mark them down. Learn <b>ideas and phrases</b> from the model answers, not whole paragraphs — then say them in your own words.</p></section>"], "sets": [{"title": "A · Choose the better answer", "instr": "Which answer would score higher?", "items": [{"t": "mcq", "q": "“Do you work or are you a student?”", "o": ["I'm a student. I'm doing a BCom at a college in Morinda, and I'm in my final year.", "Student."], "a": 0, "e": ""}, {"t": "mcq", "q": "“Do you like your hometown?”", "o": ["Yes. My name is Aman, I am 22, I am from Morinda, my father is a farmer, my hobby is cricket…", "Yes, I do. It's peaceful and the people are friendly, although there isn't much entertainment for young people."], "a": 1, "e": ""}, {"t": "mcq", "q": "“Did you play many games as a child?”", "o": ["Yes, I used to play cricket in the street with my cousins almost every evening.", "Yes, I play cricket every day."], "a": 0, "e": "Past question → past tense."}, {"t": "mcq", "q": "“Have you ever been to the mountains?”", "o": ["Yes, I go to Shimla.", "Yes, I've been to Shimla twice — once with my school and once with my family."], "a": 1, "e": ""}, {"t": "mcq", "q": "“Would you like to learn a new language?”", "o": ["I learn German.", "I'd love to learn German, because I might study in Europe one day."], "a": 1, "e": ""}, {"t": "mcq", "q": "“What should I call you?”", "o": ["You can address me as my nick name as Preet.", "You can call me Preet."], "a": 1, "e": ""}]}, {"title": "B · Fix the grammar", "instr": "Type the missing word.", "items": [{"t": "fill", "q": "I ___ lived in Morinda all my life.", "a": [["have", "'ve"]], "e": ""}, {"t": "fill", "q": "We moved here two years ago when my father ___ transferred.", "a": [["was"]], "e": ""}, {"t": "fill", "q": "I live in a two-___ house.", "a": [["storey", "story"]], "e": ""}, {"t": "fill", "q": "I'm from Morinda, a small city ___ Ropar district.", "a": [["in"]], "e": ""}, {"t": "fill", "q": "I'm really ___ badminton. I play it every evening.", "a": [["into"]], "e": ""}, {"t": "fill", "q": "It's less crowded, so it's ___ polluted.", "a": [["less"]], "e": ""}]}], "next": "Lesson 2 — Speaking Part 1: Question Bank"};
(function(){
  var $ = function(id){return document.getElementById(id)};

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){

  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');

  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}

  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
