var D = {"n": 4, "total": 4, "title": "Compound & Special Nouns", "sub": "sons-in-law · scissors · news · police", "test": false, "unit": "Singular & Plural", "chip": null, "share": null, "video": true, "learn": ["<section class=\"card \"><h3>Compound nouns: pluralise the main word</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Singular</th><th>Plural</th><th>Main word</th></tr></thead><tbody><tr><td>son-in-law</td><td><b>sons</b>-in-law</td><td>son</td></tr><tr><td>daughter-in-law</td><td><b>daughters</b>-in-law</td><td>daughter</td></tr><tr><td>passer-by</td><td><b>passers</b>-by</td><td>passer</td></tr><tr><td>looker-on</td><td><b>lookers</b>-on</td><td>looker</td></tr><tr><td>lady-in-waiting</td><td><b>ladies</b>-in-waiting</td><td>lady</td></tr><tr><td>commander-in-chief</td><td><b>commanders</b>-in-chief</td><td>commander</td></tr><tr><td>bill of fare</td><td><b>bills</b> of fare</td><td>bill</td></tr><tr><td>chief of staff</td><td><b>chiefs</b> of staff</td><td>chief</td></tr><tr><td>secretary of state</td><td><b>secretaries</b> of state</td><td>secretary</td></tr><tr><td>post office</td><td>post <b>offices</b></td><td>office</td></tr><tr><td>full moon</td><td>full <b>moons</b></td><td>moon</td></tr><tr><td>step-sister</td><td>step-<b>sisters</b></td><td>sister</td></tr><tr><td>lieutenant colonel</td><td>lieutenant <b>colonels</b></td><td>colonel</td></tr><tr><td>middle class</td><td>middle <b>classes</b></td><td>class</td></tr><tr><td>he-man</td><td>he-<b>men</b></td><td>man</td></tr><tr><td>she-wolf</td><td>she-<b>wolves</b></td><td>wolf</td></tr></tbody></table></div><p class='note'><b>Rule:</b> find the main person or thing (usually the noun) and make only that plural.</p></section>", "<section class=\"card \"><h3>Special groups of nouns</h3><p><b>1. Always plural (plural verb, no singular):</b> trousers, jeans, shorts, pants, scissors, pliers, tongs, shears, glasses/eyeglasses, clothes, belongings, congratulations, outskirts, goods, oats, alms.<br><i>My scissors <b>are</b> sharp. → one <b>pair of</b> scissors.</i></p><p><b>2. Plural meaning without -s (plural verb):</b> police, cattle, people, vermin.<br><i>The police <b>have</b> arrived. The cattle <b>are</b> grazing.</i></p><p><b>3. Look plural but are singular:</b> news, mathematics, physics, economics, linguistics, phonetics, athletics, mumps.<br><i>The news <b>is</b> good. Physics <b>is</b> my favourite subject.</i></p><p><b>4. Uncountable — no plural at all:</b> information, advice, luggage, furniture, equipment, evidence, legislation, crockery, footwear, clothing, luck, grief, nonsense, perseverance, harm, gold, silver, wheat, corn.<br><i>some advice, a piece of advice (not advices)</i></p></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">Compound ਸ਼ਬਦ ਵਿੱਚ ਸਿਰਫ਼ ਮੁੱਖ ਸ਼ਬਦ ਨੂੰ ਬਹੁਵਚਨ ਬਣਾਓ: son-in-law → <b>sons</b>-in-law। Scissors, trousers, clothes ਹਮੇਸ਼ਾ ਬਹੁਵਚਨ ਹਨ (a pair of scissors)। News, physics, mathematics ਦੇਖਣ ਵਿੱਚ ਬਹੁਵਚਨ ਲੱਗਦੇ ਹਨ ਪਰ singular ਹਨ — The news <b>is</b>…। Information, advice, luggage ਦਾ ਕੋਈ ਬਹੁਵਚਨ ਨਹੀਂ — informations, advices, luggages ਗ਼ਲਤ ਹਨ।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ My son-in-laws live in Canada.</div><div class=\"good\">✓ My sons-in-law live in Canada.</div></div><div class=\"mk\"><div class=\"bad\">✗ The news are shocking.</div><div class=\"good\">✓ The news is shocking.</div></div><div class=\"mk\"><div class=\"bad\">✗ The police is coming.</div><div class=\"good\">✓ The police are coming.</div></div><div class=\"mk\"><div class=\"bad\">✗ I bought a new trouser.</div><div class=\"good\">✓ I bought new trousers / a pair of trousers.</div></div><div class=\"mk\"><div class=\"bad\">✗ She gave me many advices.</div><div class=\"good\">✓ She gave me a lot of advice.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>Subject–verb agreement with nouns like <b>news, police, people, data, economics</b> is tested in IELTS Grammatical Range & Accuracy. Check the verb every time you use one of these nouns.</p></section>"], "sets": [{"title": "A · Plural of compound nouns", "instr": "Type the plural.", "items": [{"t": "fill", "q": "son-in-law → ___", "a": [["sons-in-law"]], "e": ""}, {"t": "fill", "q": "daughter-in-law → ___", "a": [["daughters-in-law"]], "e": ""}, {"t": "fill", "q": "passer-by → ___", "a": [["passers-by"]], "e": ""}, {"t": "fill", "q": "looker-on → ___", "a": [["lookers-on"]], "e": ""}, {"t": "fill", "q": "lady-in-waiting → ___", "a": [["ladies-in-waiting"]], "e": ""}, {"t": "fill", "q": "post office → ___", "a": [["post offices"]], "e": ""}, {"t": "fill", "q": "full moon → ___", "a": [["full moons"]], "e": ""}, {"t": "fill", "q": "step-sister → ___", "a": [["step-sisters", "stepsisters"]], "e": ""}, {"t": "fill", "q": "lieutenant colonel → ___", "a": [["lieutenant colonels"]], "e": ""}, {"t": "fill", "q": "middle class → ___", "a": [["middle classes"]], "e": ""}, {"t": "fill", "q": "he-man → ___", "a": [["he-men"]], "e": ""}, {"t": "fill", "q": "she-wolf → ___", "a": [["she-wolves"]], "e": ""}, {"t": "fill", "q": "bill of fare → ___", "a": [["bills of fare"]], "e": ""}, {"t": "fill", "q": "chief of staff → ___", "a": [["chiefs of staff"]], "e": ""}, {"t": "fill", "q": "secretary of state → ___", "a": [["secretaries of state"]], "e": ""}]}, {"title": "B · Which group?", "instr": "Choose the correct description.", "items": [{"t": "mcq", "q": "scissors", "o": ["Looks plural but singular", "Always plural", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "news", "o": ["Uncountable", "Looks plural but singular", "Always plural"], "a": 1, "e": ""}, {"t": "mcq", "q": "information", "o": ["Uncountable", "Always plural", "Same singular & plural"], "a": 0, "e": ""}, {"t": "mcq", "q": "deer", "o": ["Always plural", "Same singular & plural", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "cattle", "o": ["Looks plural but singular", "Uncountable", "Plural meaning, no -s"], "a": 2, "e": ""}, {"t": "mcq", "q": "mathematics", "o": ["Uncountable", "Looks plural but singular", "Always plural"], "a": 1, "e": ""}, {"t": "mcq", "q": "belongings", "o": ["Same singular & plural", "Always plural", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "luggage", "o": ["Uncountable", "Same singular & plural", "Always plural"], "a": 0, "e": ""}, {"t": "mcq", "q": "headquarters", "o": ["Same singular & plural", "Always plural", "Uncountable"], "a": 0, "e": "a headquarters / two headquarters."}, {"t": "mcq", "q": "grief", "o": ["Uncountable", "Same singular & plural", "Always plural"], "a": 0, "e": ""}, {"t": "mcq", "q": "police", "o": ["Looks plural but singular", "Plural meaning, no -s", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "footwear", "o": ["Always plural", "Same singular & plural", "Uncountable"], "a": 2, "e": ""}]}, {"title": "C · is or are?", "instr": "Choose the correct verb.", "items": [{"t": "mcq", "q": "The news ___ very good today.", "o": ["is", "are"], "a": 0, "e": ""}, {"t": "mcq", "q": "My trousers ___ too long.", "o": ["is", "are"], "a": 1, "e": ""}, {"t": "mcq", "q": "Physics ___ my favourite subject.", "o": ["is", "are"], "a": 0, "e": ""}, {"t": "mcq", "q": "The police ___ looking for the thief.", "o": ["is", "are"], "a": 1, "e": ""}, {"t": "mcq", "q": "The cattle ___ grazing in the field.", "o": ["is", "are"], "a": 1, "e": ""}, {"t": "mcq", "q": "Your advice ___ very useful.", "o": ["was", "were"], "a": 0, "e": ""}, {"t": "mcq", "q": "These scissors ___ not sharp.", "o": ["is", "are"], "a": 1, "e": ""}, {"t": "mcq", "q": "Athletics ___ popular in Punjab.", "o": ["is", "are"], "a": 0, "e": ""}, {"t": "mcq", "q": "Congratulations ___ in order!", "o": ["is", "are"], "a": 1, "e": ""}, {"t": "mcq", "q": "All the equipment ___ new.", "o": ["is", "are"], "a": 0, "e": ""}]}], "next": "Final Test — Singular & Plural — Final Test"};

    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){

          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
