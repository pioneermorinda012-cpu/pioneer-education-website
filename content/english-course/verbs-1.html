var D = {"n": 1, "total": 2, "title": "The Three Forms of the Verb", "sub": "V1 · V2 · V3 — regular and irregular", "test": false, "unit": "Forms of the Verb", "chip": null, "share": null, "video": true, "js": "\ndocument.querySelectorAll('.vsearch').forEach(function(inp){\n  inp.addEventListener('input',function(){var q=inp.value.toLowerCase().trim();\n    inp.closest('section').querySelectorAll('tbody tr').forEach(function(tr){tr.style.display=!q||tr.textContent.toLowerCase().indexOf(q)>-1?'':'none';});});\n});\n", "learn": ["<section class=\"card \"><h3>What are V1, V2 and V3?</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Form</th><th>Name</th><th>Used in</th><th>Example</th></tr></thead><tbody><tr><td><b>V1</b></td><td>base form (first form)</td><td>present simple, after <i>to, do, does, did, will, can</i></td><td>I <b>go</b> to college. She doesn't <b>go</b>. I will <b>go</b>.</td></tr><tr><td><b>V2</b></td><td>past simple (second form)</td><td>past simple — positive sentences only</td><td>I <b>went</b> to college yesterday.</td></tr><tr><td><b>V3</b></td><td>past participle (third form)</td><td>perfect tenses (have/has/had + V3) and the passive (is/was + V3)</td><td>I have <b>gone</b>. English is <b>spoken</b> here.</td></tr></tbody></table></div><p>Also: <b>V1 + ing</b> (going) for continuous tenses, and <b>V1 + s/es</b> (goes) for he/she/it in the present simple.</p></section>", "<section class=\"card \"><h3>Regular verbs: just add -ed</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Rule</th><th>Examples</th></tr></thead><tbody><tr><td>most verbs + <b>-ed</b></td><td>work → worked, play → played, melt → melted</td></tr><tr><td>ending in <b>-e</b> → + <b>d</b></td><td>dare → dared, love → loved</td></tr><tr><td>consonant + <b>y</b> → <b>-ied</b></td><td>study → studied, cry → cried</td></tr><tr><td>short verb, consonant-vowel-consonant → double the last letter</td><td>stop → stopped, clap → clapped, plan → planned</td></tr></tbody></table></div><p>For regular verbs, V2 and V3 are the same: <i>work – worked – worked</i>.</p></section>", "<section class=\"card \"><h3>Irregular verbs: learn them in groups</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Pattern</th><th>Meaning</th><th>Examples</th></tr></thead><tbody><tr><td><b>A – A – A</b></td><td>all three forms the same</td><td>cut – cut – cut, put – put – put, let – let – let</td></tr><tr><td><b>A – B – B</b></td><td>V2 = V3</td><td>buy – bought – bought, teach – taught – taught, sleep – slept – slept</td></tr><tr><td><b>A – B – A</b></td><td>V3 = V1</td><td>come – came – come, run – ran – run, become – became – become</td></tr><tr><td><b>A – B – C</b></td><td>all three different</td><td>write – wrote – written, go – went – gone, eat – ate – eaten</td></tr></tbody></table></div><p>Learning by pattern is much faster than learning 150 verbs one by one. The practice sections below use these groups.</p></section>", "<section class=\"card\"><h3>Irregular verb list · 163 verbs</h3><input class=\"vsearch fi\" style=\"width:100%;margin:0 0 10px\" placeholder=\"🔍 Search a verb or ਪੰਜਾਬੀ…\"><div class=\"tw\"><table><thead><tr><th>#</th><th>V1 (base)</th><th>V2 (past)</th><th>V3 (past participle)</th><th>ਪੰਜਾਬੀ</th></tr></thead><tbody><tr><td class='num'>1</td><td><span class='say'>arise</span></td><td><span class='say'>arose</span></td><td><span class='say'>arisen</span></td><td lang='pa' class='pa'>ਉੱਠਣਾ / ਪੈਦਾ ਹੋਣਾ</td></tr><tr><td class='num'>2</td><td><span class='say'>awake</span></td><td><span class='say'>awoke</span></td><td><span class='say'>awoken</span></td><td lang='pa' class='pa'>ਜਾਗਣਾ</td></tr><tr><td class='num'>3</td><td><span class='say'>be</span></td><td><span class='say'>was / were</span></td><td><span class='say'>been</span></td><td lang='pa' class='pa'>ਹੋਣਾ</td></tr><tr><td class='num'>4</td><td><span class='say'>beat</span></td><td><span class='say'>beat</span></td><td><span class='say'>beaten</span></td><td lang='pa' class='pa'>ਕੁੱਟਣਾ / ਹਰਾਉਣਾ</td></tr><tr><td class='num'>5</td><td><span class='say'>become</span></td><td><span class='say'>became</span></td><td><span class='say'>become</span></td><td lang='pa' class='pa'>ਬਣ ਜਾਣਾ</td></tr><tr><td class='num'>6</td><td><span class='say'>begin</span></td><td><span class='say'>began</span></td><td><span class='say'>begun</span></td><td lang='pa' class='pa'>ਸ਼ੁਰੂ ਕਰਨਾ</td></tr><tr><td class='num'>7</td><td><span class='say'>bend</span></td><td><span class='say'>bent</span></td><td><span class='say'>bent</span></td><td lang='pa' class='pa'>ਮੋੜਨਾ / ਝੁਕਣਾ</td></tr><tr><td class='num'>8</td><td><span class='say'>bet</span></td><td><span class='say'>bet</span></td><td><span class='say'>bet</span></td><td lang='pa' class='pa'>ਸ਼ਰਤ ਲਾਉਣਾ</td></tr><tr><td class='num'>9</td><td><span class='say'>bind</span></td><td><span class='say'>bound</span></td><td><span class='say'>bound</span></td><td lang='pa' class='pa'>ਬੰਨ੍ਹਣਾ</td></tr><tr><td class='num'>10</td><td><span class='say'>bite</span></td><td><span class='say'>bit</span></td><td><span class='say'>bitten</span></td><td lang='pa' class='pa'>ਦੰਦੀ ਵੱਢਣਾ</td></tr><tr><td class='num'>11</td><td><span class='say'>bleed</span></td><td><span class='say'>bled</span></td><td><span class='say'>bled</span></td><td lang='pa' class='pa'>ਖ਼ੂਨ ਵਗਣਾ</td></tr><tr><td class='num'>12</td><td><span class='say'>blow</span></td><td><span class='say'>blew</span></td><td><span class='say'>blown</span></td><td lang='pa' class='pa'>ਫੂਕ ਮਾਰਨਾ / ਹਵਾ ਵਗਣਾ</td></tr><tr><td class='num'>13</td><td><span class='say'>break</span></td><td><span class='say'>broke</span></td><td><span class='say'>broken</span></td><td lang='pa' class='pa'>ਤੋੜਨਾ</td></tr><tr><td class='num'>14</td><td><span class='say'>breed</span></td><td><span class='say'>bred</span></td><td><span class='say'>bred</span></td><td lang='pa' class='pa'>ਪਾਲਣਾ (ਜਾਨਵਰ) / ਨਸਲ ਵਧਾਉਣਾ</td></tr><tr><td class='num'>15</td><td><span class='say'>bring</span></td><td><span class='say'>broug n class=\"card mist\"><h3>Corrections to the old list</h3><p>Fixed Punjabi meanings: <i>beat</i> (ਕੁੱਟਣਾ/ਹਰਾਉਣਾ, not ਹਰਾਇਆ), <i>break</i> (ਤੋੜਨਾ, not ਹੇਠਾਂ), <i>deal</i> (ਨਜਿੱਠਣਾ, not ਹਿੰਮਤ), <i>send</i> (ਭੇਜਣਾ, not ਖਰਚ), <i>lean</i> (ਢੋਅ ਲਾਉਣਾ, not ਕਮਜ਼ੋਰ), <i>tear</i> (ਪਾੜਨਾ, not ਅੱਥਰੂ), <i>spell</i> (ਸ਼ਬਦ-ਜੋੜ, not ਜਾਦੂ), <i>stride</i>, <i>strike</i>, <i>spoil</i> and others. Removed: <i>below</i> (not a verb), <i>miswed, frostbite, handwrite, inlay, sunburn</i> (very rare). Old-font Punjabi was retyped.</p></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>In IELTS Writing and Speaking, wrong verb forms (<i>I have went, she teached</i>) are among the most common grammar errors at Band 5. Learn 10 verbs a day and say all three forms aloud.</p></section>"], "sets": [{"title": "A · AAA verbs (all forms the same)", "instr": "Type V2 and V3.", "items": [{"t": "fill", "q": "shut → ___ → ___", "a": [["shut"], ["shut"]], "e": "shut – shut – shut (ਬੰਦ ਕਰਨਾ)"}, {"t": "fill", "q": "spread → ___ → ___", "a": [["spread"], ["spread"]], "e": "spread – spread – spread (ਫੈਲਾਉਣਾ)"}, {"t": "fill", "q": "wet → ___ → ___", "a": [["wet"], ["wet"]], "e": "wet – wet – wet (ਗਿੱਲਾ ਕਰਨਾ)"}, {"t": "fill", "q": "thrust → ___ → ___", "a": [["thrust"], ["thrust"]], "e": "thrust – thrust – thrust (ਜ਼ੋਰ ਨਾਲ ਧੱਕਣਾ)"}, {"t": "fill", "q": "split → ___ → ___", "a": [["split"], ["split"]], "e": "split – split – split (ਪਾੜਨਾ / ਵੰਡਣਾ)"}, {"t": "fill", "q": "hit → ___ → ___", "a": [["hit"], ["hit"]], "e": "hit – hit – hit (ਮਾਰਨਾ / ਟੱਕਰ ਮਾਰਨਾ)"}]}, {"title": "B · ABB verbs (V2 = V3)", "instr": "Type V2 and V3.", "items": [{"t": "fill", "q": "spoil → ___ → ___", "a": [["spoilt", "spoiled"], ["spoilt", "spoiled"]], "e": "spoil – spoilt / spoiled – spoilt / spoiled (ਖ਼ਰਾਬ ਕਰਨਾ / ਵਿਗਾੜਨਾ)"}, {"t": "fill", "q": "leave → ___ → ___", "a": [["left"], ["left"]], "e": "leave – left – left (ਛੱਡਣਾ / ਚਲੇ ਜਾਣਾ)"}, {"t": "fill", "q": "teach → ___ → ___", "a": [["taught"], ["taught"]], "e": "teach – ", "a": [["sang"], ["sung"]], "e": "sing – sang – sung (ਗਾਉਣਾ)"}]}, {"title": "D · Meaning", "instr": "Choose the Punjabi meaning.", "items": [{"t": "mcq", "q": "What does “dig” mean?", "o": ["ਭੇਜਣਾ", "ਪੁੱਟਣਾ", "ਤੇਜ਼ ਚੱਲਣਾ", "ਵੇਚਣਾ"], "a": 1, "e": ""}, {"t": "mcq", "q": "What does “wet” mean?", "o": ["ਚਿੱਤਰ ਬਣਾਉਣਾ / ਖਿੱਚਣਾ", "ਟੰਗਣਾ / ਲਟਕਣਾ", "ਗਿੱਲਾ ਕਰਨਾ", "ਜਾਣਨਾ"], "a": 2, "e": ""}, {"t": "mcq", "q": "What does “strike” mean?", "o": ["ਬੁਣਨਾ (ਸਲਾਈਆਂ ਨਾਲ)", "ਮਤਲਬ ਹੋਣਾ", "ਛੱਡ ਦੇਣਾ", "ਮਾਰਨਾ / ਹੜਤਾਲ ਕਰਨਾ"], "a": 3, "e": ""}, {"t": "mcq", "q": "What does “hurt” mean?", "o": ["ਛੁਟਕਾਰਾ ਪਾਉਣਾ", "ਲਿਖਣਾ", "ਸੱਟ ਲਾਉਣਾ / ਦਿਲ ਦੁਖਾਉਣਾ", "ਲੰਮੀਆਂ ਪੁਲਾਂਘਾਂ ਭਰਨਾ"], "a": 2, "e": ""}, {"t": "mcq", "q": "What does “lead” mean?", "o": ["ਪੜ੍ਹਾਉਣਾ / ਸਿਖਾਉਣਾ", "ਭੱਜ ਜਾਣਾ", "ਮਹਿਸੂਸ ਕਰਨਾ", "ਅਗਵਾਈ ਕਰਨਾ"], "a": 3, "e": ""}, {"t": "mcq", "q": "What does “kneel” mean?", "o": ["ਹੋਣਾ", "ਵਗਾਹ ਕੇ ਸੁੱਟਣਾ", "ਛਾਲ ਮਾਰਨਾ", "ਗੋਡੇ ਟੇਕਣਾ"], "a": 3, "e": ""}, {"t": "mcq", "q": "What does “lend” mean?", "o": ["ਸੁਪਨਾ ਵੇਖਣਾ", "ਉਧਾਰ ਦੇਣਾ", "ਜਾਗਣਾ / ਜਗਾਉਣਾ", "ਸਾੜਨਾ / ਸੜਨਾ"], "a": 1, "e": ""}, {"t": "mcq", "q": "What does “burst” mean?", "o": ["ਅੱਗੇ ਲੰਘਣਾ (ਗੱਡੀ)", "ਚਿੰਬੜਨਾ", "ਸ਼ਰਤ ਲਾਉਣਾ", "ਫਟਣਾ"], "a": 3, "e": ""}, {"t": "mcq", "q": "What does “slide” mean?", "o": ["ਪ੍ਰਾਪਤ ਕਰਨਾ / ਮਿਲਣਾ", "ਤਿਲ੍ਹਕਣਾ", "ਢੋਅ ਲਾਉਣਾ / ਝੁਕਣਾ", "ਦੌੜਨਾ"], "a": 1, "e": ""}, {"t": "mcq", "q": "What does “light” mean?", "o": ["ਮਾਰ ਮੁਕਾਉਣਾ", "ਹਿਲਾਉਣਾ", "ਜਗਾਉਣਾ / ਬਾਲਣਾ", "ਗੁਜ਼ਰਨਾ (ਕਿਸੇ ਪ੍ਰਕਿਰਿਆ ਵਿੱਚੋਂ)"], "a": 2, "e": ""}]}, {"title": "E · Regular verbs: spelling", "instr": "Type the past form.", "items": [{"t": "fill", "q": "study → ___", "a": [["studied"]], "e": ""}, {"t": "fill", "q": "stop → ___", "a": [["stopped"]], "e": ""}, {"t": "fill", "q": "clap → ___", "a": [["clapped"]], "e": ""}, {"t": "fill", "q": "dare → ___", "a": [["dared"]], "e": ""}, {"t": "fill", "q": "play → ___", "a": [["played"]], "e": "vowel + y → just add -ed"}, {"t": "fill", "q": "cry → ___", "a": [["cried"]], "e": ""}, {"t": "fill", "q": "plan → ___", "a": [["planned"]], (function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});

            box.appendChild(b);});
        } else if(it.t==="reveal"){

            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");

          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';

          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;

            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }

    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
