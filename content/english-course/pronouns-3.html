var D = {"n": 3, "total": 9, "title": "Possessives: my or mine?", "sub": "Possessive adjectives & possessive pronouns", "test": false, "video": false, "learn": ["<section class=\"card \"><h3>Two kinds of possessive words</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Subject</th><th>Possessive adjective<br>(+ noun)</th><th>Possessive pronoun<br>(stands alone)</th></tr></thead><tbody><tr><td>I</td><td>my book</td><td>mine</td></tr><tr><td>you</td><td>your book</td><td>yours</td></tr><tr><td>he</td><td>his book</td><td>his</td></tr><tr><td>she</td><td>her book</td><td>hers</td></tr><tr><td>it</td><td>its tail</td><td>—</td></tr><tr><td>we</td><td>our book</td><td>ours</td></tr><tr><td>they</td><td>their book</td><td>theirs</td></tr></tbody></table></div><ul class=\"exl\"><li><span class=\"say\">This is <b>my</b> book. → This book is <b>mine</b>.</span></li><li><span class=\"say\">Is this <b>your</b> pen? → Is this pen <b>yours</b>?</span></li><li><span class=\"say\"><b>Their</b> car is red. <b>Ours</b> is white.</span></li></ul></section>", "<section class=\"card \"><h3>The golden rules</h3><ol><li><b>my / your / his / her / its / our / their</b> are always followed by a noun: <i>her friend, our baby</i>.</li><li><b>mine / yours / hers / ours / theirs</b> are used alone — never with a noun after them.</li><li>No apostrophe ever: <b>yours, hers, ours, theirs, its</b> (not <s>your's, her's, it's</s>).</li><li><b>his / her</b> follow the <b>owner</b>, not the thing owned: <i>Ravi loves <b>his</b> mother. Simran loves <b>her</b> father.</i></li></ol></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਪੰਜਾਬੀ ਵਿੱਚ “ਉਸਦਾ / ਉਸਦੀ” <b>ਚੀਜ਼</b> ਦੇ ਲਿੰਗ ਨਾਲ ਬਦਲਦਾ ਹੈ, ਪਰ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ his / her <b>ਮਾਲਕ</b> ਦੇ ਲਿੰਗ ਨਾਲ ਬਦਲਦਾ ਹੈ। ਰਵੀ ਆਪਣੀ ਮਾਂ ਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹੈ = Ravi loves <b>his</b> mother (her ਨਹੀਂ, ਕਿਉਂਕਿ ਮਾਲਕ ਰਵੀ ਮੁੰਡਾ ਹੈ)। My/your/her ਤੋਂ ਬਾਅਦ ਹਮੇਸ਼ਾ noun ਆਉਂਦਾ ਹੈ; mine/yours/hers ਇਕੱਲੇ ਆਉਂਦੇ ਹਨ।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ Ravi loves her mother. (his own mother)</div><div class=\"good\">✓ Ravi loves his mother.</div><div class=\"why\">Ravi is male → his.</div></div><div class=\"mk\"><div class=\"bad\">✗ Is this bag your's?</div><div class=\"good\">✓ Is this bag yours?</div><div class=\"why\">No apostrophe in possessive pronouns.</div></div><div class=\"mk\"><div class=\"bad\">✗ The company increased it's profits.</div><div class=\"good\">✓ The company increased its profits.</div><div class=\"why\">it's = it is.</div></div><div class=\"mk\"><div class=\"bad\">✗ He is a friend of me.</div><div class=\"good\">✓ He is a friend of mine.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p><b>their / there / they're</b> is one of the most common spelling mistakes in IELTS Writing. <i><b>Their</b> house is over <b>there</b>; <b>they're</b> at home.</i> Proof-read for it in the last two minutes.</p></section>"], "sets": [{"title": "A · Choose the correct word", "instr": "Choose the correct answer.", "items": [{"t": "mcq", "q": "May I take ___ umbrella?", "o": ["you're", "yours", "your", "you"], "a": 2, "e": "A noun follows (umbrella) → possessive adjective."}, {"t": "mcq", "q": "Whose car is this? This car is ___.", "o": ["we", "our", "ours", "our's"], "a": 2, "e": "No noun after it → possessive pronoun."}, {"t": "mcq", "q": "This is Jane's book. The book is ___.", "o": ["she", "hers", "her's", "her"], "a": 1, "e": ""}, {"t": "mcq", "q": "They have done ___ work properly.", "o": ["there", "them", "their", "themselves"], "a": 2, "e": ""}, {"t": "mcq", "q": "It seems Mark and Jane have taken my umbrella, because I can see only ___ on the shelf.", "o": ["theirs", "their", "they", "them"], "a": 0, "e": ""}, {"t": "mcq", "q": "My family and I are going on a trip. We are taking ___ dog too.", "o": ["their", "our", "we"], "a": 1, "e": ""}, {"t": "mcq", "q": "Kate and Tom are having a baby. They are so excited for ___ new addition to the family.", "o": ["their", "they", "his"], "a": 0, "e": ""}, {"t": "mcq", "q": "I am a student. ___ name is Ronald.", "o": ["My", "I", "He"], "a": 0, "e": ""}, {"t": "mcq", "q": "This is not your hat. ___ hat is over there.", "o": ["Your", "His", "Our"], "a": 0, "e": ""}, {"t": "mcq", "q": "Should we go to ___ house or ___ house?", "o": ["him, my", "he, mine", "his, my"], "a": 2, "e": ""}, {"t": "mcq", "q": "Should we take ___ car or ___?", "o": ["my, her", "mine, her", "my, hers"], "a": 2, "e": ""}, {"t": "mcq", "q": "___ drink is cold. ___ drink is still hot.", "o": ["Him, I", "His, My", "He, Mine"], "a": 1, "e": ""}, {"t": "mcq", "q": "Let's take ___ car. ___ car is dirty.", "o": ["she's, Your's", "hers, Yours", "her, Your"], "a": 2, "e": ""}]}, {"title": "B · Owner decides: his or her?", "instr": "Remember — his/her follow the owner.", "items": [{"t": "mcq", "q": "Manpreet is a boy. ___ sister is a doctor.", "o": ["Her", "His"], "a": 1, "e": ""}, {"t": "mcq", "q": "Jaspreet is a girl. ___ father is a farmer.", "o": ["Her", "His"], "a": 0, "e": ""}, {"t": "mcq", "q": "Rohan loves ___ mother very much.", "o": ["her", "his"], "a": 1, "e": ""}, {"t": "mcq", "q": "Simran is washing ___ brother's car.", "o": ["his", "her"], "a": 1, "e": ""}, {"t": "mcq", "q": "The tree lost all ___ leaves.", "o": ["it's", "their", "its"], "a": 2, "e": ""}, {"t": "mcq", "q": "The teachers checked ___ students' notebooks.", "o": ["their", "they're", "there"], "a": 0, "e": ""}]}, {"title": "C · Write the possessive", "instr": "Write the correct possessive word.", "items": [{"t": "fill", "q": "Is this ___ (you) pen? — No, it isn't ___ (I).", "a": [["your"], ["mine"]], "e": ""}, {"t": "fill", "q": "We have a new car. ___ car is red.", "a": [["Our"]], "e": ""}, {"t": "fill", "q": "The cat is licking ___ paw.", "a": [["its"]], "e": ""}, {"t": "fill", "q": "Those bags are not ours. They are ___ (they).", "a": [["theirs"]], "e": ""}, {"t": "fill", "q": "Is this pen yours or ___ (he)?", "a": [["his"]], "e": ""}, {"t": "fill", "q": "Harpreet (a boy) phoned ___ grandmother.", "a": [["his"]], "e": ""}, {"t": "fill", "q": "That laptop is not mine; it's ___ (she).", "a": [["hers"]], "e": ""}]}], "next": "Lesson 4 — Reflexive Pronouns"};

    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
