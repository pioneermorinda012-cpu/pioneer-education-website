<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upgrade Your Words · Pioneer Education</title>
<style>
:root{
  --bg:#f5f7fb; --card:#ffffff; --ink:#152033; --muted:#5b6678; --line:#e3e8f0;
  --brand:#1f3f93; --brand-2:#2f5bd3; --accent:#f28c28; --accent-soft:#fff3e6;
  --ok:#16803c; --ok-soft:#e7f6ec; --bad:#c62828; --bad-soft:#fdecec;
  --pun:#6d3fb8; --pun-soft:#f3edfc; --exam:#0f766e; --exam-soft:#e6f6f4;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}}
:root[data-theme="dark"]{
  --bg:#0f1420; --card:#171e2d; --ink:#e7ecf5; --muted:#9aa6ba; --line:#2a3447;
  --brand:#8fb0ff; --brand-2:#6f93f5; --accent:#ffa94d; --accent-soft:#3a2a17;
  --ok:#4ade80; --ok-soft:#133221; --bad:#f87171; --bad-soft:#3a1717;
  --pun:#c4a5ff; --pun-soft:#2a2140; --exam:#5eead4; --exam-soft:#12302d; --shadow:none;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,#1f3f93,#2f5bd3);color:#fff;padding:20px 16px 26px}
header.hero .wrap{padding-bottom:0}
.brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:600}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;margin-top:10px}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.sub{opacity:.9;margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.prog{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.stat{font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tabs button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .tabs button.on{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button.on{color:#0f1420}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:17px;color:var(--brand)}
.card p{margin:8px 0}
.card.pun{background:var(--pun-soft);border-color:transparent}.card.pun h3{color:var(--pun)}
.pa{font-size:16.5px;line-height:1.8}
.card.exam{background:var(--exam-soft);border-color:transparent}.card.exam h3{color:var(--exam)}
.card.mist h3{color:var(--bad)}
.mk{border-top:1px dashed var(--line);padding:8px 0}.mk:first-of-type{border-top:0}
.bad{color:var(--bad)}.good{color:var(--ok);font-weight:600}.why{font-size:14px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:15px}
.exl{list-style:none;padding:0;margin:8px 0}
.exl li{padding:6px 0;border-bottom:1px solid var(--line)}.exl li:last-child{border-bottom:0}
.say{cursor:pointer}
.say::after{content:" 🔊";font-size:13px;opacity:.55}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bg);font-size:13px;color:var(--muted)}
table.two td{width:50%}table.grid td{text-align:center;font-size:17px}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.set h2{font-size:19px;margin:26px 0 2px}
.instr{color:var(--muted);margin:0 0 6px;font-size:15px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.qt{margin:0 0 10px;font-weight:500}
.qn{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;background:var(--bg);color:var(--muted);font-size:13px;font-weight:700;margin-right:6px}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--muted);margin:0 3px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 15px system-ui,sans-serif;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--brand-2)}
.opt.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
textarea.fi{font:500 16px system-ui,sans-serif;line-height:1.5}
input.fi{font:500 16px system-ui,sans-serif;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:9.5em;max-width:100%;margin:2px 3px}
input.fi.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
input.fi.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.chk{margin-top:10px;padding:8px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.chk:disabled{opacity:.4;cursor:default}
.fb{margin-top:10px;padding:9px 12px;border-radius:10px;font-size:15px;display:none}
.fb.show{display:block}.fb.ok{background:var(--ok-soft);color:var(--ok)}.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ex2{display:block;color:var(--ink);margin-top:3px;font-size:14px}
.result{text-align:center;padding:24px 16px}
.big{font-size:52px;font-weight:800;color:var(--brand);line-height:1}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.btn{padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1b1206}
.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px}
.hide{display:none}
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <div class="brand">Pioneer Education · English Grammar</div>
  <span class="chip" id="chip"></span>
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
</div></header>
<div class="bar"><div class="wrap">
  <div class="prog"><i id="pbar"></i></div>
  <div class="stat" id="stat">0 / 0</div>
</div></div>
<main class="wrap">
  <div class="tabs"><button id="tLearn" class="on">📘 Learn</button><button id="tPractice">✍️ Practice</button></div>
  <div id="learn"></div>
  <div id="practice" class="hide"></div>
  <div id="result" class="card result hide"></div>
  <footer>© Pioneer Education, Prem Nagar, Morinda · <span id="unit"></span></footer>
</main>
<script>
/* Optional: paste your YouTube link or a video URL for this lesson here. Leave "" to hide the video. */
var VIDEO_URL = "";
var D = {"n": 2, "total": 4, "title": "Upgrade Your Words", "sub": "Better words for good, bad, big, happy…", "test": false, "unit": "Synonyms", "chip": null, "share": null, "video": true, "js": "\ndocument.querySelectorAll('.vsearch').forEach(function(inp){\n  inp.addEventListener('input',function(){var q=inp.value.toLowerCase().trim();\n    inp.closest('section').querySelectorAll('tbody tr').forEach(function(tr){tr.style.display=!q||tr.textContent.toLowerCase().indexOf(q)>-1?'':'none';});});\n});\n", "learn": ["<section class=\"card \"><h3>Why upgrade?</h3><p>Words like <i>good, bad, big, nice, happy</i> are correct but basic. A stronger word makes your English sound more fluent and earns a higher <b>Lexical Resource</b> score in IELTS.</p><div class=\"tw\"><table class=\"\"><thead><tr><th>Basic</th><th>Upgraded</th></tr></thead><tbody><tr><td>The food was very good.</td><td>The food was <b>delicious</b>.</td></tr><tr><td>It was a very big house.</td><td>It was a <b>huge</b> house.</td></tr><tr><td>I was very happy.</td><td>I was <b>delighted</b>.</td></tr><tr><td>The film was very bad.</td><td>The film was <b>terrible</b>.</td></tr><tr><td>The story was very funny.</td><td>The story was <b>hilarious</b>.</td></tr></tbody></table></div><p>Strong adjectives (huge, delicious, terrible, hilarious, furious) already mean “very”. Use <b>absolutely</b> or <b>really</b> with them — not <s>very</s>: <i>absolutely delicious</i>.</p></section>", "<section class=\"card\"><h3>Common words → better synonyms · 40 words</h3><input class=\"vsearch fi\" style=\"width:100%;margin:0 0 10px\" placeholder=\"🔍 Search…\"><div class=\"tw\"><table><thead><tr><th>Word</th><th>ਪੰਜਾਬੀ</th><th>Synonyms</th></tr></thead><tbody><tr><td><span class='say'>amazing</span></td><td lang='pa' class='pa'>ਹੈਰਾਨੀਜਨਕ</td><td><span class=say>incredible</span>, <span class=say>astonishing</span>, <span class=say>extraordinary</span>, <span class=say>fantastic</span></td></tr><tr><td><span class='say'>angry</span></td><td lang='pa' class='pa'>ਗੁੱਸੇ</td><td><span class=say>furious</span>, <span class=say>annoyed</span>, <span class=say>irritated</span>, <span class=say>mad</span></td></tr><tr><td><span class='say'>answer</span></td><td lang='pa' class='pa'>ਜਵਾਬ ਦੇਣਾ</td><td><span class=say>reply</span>, <span class=say>respond</span></td></tr><tr><td><span class='say'>ask</span></td><td lang='pa' class='pa'>ਪੁੱਛਣਾ</td><td><span class=say>enquire</span>, <span class=say>question</span>, <span class=say>request</span></td></tr><tr><td><span class='say'>bad</span></td><td lang='pa' class='pa'>ਮਾੜਾ</td><td><span class=say>terrible</span>, <span class=say>awful</span>, <span class=say>poor</span>, <span class=say>unpleasant</span></td></tr><tr><td><span class='say'>beautiful</span></td><td lang='pa' class='pa'>ਸੋਹਣਾ</td><td><span class=say>stunning</span>, <span class=say>gorgeous</span>, <span class=say>lovely</span>, <span class=say>attractive</span></td></tr><tr><td><span class='say'>begin</span></td><td lang='pa' class='pa'>ਸ਼ੁਰੂ ਕਰਨਾ</td><td><span class=say>start</span>, <span class=say>commence</span>, <span class=say>launch</span></td></tr><tr><td><span class='say'>big</span></td><td lang='pa' class='pa'>ਵੱਡਾ</td><td><span class=say>huge</span>, <span class=say>enormous</span>, <span class=say>vast</span>, <span class=say>massive</span></td></tr><tr><td><span class='say'>brave</span></td><td lang='pa' class='pa'>ਬਹਾਦਰ</td><td><span class=say>courageous</span>, <span class=say>fearless</span>, <span class=say>bold</span>, <span class=say>heroic</span></td></tr><tr><td><span class='say'>bright</span></td><td lang='pa' class='pa'>ਚਮਕਦਾਰ / ਹੁਸ਼ਿਆਰ</td><td><span class=say>shining</span>, <span class=say>brilliant</span>, <span class=say>intelligent</span>, <span class=say>clever</span></td></tr><tr><td><span class='say'>calm</span></td><td lang='pa' class='pa'>ਸ਼ਾਂਤ</td><td><span class=say>peaceful</span>, <span class=say>tranquil</span>, <span class=say>relaxed</span>, <span class=say>serene</span></td></tr><tr><td><span class='say'>dangerous</span></td><td lang='pa' class='pa'>ਖ਼ਤਰਨਾਕ</td><td><span class=say>risky</span>, <span class=say>unsafe</span>, <span class=say>hazardous</span></td></tr><tr><td><span class='say'>decide</span></td><td lang='pa' class='pa'>ਫ਼ੈਸਲਾ ਕਰਨਾ</td><td><span class=say>choose</span>, <span class=say>determine</span>, <span class=say>resolve</span></td></tr><tr><td><span class='say'>delicious</span></td><td lang='pa' class='pa'>ਸੁਆਦਲਾ</td><td><span class=say>tasty</span>, <span class=say>mouth-watering</span>, <span class=say>appetising</span></td></tr><tr><td><span class='say'>describe</span></td><td lang='pa' class='pa'>ਵਰਣਨ ਕਰਨਾ</td><td><span class=say>portray</span>, <span class=say>depict</span>, <span class=say>explain</span></td></tr><tr><td><span class='say'>destroy</span></td><td lang='pa' class='pa'>ਤਬਾਹ ਕਰਨਾ</td><td><span class=say>ruin</span>, <span class=say>demolish</span>, <span class=say>wreck</span></td></tr><tr><td><span class='say'>dull</span></td><td lang='pa' class='pa'>ਬੋਰਿੰਗ / ਫਿੱਕਾ</td><td><span class=say>boring</span>, <span class=say>tedious</span>, <span class=say>monotonous</span></td></tr><tr><td><span class='say'>eager</span></td><td lang='pa' class='pa'>ਉਤਸੁਕ</td><td><span class=say>keen</span>, <span class=say>enthusiastic</span></td></tr><tr><td><span class='say'>explain</span></td><td lang='pa' class='pa'>ਸਮਝਾਉਣਾ</td><td><span class=say>clarify</span>, <span class=say>describe</span>, <span class=say>account for</span></td></tr><tr><td><span class='say'>fair</span></td><td lang='pa' class='pa'>ਨਿਰਪੱਖ</td><td><span class=say>just</span>, <span class=say>impartial</span>, <span class=say>unbiased</span></td></tr><tr><td><span class='say'>false</span></td><td lang='pa' class='pa'>ਝੂਠਾ / ਨਕਲੀ</td><td><span class=say>untrue</span>, <span class=say>fake</span>, <span class=say>incorrect</span></td></tr><tr><td><span class='say'>famous</span></td><td lang='pa' class='pa'>ਮਸ਼ਹੂਰ</td><td><span class=say>well-known</span>, <span class=say>renowned</span>, <span class=say>celebrated</span></td></tr><tr><td><span class='say'>fast</span></td><td lang='pa' class='pa'>ਤੇਜ਼</td><td><span class=say>quick</span>, <span class=say>rapid</span>, <span class=say>speedy</span>, <span class=say>swift</span></td></tr><tr><td><span class='say'>fear</span></td><td lang='pa' class='pa'>ਡਰ</td><td><span class=say>fright</span>, <span class=say>terror</span>, <span class=say>dread</span>, <span class=say>anxiety</span></td></tr><tr><td><span class='say'>funny</span></td><td lang='pa' class='pa'>ਮਜ਼ਾਕੀਆ</td><td><span class=say>hilarious</span>, <span class=say>amusing</span>, <span class=say>humorous</span></td></tr><tr><td><span class='say'>get</span></td><td lang='pa' class='pa'>ਪ੍ਰਾਪਤ ਕਰਨਾ</td><td><span class=say>obtain</span>, <span class=say>receive</span>, <span class=say>gain</span>, <span class=say>acquire</span></td></tr><tr><td><span class='say'>good</span></td><td lang='pa' class='pa'>ਚੰਗਾ</td><td><span class=say>excellent</span>, <span class=say>great</span>, <span class=say>wonderful</span>, <span class=say>superb</span></td></tr><tr><td><span class='say'>happy</span></td><td lang='pa' class='pa'>ਖ਼ੁਸ਼</td><td><span class=say>delighted</span>, <span class=say>cheerful</span>, <span class=say>pleased</span>, <span class=say>glad</span></td></tr><tr><td><span class='say'>hate</span></td><td lang='pa' class='pa'>ਨਫ਼ਰਤ ਕਰਨਾ</td><td><span class=say>detest</span>, <span class=say>loathe</span>, <span class=say>dislike</span></td></tr><tr><td><span class='say'>help</span></td><td lang='pa' class='pa'>ਮਦਦ ਕਰਨਾ</td><td><span class=say>assist</span>, <span class=say>support</span>, <span class=say>aid</span></td></tr><tr><td><span class='say'>hide</span></td><td lang='pa' class='pa'>ਲੁਕਾਉਣਾ</td><td><span class=say>conceal</span>, <span class=say>cover</span></td></tr><tr><td><span class='say'>hurry</span></td><td lang='pa' class='pa'>ਜਲਦੀ ਕਰਨਾ</td><td><span class=say>rush</span>, <span class=say>hasten</span></td></tr><tr><td><span class='say'>hurt</span></td><td lang='pa' class='pa'>ਸੱਟ ਮਾਰਨਾ / ਦੁਖੀ ਕਰਨਾ</td><td><span class=say>injure</span>, <span class=say>harm</span>, <span class=say>wound</span></td></tr><tr><td><span class='say'>idea</span></td><td lang='pa' class='pa'>ਵਿਚਾਰ</td><td><span class=say>thought</span>, <span class=say>concept</span>, <span class=say>notion</span></td></tr><tr><td><span class='say'>important</span></td><td lang='pa' class='pa'>ਮਹੱਤਵਪੂਰਨ</td><td><span class=say>essential</span>, <span class=say>vital</span>, <span class=say>crucial</span>, <span class=say>significant</span></td></tr><tr><td><span class='say'>interesting</span></td><td lang='pa' class='pa'>ਦਿਲਚਸਪ</td><td><span class=say>fascinating</span>, <span class=say>gripping</span>, <span class=say>absorbing</span></td></tr><tr><td><span class='say'>lazy</span></td><td lang='pa' class='pa'>ਆਲਸੀ</td><td><span class=say>idle</span>, <span class=say>inactive</span>, <span class=say>sluggish</span></td></tr><tr><td><span class='say'>little</span></td><td lang='pa' class='pa'>ਛੋਟਾ</td><td><span class=say>tiny</span>, <span class=say>small</span>, <span class=say>minute</span></td></tr><tr><td><span class='say'>look</span></td><td lang='pa' class='pa'>ਵੇਖਣਾ</td><td><span class=say>glance</span>, <span class=say>stare</span>, <span class=say>gaze</span>, <span class=say>observe</span></td></tr><tr><td><span class='say'>make</span></td><td lang='pa' class='pa'>ਬਣਾਉਣਾ</td><td><span class=say>create</span>, <span class=say>build</span>, <span class=say>produce</span>, <span class=say>construct</span></td></tr></tbody></table></div></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਹਰ ਵਾਰ <b>good / bad / big / happy</b> ਨਾ ਵਰਤੋ। ਉੱਪਰਲੀ ਸੂਚੀ ਵਿੱਚੋਂ ਹਰ ਰੋਜ਼ 5 ਸ਼ਬਦ ਚੁਣੋ ਅਤੇ ਆਪਣੇ ਵਾਕ ਬਣਾਓ। ਨੋਟ: <b>very huge</b> ❌ — <b>absolutely huge</b> ✓</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ The food was very delicious.</div><div class=\"good\">✓ The food was absolutely delicious.</div><div class=\"why\">delicious already means very good.</div></div><div class=\"mk\"><div class=\"bad\">✗ He is very famous and notorious.</div><div class=\"good\">✓ He is very famous / well-known.</div><div class=\"why\">notorious = famous for something bad.</div></div><div class=\"mk\"><div class=\"bad\">✗ I am glad to see the film. It was too good.</div><div class=\"good\">✓ I'm glad I saw the film. It was really good.</div><div class=\"why\">too = a problem.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>Don't learn rare words just to show off (e.g. <i>lickety-split, gargantuan</i>). Examiners prefer <b>accurate, natural</b> words. Learn the word <b>with a sentence</b>.</p></section>"], "sets": [{"title": "A · Choose the synonym", "instr": "", "items": [{"t": "mcq", "q": "Which word means the same as “make”?", "o": ["acquire", "create", "demolish", "explain"], "a": 1, "e": "make = create, build, produce, construct (ਬਣਾਉਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “funny”?", "o": ["awful", "harm", "hilarious", "tedious"], "a": 2, "e": "funny = hilarious, amusing, humorous (ਮਜ਼ਾਕੀਆ)"}, {"t": "mcq", "q": "Which word means the same as “ask”?", "o": ["renowned", "gripping", "enquire", "vast"], "a": 2, "e": "ask = enquire, question, request (ਪੁੱਛਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “dull”?", "o": ["rush", "dread", "boring", "relaxed"], "a": 2, "e": "dull = boring, tedious, monotonous (ਬੋਰਿੰਗ / ਫਿੱਕਾ)"}, {"t": "mcq", "q": "Which word means the same as “decide”?", "o": ["terrible", "construct", "extraordinary", "choose"], "a": 3, "e": "decide = choose, determine, resolve (ਫ਼ੈਸਲਾ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “hide”?", "o": ["enthusiastic", "glance", "vast", "conceal"], "a": 3, "e": "hide = conceal, cover (ਲੁਕਾਉਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “destroy”?", "o": ["cover", "glad", "ruin", "tranquil"], "a": 2, "e": "destroy = ruin, demolish, wreck (ਤਬਾਹ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “hate”?", "o": ["excellent", "detest", "cover", "rapid"], "a": 1, "e": "hate = detest, loathe, dislike (ਨਫ਼ਰਤ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “idea”?", "o": ["detest", "serene", "thought", "vital"], "a": 2, "e": "idea = thought, concept, notion (ਵਿਚਾਰ)"}, {"t": "mcq", "q": "Which word means the same as “answer”?", "o": ["shining", "speedy", "glance", "reply"], "a": 3, "e": "answer = reply, respond (ਜਵਾਬ ਦੇਣਾ)"}, {"t": "mcq", "q": "Which word means the same as “delicious”?", "o": ["tranquil", "commence", "well-known", "tasty"], "a": 3, "e": "delicious = tasty, mouth-watering, appetising (ਸੁਆਦਲਾ)"}, {"t": "mcq", "q": "Which word means the same as “bright”?", "o": ["fright", "poor", "shining", "reply"], "a": 2, "e": "bright = shining, brilliant, intelligent, clever (ਚਮਕਦਾਰ / ਹੁਸ਼ਿਆਰ)"}, {"t": "mcq", "q": "Which word means the same as “eager”?", "o": ["delighted", "unbiased", "renowned", "keen"], "a": 3, "e": "eager = keen, enthusiastic (ਉਤਸੁਕ)"}, {"t": "mcq", "q": "Which word means the same as “interesting”?", "o": ["peaceful", "resolve", "fascinating", "appetising"], "a": 2, "e": "interesting = fascinating, gripping, absorbing (ਦਿਲਚਸਪ)"}, {"t": "mcq", "q": "Which word means the same as “good”?", "o": ["rapid", "clarify", "excellent", "enquire"], "a": 2, "e": "good = excellent, great, wonderful, superb (ਚੰਗਾ)"}, {"t": "mcq", "q": "Which word means the same as “false”?", "o": ["awful", "determine", "irritated", "untrue"], "a": 3, "e": "false = untrue, fake, incorrect (ਝੂਠਾ / ਨਕਲੀ)"}, {"t": "mcq", "q": "Which word means the same as “dangerous”?", "o": ["lovely", "fright", "risky", "delighted"], "a": 2, "e": "dangerous = risky, unsafe, hazardous (ਖ਼ਤਰਨਾਕ)"}, {"t": "mcq", "q": "Which word means the same as “calm”?", "o": ["vast", "peaceful", "account for", "brilliant"], "a": 1, "e": "calm = peaceful, tranquil, relaxed, serene (ਸ਼ਾਂਤ)"}, {"t": "mcq", "q": "Which word means the same as “hurry”?", "o": ["request", "receive", "rush", "renowned"], "a": 2, "e": "hurry = rush, hasten (ਜਲਦੀ ਕਰਨਾ)"}, {"t": "mcq", "q": "Which word means the same as “big”?", "o": ["fright", "commence", "huge", "thought"], "a": 2, "e": "big = huge, enormous, vast, massive (ਵੱਡਾ)"}]}, {"title": "B · Type a synonym", "instr": "Type one word with the same meaning.", "items": [{"t": "fill", "q": "help (ਮਦਦ ਕਰਨਾ) = ___", "a": [["assist", "support", "aid"]], "e": "Any of: assist, support, aid"}, {"t": "fill", "q": "bad (ਮਾੜਾ) = ___", "a": [["terrible", "awful", "poor", "unpleasant"]], "e": "Any of: terrible, awful, poor, unpleasant"}, {"t": "fill", "q": "little (ਛੋਟਾ) = ___", "a": [["tiny", "small", "minute"]], "e": "Any of: tiny, small, minute"}, {"t": "fill", "q": "famous (ਮਸ਼ਹੂਰ) = ___", "a": [["well-known", "renowned", "celebrated"]], "e": "Any of: well-known, renowned, celebrated"}, {"t": "fill", "q": "brave (ਬਹਾਦਰ) = ___", "a": [["courageous", "fearless", "bold", "heroic"]], "e": "Any of: courageous, fearless, bold, heroic"}, {"t": "fill", "q": "get (ਪ੍ਰਾਪਤ ਕਰਨਾ) = ___", "a": [["obtain", "receive", "gain", "acquire"]], "e": "Any of: obtain, receive, gain, acquire"}, {"t": "fill", "q": "lazy (ਆਲਸੀ) = ___", "a": [["idle", "inactive", "sluggish"]], "e": "Any of: idle, inactive, sluggish"}, {"t": "fill", "q": "important (ਮਹੱਤਵਪੂਰਨ) = ___", "a": [["essential", "vital", "crucial", "significant"]], "e": "Any of: essential, vital, crucial, significant"}, {"t": "fill", "q": "look (ਵੇਖਣਾ) = ___", "a": [["glance", "stare", "gaze", "observe"]], "e": "Any of: glance, stare, gaze, observe"}, {"t": "fill", "q": "amazing (ਹੈਰਾਨੀਜਨਕ) = ___", "a": [["incredible", "astonishing", "extraordinary", "fantastic"]], "e": "Any of: incredible, astonishing, extraordinary, fantastic"}, {"t": "fill", "q": "fast (ਤੇਜ਼) = ___", "a": [["quick", "rapid", "speedy", "swift"]], "e": "Any of: quick, rapid, speedy, swift"}, {"t": "fill", "q": "fair (ਨਿਰਪੱਖ) = ___", "a": [["just", "impartial", "unbiased"]], "e": "Any of: just, impartial, unbiased"}, {"t": "fill", "q": "beautiful (ਸੋਹਣਾ) = ___", "a": [["stunning", "gorgeous", "lovely", "attractive"]], "e": "Any of: stunning, gorgeous, lovely, attractive"}, {"t": "fill", "q": "explain (ਸਮਝਾਉਣਾ) = ___", "a": [["clarify", "describe", "account for"]], "e": "Any of: clarify, describe, account for"}, {"t": "fill", "q": "hurt (ਸੱਟ ਮਾਰਨਾ / ਦੁਖੀ ਕਰਨਾ) = ___", "a": [["injure", "harm", "wound"]], "e": "Any of: injure, harm, wound"}, {"t": "fill", "q": "begin (ਸ਼ੁਰੂ ਕਰਨਾ) = ___", "a": [["start", "commence", "launch"]], "e": "Any of: start, commence, launch"}, {"t": "fill", "q": "angry (ਗੁੱਸੇ) = ___", "a": [["furious", "annoyed", "irritated", "mad"]], "e": "Any of: furious, annoyed, irritated, mad"}, {"t": "fill", "q": "describe (ਵਰਣਨ ਕਰਨਾ) = ___", "a": [["portray", "depict", "explain"]], "e": "Any of: portray, depict, explain"}, {"t": "fill", "q": "happy (ਖ਼ੁਸ਼) = ___", "a": [["delighted", "cheerful", "pleased", "glad"]], "e": "Any of: delighted, cheerful, pleased, glad"}, {"t": "fill", "q": "fear (ਡਰ) = ___", "a": [["fright", "terror", "dread", "anxiety"]], "e": "Any of: fright, terror, dread, anxiety"}]}, {"title": "C · Use it in a sentence", "instr": "Choose the word that fits best.", "items": [{"t": "mcq", "q": "The view from the hill was absolutely ___.", "o": ["false", "stunning", "dull", "lazy"], "a": 1, "e": ""}, {"t": "mcq", "q": "My father was ___ when I crashed his car.", "o": ["renowned", "tiny", "furious", "delicious"], "a": 2, "e": ""}, {"t": "mcq", "q": "Smoking is ___ to your health.", "o": ["eager", "harmful", "funny", "calm"], "a": 1, "e": ""}, {"t": "mcq", "q": "She is a ___ singer — everyone in India knows her.", "o": ["sluggish", "renowned", "risky", "tedious"], "a": 1, "e": ""}, {"t": "mcq", "q": "The comedy show was ___. We laughed all evening.", "o": ["terrible", "hilarious", "vast", "idle"], "a": 1, "e": ""}, {"t": "mcq", "q": "Clean water is ___ for good health.", "o": ["fake", "brave", "amusing", "essential"], "a": 3, "e": ""}]}], "next": "Lesson 3 — Advanced Synonyms"};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
