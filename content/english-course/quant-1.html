var D = {"n": 1, "total": 1, "title": "How Much or How Many?", "sub": "Countable & uncountable nouns", "chip": "Quantity Questions", "share": "How Much / How Many", "unit": "How much / How many", "learn": ["<section class=\"card \"><h3>The one question to ask: can I count it?</h3><div class=\"tw\"><table class=\"\"><thead><tr><th></th><th>How <b>many</b></th><th>How <b>much</b></th></tr></thead><tbody><tr><td>Used with</td><td><b>countable</b> nouns — you can put a number before them</td><td><b>uncountable</b> nouns — you can't count them one by one</td></tr><tr><td>Noun form</td><td>plural: books, people, days</td><td>singular, no -s: water, money, time</td></tr><tr><td>Examples</td><td><span class='say'>How many books do you have?</span><br><span class='say'>How many people live here?</span></td><td><span class='say'>How much water do you drink?</span><br><span class='say'>How much time do you have?</span></td></tr></tbody></table></div><p class='note'><b>Quick test:</b> Can you say <i>two ___</i>? two books ✓ → <b>many</b>. two waters ✗ → <b>much</b>.</p></section>", "<section class=\"card \"><h3>Uncountable nouns students often get wrong</h3><p>These are <b>uncountable</b> in English — no <i>-s</i>, and they take <b>how much</b>:</p><p><b>money, information, advice, furniture, luggage, baggage, homework, work, news, traffic, bread, rice, sugar, milk, water, time, sleep, fun, weather, knowledge, equipment</b></p><ul class=\"exl\"><li><span class=\"say\">How much <b>information</b> do you need? (not informations)</span></li><li><span class=\"say\">How much <b>homework</b> did you get? (not homeworks)</span></li><li><span class=\"say\">How much <b>luggage</b> are you carrying? (not luggages)</span></li></ul></section>", "<section class=\"card \"><h3>Turning uncountable into countable</h3><p>Put a container or unit in front, and the unit becomes countable → <b>how many</b>.</p><ul class=\"exl\"><li><span class=\"say\">How much coffee? → How many <b>cups</b> of coffee?</span></li><li><span class=\"say\">How much rice? → How many <b>kilos</b> of rice?</span></li><li><span class=\"say\">How much advice? → How many <b>pieces</b> of advice?</span></li><li><span class=\"say\">How much money? → How many <b>rupees</b>?</span></li><li><span class=\"say\">How much time? → How many <b>hours</b>?</span></li></ul></section>", "<section class=\"card \"><h3>Asking the price</h3><p><b>How much</b> is used for price — even with plural things.</p><ul class=\"exl\"><li><span class=\"say\"><b>How much</b> is this shirt?</span></li><li><span class=\"say\"><b>How much</b> are these shoes?</span></li><li><span class=\"say\"><b>How much</b> does a ticket to Delhi cost?</span></li></ul></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\"><b>How many = ਕਿੰਨੇ</b> — ਉਹ ਚੀਜ਼ਾਂ ਜੋ ਗਿਣੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ (ਕਿੰਨੇ ਸੇਬ, ਕਿੰਨੇ ਵਿਦਿਆਰਥੀ)। <b>How much = ਕਿੰਨਾ</b> — ਉਹ ਚੀਜ਼ਾਂ ਜੋ ਗਿਣੀਆਂ ਨਹੀਂ ਜਾ ਸਕਦੀਆਂ, ਸਿਰਫ਼ ਮਾਪੀਆਂ ਜਾ ਸਕਦੀਆਂ ਹਨ (ਕਿੰਨਾ ਪਾਣੀ, ਕਿੰਨਾ ਸਮਾਂ, ਕਿੰਨੇ ਪੈਸੇ = how much money)। ਧਿਆਨ ਦਿਓ: ਪੰਜਾਬੀ ਵਿੱਚ “ਪੈਸੇ” ਬਹੁਵਚਨ ਲੱਗਦਾ ਹੈ, ਪਰ ਅੰਗਰੇਜ਼ੀ ਵਿੱਚ <b>money</b> uncountable ਹੈ — How much money, ਨਾ ਕਿ How many money। ਕੀਮਤ ਪੁੱਛਣ ਲਈ ਹਮੇਸ਼ਾ <b>How much</b>।</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ How many money do you have?</div><div class=\"good\">✓ How much money do you have?</div><div class=\"why\">money is uncountable.</div></div><div class=\"mk\"><div class=\"bad\">✗ I need some informations.</div><div class=\"good\">✓ I need some information.</div><div class=\"why\">No -s on uncountable nouns.</div></div><div class=\"mk\"><div class=\"bad\">✗ He gave me many advices.</div><div class=\"good\">✓ He gave me a lot of advice. / some pieces of advice.</div></div><div class=\"mk\"><div class=\"bad\">✗ How much students are in your class?</div><div class=\"good\">✓ How many students are in your class?</div><div class=\"why\">students can be counted.</div></div><div class=\"mk\"><div class=\"bad\">✗ How many is this watch?</div><div class=\"good\">✓ How much is this watch?</div><div class=\"why\">Price → how much.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>In IELTS Writing Task 1, use <b>the number of</b> for countable nouns and <b>the amount of</b> for uncountable nouns: <i>“<b>the number of</b> tourists rose…”, “<b>the amount of</b> electricity used fell…”</i>. Likewise <b>fewer</b> people (countable) but <b>less</b> water (uncountable). Examiners check this for Lexical Resource and Grammar.</p></section>"], "sets": [{"title": "A · Countable or uncountable?", "instr": "Can you put a number in front of it?", "items": [{"t": "mcq", "q": "“water” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "“chair” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}, {"t": "mcq", "q": "“advice” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": "Say “a piece of advice”, not “an advice”."}, {"t": "mcq", "q": "“rupee” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}, {"t": "mcq", "q": "“information” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "“student” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}, {"t": "mcq", "q": "“furniture” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": "chairs and tables are countable; furniture is not."}, {"t": "mcq", "q": "“minute” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}, {"t": "mcq", "q": "“luggage” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": ""}, {"t": "mcq", "q": "“suitcase” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}, {"t": "mcq", "q": "“news” is…", "o": ["Countable", "Uncountable"], "a": 1, "e": "News looks plural but takes a singular verb: The news is good."}, {"t": "mcq", "q": "“idea” is…", "o": ["Countable", "Uncountable"], "a": 0, "e": ""}]}, {"title": "B · How much or how many?", "instr": "Choose the correct question word.", "items": [{"  many"], "a": 0, "e": ""}, {"t": "mcq", "q": "___ hours of sleep do you get every night?", "o": ["How much", "How many"], "a": 1, "e": "hours can be counted (compare: how much sleep)."}, {"t": "mcq", "q": "___ different kinds of pizzas are on the menu?", "o": ["How much", "How many"], "a": 1, "e": ""}, {"t": "mcq", "q": "___ hotels do you think there are in Delhi?", "o": ["How much", "How many"], "a": 1, "e": ""}, {"t": "mcq", "q": "___ days do you want to stay in Bangalore?", "o": ["How much", "How many"], "a": 1, "e": ""}, {"t": "mcq", "q": "___ work do you have?", "o": ["How much", "How many"], "a": 0, "e": "work (uncountable) — but: how many jobs?"}, {"t": "mcq", "q": "___ years does it take to become a doctor?", "o": ["How much", "How many"], "a": 1, "e": ""}, {"t": "mcq", "q": "___ coffee do you think Tom drinks every day?", "o": ["How much", "How many"], "a": 0, "e": ""}, {"t": "mcq", "q": "___ cash do you usually have on you?", "o": ["How much", "How many"], "a": 0, "e": ""}, {"t": "mcq", "q": "___ cups of coffee do you drink every day?", "o": ["How much", "How many"], "a": 1, "e": "cups can be counted."}, {"t": "mcq", "q": "___ people do you know who are named Frank?", "o": ["How much", "How many"], "a": 1, "e": "people = plural of person."}, {"t": "mcq", "q": "___ food should I be feeding my dog?", "o": ["How much", "How many"], "a": 0, "e": ""}, {"t": "mcq", "q": "Did you tell Tom ___ fun you had?", "o": ["How much", "How many"], "a": 0, "e": ""}]}, {"title": "C · Write the question", "instr": "Write How much or How many.", "items": [{"t": "fill", "q": "___ brothers do you have? — I have three brothers.", "a": [["How many"]], "e": ""}, {"t": "fill", "q": "___ is this jacket? — It's ₹1,500.", "a": [["How much"]], "e": "Price → how much."}, {"t": "fill", "q": "___ are these mangoes? — ₹80 a kilo.", "a": [["How much"]], "e": "Price → how much, even with a plural noun."}, {"t": "fill", "q": "___ students are there in your class? — Thirty.", "a": [["How many"]], "e": ""}, {"t": "fill", "q": "___ petrol does your bike use in a week?", "a": [["How much"]], "e": ""}, {"t": "fill", "q": "___ homework did the teacher give you?", "a": [["How much"]], "e": ""}, {"t": "fill", "q": "___ litres of milk do we need?", "a": [["How many"]], "e": ""}, {"t": "fill", "q": "___ luggage are you taking to Canada?", "a": [["How much"]], "e": ""}, {"t": "fill", "q": "___ bags are you taking to Canada?", "a": [["How many"]], "e": ""}, {"t": "fill", "q": "___ information do you need for the visa form?", "a": [["How much"]], "e": ""}]}, {"title": "D · Spot the correct sentence (Pro)", "instr": "Choose the correct sentence.", "items": [{"t": "mcq", "q": "Choose the correct sentence.", "o": ["How many money did you spend?", "How much money did you spend?"], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["Can you give me some informations?", "Can you give me some information?"], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["My teacher gave me a useful advice.", "My teacher gave me a useful piece of advice."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["We bought new furniture.", "We bought new furnitures."], "a": 0, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence (IELTS Task 1).", "o": ["The number of students increased.", "The amount of students increased."], "a": 0, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["There were less people this year.", "There were fewer people this year."], "a": 1, "e": ""}, {"t": "mcq", "q": "Choose the correct sentence.", "o": ["The news is very good.", "The news are very good."], "a": 0, "e": ""}]}], "next": null};

  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"; P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?"the Pronouns Final Test":"Pronouns Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
