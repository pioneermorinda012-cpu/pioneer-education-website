<style>

var VIDEO_URL = "";
var D = {"n": 1, "total": 3, "title": "Comparatives & Superlatives: Practice", "sub": "Rules + lots of practice", "test": false, "unit": "Comparatives & Superlatives", "chip": null, "share": null, "video": true, "js": null, "learn": ["<section class=\"card \"><h3>Quick reminder</h3><p><b>Comparative</b> = comparing <b>two</b> → <b>-er … than</b> / <b>more … than</b>.<br><b>Superlative</b> = <b>three or more</b> → <b>the -est</b> / <b>the most</b>.</p><ul class=\"exl\"><li><span class=\"say\">Ali is taller than Adam.</span></li><li><span class=\"say\">Winter is the coldest season.</span></li><li><span class=\"say\">This is the saddest book I've ever read.</span></li></ul></section>", "<section class=\"card \"><h3>All the rules in one place</h3><div class=\"tw\"><table class=\"\"><thead><tr><th>Adjective</th><th>Rule</th><th>Positive → Comparative → Superlative</th></tr></thead><tbody><tr><td>one syllable</td><td>+ er / est</td><td>tall → taller → tallest · sweet, young, bold, kind, high, great, small</td></tr><tr><td>ends in -e</td><td>+ r / st</td><td>brave → braver → bravest · large, wise, white, noble, fine</td></tr><tr><td>consonant + y</td><td>y → ier / iest</td><td>happy → happier → happiest · easy, heavy, lazy, merry, wealthy</td></tr><tr><td>one vowel + one consonant</td><td>double the last letter</td><td>big → bigger → biggest · fat, hot, red, sad, thin</td></tr><tr><td>two or more syllables</td><td>more / most</td><td>beautiful → more beautiful → most beautiful · difficult, honest, enjoyable</td></tr><tr><td>irregular</td><td>new word</td><td>good → better → best · bad → worse → worst · little → less → least · much/many → more → most · far → farther/further → farthest/furthest</td></tr></tbody></table></div></section>", "<section class=\"card pun\"><h3>ਪੰਜਾਬੀ ਵਿੱਚ ਸਮਝੋ</h3><p lang=\"pa\" class=\"pa\">ਦੋ ਦੀ ਤੁਲਨਾ: <b>-er + than</b> (ਨਾਲੋਂ)। ਸਭ ਤੋਂ ਵੱਧ: <b>the + -est</b> (ਸਭ ਤੋਂ)। ਲੰਮੇ ਸ਼ਬਦ: more / most। <b>the</b> ਨੂੰ superlative ਤੋਂ ਪਹਿਲਾਂ ਭੁੱਲਣਾ ਨਹੀਂ!</p></section>", "<section class=\"card mist\"><h3>Common mistakes</h3><div class=\"mk\"><div class=\"bad\">✗ He is more tall than me.</div><div class=\"good\">✓ He is taller than me.</div></div><div class=\"mk\"><div class=\"bad\">✗ She is most beautiful girl.</div><div class=\"good\">✓ She is the most beautiful girl.</div><div class=\"why\">Superlative needs “the”.</div></div><div class=\"mk\"><div class=\"bad\">✗ This is more better.</div><div class=\"good\">✓ This is better.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>IELTS Writing Task 1 is full of comparisons. Learn these patterns: <i>“X was <b>higher than</b> Y”, “X was <b>the highest</b>”, “X was <b>twice as high as</b> Y”, “X was <b>slightly lower than</b> Y”.</i></p></section>"], "sets": [{"title": "A · Write the comparative or superlative", "instr": "Use the word in brackets.", "items": [{"t": "fill", "q": "Ali is ___ than Adam. (tall)", "a": [["taller"]], "e": ""}, {"t": "fill", "q": "Pineapples are ___ than oranges. (sweet)", "a": [["sweeter"]], "e": ""}, {"t": "fill", "q": "This is the ___ book I've ever read. (sad)", "a": [["saddest"]], "e": ""}, {"t": "fill", "q": "Winter is the ___ season. (cold)", "a": [["coldest"]], "e": ""}, {"t": "fill", "q": "My bag is ___ than yours. (heavy)", "a": [["heavier"]], "e": ""}, {"t": "fill", "q": "Sara's dress is ___ than mine. (short)", "a": [["shorter"]], "e": ""}, {"t": "fill", "q": "Summer is ___ than autumn. (hot)", "a": [["hotter"]], "e": ""}, {"t": "fill", "q": "The elephant is ___ than the mouse. (big)", "a": [["bigger"]], "e": ""}, {"t": "fill", "q": "This TV is the ___ one in the shop. (big)", "a": [["biggest"]], "e": ""}, {"t": "fill", "q": "Tim can run ___ than Bill. (fast)", "a": [["faster"]], "e": ""}, {"t": "fill", "q": "I was sad because I got the ___ grade in the test. (low)", "a": [["lowest"]], "e": ""}, {"t": "fill", "q": "I got a ___ grade than Lena. (low)", "a": [["lower"]], "e": ""}]}, {"title": "B · Form the degrees of comparison", "instr": "Type the comparative and superlative.", "items": [{"t": "fill", "q": "nice → ___ → ___", "a": [["nicer"], ["nicest"]], "e": ""}, {"t": "fill", "q": "short → ___ → ___", "a": [["shorter"], ["shortest"]], "e": ""}, {"t": "fill", "q": "young → ___ → ___", "a": [["younger"], ["youngest"]], "e": ""}, {"t": "fill", "q": "new → ___ → ___", "a": [["newer"], ["newest"]], "e": ""}, {"t": "fill", "q": "old → ___ → ___", "a": [["older"], ["oldest"]], "e": ""}, {"t": "fill", "q": "careful → ___ → ___", "a": [["more careful"], ["most careful"]], "e": ""}, {"t": "fill", "q": "modern → ___ → ___", "a": [["more modern"], ["most modern"]], "e": ""}, {"t": "fill", "q": "popular → ___ → ___", "a": [["more popular"], ["most popular"]], "e": ""}, {"t": "fill", "q": "dangerous → ___ → ___", "a": [["more dangerous"], ["most dangerous"]], "e": ""}, {"t": "fill", "q": "expensive → ___ → ___", "a": [["more expensive"], ["most expensive"]], "e": ""}, {"t": "fill", "q": "little → ___ → ___", "a": [["less"], ["least"]], "e": ""}, {"t": "fill", "q": "bad → ___ → ___", "a": [["worse"], ["worst"]], "e": ""}, {"t": "fill", "q": "good → ___ → ___", "a": [["better"], ["best"]], "e": ""}, {"t": "fill", "q": "much / many → ___ → ___", "a": [["more"], ["most"]], "e": ""}, {"t": "fill", "q": "high → ___ → ___", "a": [["higher"], ["highest"]], "e": ""}, {"t": "fill", "q": "small → ___ → ___", "a": [["smaller"], ["smallest"]], "e": ""}, {"t": "fill", "q": "large → ___ → ___", "a": [["larger"], ["largest"]], "e": ""}, {"t": "fill", "q": "heavy → ___ → ___", "a": [["heavier"], ["heaviest"]], "e": ""}, {"t": "fill", "q": "interesting → ___ → ___", "a": [["more interesting"], ["most interesting"]], "e": ""}, {"t": "fill", "q": "creative → ___ → ___", "a": [["more creative"], ["most creative"]], "e": ""}]}, {"title": "C · Choose the correct form", "instr": "", "items": [{"t": "mcq", "q": "Mary is ___ than Kate.", "o": ["taller", "tall", "the tallest"], "a": 0, "e": ""}, {"t": "mcq", "q": "Tom is ___ than Bob.", "o": ["the shortest", "short", "shorter"], "a": 2, "e": ""}, {"t": "mcq", "q": "Bill reads ___ than Ben.", "o": ["the most", "much", "more"], "a": 2, "e": ""}, {"t": "mcq", "q": "Pam is ___ than Helen.", "o": ["the oldest", "old", "older"], "a": 2, "e": ""}, {"t": "mcq", "q": "Mona's dress is ___ than Pam's dress.", "o": ["cheaper", "cheap", "the cheapest"], "a": 0, "e": ""}, {"t": "mcq", "q": "Nick is ___ than Mike.", "o": ["faster", "fast", "the fastest"], "a": 0, "e": ""}, {"t": "mcq", "q": "Tim is ___ than his brother.", "o": ["the most helpful", "helpful", "more helpful"], "a": 2, "e": ""}, {"t": "mcq", "q": "This text is ___ than that text.", "o": ["more difficult", "difficult", "the most difficult"], "a": 0, "e": ""}]}, {"title": "D · Fill in the correct form (superlatives)", "instr": "", "items": [{"t": "fill", "q": "July is the ___ (hot) month of the year.", "a": [["hottest"]], "e": ""}, {"t": "fill", "q": "My bike is the ___ (cheap).", "a": [["cheapest"]], "e": ""}, {"t": "fill", "q": "This is the ___ (high) tree in this park.", "a": [["highest"]], "e": ""}, {"t": "fill", "q": "Peter is the ___ (good) runner at school.", "a": [["best"]], "e": ""}, {"t": "fill", "q": "Mona is the ___ (clever) student in our class.", "a": [["cleverest", "most clever"]], "e": ""}, {"t": "fill", "q": "This task is the ___ (difficult) in the test.", "a": [["most difficult"]], "e": ""}, {"t": "fill", "q": "The traffic on this road is the ___ (dangerous).", "a": [["most dangerous"]], "e": ""}, {"t": "fill", "q": "It is the ___ (heavy) box here.", "a": [["heaviest"]], "e": ""}, {"t": "fill", "q": "My granny is the ___ (old) in our family.", "a": [["oldest"]], "e": ""}, {"t": "fill", "q": "This car is the ___ (expensive) here.", "a": [["most expensive"]], "e": ""}, {"t": "fill", "q": "Liz is the ___ (fat) girl in our street.", "a": [["fattest"]], "e": ""}, {"t": "fill", "q": "This is the ___ (good) translation.", "a": [["best"]], "e": ""}, {"t": "fill", "q": "It is the ___ (popular) film now.", "a": [["most popular"]], "e": ""}, {"t": "fill", "q": "I think it is the ___ (cold) day today.", "a": [["coldest"]], "e": ""}, {"t": "fill", "q": "It is the ___ (big) size of the dress.", "a": [["biggest"]], "e": ""}, {"t": "fill", "q": "Bob is the ___ (good) student in our class.", "a": [["best"]], "e": ""}]}], "next": "Lesson 2 — Comparative or Superlative?"};
(function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";
  $("chip").textContent = D.chip ? D.chip : D.test ? "Final Test" : ("Lesson " + D.n + " of " + D.total);
  $("unit").textContent = D.unit || "Pronouns unit"; $("ttl").textContent = D.title; $("sub").textContent = D.sub;

  function speak(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=0.9;speechSynthesis.speak(u);}catch(e){}}
  function videoHTML(u){
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m) return '<div class="video"><iframe src="https://www.youtube.com/embed/'+m[1]+'" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>';
    return '<div class="video"><video src="'+u+'" controls playsinline preload="metadata"></video></div>';
  }
  var L = $("learn");
  if(D.video && VIDEO_URL) L.insertAdjacentHTML("beforeend",'<section class="card"><h3>🎬 Watch the video lesson</h3>'+videoHTML(VIDEO_URL)+'</section>');
  L.insertAdjacentHTML("beforeend", D.learn.join(""));
  if(D.js){try{new Function(D.js)();}catch(e){console.error(e)}}
  L.insertAdjacentHTML("beforeend",'<div class="btns"><button class="btn pri" id="goP">Start practice →</button></div>');
  L.addEventListener("click",function(e){var s=e.target.closest(".say");if(s)speak(s.textContent.replace(/\(.*?\)/g,""));});

  function tab(p){ $("learn").classList.toggle("hide",p); $("practice").classList.toggle("hide",!p);
    $("tLearn").classList.toggle("on",!p); $("tPractice").classList.toggle("on",p);
    if(!p) $("result").classList.add("hide"); else if(done===total) $("result").classList.remove("hide");
    window.scrollTo(0,0);}
  $("tLearn").onclick=function(){tab(false)}; $("tPractice").onclick=function(){tab(true)};
  $("goP").onclick=function(){tab(true)};

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}
  function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function upd(){ $("pbar").style.width=(total?done/total*100:0)+"%"; $("stat").textContent="✓ "+score+" · "+done+"/"+total;
    if(done===total) showResult(); }
  function fb(el,ok,correct,exp){ el.className="fb show "+(ok?"ok":"no");
    el.innerHTML=(ok?"✔ Correct!":"✘ Correct answer: <b>"+esc(correct)+"</b>")+(exp?'<span class="ex2">'+exp+'</span>':""); }

  function build(){
    var P=$("practice"); P.innerHTML=""; done=0; score=0; var n=0;
    D.sets.forEach(function(s){
      var sec=document.createElement("div"); sec.className="set";
      sec.innerHTML="<h2>"+s.title+"</h2><p class='instr'>"+s.instr+"</p>"+(s.intro||""); P.appendChild(sec);
      s.items.forEach(function(it){
        n++; var q=document.createElement("div"); q.className="q"; q.dataset.state="";
        if(it.t==="mcq"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span>'+esc(it.q).replace(/___/g,'<span class="blank"></span>')+'</p><div class="opts"></div><div class="fb"></div>';
          var box=q.querySelector(".opts");
          it.o.forEach(function(o,i){var b=document.createElement("button");b.className="opt";b.textContent=o;
            b.onclick=function(){ if(q.dataset.state)return; var ok=i===it.a; q.dataset.state=ok?"ok":"no";
              box.querySelectorAll(".opt").forEach(function(x,j){x.disabled=true; if(j===it.a)x.classList.add("right"); else if(j===i)x.classList.add("wrong");});
              done++; if(ok)score++; fb(q.querySelector(".fb"),ok,it.o[it.a],it.e); upd(); };
            box.appendChild(b);});
        } else if(it.t==="reveal"){
          q.innerHTML='<p class="qt"><span class="qn">'+n+'</span><span lang="pa" class="pa">'+esc(it.q)+'</span></p>'
            +'<textarea class="fi" rows="2" style="width:100%" placeholder="Write your English sentence here (optional)…"></textarea>'
            +'<button class="chk">Show answer</button><div class="fb"></div><div class="opts hide" style="margin-top:8px"><button class="opt sg">✓ I got it</button><button class="opt sb">✗ Not yet</button></div>';
          var rb=q.querySelector(".chk"), rf=q.querySelector(".fb"), ro=q.querySelector(".opts");
          rb.onclick=function(){ rb.disabled=true; rf.className="fb show ok"; rf.style.background="var(--bg)"; rf.style.color="var(--ink)";
            rf.innerHTML="<b>Model answer:</b> <span class='say'>"+esc(it.a)+"</span>"+(it.e?'<span class="ex2">'+it.e+'</span>':""); ro.classList.remove("hide"); };
          function grade(ok){ if(q.dataset.state)return; q.dataset.state=ok?"ok":"no"; done++; if(ok)score++;
            ro.querySelectorAll(".opt").forEach(function(x){x.disabled=true;}); (ok?ro.querySelector(".sg"):ro.querySelector(".sb")).classList.add(ok?"right":"wrong"); upd(); }
          ro.querySelector(".sg").onclick=function(){grade(true)}; ro.querySelector(".sb").onclick=function(){grade(false)};
          q.addEventListener("click",function(e){var sy=e.target.closest(".say");if(sy)speak(sy.textContent);});
        } else {
          var parts=it.q.split("___"), h='<p class="qt"><span class="qn">'+n+'</span>';
          parts.forEach(function(p,i){ h+=esc(p); if(i<parts.length-1) h+='<input class="fi"'+(it.a[i][0].length>18?' style="width:100%;display:block;margin-top:8px"':'')+' autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="answer '+(i+1)+'">'; });
          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;
          var ins=q.querySelectorAll("input.fi"), btn=q.querySelector(".chk");
          function check(){ if(q.dataset.state)return; var all=true, empty=false;
            ins.forEach(function(x){if(!x.value.trim())empty=true;}); if(empty){ins.forEach(function(x){if(!x.value.trim())x.focus();});return;}
            ins.forEach(function(x,i){ var acc=it.a[i].map(norm); var ok=acc.indexOf(norm(x.value))>-1; x.classList.add(ok?"right":"wrong"); x.disabled=true; if(!ok)all=false; });
            q.dataset.state=all?"ok":"no"; btn.disabled=true; done++; if(all)score++;
            fb(q.querySelector(".fb"),all,it.a.map(function(a){return a[0]}).join(" / "),it.e); upd(); }
          btn.onclick=check; ins.forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();check();}});});
        }
        sec.appendChild(q);
      });
    });
    $("result").classList.add("hide"); upd();
  }
  function showResult(){
    var pct=Math.round(score/total*100), R=$("result");
    var msg = pct>=90?"Outstanding! 🏆": pct>=80?"Excellent work! 🌟": pct>=60?"Good — review the red answers and try again. 💪":"Keep practising — reread the Learn section, then try again. 📘";
    var share="I scored "+score+"/"+total+" ("+pct+"%) in "+(D.share?D.share:D.test?(D.unit||"Pronouns")+" Final Test":(D.unit||"Pronouns")+" Lesson "+D.n+": "+D.title)+" — Pioneer Education, Morinda";
    R.innerHTML='<div class="big">'+pct+'%</div><p><b>'+score+' / '+total+'</b> correct</p><p>'+msg+'</p>'
      +'<div class="btns"><button class="btn" id="rv">Review mistakes</button><button class="btn pri" id="ag">Try again</button>'
      +'<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(share)+'">Share on WhatsApp</a></div>'
      +(D.next?'<p class="next">Next: '+D.next+'</p>':'');
    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
</body>
</html>
