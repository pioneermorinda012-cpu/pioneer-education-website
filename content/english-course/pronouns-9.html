<style>

:root[data-theme="dark"]{

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gurmukhi",sans-serif;-webkit-text-size-adjust:100%}

.btn.wa{background:#25d366;border-color:#25d366;color:#062b14}
.next{color:var(--muted);font-size:14px;margin-top:14px}

.hide{display:none}
</style>

class=\"mk\"><div class=\"bad\">✗ This is the man which helped me.</div><div class=\"good\">✓ This is the man who helped me.</div><div class=\"why\">People → who.</div></div><div class=\"mk\"><div class=\"bad\">✗ The house where I live in is old.</div><div class=\"good\">✓ The house where I live is old. / The house (that) I live in is old.</div></div><div class=\"mk\"><div class=\"bad\">✗ My brother, that lives in Canada, is a nurse.</div><div class=\"good\">✓ My brother, who lives in Canada, is a nurse.</div><div class=\"why\">No “that” after a comma.</div></div></section>", "<section class=\"card exam\"><h3>IELTS / Exam tip</h3><p>Relative clauses are one of the easiest ways to show <b>complex sentences</b> in IELTS Writing (needed for Band 7 Grammatical Range): <i>“Young people, <b>who</b> spend hours online, are…”</i></p></section>"], "sets": [{"title": "A · Match the halves", "instr": "Choose the best ending.", "items": [{"t": "mcq", "q": "I really enjoyed the book …", "o": ["which leaves at 8:30.", "which I read last week.", "where the treasure was.", "who needs tickets for the concert?"], "a": 1, "e": ""}, {"t": "mcq", "q": "Long John Silver went back to the island …", "o": ["where we can ski.", "who live in America.", "which I read last week.", "where the treasure was."], "a": 3, "e": ""}, {"t": "mcq", "q": "Who was the author …", "o": ["which they sell in the canteen.", "where the treasure was.", "who wrote the Harry Potter books?", "which the thieves stole last week."], "a": 2, "e": ""}, {"t": "mcq", "q": "The police couldn't find the painting …", "o": ["who live in America.", "which the thieves stole last week.", "where we can ski.", "who wrote the Harry Potter books?"], "a": 1, "e": ""}, {"t": "mcq", "q": "Do you know anyone …", "o": ["where the treasure was.", "which won three Oscars.", "who needs tickets for the concert?", "which leaves at 8:30."], "a": 2, "e": ""}, {"t": "mcq", "q": "She's got relatives …", "o": ["which the thieves stole last week.", "which they sell in the canteen.", "who live in America.", "where we can ski."], "a": 2, "e": ""}, {"t": "mcq", "q": "During the holidays we are going to a place …", "o": ["who needs tickets for the concert?", "which won three Oscars.", "where we can ski.", "which I read last week."], "a": 2, "e": ""}, {"t": "mcq", "q": "You must take the train …", "o": ["who wrote the Harry Potter books?", "where the treasure was.", "who live in America.", "which leaves at 8:30."], "a": 3, "e": ""}, {"t": "mcq", "q": "I don't like the sandwiches …", "o": ["who wrote the Harry Potter books?", "who needs tickets for the concert?", "where we can ski.", "which they sell in the canteen."], "a": 3, "e": ""}, {"t": "mcq", "q": "Last week we watched a film …", "o": ["who needs tickets for the concert?", "where the treasure was.", "who live in America.", "which won three Oscars."], "a": 3, "e": ""}]}, {"title": "B · Annie's story", "instr": "Write whose, who, why, where, which or whom.", "items": [{"t": "fill", "q": "Last year my best friend, ___ name is Annie, invited me to stay with her.", "a": [["whose"]], "e": ""}, {"t": "fill", "q": "Annie lives in Nancy, ___ is a beautiful town in the east of France.", "a": [["which"]], "e": ""}, {"t": "fill", "q": "She has a big apartment ___ overlooks the river.", "a": [["which", "that"]], "e": ""}, {"t": "fill", "q": "The school ___ she works is very close to her apartment.", "a": [["where"]], "e": ""}, {"t": "fill", "q": "Annie studied French at university, ___ is the reason ___ she decided to live in France.", "a": [["which"], ["why"]], "e": ""}, {"t": "fill", "q": "She teaches English to students, most of ___ are hoping to study in England.", "a": [["whom"]], "e": "After “of” → whom."}, {"t": "fill", "q": "I also met her boss, ___ struck me as a very nice man.", "a": [["who"]], "e": ""}, {"t": "fill", "q": "I decided to accept his offer, ___ is why I'm still here in Nancy.", "a": [["which"]], "e": ""}]}, {"title": "C · who, which or where?", "in (function(){
  var $ = function(id){return document.getElementById(id)};
  document.title = D.title + " · Pioneer Education";

  var total=0, done=0, score=0;
  D.sets.forEach(function(s){total+=s.items.length});
  function norm(x){return String(x).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?,]+$/,"").trim();}

          h+='</p><button class="chk">Check</button><div class="fb"></div>'; q.innerHTML=h;

    R.classList.remove("hide");
    $("ag").onclick=function(){build();window.scrollTo(0,0);};
    $("rv").onclick=function(){var w=document.querySelector('.q[data-state="no"]'); if(w)w.scrollIntoView({behavior:"smooth",block:"center"}); else this.textContent="No mistakes 🎉";};
  }
  build();
})();
</script>
